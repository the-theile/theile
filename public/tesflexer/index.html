<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1628;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #132a4a 0%, #0a1628 70%);
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0)
             env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    box-shadow: 0 0 60px rgba(0,0,0,0.55);
  }
  @media (max-width: 520px) {
    canvas { width: 100%; height: 100%; box-shadow: none; max-height: 100%; }
  }
</style>

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";
/**
 * TesFlexer — EV package delivery arcade (top-down vertical scroll)
 * Juicy single-file mobile web game. No external assets.
 *
 * Controls: on-screen L/R arrows (or A/D/←→) · drag to aim/throw · Space throw · P pause · M mute
 * Radio: 1 House · 2 DnB · 3 Riddim · 4 Techno
 * Full Self-Delivering (FSD): temporary assist after clean deliveries
 *
 * Polish: multi-layer parallax, continuous TOD, Flex Flow, modern EV juice.
 */

// ═══════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const W = 390, H = 700;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const now = () => performance.now();

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shade(hex, amt) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  return `rgb(${clamp(r,0,255)|0},${clamp(g,0,255)|0},${clamp(b,0,255)|0})`;
}

/** Soft drop shadow helper (Canvas) */
function softShadow(blur = 8, a = 0.18) {
  ctx.shadowColor = `rgba(0,0,0,${a})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;
}
function clearShadow() {
  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
}

/** Pill badge for HUD */
function drawPill(x, y, w, h, fill, stroke) {
  softShadow(6, 0.2);
  ctx.fillStyle = fill;
  roundRect(x, y, w, h, h / 2);
  ctx.fill();
  clearShadow();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    roundRect(x, y, w, h, h / 2);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const ROUTE_TIME = 90;
const EASY_SECS = 30;
// Slightly narrower road → wider yards for larger houses
const ROAD_L = 88, ROAD_R = 302;
const ROAD_CX = (ROAD_L + ROAD_R) / 2;
const ROAD_W = ROAD_R - ROAD_L;
const CAR_Y = 555;
const MAX_DIFF = 0.78;
const FSD_NEED = 3;
const FSD_DUR = 10;
const MAX_HEARTS = 3;
const LS_KEY = "tesflexer_v1";
// Parallax scroll factors (decorative layers only — gameplay world stays 1:1 with G.scroll)
const PX_FAR  = 0.22;
const PX_MID  = 0.68;
const PX_ROAD = 1.00;
const PX_FG   = 1.12;
const FAR_TILE = 280;
// Particle budget (tighter on coarse DPR / mobile-ish)
const PARTICLE_CAP = 64;

// Package types: mass affects arc & flight, score mult
const PKG = {
  standard: { id: "standard", label: "Box", mult: 1, mass: 1, arc: 1, size: 1, color: "#FF9900" },
  heavy:    { id: "heavy", label: "Heavy", mult: 1.45, mass: 1.45, arc: 0.72, size: 1.25, color: "#E65100" },
  envelope: { id: "envelope", label: "Envelope", mult: 0.85, mass: 0.65, arc: 1.15, size: 0.75, color: "#FFE082" },
  weird:    { id: "weird", label: "Weird", mult: 1.8, mass: 1.1, arc: 1.05, size: 1.35, color: "#AB47BC" },
};

// ═══════════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════════
function loadMeta() {
  try {
    return Object.assign({
      highScore: 0, bestStreak: 0, games: 0, totalDrops: 0,
      achievements: {}, station: "house", coachSeen: false, difficulty: "easy",
    }, JSON.parse(localStorage.getItem(LS_KEY) || "{}"));
  } catch {
    return { highScore: 0, bestStreak: 0, games: 0, totalDrops: 0, achievements: {}, station: "house", coachSeen: false, difficulty: "easy" };
  }
}
function saveMeta(m) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(m)); } catch {}
}
let META = loadMeta();
/** Run difficulty: "easy" (forgiving) | "hard" (denser, tighter assist) */
let DIFF_MODE = META.difficulty === "hard" ? "hard" : "easy";
function isHard() { return DIFF_MODE === "hard"; }
function setDifficulty(mode) {
  DIFF_MODE = mode === "hard" ? "hard" : "easy";
  META.difficulty = DIFF_MODE;
  saveMeta(META);
}

const ACHIEVEMENTS = {
  porchPerfect: { id: "porchPerfect", title: "Porch Perfect", desc: "10 streak in one route" },
  fsdSavant: { id: "fsdSavant", title: "Self-Delivering", desc: "Trigger Full Self-Delivering twice in one route" },
  noDogs: { id: "noDogs", title: "No Dogs Harmed", desc: "Finish with 0 dog incidents" },
  firstFlex: { id: "firstFlex", title: "First Route", desc: "Complete any route" },
  beanQueen: { id: "beanQueen", title: "Bean Queen", desc: "Dismiss 5 threats with packages" },
  goldenFlex: { id: "goldenFlex", title: "Golden Hour", desc: "Score 1500+ in golden hour" },
  survivor: { id: "survivor", title: "Still Rolling", desc: "Finish with 1 heart left" },
};

// ═══════════════════════════════════════════════════════════
// AUDIO (Web Audio — SFX + procedural rave radio)
// ═══════════════════════════════════════════════════════════
let audioCtx = null, muted = false;
let sfxBus = null, musicBus = null;

/** Radio stations — procedural EDM, no external files */
const RADIO = {
  house:  { id: "house",  name: "House",  bpm: 124, tag: "4/4 cruise control",     color: "#FF6D00", silent: false },
  dnb:    { id: "dnb",    name: "DnB",    bpm: 174, tag: "Neuro package rush",  color: "#00E5FF", silent: false },
  riddim: { id: "riddim", name: "Riddim", bpm: 140, tag: "Half-time HOA bass",  color: "#E040FB", silent: false },
  techno: { id: "techno", name: "Techno", bpm: 132, tag: "Warehouse night run", color: "#69F0AE", silent: false },
  silent: { id: "silent", name: "Silent", bpm: 0,   tag: "Quiet night ride",      color: "#90A4AE", silent: true },
};
let station = (META.station && RADIO[META.station]) ? META.station : "house";

// Music scheduler state
const music = {
  running: false,
  nextT: 0,
  step: 0,
  timer: null,
  master: null,
};

function ensureAudio() {
  if (muted) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    audioCtx = new AC();
    sfxBus = audioCtx.createGain(); sfxBus.gain.value = 0.9;
    musicBus = audioCtx.createGain(); musicBus.gain.value = 0.22;
    sfxBus.connect(audioCtx.destination);
    musicBus.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone({ freq = 440, dur = 0.12, type = "sine", gain = 0.07, slide = 0, delay = 0 }) {
  const ac = ensureAudio(); if (!ac) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxBus || ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

function noise(dur = 0.08, gain = 0.04, freq = 1200) {
  const ac = ensureAudio(); if (!ac) return;
  const n = (ac.sampleRate * dur) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(sfxBus || ac.destination); src.start();
}

// ── Music synth voices (route through musicBus) ──
function mKick(t, g = 0.55) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + 0.3);
}
function mHat(t, open = false, g = 0.06) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const n = (ac.sampleRate * (open ? 0.12 : 0.04)) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = open ? 7000 : 9000;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + (open ? 0.12 : 0.04));
  src.connect(f); f.connect(gn); gn.connect(musicBus);
  src.start(t);
}
function mSnare(t, g = 0.2) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const n = (ac.sampleRate * 0.12) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.7;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  src.connect(f); f.connect(gn); gn.connect(musicBus);
  src.start(t);
  // body
  const o = ac.createOscillator(), g2 = ac.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.08);
  g2.gain.setValueAtTime(g * 0.5, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  o.connect(g2); g2.connect(musicBus); o.start(t); o.stop(t + 0.12);
}
function mBass(t, freq, dur = 0.18, g = 0.14, type = "sawtooth") {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), gn = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  f.type = "lowpass";
  f.frequency.setValueAtTime(600, t);
  f.frequency.exponentialRampToValueAtTime(180, t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(g, t + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + dur + 0.02);
}
function mReese(t, freq, dur = 0.35, g = 0.1) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  const f = ac.createBiquadFilter(), gn = ac.createGain(), lfo = ac.createOscillator(), lfoG = ac.createGain();
  o1.type = "sawtooth"; o2.type = "sawtooth";
  o1.frequency.setValueAtTime(freq, t);
  o2.frequency.setValueAtTime(freq * 1.01, t);
  f.type = "lowpass"; f.Q.value = 8;
  f.frequency.setValueAtTime(220, t);
  lfo.type = "sine"; lfo.frequency.setValueAtTime(station === "riddim" ? 2.2 : 5.5, t);
  lfoG.gain.value = 160;
  lfo.connect(lfoG); lfoG.connect(f.frequency);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(g, t + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.connect(f); o2.connect(f); f.connect(gn); gn.connect(musicBus);
  o1.start(t); o2.start(t); lfo.start(t);
  o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
}
function mStab(t, freq, g = 0.05) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = "square"; o.frequency.setValueAtTime(freq, t);
  gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + 0.14);
}

// Chord roots for variety (Hz, roughly F minor / related)
const BASS_NOTES = [87.31, 92.5, 103.83, 116.54, 130.81]; // F G Ab Bb C
function noteAt(step) {
  const bar = Math.floor(step / 16) % 4;
  return BASS_NOTES[bar % BASS_NOTES.length];
}

function flowIntensity() {
  // Subtle radio lift from Flex Flow (0–1)
  return clamp((G.flexFlow || 0) / 100, 0, 1);
}

function scheduleStep(step, t) {
  const st = station;
  const s = step % 16; // 16th-note grid, 1 bar
  const fi = flowIntensity();
  const kG = 1 + fi * 0.18;   // slightly louder kicks at high flow
  const hG = 1 + fi * 0.22;   // hats brighten a touch
  if (st === "house") {
    // 4-on-the-floor
    if (s % 4 === 0) mKick(t, 0.5 * kG);
    if (s % 2 === 1) mHat(t, false, 0.045 * hG);
    if (s === 6 || s === 14) mHat(t, true, 0.05 * hG);
    if (fi > 0.72 && s % 4 === 2) mHat(t, false, 0.028); // extra offbeat hats
    if (s === 4 || s === 12) mSnare(t, 0.12);
    if (s % 4 === 0) mBass(t, noteAt(step) / 2, 0.2, 0.12, "sawtooth");
    if (s === 0 || s === 8) mStab(t, noteAt(step) * 2, 0.035);
  } else if (st === "dnb") {
    // Amen-ish / 2-step-ish approximation at 16ths
    if (s === 0 || s === 10) mKick(t, 0.48 * kG);
    if (s === 4 || s === 12) mSnare(t, 0.22);
    if (s === 6 || s === 14) mSnare(t, 0.08); // ghost
    if (s % 2 === 0) mHat(t, false, 0.04 * hG);
    if (s === 3 || s === 11) mHat(t, true, 0.045 * hG);
    if (fi > 0.72 && s === 8) mHat(t, false, 0.03);
    if (s === 0 || s === 8) mReese(t, noteAt(step) / 2, 0.28, 0.09);
    else if (s % 4 === 0) mBass(t, noteAt(step) / 2, 0.12, 0.08, "square");
  } else if (st === "riddim") {
    // Riddim — half-time, heavy
    if (s === 0) mKick(t, 0.58 * kG);
    if (s === 8) mSnare(t, 0.28);
    if (s === 4 || s === 12) mHat(t, false, 0.03 * hG);
    if (s === 14) mHat(t, true, 0.04 * hG);
    if (fi > 0.72 && s === 6) mHat(t, false, 0.025);
    if (s === 0) mReese(t, noteAt(step) / 2, 0.55, 0.12);
    if (s === 8) mBass(t, noteAt(step) / 2 * 0.75, 0.25, 0.1, "sawtooth");
  } else {
    // Techno — driving 4/4, minimal, hypnotic
    if (s % 4 === 0) mKick(t, 0.52 * kG);
    if (s % 4 === 2) mHat(t, false, 0.05 * hG);          // offbeat hats
    if (s === 4 || s === 12) mHat(t, true, 0.035 * hG);  // open
    if (fi > 0.72 && s % 8 === 6) mHat(t, false, 0.03);
    if (s === 0) mBass(t, noteAt(step) / 2, 0.22, 0.13, "square");
    if (s === 8) mBass(t, noteAt(step) / 2 * 1.5, 0.14, 0.08, "sawtooth");
    if (s === 0 || s === 6) mStab(t, noteAt(step) * 3, 0.028); // icy stabs
  }
}

function musicSchedulerTick() {
  if (!music.running || !audioCtx || RADIO[station]?.silent) return;
  const ac = audioCtx;
  const bpm = RADIO[station].bpm || 120;
  const stepDur = (60 / bpm) / 4; // 16th
  const horizon = 0.12;
  while (music.nextT < ac.currentTime + horizon) {
    scheduleStep(music.step, music.nextT);
    music.nextT += stepDur;
    music.step++;
  }
  music.timer = setTimeout(musicSchedulerTick, 25);
}

function startRadio() {
  const ac = ensureAudio();
  if (!ac || muted) return;
  stopRadio();
  // Silent ride: no procedural music, SFX only
  if (RADIO[station]?.silent) {
    if (musicBus) musicBus.gain.setValueAtTime(0, ac.currentTime);
    return;
  }
  music.running = true;
  music.step = 0;
  music.nextT = ac.currentTime + 0.05;
  if (musicBus) {
    musicBus.gain.cancelScheduledValues(ac.currentTime);
    musicBus.gain.setValueAtTime(0.001, ac.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.2, ac.currentTime + 0.6);
  }
  musicSchedulerTick();
}
function stopRadio() {
  music.running = false;
  if (music.timer) { clearTimeout(music.timer); music.timer = null; }
}
function setStation(id) {
  if (!RADIO[id]) return;
  station = id;
  META.station = id;
  saveMeta(META);
  if (!muted) startRadio();
  SFX.click();
}

// Back-compat aliases used elsewhere
function startBgHum() { startRadio(); }
function stopBgHum() { stopRadio(); }

const SFX = {
  click() { tone({ freq: 540, dur: 0.05, type: "triangle", gain: 0.04 }); },
  throw() { tone({ freq: 240, dur: 0.1, type: "sawtooth", gain: 0.03, slide: 200 }); noise(0.07, 0.025, 2000); },
  land() { tone({ freq: 180, dur: 0.08, type: "triangle", gain: 0.05 }); noise(0.05, 0.03, 900); },
  /** Package-type weighted landing thump */
  landType(id) {
    if (id === "heavy") {
      tone({ freq: 110, dur: 0.14, type: "triangle", gain: 0.07, slide: -30 });
      noise(0.1, 0.05, 500);
      tone({ freq: 70, dur: 0.12, type: "sine", gain: 0.04, delay: 0.02 });
    } else if (id === "envelope") {
      tone({ freq: 320, dur: 0.06, type: "triangle", gain: 0.035, slide: 40 });
      noise(0.04, 0.02, 2200);

/** Large soft L/R steer pads — lower third of the road */
function getSteerButtons() {

    left:  { x: ROAD_L + 6, y: by, w: bw, h: bh },

}
function hitSteerSide(px, py) {

  if (px >= b.left.x && px <= b.left.x + b.left.w && py >= b.left.y && py <= b.left.y + b.left.h) return "L";
  if (px >= b.right.x && px <= b.right.x + b.right.w && py >= b.right.y && py <= b.right.y + b.right.h) return "R";

}
function touchSteerDir() {

  for (const side of steerPointers.values()) {

    if (side === "R") d += 1;
  }
  return clamp(d, -1, 1);
}
function pauseBtnRect() {

// ═══════════════════════════════════════════════════════════
// WEATHER + CONTINUOUS TIME-OF-DAY
// ═══════════════════════════════════════════════════════════
function rollWeather() {
  // Weighted: sunny common, rain/golden rarer
  const r = Math.random();
  if (r < 0.38) return "sunny";
  if (r < 0.62) return "cloudy";
  if (r < 0.82) return "golden";
  return "rain";
}

function weatherInfo(w) {
  return {
    sunny:  { name: "Florida Sun", mult: 1, throw: 1, note: "Clear skies — clean throws" },
    cloudy: { name: "Overcast", mult: 1, throw: 1, note: "Soft light, same rules" },
    golden: { name: "Golden Hour", mult: 1.12, throw: 1, note: "+12% score · peak route vibes" },
    rain:   { name: "Pop-up Shower", mult: 0.95, throw: 0.88, note: "Slippery arcs · slightly lower score" },
  }[w] || { name: w, mult: 1, throw: 1, note: "" };
}

/** 0 = bright morning · 1 = late route / warm evening. Title stays morning. */
function dayPhase() {
  if (state !== ST.PLAY && state !== ST.PAUSE && state !== ST.GATE) return 0.08;
  return clamp(elapsed() / ROUTE_TIME, 0, 1);
}

/**
 * Continuous lighting state: blends base weather with route progress.
 * Affects sky, grade overlay, window lights, palm shadows — not gameplay mult.
 */
function tod() {
  const p = dayPhase();
  const w = G.weather || "sunny";
  // Warmth rises through route; golden weather amplifies, rain cools
  let warm = smooth(p) * 0.55;
  let cool = 0;
  let evening = smooth(clamp((p - 0.55) / 0.45, 0, 1));
  if (w === "golden") { warm = lerp(0.45, 0.95, p); evening = lerp(0.35, 1, p); }
  else if (w === "rain") { cool = 0.45 + p * 0.15; warm *= 0.25; evening *= 0.5; }
  else if (w === "cloudy") { cool = 0.18; warm *= 0.55; evening *= 0.7; }
  // Sun screen position (morning right → drifts left/down toward golden)
  const sunX = lerp(W - 48, 70, evening);
  const sunY = lerp(46, 100, evening);
  const sunA = w === "rain" ? 0 : (w === "cloudy" ? 0.35 : 1);
  // Window light bias: more porch/windows glow later or in golden/rain dusk
  const lightBias = clamp(evening * 0.55 + (w === "golden" ? 0.25 : 0) + (w === "rain" ? 0.15 : 0), 0, 0.85);
  // Palm shadow angle/length (sun from upper-right early, longer late)
  const shadowAng = lerp(0.35, -0.55, evening);
  const shadowLen = lerp(0.55, 1.15, evening + (w === "golden" ? 0.2 : 0));
  return { p, warm, cool, evening, sunX, sunY, sunA, lightBias, shadowAng, shadowLen, w };
}

function hexToRgb(hex) {
  if (!hex || hex[0] !== "#") return { r: 100, g: 140, b: 180 };
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function mixHex(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  const r = (lerp(A.r, B.r, t) | 0), g = (lerp(A.g, B.g, t) | 0), bl = (lerp(A.b, B.b, t) | 0);
  return `rgb(${r},${g},${bl})`;
}

// ═══════════════════════════════════════════════════════════
// DIFFICULTY
// ═══════════════════════════════════════════════════════════
function elapsed() { return ROUTE_TIME - G.time; }

function difficulty() {
  const e = elapsed();
  // Welcoming first ~28s, meaningful mid, intense but fair final stretch
  let d;
  if (e <= EASY_SECS) d = (e / EASY_SECS) * 0.14;
  else if (e < 68) d = clamp(0.14 + (e - EASY_SECS) / 38 * 0.44, 0, 0.58);
  else d = clamp(0.58 + (e - 68) / 22 * (MAX_DIFF - 0.58), 0, MAX_DIFF);
  // Hard: faster ramp, denser feel — Easy stays near classic balance
  if (isHard()) d = clamp(d * 1.32 + 0.06, 0, MAX_DIFF);
  return d;
}

function aimStrength() {
  let a = lerp(0.95, 0.7, difficulty() / MAX_DIFF);
  if (isHard()) a *= 0.86; // tighter assist on Hard
  // Max Flow: brief throw consistency boost
  if (G.flowBoostT > 0) a = lerp(a, Math.min(0.98, a + 0.12), 0.85);
  return a;
}
function padExtra() {
  let p = lerp(40, 22, difficulty() / MAX_DIFF);
  if (isHard()) p *= 0.88;
  return p;
}
function assistR() {
  let r = lerp(170, 110, difficulty() / MAX_DIFF);
  if (isHard()) r *= 0.88;
  if (G.flowBoostT > 0) r *= 1.12;
  return r;
}
function snapD() {
  let d = lerp(105, 70, difficulty() / MAX_DIFF);
  if (isHard()) d *= 0.9;
  if (G.flowBoostT > 0) d *= 1.15;
  return d;
}

// ═══════════════════════════════════════════════════════════
// FLEX FLOW (0–100 combo meter)
// ═══════════════════════════════════════════════════════════
function flowMult() {
  // Up to ~1.4× at max Flow (skilled play can hold high Flow without feeling mandatory)
  return 1 + clamp(G.flexFlow || 0, 0, 100) / 100 * 0.4;
}
function addFlow(n) {
  if (!n) return;
  const mult = G.eventFlowMult || 1;
  const prev = G.flexFlow || 0;
  G.flexFlow = clamp(prev + n * mult, 0, 100);
  G.peakFlow = Math.max(G.peakFlow || 0, G.flexFlow);
  G.idleT = 0;
  if (prev < 100 && G.flexFlow >= 100 && !G.flowMaxLatch) {
    G.flowMaxLatch = true;
    onFlowMax();
  }
  if (G.flexFlow < 82) G.flowMaxLatch = false;
}
function dumpFlow(frac = 0.72) {
  G.flexFlow = clamp((G.flexFlow || 0) * (1 - frac), 0, 100);
  G.flowMaxLatch = false;
}
function softFlowHit(n = 10) {
  G.flexFlow = clamp((G.flexFlow || 0) - n, 0, 100);
  if (G.flexFlow < 82) G.flowMaxLatch = false;
}
function onFlowMax() {
  G.flowBoostT = Math.max(G.flowBoostT || 0, 5.5);
  // Short Full Self-Delivering charge pip (does not auto-engage unless already at threshold-1)
  G.fsdReady = Math.min(FSD_NEED, (G.fsdReady || 0) + 1);
  flash(0.28, "rgba(0,229,255,0.4)");
  G.gradeCyan = Math.max(G.gradeCyan || 0, 0.4);
  camPunch(5);
  floatT(G.carX, CAR_Y - 70, "FLOW", "#00E5FF", 14, 0.7);
  SFX.perfect();
}
function updateFlow(dt) {
  if (G.flowBoostT > 0) G.flowBoostT = Math.max(0, G.flowBoostT - dt);
  G.idleT = (G.idleT || 0) + dt;
  // Slow idle decay after a quiet moment (holdable with clean play)
  if (G.idleT > 2.0 && G.flexFlow > 0) {
    G.flexFlow = Math.max(0, G.flexFlow - 4.2 * dt);
    if (G.flexFlow < 82) G.flowMaxLatch = false;
  }
}

// ═══════════════════════════════════════════════════════════
// JUICE HELPERS
// ═══════════════════════════════════════════════════════════
function shake(n = 8) { G.shake = Math.max(G.shake, n); }
function flash(n = 0.25, color = null) {
  G.flash = Math.max(G.flash, n);
  if (color) G.flashColor = color;
}
function hitStop(t = 0.035) { G.hitStop = Math.max(G.hitStop, Math.min(t, 0.08)); }
/** Camera punch — vertical kick that damps in draw/update */
function camPunch(y = 5, x = 0) {
  G.camPunchY = (G.camPunchY || 0) + y;
  G.camPunchX = (G.camPunchX || 0) + x;
}
function cullParticles() {
  if (G.particles.length > PARTICLE_CAP) {
    G.particles.splice(0, G.particles.length - PARTICLE_CAP);
  }
}
function budgetN(n) {
  // Prefer fewer higher-quality particles on high-DPR / busy frames
  const busy = G.particles.length > 40 ? 0.65 : 1;
  const dprTax = dpr > 2 ? 0.75 : 1;
  return Math.max(3, Math.round(n * busy * dprTax));
}

function msg(text, life = 2.2) {
  if (G.messages.length > 2) G.messages.shift();
  G.messages.push({ text, life, max: life });
}
function floatT(x, y, text, color = "#fff", size = 16, life = 0.75) {
  // Larger popups for mobile readability; few concurrent
  if (G.floatText.length > 2) G.floatText.shift();
  G.floatText.push({ x, y, text, color, size: Math.max(size, 15), life, vy: -34 });
}
function burst(x, y, color, n = 12, speed = 140) {
  n = budgetN(n);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(speed * 0.3, speed);
    G.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.35, 0.9), max: 0.9, r: rand(2.5, 5.5), color, g: 180,
    });
  }
  cullParticles();
}
function ringBurst(x, y, color) {
  const n = budgetN(12);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    G.particles.push({
      x, y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
      life: 0.45, max: 0.45, r: 3.2, color, g: 0,
    });
  }
  cullParticles();
}
function confetti(x, y) {
  const cols = ["#FF9900", "#00E5FF", "#69F0AE", "#FFD54F", "#F48FB1"];
  const n = budgetN(14);
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2);
    G.particles.push({
      x, y, vx: Math.cos(a) * rand(40, 160), vy: Math.sin(a) * rand(-120, -40),
      life: rand(0.6, 1.1), max: 1.1, r: rand(2.5, 4.5), color: pick(cols), g: 220,
    });

  cullParticles();
}
/** Soft landing ring + flecks — weight varies by package type */
function landBurst(x, y, def) {
  const id = def?.id || "standard";
  const col = def?.color || "#FF9900";
  if (id === "heavy") {
    ringBurst(x, y, shade(col, -20));

    for (let i = 0; i < budgetN(5); i++) {
      G.particles.push({
        x: x + rand(-8, 8), y: y + 2, vx: rand(-30, 30), vy: rand(-20, -4),
        life: rand(0.35, 0.7), max: 0.7, r: rand(4, 8), color: "rgba(120,110,95,0.55)", g: 40,
      });

  } else if (id === "envelope") {
    burst(x, y, col, 6, 70);
    for (let i = 0; i < budgetN(4); i++) {
      const a = rand(0, Math.PI * 2);
      G.particles.push({
        x, y, vx: Math.cos(a) * rand(20, 50), vy: Math.sin(a) * rand(-40, -10),
        life: 0.4, max: 0.4, r: 2, color: "#FFF8E1", g: 60,

  } else if (id === "weird") {

function unlockAch(id) {

function pickNextPackage() {
  const d = difficulty();

  // Express rush event: more heavy + weird for risk/reward
  if (G.event === "express_rush") {
    if (r < 0.18) G.nextPkg = "weird";
    else if (r < 0.55) G.nextPkg = "heavy";
    else if (r < 0.72) G.nextPkg = "envelope";
    else G.nextPkg = "standard";
    return;
  }
  if (r < 0.04) G.nextPkg = "weird";
  else if (r < 0.18 + d * 0.08) G.nextPkg = "heavy";
  else if (r < 0.38) G.nextPkg = "envelope";
  else G.nextPkg = "standard";
}

function spawnHouse(y) {

  const diff = state === ST.PLAY ? difficulty() : 0.12;
  const early = state === ST.PLAY && elapsed() < EASY_SECS;
  const needsDelivery = Math.random() < (early ? 0.72 : lerp(0.62, 0.45, diff / MAX_DIFF));

  // Stoops sized for larger houses (still stay in yard strip)
  const porchW = needsDelivery ? (early ? 30 : lerp(28, 24, diff / MAX_DIFF)) : 20;
  const porchH = needsDelivery ? (early ? 34 : lerp(32, 28, diff / MAX_DIFF)) : 20;
  const hasDriveway = Math.random() < 0.85;
  // Parked cars only when driveway exists; placed BELOW house (see layoutParked)
  const hasParked = hasDriveway && Math.random() < 0.5;

  const h = {
    y, side, color: pick(HOUSE_COLORS), scale: 1,
    porchW, porchH, needsDelivery, delivered: false, special,
    roof: pick(["#6D4C41","#455A64","#5D4037","#37474F","#795548","#BF360C"]),
    trim: pick(["#FFFFFF","#FAFAFA","#FFF8E1","#EFEBE9"]),

    brick: pick(["#A1887F","#8D6E63","#BCAAA4"]),
    style: pick(["ranch","ranch","cottage","modern","modern","cottage"]),
    hasPool: needsDelivery && !early && Math.random() < 0.1,
    hasRing: needsDelivery && Math.random() < 0.22,
    hasSnack: needsDelivery && Math.random() < 0.14,
    hasPirate: needsDelivery && !early && Math.random() < 0.06,
    hasDog: !early && Math.random() < 0.07,
    hasMailbox: true, hasDriveway, hasBush: Math.random() < 0.75,
    hasFence: Math.random() < 0.5, hasPlanters: Math.random() < 0.55,
    hasFlag: Math.random() < 0.28,
    poolX: side === 0 ? 28 : W - 28,
    ringHit: false, snackTaken: false, pirateHit: false, pirateStolen: false,
    pirateState: "lurk", pirateT: 0, pirateX: 0, pirateY: 0,
    windowBroken: false,
    number: 100 + (G.houses.length * 2 + side + 1),
    windowLit: Math.random() < 0.35, garage: Math.random() < 0.42, shutters: Math.random() < 0.55,
    porchLight: Math.random() < 0.4,
    ladySpawned: false, dogPhase: 0, seed: rand(0, 1000),
    activeAge: 0,
    hasParked,
    parkedCar: hasParked ? {
      color: pick(["#ECEFF1","#E53935","#1E88E5","#43A047","#FB8C00","#37474F","#FAFAFA"]),
      cracked: false, dented: false, w: 28, h: 42,
    } : null,
  };
  G.houses.push(h);

  G.props.push({ type: "palm", x: side === 0 ? rand(14, 44) : rand(W - 44, W - 14), y: y - 14, scale: rand(1.0, 1.35) });
  if (h.hasBush) G.props.push({ type: "bush", x: side === 0 ? rand(16, 48) : rand(W - 48, W - 16), y: y + 28 });
  if (h.hasPool) G.props.push({ type: "pool", x: h.poolX, y: y + 6 });
  if (Math.random() < 0.4) G.props.push({ type: "pole", x: side === 0 ? rand(10, 28) : rand(W - 28, W - 10), y: y - 40 });
  if (Math.random() < 0.22) G.props.push({ type: "hydrant", x: side === 0 ? ROAD_L - 22 : ROAD_R + 16, y: y + 48 });
}

function spawnObstacle() {
  const diff = difficulty();
  // Hard: fewer skips, denser presence
  const skipChance = isHard() ? lerp(0.28, 0.06, diff / MAX_DIFF) : lerp(0.4, 0.12, diff / MAX_DIFF);
  if (Math.random() < skipChance) return;
  if (G.fsd > 0 && Math.random() < (isHard() ? 0.55 : 0.7)) return;
  const maxObs = isHard()
    ? (diff < 0.25 ? 2 : diff < 0.5 ? 3 : 4)
    : (diff < 0.25 ? 1 : diff < 0.5 ? 2 : 3);
  if (G.obstacles.filter(o => !o.dead).length >= maxObs) return;

  let type;
  // Classic + Florida-suburb variety (mower, bike, trash, wet, robot)
  if (diff < 0.18) type = pick(["cone", "cone", "pothole", "scooter", "wet"]);
  else if (diff < 0.35) type = pick(["cone", "pothole", "barrier", "scooter", "cone", "trash", "wet"]);
  else if (diff < 0.55) type = pick(["cone", "pothole", "barrier", "branch", "scooter", "ped", "mower", "bike", "trash"]);
  else type = pick(["cone", "pothole", "barrier", "branch", "scooter", "ped", "dog", "car", "mower", "bike", "robot", "trash"]);

  if (isHard() && diff > 0.25) {
    type = pick([type, type, "bike", "mower", "robot", "dog", "scooter"]);
  }
  if (G.event === "construction") type = pick(["cone", "cone", "barrier", "barrier", "pothole", type]);
  if (G.event === "dog_wave" || G.event === "dog_zone") {
    if (Math.random() < 0.45) type = "dog";
  }

  let x = rand(ROAD_L + 28, ROAD_R - 28);
  const staticHaz = type === "pothole" || type === "barrier" || type === "branch" || type === "cone" || type === "wet";
  if (!staticHaz && Math.random() < (diff < 0.35 ? 0.9 : 0.68)) {
    x = Math.random() < 0.5 ? rand(ROAD_L + 24, ROAD_L + 58) : rand(ROAD_R - 58, ROAD_R - 24);
  } else if (type === "pothole" || type === "wet") {
    x = rand(ROAD_L + 36, ROAD_R - 36);
  }

  const spd = isHard() ? 1.18 : 1;
  const o = { type, x, y: -70, w: 28, h: 28, vx: 0, dead: false, hit: false, anim: 0, pkgHit: false, seed: rand(0, 100) };
  if (type === "cone") { o.w = 20; o.h = 24; }
  if (type === "pothole") { o.w = 36; o.h = 24; }
  if (type === "wet") { o.w = 40; o.h = 22; }
  if (type === "barrier") { o.w = 44; o.h = 20; }
  if (type === "branch") { o.w = 38; o.h = 18; o.rot = rand(-0.4, 0.4); }
  if (type === "scooter") { o.w = 18; o.h = 38; o.vx = pick([-14, 14]) * (0.5 + diff * 0.4) * spd; }
  if (type === "car") {
    o.w = 46; o.h = 74; o.color = pick(["#E53935","#1E88E5","#43A047","#FB8C00","#5E35B1","#FAFAFA","#37474F"]);
    if (Math.random() < 0.7) { o.x = Math.random() < 0.5 ? ROAD_L + 40 : ROAD_R - 40; o.vy = rand(8, 24) * spd; }
    else o.vy = rand(16, 38 + diff * 20) * spd;
  }
  if (type === "ped") { o.w = 18; o.h = 34; o.vx = pick([-16, 16]) * (0.5 + diff * 0.35) * spd; }
  if (type === "dog") { o.w = 30; o.h = 18; o.vx = pick([-28, 28]) * (0.55 + diff * 0.3) * spd; }
  if (type === "mower") { o.w = 36; o.h = 28; o.vx = pick([-22, 22]) * (0.45 + diff * 0.25) * spd; o.color = pick(["#C62828","#F9A825","#2E7D32"]); }
  if (type === "bike") { o.w = 22; o.h = 36; o.vx = pick([-26, 26]) * (0.6 + diff * 0.35) * spd; o.color = pick(["#29B6F6","#EC407A","#66BB6A","#FFA726"]); }
  if (type === "trash") { o.w = 26; o.h = 34; o.vx = pick([-10, 10]) * (0.35 + diff * 0.2) * spd; o.color = pick(["#546E7A","#37474F","#78909C"]); }
  if (type === "robot") { o.w = 28; o.h = 24; o.vx = pick([-18, 18]) * (0.5 + diff * 0.3) * spd; }
  G.obstacles.push(o);
}

// ═══════════════════════════════════════════════════════════
// AIM
// ═══════════════════════════════════════════════════════════
/**
 * Shared house geometry so draw + collisions never disagree.
 * Layout: house sits in the outer yard; porch is a stoop on the
 * road-facing wall; parked car sits on the driveway BELOW the house
 * (toward the player), never under the porch.
 */
function layoutHouse(h) {
  // Distinct silhouettes: modern = wide/low, cottage = tall/narrow, ranch = long
  let hw, hh, hyOff;
  if (h.style === "modern") { hw = 62; hh = 64; hyOff = -18; }
  else if (h.style === "cottage") { hw = 52; hh = 74; hyOff = -26; }
  else { hw = 60; hh = 70; hyOff = -22; } // ranch
  const hx = h.side === 0 ? 4 : W - 4 - hw;
  const hy = h.y + hyOff;

  // Stoop on road-facing wall — room for porch between wall and curb
  let porchW = Math.min(h.porchW || 28, 28);
  let porchH = Math.min(h.porchH || 30, 32);
  let porchX, porchY;
  if (h.side === 0) {
    porchX = hx + hw - 2; // slight attach to wall
    const maxW = Math.max(16, ROAD_L - 10 - porchX);
    porchW = Math.min(porchW, maxW);
  } else {
    const maxW = Math.max(16, hx - (ROAD_R + 10));
    porchW = Math.min(porchW, maxW);
    porchX = hx - porchW + 2;
  }
  porchY = hy + hh * (h.style === "modern" ? 0.42 : 0.38);

  const driveTop = hy + hh + 2;
  let car = null;
  if (h.parkedCar) {
    const cw = h.parkedCar.w || 30, ch = h.parkedCar.h || 44;
    // Garage-aligned when present: park under driveway toward yard edge
    const gOff = h.garage ? (h.side === 0 ? -6 : 6) : 0;
    const cx = hx + hw / 2 + gOff;
    const cy = driveTop + 28;
    car = { cx, cy, w: cw, h: ch, x: cx - cw / 2, y: cy - ch / 2 };
  }

  const winW = h.style === "modern" ? 28 : 22;
  const winH = h.style === "modern" ? 16 : 18;
  const winX = h.side === 0 ? hx + 8 : hx + hw - (winW + 8);
  const winY = hy + (h.style === "cottage" ? 20 : 14);

  return {
    hx, hy, hw, hh,
    porchX, porchY, porchW, porchH,
    porchCx: porchX + porchW / 2,
    porchCy: porchY + porchH / 2,
    doorX: h.side === 0 ? hx + hw - 18 : hx + 4,
    doorY: hy + hh * (h.style === "modern" ? 0.42 : 0.38),
    winX, winY, winW, winH,
    car, driveTop,
  };
}

function getPorch(h) {
  const L = layoutHouse(h);
  const pad = state === ST.PLAY ? padExtra() * 0.65 : 6;
  return {
    x: L.porchX - pad * 0.15,
    y: L.porchY - pad * 0.1,
    w: L.porchW + pad * 0.3,
    h: L.porchH + pad * 0.25,
    cx: L.porchCx,
    cy: L.porchCy,
  };
}
function isActive(h) { return h && h.needsDelivery && !h.delivered; }

function bestStop() {
  let best = null, bestH = null, s = 1e9;
  for (const h of G.houses) {
    if (!isActive(h)) continue;
    const p = getPorch(h);
    if (p.cy > CAR_Y - 40 || p.cy < 70) continue;
    const sc = Math.abs(p.cx - G.carX) * 0.5 + Math.abs(p.cy - (CAR_Y - 170)) * 0.5;
    if (sc < s) { s = sc; best = p; bestH = h; }
  }
  return best ? { porch: best, house: bestH } : null;
}

/** Yard dog position (matches draw/resolve) */
function getYardDogPos(h) {
  if (!h || !h.hasDog || h.delivered) return null;
  const L = layoutHouse(h);
  const facingRight = h.side === 0;
  const dx = facingRight ? L.hx + 12 : L.hx + L.hw - 12;
  const dy = L.driveTop + 18 + Math.sin((h.seed || 1) + now() / 450) * 1.2;
  return { x: dx, y: dy };
}

/**
 * Resolve current world position of a tracked throw target.
 * Used in flight so packages follow scrolling / moving targets.
 */
function getTrackPos(pk) {
  if (!pk || !pk.trackKind || pk.trackKind === "free") return null;
  if (pk.trackKind === "porch") {
    if (!pk.targetHouse || !isActive(pk.targetHouse)) return null;
    const p = getPorch(pk.targetHouse);
    return { x: p.cx, y: p.cy };
  }
  if (pk.trackKind === "window") {
    if (!pk.targetHouse || pk.targetHouse.windowBroken) return null;
    const L = layoutHouse(pk.targetHouse);
    return { x: L.winX + L.winW / 2, y: L.winY + L.winH / 2 };
  }
  if (pk.trackKind === "parked") {
    if (!pk.targetHouse?.parkedCar) return null;
    const L = layoutHouse(pk.targetHouse);
    if (!L.car) return null;
    return { x: L.car.cx, y: L.car.cy };
  }
  if (pk.trackKind === "pirate") {
    const h = pk.targetHouse;
    if (!h || h.pirateHit || h.pirateStolen || !isActive(h)) return null;
    if (h.pirateState === "gone") return null;
    return { x: h.pirateX || getPorch(h).cx, y: h.pirateY || getPorch(h).cy };
  }
  if (pk.trackKind === "dog_yard") {
    return getYardDogPos(pk.targetHouse);
  }
  if (pk.trackKind === "obstacle") {
    const o = pk.trackObs;
    if (!o || o.dead || o.hit) return null;
    if (o.y < -40 || o.y > H + 60) return null;
    return { x: o.x, y: o.y };
  }
  return null;
}

function findAssist(ax, ay) {
  const R = assistR(), str = aimStrength();
  let best = null, bestH = null, bestD = R;
  for (const h of G.houses) {
    if (!isActive(h)) continue;
    const p = getPorch(h);
    if (p.cy > CAR_Y - 30 || p.cy < 60) continue;
    const d = dist(ax, ay, p.cx, p.cy);
    if (d < bestD) { bestD = d; best = p; bestH = h; }
  }
  if (!best) return { x: ax, y: ay, snap: false, house: null, porch: null, trackKind: "free", follow: 0 };
  if (bestD < snapD()) {
    return {
      x: best.cx, y: best.cy, snap: true, house: bestH, porch: best,
      trackKind: "porch", follow: 0.95, assisted: true,
    };
  }
  // Milder pull than before — keep porch helpful without aimbot feel
  const pull = Math.min(1, str * (1 - bestD / R) * 1.05);
  return {
    x: lerp(ax, best.cx, pull), y: lerp(ay, best.cy, pull),
    snap: pull > 0.9, house: pull > 0.55 ? bestH : null, porch: pull > 0.55 ? best : null,
    assisted: pull > 0.14,
    trackKind: pull > 0.55 ? "porch" : "free",
    follow: pull > 0.55 ? 0.88 : 0,
  };
}

/** Mild sticky for threats / breakables — weaker than porch assist */
function findThreatAssist(ax, ay) {
  let best = null, bestD = 48;
  // Road threats
  for (const o of G.obstacles) {
    if (o.dead || o.hit) continue;
    if (o.y < 55 || o.y > CAR_Y - 15) continue;
    const beanable = o.type === "dog" || o.type === "lady" || o.type === "scooter" ||
      o.type === "ped" || o.type === "cone" || o.type === "barrier" || o.type === "branch" ||
      o.type === "mower" || o.type === "bike" || o.type === "trash" || o.type === "robot";
    if (!beanable) continue;
    // Lady warn: smaller sticky (riskier near porch)
    const rMul = (o.type === "lady" && o.phase === "warn") ? 0.75 : 1;
    const d = dist(ax, ay, o.x, o.y) / rMul;
    if (d < bestD) {
      bestD = d;
      best = { trackKind: "obstacle", trackObs: o, x: o.x, y: o.y, house: null, follow: 0.72 };
    }
  }
  // House-attached: windows, parked cars, yard dogs, pirates
  for (const h of G.houses) {
    if (h.y < -40 || h.y > H + 80) continue;
    if (!h.windowBroken) {
      const L = layoutHouse(h);
      const wx = L.winX + L.winW / 2, wy = L.winY + L.winH / 2;
      const d = dist(ax, ay, wx, wy);
      if (d < bestD && d < 40) {
        bestD = d;
        best = { trackKind: "window", house: h, x: wx, y: wy, follow: 0.78 };
      }
    }
    if (h.parkedCar) {
      const L = layoutHouse(h);
      if (L.car) {
        const d = dist(ax, ay, L.car.cx, L.car.cy);
        if (d < bestD && d < 42) {
          bestD = d;
          best = { trackKind: "parked", house: h, x: L.car.cx, y: L.car.cy, follow: 0.75 };
        }
      }
    }
    if (h.hasPirate && !h.pirateHit && !h.pirateStolen && isActive(h)) {
      const px = h.pirateX || getPorch(h).cx, py = h.pirateY || getPorch(h).cy;
      const d = dist(ax, ay, px, py);
      if (d < bestD && d < 44) {
        bestD = d;
        best = { trackKind: "pirate", house: h, x: px, y: py, follow: 0.8 };
      }
    }
    if (h.hasDog && !h.delivered) {
      const dp = getYardDogPos(h);
      if (dp) {
        const d = dist(ax, ay, dp.x, dp.y);
        if (d < bestD && d < 40) {
          bestD = d;
          best = { trackKind: "dog_yard", house: h, x: dp.x, y: dp.y, follow: 0.74 };
        }
      }
    }
  }
  if (!best) return null;
  // Soft pull toward threat — skillful free aim still possible
  const pull = clamp(1 - bestD / 48, 0.15, 0.55);
  return {
    x: lerp(ax, best.x, pull),
    y: lerp(ay, best.y, pull),
    snap: bestD < 18,
    assisted: true,
    house: best.house || null,
    trackKind: best.trackKind,
    trackObs: best.trackObs || null,
    follow: best.follow,
    porch: null,
  };
}

function clampAim(sx, sy, ax, ay) {
  const maxD = lerp(195, 270, difficulty() / MAX_DIFF);
  // Allow aiming deep into the road corridor for cones / dogs / HOA
  ay = clamp(ay, HUD_H + 8, CAR_Y - 36);
  // Mild curb bias only when aim is deep in the travel lane (not a hard ban)
  if (ax > ROAD_L + 22 && ax < ROAD_R - 22 && ay < CAR_Y - 100) {
    const curb = ax < ROAD_CX ? ROAD_L - 10 : ROAD_R + 10;
    ax = lerp(ax, curb, 0.12);
  }
  let d = dist(sx, sy, ax, ay);
  if (d > maxD) { const k = maxD / d; ax = sx + (ax - sx) * k; ay = sy + (ay - sy) * k; }
  if (sy - ay > 175) ay = lerp(ay, sy - 160, lerp(0.45, 0.22, difficulty() / MAX_DIFF));
  // rain: slightly flatter aim band
  if (G.weather === "rain") ay = lerp(ay, sy - 150, 0.06);
  return { x: ax, y: ay };
}

/**
 * Sticky / assist resolution for aim + throw.
 * Porches win when near; mild threat assist otherwise; free aim last.
 */
function stickyAim(ax, ay) {
  const b = bestStop();
  if (b) {
    const p = b.porch;
    const d = dist(ax, ay, p.cx, p.cy);
    // Slightly tighter snap zone so free aim stays responsive
    if (d < snapD() * 1.25 || (Math.abs(ax - p.cx) < 62 && Math.abs(ay - p.cy) < 85)) {
      return {
        x: p.cx, y: p.cy, snap: true, house: b.house, porch: p,
        assisted: true, trackKind: "porch", follow: 0.96,
      };
    }
  }
  const porchAssist = findAssist(ax, ay);
  if (porchAssist.snap || (porchAssist.assisted && porchAssist.trackKind === "porch" && porchAssist.follow >= 0.85)) {
    return porchAssist;
  }
  // Mild threat assist when not strongly porch-locked
  const threat = findThreatAssist(ax, ay);
  if (threat && (!porchAssist.assisted || porchAssist.follow < 0.5)) {
    return threat;
  }
  if (porchAssist.assisted) return porchAssist;
  if (threat) return threat;
  return { x: ax, y: ay, snap: false, house: null, porch: null, trackKind: "free", follow: 0, assisted: false };
}

/** Flight duration — capped so long throws fight scroll less */
function estimateFlight(d, def) {
  const wi = weatherInfo(G.weather);
  const mass = def?.mass || 1;
  return clamp((d / 330) * mass / (wi.throw || 1), 0.28, 0.70);
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
function cpos(e) {
  const r = canvas.getBoundingClientRect();
  const id = e.changedTouches ? e.changedTouches[0] : e;
  return {
    x: ((id.clientX ?? e.clientX) - r.left) * (W / r.width),
    y: ((id.clientY ?? e.clientY) - r.top) * (H / r.height),
  };
}

function onDown(e) {
  e.preventDefault();
  ensureAudio();
  const id = e.pointerId ?? 0;
  const p = cpos(e);
  pointers.set(id, p);

  if (state === ST.TITLE || state === ST.HOWTO || state === ST.END) { hitUI(p.x, p.y); return; }
  if (state === ST.PAUSE) { hitUI(p.x, p.y); return; }
  if (state === ST.GATE) { hitGate(p.x, p.y); return; }
  if (state === ST.PLAY) {
    if (hitPause(p.x, p.y)) { state = ST.PAUSE; SFX.click(); return; }
    // Steer arrows take priority — do not start a throw from on top of them
    const side = hitSteerSide(p.x, p.y);
    if (side) {
      steerPointers.set(id, side);
      G.aimPreview = null;
      return;
    }
    // Entire playfield is aim/throw (except HUD chrome / steer pads)
    throwAimId = id;
    updateAim(p.x, p.y);
  }
}
function onMove(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = cpos(e);
  pointers.set(id, p);
  // Finger slid off a steer pad mid-hold → release that side
  if (state === ST.PLAY && steerPointers.has(id)) {
    const side = hitSteerSide(p.x, p.y);
    if (side) steerPointers.set(id, side);
    else steerPointers.delete(id);
  }
  if (state === ST.PLAY && id === throwAimId) updateAim(p.x, p.y);
  // Desktop hover preview — full playfield minus steer pads / pause
  if (state === ST.PLAY && e.pointerType === "mouse" && throwAimId == null && !steerPointers.has(id)) {
    if (hitSteerSide(p.x, p.y) || hitPause(p.x, p.y) || p.y < 8) G.aimPreview = null;
    else updateAim(p.x, p.y);
  }
}
function onUp(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = pointers.get(id) || cpos(e);
  if (state === ST.PLAY && id === throwAimId) {
    updateAim(p.x, p.y);
    if (G.aimPreview) throwPkg(G.aimPreview.x, G.aimPreview.y);
    else throwPkg(p.x, p.y);
    throwAimId = null; G.aimPreview = null;
  }
  pointers.delete(id);
  steerPointers.delete(id);
}

function updateAim(px, py) {
  if (state !== ST.PLAY) { G.aimPreview = null; return; }
  // Aim across nearly the whole screen (road + yards). Tiny top margin for HUD.
  if (py < HUD_H - 8) { G.aimPreview = null; return; }
  const sx = G.carX, sy = CAR_Y - 18;
  const c = clampAim(sx, sy, px, py);
  const s = stickyAim(c.x, c.y);
  const def = PKG[G.nextPkg] || PKG.standard;
  const d = dist(sx, sy, s.x, s.y);
  const ft = estimateFlight(d, def);
  const arc = lerp(26, 38, Math.min(d / 220, 1)) * (def.arc || 1) * (G.weather === "rain" ? 0.9 : 1);
  G.aimPreview = {
    x: s.x, y: s.y, snap: !!s.snap, assisted: !!s.assisted || !!s.snap,
    sx, sy, house: s.house, trackKind: s.trackKind || "free",
    flight: ft, arc,
  };
}

canvas.addEventListener("pointerdown", onDown, { passive: false });
canvas.addEventListener("pointermove", onMove, { passive: false });
canvas.addEventListener("pointerup", onUp, { passive: false });
canvas.addEventListener("pointercancel", onUp, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

addEventListener("keydown", e => {
  keys[e.code] = true;
  ensureAudio();
  if (["Space","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyM") {
    muted = !muted;
    if (muted) stopRadio();
    else if (state === ST.PLAY || state === ST.PAUSE) startRadio();
    msg(muted ? "Sound off" : "Tuned to " + RADIO[station].name, 1.4);
  }
  // Station switch: 1 House · 2 DnB · 3 Riddim · 4 Techno · 0 Silent
  if ((state === ST.PLAY || state === ST.PAUSE || state === ST.TITLE) && state !== ST.GATE && !e.repeat) {
    if (e.code === "Digit1" || e.code === "Numpad1") { setStation("house"); if (state !== ST.TITLE) msg("House", 1); }
    if (e.code === "Digit2" || e.code === "Numpad2") { setStation("dnb"); if (state !== ST.TITLE) msg("DnB", 1); }
    if (e.code === "Digit3" || e.code === "Numpad3") { setStation("riddim"); if (state !== ST.TITLE) msg("Riddim", 1); }
    if (e.code === "Digit4" || e.code === "Numpad4") { setStation("techno"); if (state !== ST.TITLE) msg("Techno", 1); }
    if (e.code === "Digit0" || e.code === "Numpad0") { setStation("silent"); if (state !== ST.TITLE) msg("Silent ride", 1); }
  }
  if (e.code === "KeyP" || e.code === "Escape") {
    if (state === ST.PLAY) { state = ST.PAUSE; steerPointers.clear(); SFX.click(); }
    else if (state === ST.PAUSE) { state = ST.PLAY; SFX.click(); }
  }
  if (state === ST.TITLE && (e.code === "Enter" || e.code === "Space")) { state = ST.PLAY; resetGame(); }
  if (state === ST.PLAY && e.code === "Space") {
    const b = bestStop();
    if (b) throwPkg(b.porch.cx, b.porch.cy);
    else throwPkg(G.carX + rand(-12, 12), CAR_Y - 160);
  }
  if (state === ST.GATE) {
    if (e.code === "Digit1" || e.code === "Numpad1") pickGate(0);
    if (e.code === "Digit2" || e.code === "Numpad2") pickGate(1);
    if (e.code === "Digit3" || e.code === "Numpad3") pickGate(2);
  }
});
addEventListener("keyup", e => { keys[e.code] = false; });

function btn(id, x, y, w, h, label, style = "primary") {
  UI.buttons.push({ id, x, y, w, h, label, style });
}
function hitUI(x, y) {
  for (const b of UI.buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { onBtn(b.id); return; }
  }
  // title: tap anywhere also starts if quick start zone
  if (state === ST.TITLE && y > H * 0.55) onBtn("play");
}
function onBtn(id) {
  if (id.startsWith("radio_")) {
    ensureAudio();
    setStation(id.slice(6));
    // Preview the station on title/pause
    if (state === ST.TITLE || state === ST.PAUSE || state === ST.HOWTO) startRadio();
    return;
  }
  if (id.startsWith("diff_")) {
    ensureAudio();
    setDifficulty(id.slice(5));
    SFX.click();
    return;
  }
  SFX.click();
  if (id === "play") { state = ST.PLAY; resetGame(); }
  if (id === "howto") state = ST.HOWTO;
  if (id === "back" || id === "menu") { stopRadio(); state = ST.TITLE; }
  if (id === "again") { state = ST.PLAY; resetGame(); }
  if (id === "resume") { state = ST.PLAY; steerPointers.clear(); if (!muted) startRadio(); }
  if (id === "share") shareScore();
  if (id === "share_card") shareCard();
}
function hitGate(x, y) {
  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) { pickGate(i); return; }
    by += 68;
  }
}
function pickGate(i) {
  if (state !== ST.GATE) return;
  if (i === G.gateCorrect) {
    G.score += Math.round(50 * G.weatherMult);
    floatT(W / 2, 280, "GATE OPEN +50", "#69F0AE", 20);
    confetti(W / 2, 320); SFX.perfect(); msg("Gate accepted. Welcome, driver.", 2);
  } else {
    loseHeart("Wrong gate code — HOA delay!");
    shake(12); SFX.fail();
  }
  state = ST.PLAY;
  G.nextGateIn = rand(32, 48);
}

/** Procedural 1080×1080 share card — no external assets */
function buildShareCardCanvas() {
  const S = 1080;
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const x = c.getContext("2d");
  // Background
  const bg = x.createLinearGradient(0, 0, 0, S);
  bg.addColorStop(0, "#0a1628");
  bg.addColorStop(0.45, "#132a4a");
  bg.addColorStop(1, "#1a1a1a");
  x.fillStyle = bg;
  x.fillRect(0, 0, S, S);
  // Soft sun glow
  const sun = x.createRadialGradient(S * 0.78, S * 0.18, 10, S * 0.78, S * 0.18, 280);
  sun.addColorStop(0, "rgba(255,180,80,0.35)");
  sun.addColorStop(1, "rgba(255,180,80,0)");
  x.fillStyle = sun;
  x.beginPath(); x.arc(S * 0.78, S * 0.18, 280, 0, Math.PI * 2); x.fill();
  // Card panel
  x.fillStyle = "rgba(16,28,46,0.88)";
  roundRectOn(x, 70, 90, S - 140, S - 180, 36);
  x.fill();
  x.strokeStyle = "rgba(255,153,0,0.55)";
  x.lineWidth = 4;
  roundRectOn(x, 70, 90, S - 140, S - 180, 36);
  x.stroke();
  // Title
  x.textAlign = "center";
  x.fillStyle = "#FF9900";
  x.font = "bold 36px system-ui,sans-serif";
  x.fillText("EV PACKAGE RUN", S / 2, 170);
  x.fillStyle = "#fff";
  x.font = "bold 86px system-ui,sans-serif";
  x.fillText("TesFlexer", S / 2, 270);
  // Grade pill
  x.fillStyle = "rgba(105,240,174,0.18)";
  roundRectOn(x, S / 2 - 220, 300, 440, 56, 28);
  x.fill();
  x.fillStyle = "#69F0AE";
  x.font = "bold 32px system-ui,sans-serif";
  x.fillText(grade(), S / 2, 338);
  // Stats
  const rows = [
    ["SCORE", String(G.score)],
    ["DELIVERIES", String(G.deliveries)],
    ["BEST STREAK", String(G.bestStreak)],
    ["WEATHER", weatherInfo(G.weather).name],
    ["RADIO", RADIO[station]?.name || "House"],
  ];
  let yy = 420;
  for (const [k, v] of rows) {
    x.textAlign = "left";
    x.fillStyle = "rgba(255,255,255,0.5)";
    x.font = "bold 28px system-ui,sans-serif";
    x.fillText(k, 160, yy);
    x.textAlign = "right";
    x.fillStyle = "#fff";
    x.font = "bold 34px system-ui,sans-serif";
    x.fillText(v, S - 160, yy);
    yy += 58;
  }
  // Mini EV + package silhouette
  x.save();
  x.translate(S / 2, 780);
  // Package
  x.fillStyle = "#FF9900";
  roundRectOn(x, 70, -30, 70, 54, 10);
  x.fill();
  x.strokeStyle = "#232F3E";
  x.lineWidth = 3;
  x.beginPath(); x.moveTo(105, -30); x.lineTo(105, 24); x.moveTo(70, -4); x.lineTo(140, -4); x.stroke();
  // Clean modern EV body (top-down)
  x.fillStyle = "#F5F5F5";
  roundRectOn(x, -90, -70, 100, 170, 28);
  x.fill();
  x.fillStyle = "#1A2A3A";
  roundRectOn(x, -72, -40, 64, 70, 16);
  x.fill();
  x.fillStyle = "#00E5FF";
  roundRectOn(x, -72, -62, 64, 10, 4);
  x.fill();
  x.fillStyle = "#FF1744";
  roundRectOn(x, -68, 72, 56, 10, 4);
  x.fill();
  x.restore();
  // CTA
  x.fillStyle = "#FF9900";
  x.font = "bold 40px system-ui,sans-serif";
  x.textAlign = "center";
  x.fillText("Beat my route?", S / 2, 960);
  x.fillStyle = "rgba(255,255,255,0.45)";
  x.font = "24px system-ui,sans-serif";
  x.fillText("TesFlexer · free to play", S / 2, 1005);
  return c;
}

function roundRectOn(ctx2, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx2.beginPath();
  ctx2.moveTo(x + r, y);
  ctx2.arcTo(x + w, y, x + w, y + h, r);
  ctx2.arcTo(x + w, y + h, x, y + h, r);
  ctx2.arcTo(x, y + h, x, y, r);
  ctx2.arcTo(x, y, x + w, y, r);
  ctx2.closePath();
}

function shareCard() {
  SFX.click();
  try {
    const c = buildShareCardCanvas();
    const text = `⚡ TesFlexer — Score ${G.score} · ${grade()}\nFull Self-Delivering ready? Beat my route!`;
    c.toBlob(async (blob) => {
      if (!blob) { msg("Could not build card", 2); return; }
      const file = new File([blob], "tesflexer-score.png", { type: "image/png" });
      // Prefer Web Share with file
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: "TesFlexer", text });
          msg("Shared your TesFlexer card!", 2.2);
          return;
        } catch (e) {
          if (e && e.name === "AbortError") return;
        }
      }
      if (navigator.share) {
        try {
          await navigator.share({ title: "TesFlexer", text });
        } catch {}
      }
      // Download fallback
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "tesflexer-score.png";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      // Clipboard image if available
      if (navigator.clipboard && window.ClipboardItem) {
        try {
          await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
          msg("Card saved + copied!", 2.4);
          return;
        } catch {}
      }
      msg("Share card downloaded!", 2.2);
    }, "image/png");
  } catch {
    msg("Share card unavailable — try text share", 2.4);
    shareScore();
  }
}

// THROW
// ═══════════════════════════════════════════════════════════
function throwPkg(tx, ty) {
  if (G.throwCD > 0 || state !== ST.PLAY) return;
  G.throwCD = 0.2;
  const sx = G.carX, sy = CAR_Y - 18;
  const c = clampAim(sx, sy, tx, ty);
  let s = stickyAim(c.x, c.y);
  // Porch bias when car is near best stop (strong delivery assist, not full aimbot)
  const b = bestStop();
  if (b && Math.abs(b.porch.cx - G.carX) < 100 && Math.abs(c.x - b.porch.cx) < 90) {
    s = {
      x: b.porch.cx, y: b.porch.cy, snap: true, house: b.house, porch: b.porch,
      assisted: true, trackKind: "porch", follow: 0.97,
    };
  }
  const ax = s.x, ay = s.y;
  const th = s.house || null;
  const trackKind = s.trackKind || "free";
  const follow = s.follow != null ? s.follow : (trackKind === "porch" ? 0.94 : trackKind === "free" ? 0 : 0.72);

  const def = PKG[G.nextPkg] || PKG.standard;
  const d = dist(sx, sy, ax, ay);
  const flight = estimateFlight(d, def);
  // Arc weight by package type; rain slightly flatter; max Flow steadies
  let arc = lerp(24, 38, Math.min(d / 220, 1)) * def.arc * (G.weather === "rain" ? 0.88 : 1);
  let vr = rand(-10, 10) / def.mass;
  if (G.flowBoostT > 0) {
    arc = lerp(arc, lerp(28, 34, Math.min(d / 220, 1)) * def.arc, 0.55);
    vr *= 0.45;
  }

  G.packages.push({
    x: sx, y: sy, sx, sy, tx: ax, ty: ay,
    t: 0, dur: flight,
    arc, rot: rand(0, Math.PI), vr,
    done: false, type: def.id, def, targetHouse: th,
    trackKind, trackObs: s.trackObs || null, follow,
    // Free-aim world lock: destination scrolls with the route
    freeScroll: trackKind === "free",
    trail: [],
  });
  // throw juice (light)
  burst(sx, sy, def.color, 5, 75);
  G.carVX += (sx - ax) * 0.015; // slight recoil weight
  SFX.throw();
  pickNextPackage();
}

/**
 * Update package destination toward tracked target (or scroll free aim with world).
 * Gentle smoothing keeps arcs natural while landing tracks porches / threats.
 */
function updatePackageTrack(pk, dt, scrollAmt) {
  if (pk.done) return;
  const rem = clamp(1 - pk.t / pk.dur, 0, 1);
  const pos = getTrackPos(pk);
  if (pos) {
    // Small predictive lead from remaining flight + scroll (porches / road threats)
    const leadK = pk.trackKind === "porch" ? 0.22 : 0.14;
    const leadY = G.speed * (pk.dur * rem) * leadK;
    let gx = pos.x, gy = pos.y + leadY;
    // Sideways lead for moving road threats
    if (pk.trackKind === "obstacle" && pk.trackObs) {
      gx += (pk.trackObs.vx || 0) * (pk.dur * rem) * 0.35;
    }
    // Stronger follow near the end of flight so final landings stick
    const baseFollow = pk.follow != null ? pk.follow : 0.85;
    const follow = clamp(baseFollow + (1 - rem) * 0.12, 0.35, 0.99);
    // Frame-rate independent smooth chase
    const k = 1 - Math.pow(1 - follow, dt * 16);
    pk.tx = lerp(pk.tx, gx, k);
    pk.ty = lerp(pk.ty, gy, k);
  } else if (pk.freeScroll || pk.trackKind === "free") {
    // World scrolls down — keep free landing on the same road/lawn cell
    pk.ty += scrollAmt;
    pk.freeScroll = true;
  } else {
    // Lost tracked target: soft land at last known, still scroll with world
    pk.ty += scrollAmt;
  }
}

// ═══════════════════════════════════════════════════════════
// COMBAT / HEARTS / Full Self-Delivering (FSD)
// ═══════════════════════════════════════════════════════════
function loseHeart(reason) {
  if (G.invuln > 0 || G.fsd > 0) return false;
  G.hearts--;
  G.invuln = 1.5;
  G.streak = 0;
  dumpFlow(0.78); // hard fail dumps most Flow
  shake(14); flash(0.35); hitStop(0.06);
  SFX.heart();
  if (reason) msg(reason, 2.2);
  if (G.hearts <= 0) endRoute(true);
  return true;
}

function oops(reason) {
  // Non-lethal soft fail
  G.fails++;
  G.streak = 0;
  softFlowHit(14);
  shake(5);
  if (reason) floatT(G.carX, CAR_Y - 60, reason, "#FFCC80", 13);
  SFX.miss();
}

function tryFSD() {
  G.fsdReady++;
  if (G.fsdReady >= FSD_NEED) {
    G.fsdReady = 0;
    G.fsd = FSD_DUR;
    G.fsdTriggers++;
    burst(G.carX, CAR_Y, "#00B0FF", 14, 150);
    ringBurst(G.carX, CAR_Y, "#00E5FF");
    flash(0.42, "rgba(0,229,255,0.55)");
    shake(7); hitStop(0.06); camPunch(8, 0);
    G.gradeCyan = Math.max(G.gradeCyan, 0.55);
    SFX.fsd();
    if (G.fsdTriggers >= 2) unlockAch("fsdSavant");
  }
}

function addScore(base, x, y, showPop = true) {
  const em = G.eventScoreMult || 1;
  const pts = Math.round(base * G.weatherMult * em * flowMult() * (1 + G.streak * 0.04));
  G.score += pts;
  // Soft score tick — no long words, just a quiet +n
  if (showPop) floatT(x, y, "+" + pts, "rgba(200,230,201,0.95)", 13, 0.65);
  return pts;
}

function endRoute(wrecked) {
  state = ST.END;
  G.wrecked = wrecked;
  stopBgHum();
  META.games++;
  META.totalDrops += G.deliveries;
  if (G.score > META.highScore) { META.highScore = G.score; G.newHigh = true; }
  if (G.bestStreak > META.bestStreak) META.bestStreak = G.bestStreak;
  saveMeta(META);
  if (!wrecked) unlockAch("firstFlex");
  if (G.bestStreak >= 10) unlockAch("porchPerfect");
  if (G.dogIncidents === 0 && G.deliveries >= 3) unlockAch("noDogs");
  if (G.threatBeans >= 5) unlockAch("beanQueen");
  if (G.weather === "golden" && G.score >= 1500) unlockAch("goldenFlex");
  if (!wrecked && G.hearts === 1) unlockAch("survivor");
  if (wrecked) SFX.fail(); else SFX.win();
}

// LADY
// ═══════════════════════════════════════════════════════════
const SPEED_LIMIT = 120;
function isSpeeding() { return G.speed >= SPEED_LIMIT; }

function tryLady(e, diff) {
  if (G.ladyCD > 0) return;
  if (e < 16 || !isSpeeding()) return;
  if (G.obstacles.some(o => o.type === "lady" && !o.dead)) return;
  const cands = G.houses.filter(h => !h.ladySpawned && h.y > 120 && h.y < CAR_Y - 140);
  if (!cands.length) return;
  const over = clamp((G.speed - SPEED_LIMIT) / 40, 0, 1);
  if (Math.random() > 0.012 + over * 0.03 + diff * 0.015) return;
  spawnLady(pick(cands));
}

function spawnLady(h) {
  h.ladySpawned = true;
  G.ladyCD = rand(10, 16);
  const p = getPorch(h);
  G.obstacles.push({
    type: "lady", x: p.cx, y: h.y + 18, w: 22, h: 36,
    vx: 0, dead: false, hit: false, phase: "warn", // warning before road entry
    roadX: h.side === 0 ? ROAD_L + rand(36, 70) : ROAD_R - rand(36, 70),
    age: 0, wave: 0, yellT: 1.25, yellText: pick(["SLOW DOWN!", "I SEE YOU!", "HOA WATCH!"]),
    anim: 0, warnT: 1.55,
  });
  floatT(p.cx, h.y, "!", "#F8BBD0", 18, 0.7);
  SFX.lady(); burst(p.cx, h.y + 18, "#F8BBD0", 10);
}

function updateLady(o, dt) {
  o.age += dt; o.wave += dt * 14; o.yellT -= dt; o.anim += dt * 10;
  if (o.phase === "warn") {
    // Short readable warning at porch — speech bubble, not on road yet
    // (world scroll is applied in the obstacle loop)
    o.warnT = (o.warnT || 0) - dt;
    if (o.yellT <= 0) { o.yellText = pick(["COMING OUT!", "PHONE READY!", "HOA LIVE!"]); o.yellT = 0.9; }
    if (o.warnT <= 0) {
      o.phase = "exit";
      o.yellText = pick(["I'M FILMING!", "HOA CHAT!", "SLOW DOWN!"]);
      o.yellT = 1.0;
      SFX.lady();
    }
  } else if (o.phase === "exit") {
    o.x += Math.sign(o.roadX - o.x) * Math.min(Math.abs(o.roadX - o.x), 150 * dt);
    o.y += 55 * dt;
    if (Math.abs(o.x - o.roadX) < 6) {
      o.phase = "chase"; o.x = o.roadX;
      o.yellText = pick(["I'M FILMING!","HOA CHAT!","SLOW DOWN!"]);
      o.yellT = 1.1; SFX.lady();
    }
  } else {
    o.vx = lerp(o.vx || 0, clamp((G.carX - o.x) * 3.2, -170, 170), 1 - Math.pow(0.02, dt));
    o.x = clamp(o.x + o.vx * dt, ROAD_L + 16, ROAD_R - 16);
    o.y += 100 * dt;
    if (o.yellT <= 0 && Math.random() < 0.02) {
      o.yellText = pick(["SENDING TO HOA!","GOT YOUR PLATE!","SPEED DEMON!"]);
      o.yellT = 1.3;
    }
  }
  if (o.y > CAR_Y + 80 || o.age > 10) o.dead = true;
}

/** World scroll rate used by tethered threats (lady warn, pirates) */
function scrollSpeed() { return G.speed || 0; }

// ═══════════════════════════════════════════════════════════
// PACKAGE RESOLUTION
// ═══════════════════════════════════════════════════════════
function resolveMidair(pk) {
  for (const o of G.obstacles) {
    if (o.dead || o.pkgHit) continue;
    // Lady warn: smaller hitbox (riskier — she's near the porch)
    let r = o.type === "car" ? 28 : o.type === "lady" ? (o.phase === "warn" ? 16 : 22) : 17;
    if (dist(pk.x, pk.y, o.x, o.y) < r) return hitEntity(pk, o);
  }
  // Active porch pirates as beanable midair targets
  for (const h of G.houses) {
    if (!h.hasPirate || h.pirateHit || h.pirateStolen || !isActive(h)) continue;
    if (h.pirateState !== "active" && h.pirateState !== "rush") continue;
    if (dist(pk.x, pk.y, h.pirateX, h.pirateY) < 18) return beanPirate(pk, h);
  }
  // Windows first (specific), then parked cars — geometry from layoutHouse
  for (const h of G.houses) {
    if (!h.windowBroken && hitsWindow(pk, h)) return hitWindow(pk, h);
  }
  for (const h of G.houses) {
    if (h.parkedCar && hitsParked(pk, h)) return hitParked(pk, h);
  }
  return false;
}

function beanPirate(pk, h, { countStreak = true } = {}) {
  if (h.pirateHit) return true;
  h.pirateHit = true;
  h.pirateState = "gone";
  G.pirateBonus++;
  G.threatBeans++;
  if (countStreak) {
    G.streak++;
    G.bestStreak = Math.max(G.bestStreak, G.streak);
  }
  const bonus = Math.round(70 * (pk.def?.mult || 1));
  G.score += Math.round(bonus * G.weatherMult * (G.eventScoreMult || 1) * flowMult());
  addFlow(14);
  confetti(h.pirateX || pk.x, h.pirateY || pk.y);
  shake(6); hitStop(0.04);
  floatT((h.pirateX || pk.x), (h.pirateY || pk.y) - 12, "+" + bonus, "#A5D6A7", 13, 0.65);
  SFX.dismiss();
  return true;
}

function hitsWindow(pk, h) {
  const L = layoutHouse(h);
  return pk.x > L.winX && pk.x < L.winX + L.winW &&
         pk.y > L.winY && pk.y < L.winY + L.winH;
}

function hitsParked(pk, h) {
  const L = layoutHouse(h);
  if (!L.car) return false;
  const c = L.car;
  return pk.x > c.x + 3 && pk.x < c.x + c.w - 3 &&
         pk.y > c.y + 4 && pk.y < c.y + c.h - 4;
}

function hitEntity(pk, o) {
  o.pkgHit = true;
  const dismiss = {
    lady: 60, ped: 40, dog: 35, scooter: 28, cone: 22, barrier: 20, branch: 18,
    mower: 32, bike: 38, trash: 26, robot: 42,
  };
  if (dismiss[o.type] != null) {
    // Lady during warn is riskier (near porch) but still beanable — slightly less bonus
    let base = dismiss[o.type];
    if (o.type === "lady" && o.phase === "warn") base = 48;
    const bonus = Math.round(base * (pk.def?.mult || 1));
    G.score += Math.round(bonus * G.weatherMult * (G.eventScoreMult || 1) * flowMult());
    G.threatBeans++;
    G.streak++;
    G.bestStreak = Math.max(G.bestStreak, G.streak);
    o.dead = true; o.hit = true;
    confetti(o.x, o.y); shake(5); hitStop(0.04);
    floatT(o.x, o.y - 14, "+" + bonus, "#A5D6A7", 13, 0.65);
    SFX.dismiss();
    // Flow from beans — dogs extra
    addFlow(o.type === "dog" ? 16 : o.type === "lady" ? 12 : 10);
    if (o.type === "dog") SFX.bark();
    return true;
  }
  // Potholes / wet spots aren't "beanable" — package vanishes
  if (o.type === "pothole" || o.type === "wet") {
    burst(pk.x, pk.y, o.type === "wet" ? "#4FC3F7" : "#37474F", 10);
    softFlowHit(8);
    SFX.miss();
    return true;
  }
  if (o.type === "car") {
    G.score = Math.max(0, G.score - 15); G.streak = 0;
    softFlowHit(16);
    burst(pk.x, pk.y, "#90A4AE", 12); shake(4);
    SFX.horn(); SFX.crack(); return true;
  }
  return false;
}

function hitParked(pk, h) {
  const pc = h.parkedCar;
  if (!pc.cracked) {
    pc.cracked = pc.dented = true;
    G.score = Math.max(0, G.score - 20); G.fails++; G.streak = 0;
    softFlowHit(14);
    burst(pk.x, pk.y, "#B0BEC5", 14); shake(6);
    floatT(pk.x, pk.y, "−20", "rgba(239,154,154,0.9)", 12, 0.55);
    SFX.crack();
  } else {
    burst(pk.x, pk.y, "#9E9E9E", 6); SFX.land();
  }
  return true;
}

function hitWindow(pk, h) {
  h.windowBroken = true; h.windowLit = false;
  G.score = Math.max(0, G.score - 25); G.fails++; G.streak = 0;
  softFlowHit(16);
  burst(pk.x, pk.y, "#E1F5FE", 14); shake(6); flash(0.12);
  floatT(pk.x, pk.y, "−25", "rgba(129,212,250,0.9)", 12, 0.55);
  SFX.crack();
  return true;
}

function resolveLand(pk) {
  if (resolveMidair(pk)) return;
  const ordered = [];
  if (pk.targetHouse && isActive(pk.targetHouse)) ordered.push(pk.targetHouse);
  for (const h of G.houses) if (h !== pk.targetHouse) ordered.push(h);

  for (const h of ordered) {
    const porch = getPorch(h);
    const on = pk.x > porch.x && pk.x < porch.x + porch.w && pk.y > porch.y && pk.y < porch.y + porch.h;
    const near = isActive(h) && dist(pk.x, pk.y, porch.cx, porch.cy) < lerp(50, 34, difficulty() / MAX_DIFF);
    const perfect = isActive(h) && dist(pk.x, pk.y, porch.cx, porch.cy) < 16;

    // Bean active pirate (if not also completing a porch drop — that path beans + delivers)
    if (!on && !near && h.hasPirate && !h.pirateHit && !h.pirateStolen && isActive(h) &&
        (h.pirateState === "active" || h.pirateState === "rush") &&
        dist(pk.x, pk.y, h.pirateX, h.pirateY) < 20) {
      beanPirate(pk, h);
      return;
    }

    if (on || near) {
      if (!h.needsDelivery) { oops(); return; }
      if (h.delivered || h.pirateStolen) return;

      // Delivering onto porch while pirate is active = bean bonus + complete delivery
      if (h.hasPirate && !h.pirateHit && (h.pirateState === "active" || h.pirateState === "rush")) {
        beanPirate(pk, h, { countStreak: false });
      }
      if (h.hasRing && Math.random() < lerp(0.05, 0.14, difficulty() / MAX_DIFF)) {
        h.ringHit = true; G.fails++; G.streak = 0;
        G.score = Math.max(0, G.score - 10);
        softFlowHit(10);
        floatT(pk.x, pk.y, "−10", "rgba(255,171,145,0.9)", 12, 0.5); SFX.miss(); return;
      }

      h.delivered = true;
      if (h.hasPirate) h.pirateState = "gone";
      G.deliveries++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
      let base = 100 * (pk.def?.mult || 1);
      if (h.special === "fresh") base *= 2;
      if (h.special === "express") base *= 1.5;
      if (perfect) { base *= 1.35; G.perfects++; }

      landBurst(porch.cx, porch.cy, pk.def);
      SFX.landType(pk.def?.id);

      if (h.hasSnack && !h.snackTaken) {
        h.snackTaken = true; G.snacks++; base += 40;
        confetti(porch.cx, porch.cy); SFX.perfect();
        addFlow(8);
      }
      if (perfect) {
        confetti(porch.cx, porch.cy); ringBurst(porch.cx, porch.cy, "#FFD54F");
        if (!(h.hasSnack && h.snackTaken)) SFX.perfect();
        flash(0.38, "rgba(255,213,79,0.5)");
        G.gradeWarm = Math.max(G.gradeWarm, 0.48);
        hitStop(0.055); camPunch(7); shake(10);
        addFlow(18);
      } else {
        SFX.deliver();
        shake(5); hitStop(0.035); camPunch(3);
        addFlow(8 + Math.min(6, G.streak));
      }

      addScore(base, porch.cx, porch.cy - 8, "+");
      tryFSD();
      return;
    }

    if (h.hasPool) {
      const pool = { x: h.poolX - 30, y: h.y + 4, w: 60, h: 42 };
      if (pk.x > pool.x && pk.x < pool.x + pool.w && pk.y > pool.y && pk.y < pool.y + pool.h) {
        G.fails++; G.streak = 0; G.score = Math.max(0, G.score - 20);
        softFlowHit(12);
        burst(pk.x, pk.y, "#29B6F6", 16); floatT(pk.x, pk.y, "−20", "rgba(79,195,247,0.9)", 12, 0.5);
        SFX.splash(); return;
      }
    }
    if (h.hasDog && !h.delivered) {
      const Ldog = layoutHouse(h);
      const dx = h.side === 0 ? Ldog.hx + 12 : Ldog.hx + Ldog.hw - 12;
      const dy = Ldog.driveTop + 18 + Math.sin((h.seed || 1) + now() / 450) * 1.2;
      const dd = dist(pk.x, pk.y, dx, dy);
      // Tight hit = successful bean + Flow
      if (dd < 16) {
        G.threatBeans++;
        G.streak++;
        G.bestStreak = Math.max(G.bestStreak, G.streak);
        const bonus = Math.round(40 * (pk.def?.mult || 1));
        G.score += Math.round(bonus * G.weatherMult * (G.eventScoreMult || 1) * flowMult());
        addFlow(18);
        confetti(dx, dy); floatT(dx, dy - 12, "+" + bonus, "#A5D6A7", 13, 0.65);
        SFX.dismiss(); SFX.bark();
        h.hasDog = false; // dismissed for this house
        return;
      }
      // Poor aim near dog — chance to be chased a short distance
      if (dd < 38 && Math.random() < 0.55) {
        G.fails++; G.dogIncidents++; G.streak = 0;
        G.score = Math.max(0, G.score - 8);
        softFlowHit(12);
        // Visual: package "chased" flecks along dog path
        for (let i = 0; i < budgetN(5); i++) {
          G.particles.push({
            x: pk.x, y: pk.y,
            vx: (dx - pk.x) * rand(0.4, 1.2), vy: (dy - pk.y) * rand(0.3, 0.9),
            life: 0.35, max: 0.35, r: 2.5, color: "#A1887F", g: 40,
          });
        }
        floatT(pk.x, pk.y, "chased!", "rgba(255,204,128,0.9)", 12, 0.55);
        SFX.bark(); SFX.miss();
        return;
      }
      if (dd < 28) {
        G.fails++; G.dogIncidents++; G.streak = 0; G.score = Math.max(0, G.score - 8);
        softFlowHit(10);
        burst(pk.x, pk.y, "#A1887F", 8); SFX.bark(); SFX.miss();
        return;
      }
    }
  }

  // driveway slab (below house — not porch)
  for (const h of G.houses) {
    if (!h.hasDriveway) continue;
    const L = layoutHouse(h);
    const top = L.driveTop;
    const dw = Math.min(L.hw + 8, 58);
    const dx = h.side === 0 ? L.hx + 4 : L.hx + L.hw - dw - 4;
    if (pk.x > dx && pk.x < dx + dw && pk.y > top && pk.y < top + 52) {
      if (h.parkedCar && hitsParked(pk, h)) continue;
      landBurst(pk.x, pk.y, pk.def); G.streak = 0; softFlowHit(6); SFX.landType(pk.def?.id); return;
    }
  }

  if (pk.x > ROAD_L && pk.x < ROAD_R) {
    landBurst(pk.x, pk.y, pk.def); G.streak = 0; softFlowHit(8); SFX.miss();
  } else {
    landBurst(pk.x, pk.y, pk.def); G.streak = 0; softFlowHit(6); SFX.miss();
  }
}

// ═══════════════════════════════════════════════════════════
// LATE-ROUTE EVENTS + THREATS + COACH
// ═══════════════════════════════════════════════════════════
const EVENT_META = {
  construction: { icon: "△", title: "Construction", score: 1, flow: 1 },
  dog_zone:     { icon: "🐕", title: "Dog Zone", score: 1, flow: 1.05 },
  dog_wave:     { icon: "🐕", title: "Dog Wave", score: 1, flow: 1.1 },
  fresh_boost:  { icon: "2×", title: "Fresh Drop", score: 1.12, flow: 1.08 },
  golden_flex:  { icon: "✦", title: "Golden Window", score: 1.18, flow: 1.28 },
  express_rush: { icon: "📦", title: "Express Rush", score: 1.08, flow: 1.12 },
};

function pushEventBanner(id) {
  const m = EVENT_META[id] || { icon: "!", title: "Event", score: 1, flow: 1 };
  G.eventBanner = { icon: m.icon, title: m.title, life: 1.7, max: 1.7 };
  G.eventScoreMult = m.score;
  G.eventFlowMult = m.flow;
}

function startEvent(id, dur) {
  G.event = id;
  G.eventT = dur;
  pushEventBanner(id);
  if (id === "dog_wave") G.dogWaveLeft = randi(2, 3);
  if (id === "construction") {
    // Immediate readable hazard cluster
    for (let i = 0; i < 2; i++) {
      const o = {
        type: pick(["cone", "cone", "barrier"]), x: rand(ROAD_L + 30, ROAD_R - 30),
        y: -40 - i * 50, w: 28, h: 22, vx: 0, dead: false, hit: false, anim: 0, pkgHit: false, seed: rand(0, 100),
      };
      if (o.type === "cone") { o.w = 18; o.h = 22; }
      if (o.type === "barrier") { o.w = 40; o.h = 18; }
      G.obstacles.push(o);
    }
  }
}

function updateEvents(dt, e) {
  if (G.eventT > 0) {
    G.eventT -= dt;
    if (G.eventT <= 0) {
      G.event = null;
      G.eventT = 0;
      G.eventScoreMult = 1;
      G.eventFlowMult = 1;
      G.dogWaveLeft = 0;
    }
  }
  if (G.eventBanner) {
    G.eventBanner.life -= dt;
    if (G.eventBanner.life <= 0) G.eventBanner = null;
  }
  if (G.event) return;

  // Early light events (existing cadence)
  if (e > 20 && e < 55 && Math.random() < 0.0025) {
    startEvent(pick(["fresh_boost", "construction", "dog_zone"]), 12);
    return;
  }
  // Late-route: stronger, shorter (8–12s), higher chance after ~55–60s
  if (e >= 56 && Math.random() < 0.0055) {
    const late = pick(["construction", "dog_wave", "golden_flex", "express_rush", "dog_wave", "golden_flex"]);
    startEvent(late, rand(8, 11));
  }
}

function spawnDogWaveUnit() {
  const o = {
    type: "dog", x: Math.random() < 0.5 ? ROAD_L + rand(24, 58) : ROAD_R - rand(24, 58),
    y: -60, w: 28, h: 16, vx: pick([-30, 30]) * (0.6 + difficulty() * 0.3),
    dead: false, hit: false, anim: 0, pkgHit: false, seed: rand(0, 100),
  };
  G.obstacles.push(o);
}

function piratePos(h, L) {
  const facingRight = h.side === 0;
  // Lurk beside yard; rush toward porch
  const porch = { x: L.porchCx, y: L.porchCy };
  if (h.pirateState === "lurk" || !h.pirateState) {
    return {
      x: porch.x + (facingRight ? 16 : -16),
      y: porch.y + 14,
    };
  }
  return { x: h.pirateX, y: h.pirateY };
}

function updatePirates(dt) {
  for (const h of G.houses) {
    if (!h.hasPirate || h.pirateHit || h.pirateStolen || !h.needsDelivery || h.delivered) continue;
    const L = layoutHouse(h);
    // Age only while house is on-screen and active
    if (isActive(h) && h.y > 40 && h.y < CAR_Y - 30) {
      h.activeAge = (h.activeAge || 0) + dt;
      h.pirateT = (h.pirateT || 0) + dt;
    }
    if (!h.pirateState || h.pirateState === "lurk") {
      const p = piratePos(h, L);
      h.pirateX = p.x; h.pirateY = p.y;
      // Clear window before pirate rushes the porch
      if ((h.activeAge || 0) > 4.8 || (h.pirateT || 0) > 5.2) {
        h.pirateState = "active";
        h.pirateT = 0;
      }
    } else if (h.pirateState === "active" || h.pirateState === "rush") {
      h.pirateState = "rush";
      const tx = L.porchCx, ty = L.porchCy;
      const dx = tx - h.pirateX, dy = ty - h.pirateY;
      const d = Math.hypot(dx, dy) || 1;
      const spd = 32;
      h.pirateX += (dx / d) * spd * dt;
      h.pirateY += (dy / d) * spd * dt;
      // Steal when on porch long enough
      if (d < 10) {
        h.pirateT = (h.pirateT || 0) + dt;
        if (h.pirateT > 0.7) {
          h.pirateStolen = true;
          h.delivered = true; // remove as active target
          h.pirateState = "gone";
          G.streak = 0;
          G.fails++;
          G.score = Math.max(0, G.score - 35);
          softFlowHit(22);
          floatT(L.porchCx, L.porchCy, "stolen!", "rgba(239,154,154,0.95)", 13, 0.7);
          burst(L.porchCx, L.porchCy, "#424242", 10);
          SFX.miss();
        }
      }
    }
  }
}

function updateCoach(dt, e) {
  // Returning players: short safety-net tip only
  if (!G.coachInteractive) {
    if (G.coachPhase === 0 && e > 0.8) {
      G.coachPhase = 1;
      msg("Arrows = steer · Drag = throw", 2.4);
    } else if (G.coachPhase === 1 && e > 4) {
      G.coachPhase = 2;
    }
    return;
  }
  // First-run interactive sequence (non-blocking)
  G.coachT = (G.coachT || 0) + dt;
