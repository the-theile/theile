  const steered = touchSteerDir() !== 0 || keys.ArrowLeft || keys.ArrowRight || keys.KeyA || keys.KeyD;
  if (G.coachStep === 0 && e > 0.45) {
    G.coachStep = 1;
    G.coachT = 0;
  } else if (G.coachStep === 1 && (G.coachT > 3.2 || steered)) {
    G.coachStep = 2;
    G.coachT = 0;
  } else if (G.coachStep === 2 && (G.coachT > 3.5 || G.deliveries > 0 || G.packages.length > 0)) {
    G.coachStep = 3;
    G.coachT = 0;
  } else if (G.coachStep === 3 && (G.coachT > 3.8 || G.deliveries > 0)) {
    G.coachStep = 4;
    G.coachInteractive = false;
    META.coachSeen = true;
    saveMeta(META);
  }
}

// ═══════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════
let lastT = now();

function update(dt) {
  // ambient always
  for (const c of G.clouds) {
    c.x += c.s * dt * (0.1 + c.layer * 0.12);
    if (c.x > W + 100) c.x = -100;
  }
  for (const b of G.birds) {
    b.x += b.s * dt; b.flap += dt * 9;
    if (b.x > W + 30) { b.x = -20; b.y = rand(40, 110); }
  }
  for (const r of G.rain) {
    r.y += 220 * r.z * dt;
    r.x += 18 * dt;
    if (r.y > H) { r.y = -10; r.x = rand(-20, W); }
  }

  if (state === ST.TITLE || state === ST.HOWTO) {
    G.scroll += 32 * dt; G.roadLines += 32 * dt;
    G.wheelRot = (G.wheelRot + 32 * dt * 0.085) % (Math.PI * 2);
    if (!G.houses.length) for (let i = 0; i < 6; i++) spawnHouse(i * 140 - 80);
    for (const h of G.houses) h.y += 32 * dt;
    for (const p of G.props) p.y += 32 * dt;
    G.houses = G.houses.filter(h => h.y < H + 120);
    G.props = G.props.filter(p => p.y < H + 120);
    if (G.houses.length < 6) spawnHouse(-90);
    G.carX = ROAD_CX + Math.sin(now() / 900) * 40;
    G.carLean = Math.sin(now() / 900) * 0.04;
    return;
  }
  if (state === ST.PAUSE || state === ST.END) {
    // Still decay UI toasts so share/copy feedback clears
    for (const m of G.messages) m.life -= dt;
    G.messages = G.messages.filter(m => m.life > 0);
    if (G.unlockQueue.length) {
      G._achT = (G._achT || 2.5) - dt;
      if (G._achT <= 0) { G.unlockQueue.shift(); G._achT = 2.5; }
    }
    return;
  }

  if (G.hitStop > 0) { G.hitStop -= dt; return; } // freeze frames for juice

  if (state === ST.GATE) {
    G.gateTimer -= dt;
    if (G.gateTimer <= 0) { loseHeart("Gate timeout!"); state = ST.PLAY; G.nextGateIn = rand(35, 50); }
    updateFX(dt); return;
  }

  // PLAY
  G.time -= dt;
  if (G.time <= 0) { G.time = 0; endRoute(false); return; }

  if (G.invuln > 0) G.invuln -= dt;
  if (G.throwCD > 0) G.throwCD -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 28);
  if (G.flash > 0) {
    G.flash = Math.max(0, G.flash - dt * 2.2);
    if (G.flash <= 0) G.flashColor = null;
  }
  if (G.camPunchY) G.camPunchY = lerp(G.camPunchY, 0, 1 - Math.pow(0.0008, dt));
  if (G.camPunchX) G.camPunchX = lerp(G.camPunchX, 0, 1 - Math.pow(0.0008, dt));
  if (Math.abs(G.camPunchY) < 0.05) G.camPunchY = 0;
  if (Math.abs(G.camPunchX) < 0.05) G.camPunchX = 0;
  G.gradeWarm = Math.max(0, (G.gradeWarm || 0) - dt * 0.9);
  G.gradeCool = Math.max(0, (G.gradeCool || 0) - dt * 0.9);
  G.gradeCyan = Math.max(0, (G.gradeCyan || 0) - dt * 0.75);
  if (G.ladyCD > 0) G.ladyCD -= dt;

  const e = elapsed();
  updateFlow(dt);
  updateCoach(dt, e);
  updatePirates(dt);
  updateEvents(dt, e);

  if (G.fsd > 0) {
    G.fsd -= dt;
    if (G.fsd <= 0) G.fsd = 0;
  }

  const diff = difficulty();
  // Hard: slightly higher cruise speed for tighter timing
  G.baseSpeed = lerp(isHard() ? 96 : 90, isHard() ? 168 : 158, easeOut(diff / MAX_DIFF));
  if (G.event === "construction") G.baseSpeed *= 0.88; // slightly slower during construction surge
  G.prevSpeed = G.speed;
  G.speed = G.baseSpeed * (G.fsd > 0 ? 1.06 : 1);
  // Brake light: slowing or Full Self-Delivering pathing correction
  G.braking = (G.speed < G.prevSpeed - 0.5) || (G.fsd > 0 && Math.abs(G.carVX) > 40);
  // Wheel spin from forward speed
  G.wheelRot = (G.wheelRot + G.speed * dt * 0.085) % (Math.PI * 2);
  const scrollAmt = G.speed * dt;
  G.scroll += scrollAmt; G.roadLines += scrollAmt;
  // subtle camera sway + punch recovery
  G.cameraY = lerp(G.cameraY, Math.sin(now() / 700) * 2 + G.carVX * 0.01, 0.1);

  // Steering — on-screen arrows + keyboard (same weight as legacy free-drag response)
  let inputX = 0;
  if (keys.ArrowLeft || keys.KeyA) inputX -= 1;
  if (keys.ArrowRight || keys.KeyD) inputX += 1;
  inputX = clamp(inputX + touchSteerDir(), -1, 1);

  if (G.fsd > 0) {
    let avoid = 0, best = 1e9;
    for (const o of G.obstacles) {
      if (o.dead || o.y < CAR_Y - 220 || o.y > CAR_Y + 40) continue;
      const dx = o.x - G.carX, threat = Math.abs(dx) + Math.abs(o.y - CAR_Y) * 0.35;
      if (threat < best && Math.abs(dx) < 72) { best = threat; avoid = dx > 0 ? -1 : 1; }
    }
    G.carVX = lerp(G.carVX, avoid * 210 + (ROAD_CX - G.carX) * 0.5, 1 - Math.pow(0.001, dt));
  } else {
    G.carVX = lerp(G.carVX, inputX * 240, 1 - Math.pow(0.001, dt));
    if (!inputX) G.carVX *= Math.pow(0.08, dt); // release → natural straighten
  }
  // weight: clamp accel feel — slightly heavier lean for premium chassis feel
  G.carX = clamp(G.carX + G.carVX * dt, ROAD_L + 26, ROAD_R - 26);
  const leanT = clamp(G.carVX / 320, -0.16, 0.16);
  G.carLean = lerp(G.carLean, leanT, 0.12);

  // Scroll world
  for (const h of G.houses) h.y += scrollAmt;
  for (const p of G.props) p.y += scrollAmt;
  for (const o of G.obstacles) {
    o.y += scrollAmt; o.anim += dt * 8;
    if (o.type === "lady") updateLady(o, dt);
    else {
      if (o.type === "car") o.y += (o.vy || 0) * dt;
      o.x += (o.vx || 0) * dt;
      if ((o.type === "scooter" || o.type === "ped" || o.type === "dog" ||
           o.type === "mower" || o.type === "bike" || o.type === "trash" || o.type === "robot") &&
          (o.x < ROAD_L + 14 || o.x > ROAD_R - 14)) o.vx *= -1;
    }
  }

  G.nextHouseDist -= scrollAmt;
  if (G.nextHouseDist <= 0) {
    spawnHouse(-90);
    // Tighter suburban spacing (was very sparse)
    G.nextHouseDist = lerp(155, 118, diff / MAX_DIFF);
  }

  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    if (e > 7) spawnObstacle();
    let spawnMul = G.event === "construction" ? 0.55 : 1;
    if (G.event === "dog_wave") spawnMul = 0.75;
    const baseSpawn = isHard()
      ? lerp(3.6, 1.25, easeOut(diff / MAX_DIFF))
      : lerp(4.6, 1.7, easeOut(diff / MAX_DIFF));
    G.spawnT = baseSpawn * spawnMul;
  }
  // Dog wave: inject 2–3 dogs in quick succession without changing base spawn curve permanently
  if (G.dogWaveLeft > 0 && Math.random() < 0.045) {
    spawnDogWaveUnit();
    G.dogWaveLeft--;
  }

  if (e > EASY_SECS + 10) {
    G.nextGateIn -= dt;
    if (G.nextGateIn <= 0) startGate();
  }

  tryLady(e, diff);

  // Packages — track scrolling / moving targets after world scroll
  for (const pk of G.packages) {
    if (pk.done) continue;
    updatePackageTrack(pk, dt, scrollAmt);
    pk.t += dt;
    const u = clamp(pk.t / pk.dur, 0, 1);
    const ease = smooth(u);
    pk.x = lerp(pk.sx, pk.tx, ease);
    pk.y = lerp(pk.sy, pk.ty, ease) - Math.sin(u * Math.PI) * pk.arc;
    pk.rot += pk.vr * dt;
    // Longer, softer motion trails
    pk.trail.push({ x: pk.x, y: pk.y, a: 1, r: 1 });
    const trailMax = pk.def?.id === "heavy" ? 14 : pk.def?.id === "envelope" ? 18 : 16;
    if (pk.trail.length > trailMax) pk.trail.shift();
    for (const t of pk.trail) { t.a *= 0.9; t.r = (t.r || 1) * 0.94; }

    if (u > 0.12 && u < 0.98 && resolveMidair(pk)) { pk.done = true; continue; }
    if (u >= 1) {
      // Final snap onto tracked target so landing feels fair
      const pos = getTrackPos(pk);
      if (pos && (pk.follow || 0) > 0.7) {
        pk.x = lerp(pk.x, pos.x, 0.85);
        pk.y = lerp(pk.y, pos.y, 0.85);
        pk.tx = pos.x; pk.ty = pos.y;
      }
      pk.done = true;
      resolveLand(pk);
    }
  }
  G.packages = G.packages.filter(p => !p.done || ((p.fade = (p.fade ?? 0.18) - dt) > 0));

  // Collisions car
  const car = { x: G.carX - 22, y: CAR_Y - 48, w: 44, h: 78 };
  for (const o of G.obstacles) {
    if (o.dead || o.hit) continue;
    if (o.type === "lady" && o.phase === "warn") continue; // porch warning — not a road hazard yet
    if (o.y < CAR_Y - 100 || o.y > CAR_Y + 55) continue;
    const ob = { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h };
    if (car.x < ob.x + ob.w && car.x + car.w > ob.x && car.y < ob.y + ob.h && car.y + car.h > ob.y) {
      o.hit = true; o.dead = true;
      onCarHit(o);
    }
  }

  G.houses = G.houses.filter(h => h.y < H + 130);
  G.props = G.props.filter(p => p.y < H + 130);
  G.obstacles = G.obstacles.filter(o => !o.dead && o.y < H + 100);
  updateFX(dt);
  for (const m of G.messages) m.life -= dt;
  G.messages = G.messages.filter(m => m.life > 0);
}

function onCarHit(o) {
  if (G.fsd > 0) {
    burst(o.x, o.y, "#00B0FF", 8); return;
  }
  if (o.type === "lady") {
    G.ladyHits++;
    loseHeart(pick(["Too fast — HOA noticed!", "Watch the speed on this block!"]));
    burst(o.x, o.y, "#CE93D8", 12); SFX.lady();
    return;
  }
  const table = {
    cone: "Traffic cone!",
    scooter: "Scooter!",
    car: "Fender bender!",
    ped: "Phone zombie!",
    dog: "Doggo attack!",
    pothole: "Pothole! Florida roads win again.",
    barrier: "Construction barrier!",
    branch: "Fallen branch!",
    mower: "Lawnmower!",
    bike: "Kid on a bike!",
    trash: "Trash bin!",
    wet: "Wet patch — whoops!",
    robot: "Delivery bot!",
  };
  if (o.type === "dog") { G.dogIncidents++; SFX.bark(); }
  if (o.type === "car") SFX.horn();
  loseHeart(table[o.type] || "Ouch!");
  const burstCol = (o.type === "pothole" || o.type === "wet") ? "#455A64"
    : o.type === "robot" ? "#4DD0E1"
    : o.type === "mower" ? "#8BC34A"
    : "#FF7043";
  burst(o.x, o.y, burstCol, 12);
  SFX.hit();
}

function startGate() {
  state = ST.GATE;
  const correct = String(randi(1000, 9999));
  const opts = new Set([correct]);
  while (opts.size < 3) {
    const digits = correct.split("");
    digits[randi(0, 3)] = String(randi(0, 9));
    opts.add(digits.join(""));
  }
  G.gateOptions = [...opts].sort(() => Math.random() - 0.5);
  G.gateCorrect = G.gateOptions.indexOf(correct);
  G.gateTimer = 10;
  msg("GATED COMMUNITY — pick the code!", 2);
}

function updateFX(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.g ?? 160) * dt; p.life -= dt;
  }
  // Cull dead + far off-screen for mobile budgets
  G.particles = G.particles.filter(p => p.life > 0 && p.x > -40 && p.x < W + 40 && p.y > -60 && p.y < H + 60);
  if (G.particles.length > PARTICLE_CAP) G.particles.splice(0, G.particles.length - PARTICLE_CAP);
  for (const f of G.floatText) { f.y += f.vy * dt; f.life -= dt; }
  G.floatText = G.floatText.filter(f => f.life > 0);
}

// ═══════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════
function draw() {
  ctx.save();
  // camera + shake + punch
  let sx = (G.camPunchX || 0), sy = (G.cameraY || 0) + (G.camPunchY || 0);
  if (G.shake > 0) {
    sx += rand(-G.shake, G.shake);
    sy += rand(-G.shake, G.shake) * 0.7;
  }
  ctx.translate(sx, sy);

  drawSky();
  drawParallaxFar();
  drawGround();
  drawRoad();
  drawProps();
  drawHouses();
  drawParallaxFG();
  drawObstacles();
  drawAim();
  drawPackages();
  drawCar();
  drawParticles();
  drawFloats();
  drawWeatherOverlay();
  drawColorGrade();

  ctx.restore();

  if (G.flash > 0) {
    const a = G.flash * 0.38;
    if (G.flashColor && G.flashColor.startsWith("rgba")) {
      ctx.fillStyle = G.flashColor.replace(/[\d.]+\)$/, Math.min(0.55, a) + ")");
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.1})`;
      ctx.fillRect(0, 0, W, H);
    } else {
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(0, 0, W, H);
    }
  }

  if (state === ST.TITLE) drawTitle();
  else if (state === ST.HOWTO) drawHowTo();
  else if (state === ST.PLAY || state === ST.GATE) {
    drawHUD();
    if (state === ST.PLAY) drawSteerControls();
    if (state === ST.GATE) drawGate();
  }
  else if (state === ST.PAUSE) { drawHUD(); drawPause(); }
  else if (state === ST.END) drawEnd();

  // achievement toast — larger for mobile
  if (G.unlockQueue.length) {
    const a = G.unlockQueue[0];
    softShadow(12, 0.22);
    ctx.fillStyle = "rgba(10,22,40,0.92)";
    roundRect(24, H - 100, W - 48, 52, 14); ctx.fill();
    clearShadow();
    ctx.strokeStyle = "#FFD54F"; ctx.lineWidth = 2;
    roundRect(24, H - 100, W - 48, 52, 14); ctx.stroke();
    ctx.fillStyle = "#FFD54F"; ctx.font = "bold 15px system-ui"; ctx.textAlign = "center";
    ctx.fillText("🏆 " + a.title, W / 2, H - 78);
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.font = "13px system-ui";
    ctx.fillText(a.desc, W / 2, H - 58);
  }
}

function drawSky() {
  const T = tod();
  // Continuous color temperature: morning Florida blue → warm late route
  let top, mid, bot;
  if (T.w === "rain") {
    top = mixHex("#546E7A", "#455A64", T.p);
    mid = mixHex("#90A4AE", "#78909C", T.p);
    bot = mixHex("#B0BEC5", "#90A4AE", T.p);
  } else if (T.w === "cloudy") {
    top = mixHex("#5C7A96", "#4A6580", T.evening);
    mid = mixHex("#8FA8B8", "#7A95A8", T.evening);
    bot = mixHex("#C5D5DE", mixHex("#B0C4CE", "#E8D5B8", T.warm), 1);
  } else if (T.w === "golden") {
    top = mixHex("#3B5BA0", "#1A237E", T.p);
    mid = mixHex("#E65100", "#BF360C", T.evening * 0.5);
    bot = mixHex("#FFCC80", "#FFE0B2", 1 - T.evening * 0.3);
  } else {
    // Sunny: bright morning → soft late-afternoon warmth
    top = mixHex("#3B7DD6", "#5B6FCF", T.evening);
    mid = mixHex("#6BB3E0", "#8EB8D4", T.evening);
    bot = mixHex("#D4EBF5", mixHex("#FFE0B2", "#FFCCBC", T.evening), T.warm);
  }

  const g = ctx.createLinearGradient(0, 0, 0, H * 0.52);
  g.addColorStop(0, top);
  g.addColorStop(0.45, mid);
  g.addColorStop(1, bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Sun / glow — continuous position from TOD
  if (T.sunA > 0.05) {
    const sx = T.sunX, sy = T.sunY;
    const warmSun = T.warm > 0.35 || T.w === "golden";
    const rg = ctx.createRadialGradient(sx, sy, 2, sx, sy, 70 + T.evening * 20);
    rg.addColorStop(0, warmSun ? `rgba(255,180,80,${0.85 * T.sunA})` : `rgba(255,252,220,${T.sunA})`);
    rg.addColorStop(0.4, `rgba(255,210,100,${0.28 * T.sunA})`);
    rg.addColorStop(1, "rgba(255,180,80,0)");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, 70 + T.evening * 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = warmSun ? `rgba(255,138,101,${0.9 * T.sunA})` : `rgba(255,245,157,${T.sunA})`;
    ctx.beginPath(); ctx.arc(sx, sy, 14 + T.evening * 3, 0, Math.PI * 2); ctx.fill();
  }
  for (const c of G.clouds) drawCloud(c);
  for (const b of G.birds) {
    const flap = Math.sin(b.flap) * 5;
    ctx.strokeStyle = `rgba(40,45,55,${0.4 - T.evening * 0.1})`; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x - 7, b.y + flap); ctx.quadraticCurveTo(b.x, b.y - 3, b.x + 7, b.y + flap);
    ctx.stroke();
  }
}

function drawCloud(c) {
  const T = tod();
  const a = G.weather === "rain" ? 0.55 : 0.72 + c.layer * 0.2;
  const cool = G.weather === "rain" || G.weather === "cloudy";
  // Slight warm tint late in route
  ctx.fillStyle = cool
    ? `rgba(176,190,197,${a})`
    : T.warm > 0.4
      ? `rgba(255,248,235,${a})`
      : `rgba(255,255,255,${a})`;
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.w * 0.5, c.w * 0.2, 0, 0, Math.PI * 2);
  ctx.ellipse(c.x - c.w * 0.28, c.y + 3, c.w * 0.28, c.w * 0.15, 0, 0, Math.PI * 2);
  ctx.ellipse(c.x + c.w * 0.25, c.y + 2, c.w * 0.3, c.w * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawParallaxFar() {
  const T = tod();
  const off = ((G.scroll * PX_FAR) % FAR_TILE + FAR_TILE) % FAR_TILE;
  const farCol = T.w === "golden" ? "rgba(90,55,35,0.18)"
    : (T.w === "rain" || T.w === "cloudy") ? "rgba(70,85,70,0.15)"
    : "rgba(55,105,50,0.16)";

  // Soft distant land wash
  const hz = ctx.createLinearGradient(0, H * 0.28, 0, H * 0.42);
  hz.addColorStop(0, "rgba(120,160,100,0)");
  hz.addColorStop(0.5, T.w === "golden" ? "rgba(160,120,70,0.09)" : "rgba(100,150,80,0.07)");
  hz.addColorStop(1, "rgba(90,140,70,0)");
  ctx.fillStyle = hz;
  ctx.fillRect(0, H * 0.28, W, H * 0.16);

  for (let k = 0; k < 2; k++) {
    const y0 = off - FAR_TILE + k * FAR_TILE;
    // Soft rolling hills on outer edges only
    ctx.fillStyle = farCol;
    ctx.beginPath();
    ctx.moveTo(0, y0 + 20);
    for (let i = 0; i <= 6; i++) {
      const tx = (i / 6) * 58;
      const th = 14 + Math.sin(i * 1.4 + k * 2) * 7 + (i % 2) * 4;
      ctx.lineTo(tx, y0 + 90 - th);
    }
    ctx.lineTo(58, y0 + 130);
    ctx.lineTo(0, y0 + 130);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(W, y0 + 20);
    for (let i = 0; i <= 6; i++) {
      const tx = W - (i / 6) * 58;
      const th = 14 + Math.sin(i * 1.5 + k * 2.2) * 7 + (i % 2) * 4;
      ctx.lineTo(tx, y0 + 90 - th);
    }
    ctx.lineTo(W - 58, y0 + 130);
    ctx.lineTo(W, y0 + 130);
    ctx.fill();

    const palms = [
      { x: 20, y: 50, s: 0.52 }, { x: 44, y: 150, s: 0.46 },
      { x: 28, y: 240, s: 0.5 },
      { x: W - 24, y: 80, s: 0.5 }, { x: W - 48, y: 185, s: 0.44 },
      { x: W - 32, y: 255, s: 0.48 },
    ];
    for (const p of palms) {
      const py = y0 + p.y;
      if (py < -60 || py > H + 50) continue;
      drawFarPalm(p.x, py, p.s);
    }
  }
}

function drawFarPalm(x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.strokeStyle = "rgba(45,80,40,0.35)";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 28);
  ctx.quadraticCurveTo(4, 8, 0, -30);
  ctx.stroke();
  ctx.fillStyle = "rgba(40,90,45,0.28)";
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i - 2) * 0.45;
    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.quadraticCurveTo(Math.cos(a) * 14, -34 + Math.sin(a) * 4, Math.cos(a) * 26, -22 + Math.sin(a) * 14);
    ctx.quadraticCurveTo(Math.cos(a) * 10, -26, 0, -28);
    ctx.fill();
  }
  ctx.restore();
}

function drawGround() {
  const T = tod();
  // Warm Florida lawns — slight TOD shift (cooler rain / warmer golden)
  const greenDeep = T.w === "golden" ? "#6B8F3A" : T.w === "rain" ? "#4A7A38" : "#5A8F35";
  const greenMid = T.w === "golden" ? "#8CB84A" : "#7CB342";
  const greenLite = T.w === "golden" ? "#A8D06A" : T.w === "rain" ? "#7BB05A" : "#9CCC65";

  const g1 = ctx.createLinearGradient(0, 0, ROAD_L, 0);
  g1.addColorStop(0, greenDeep);
  g1.addColorStop(0.55, greenMid);
  g1.addColorStop(1, greenLite);
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, ROAD_L, H);
  const g2 = ctx.createLinearGradient(ROAD_R, 0, W, 0);
  g2.addColorStop(0, greenLite);
  g2.addColorStop(0.45, greenMid);
  g2.addColorStop(1, greenDeep);
  ctx.fillStyle = g2;
  ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);

  // Soft mower bands (mid parallax)
  const mid = G.scroll * PX_MID;
  for (let i = 0; i < 16; i++) {
    const yy = ((i * 48 + mid) % (H + 48) + (H + 48)) % (H + 48) - 24;
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.025)";
    ctx.fillRect(0, yy, ROAD_L - 12, 22);
    ctx.fillRect(ROAD_R + 12, yy, W - ROAD_R - 12, 22);
  }
  // Sandy Florida soil flecks
  ctx.fillStyle = "rgba(210,180,120,0.12)";
  for (let i = 0; i < 7; i++) {
    const yy = ((i * 90 + mid * 0.85) % (H + 90) + (H + 90)) % (H + 90) - 20;
    ctx.beginPath();
    ctx.ellipse(18 + (i % 3) * 14, yy, 14, 5, 0, 0, Math.PI * 2);
    ctx.ellipse(W - 22 - (i % 2) * 12, yy + 30, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Concrete sidewalks with expansion joints
  const sw = ctx.createLinearGradient(ROAD_L - 18, 0, ROAD_L, 0);
  sw.addColorStop(0, "#D5CFC4");
  sw.addColorStop(1, "#C4BDB0");
  ctx.fillStyle = sw;
  ctx.fillRect(ROAD_L - 17, 0, 13, H);
  const sw2 = ctx.createLinearGradient(ROAD_R, 0, ROAD_R + 18, 0);
  sw2.addColorStop(0, "#C4BDB0");
  sw2.addColorStop(1, "#D5CFC4");
  ctx.fillStyle = sw2;
  ctx.fillRect(ROAD_R + 4, 0, 13, H);
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 20; i++) {
    const yy = ((i * 46 - mid) % (H + 46) + (H + 46)) % (H + 46);
    ctx.beginPath();
    ctx.moveTo(ROAD_L - 17, yy); ctx.lineTo(ROAD_L - 4, yy);
    ctx.moveTo(ROAD_R + 4, yy); ctx.lineTo(ROAD_R + 17, yy);
    ctx.stroke();
  }
}

function drawRoad() {
  // Warm sand curb (playfield edge) — road layer
  ctx.fillStyle = "#E0C9A0";
  ctx.fillRect(ROAD_L - 5, 0, 5, H);
  ctx.fillRect(ROAD_R, 0, 5, H);
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.fillRect(ROAD_L - 5, 0, 1.5, H);
  ctx.fillRect(ROAD_R + 3.5, 0, 1.5, H);

  // Sun-bleached asphalt with center crown
  const ag = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
  ag.addColorStop(0, "#4A5A63");
  ag.addColorStop(0.18, "#5A6C76");
  ag.addColorStop(0.5, "#6A7E89"); // crown highlight
  ag.addColorStop(0.82, "#5A6C76");
  ag.addColorStop(1, "#4A5A63");
  ctx.fillStyle = ag;
  ctx.fillRect(ROAD_L, 0, ROAD_W, H);

  // Soft asphalt grain + micro chips (road parallax)
  const road = G.scroll * PX_ROAD;
  ctx.fillStyle = "rgba(0,0,0,0.045)";
  for (let i = 0; i < 9; i++) {
    const yy = ((i * 85 + road * 0.4) % (H + 85) + (H + 85)) % (H + 85) - 30;
    ctx.beginPath();
    ctx.ellipse(ROAD_CX + Math.sin(i * 1.7) * 30, yy, 42, 12, 0.05, 0, Math.PI * 2);
    ctx.fill();
  }
  // Speckle grain (cheap, few)
  ctx.fillStyle = "rgba(255,255,255,0.03)";
  for (let i = 0; i < 12; i++) {
    const yy = ((i * 61 + road * 0.9) % (H + 40));
    const xx = ROAD_L + 12 + ((i * 47) % (ROAD_W - 24));
    ctx.fillRect(xx, yy, 2, 1.5);
  }

  // Yellow center dashes with soft glow
  ctx.strokeStyle = "rgba(255,236,100,0.25)";
  ctx.lineWidth = 7;
  ctx.setLineDash([24, 18]);
  ctx.lineDashOffset = -G.roadLines * 0.95;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX, 0);
  ctx.lineTo(ROAD_CX, H);
  ctx.stroke();
  ctx.strokeStyle = "#FFE566";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX, 0);
  ctx.lineTo(ROAD_CX, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // White edge lines
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 5, 0); ctx.lineTo(ROAD_L + 5, H);
  ctx.moveTo(ROAD_R - 5, 0); ctx.lineTo(ROAD_R - 5, H);
  ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 1, 0); ctx.lineTo(ROAD_L + 1, H);
  ctx.moveTo(ROAD_R - 1, 0); ctx.lineTo(ROAD_R - 1, H);
  ctx.stroke();
}

/** Light FG grass tufts on yards only — PX_FG */
function drawParallaxFG() {
  const tile = 160;
  const off = ((G.scroll * PX_FG) % tile + tile) % tile;
  ctx.fillStyle = "rgba(46,100,40,0.14)";
  for (let k = 0; k < 2; k++) {
    const y0 = off - tile + k * tile;
    for (let i = 0; i < 5; i++) {
      const ly = y0 + 18 + i * 32;
      if (ly < -8 || ly > H + 8) continue;
      const lx = 6 + (i % 3) * 9;
      ctx.beginPath();
      ctx.moveTo(lx, ly + 6);
      ctx.quadraticCurveTo(lx + 2, ly - 4, lx + 1, ly - 10);
      ctx.quadraticCurveTo(lx + 4, ly - 2, lx + 5, ly + 6);
      ctx.fill();
      const rx = W - 10 - (i % 3) * 9;
      ctx.beginPath();
      ctx.moveTo(rx, ly + 6);
      ctx.quadraticCurveTo(rx - 2, ly - 4, rx - 1, ly - 10);
      ctx.quadraticCurveTo(rx - 4, ly - 2, rx - 5, ly + 6);
      ctx.fill();
    }
  }
}

function drawColorGrade() {
  const T = tod();
  // Continuous ambient grade from TOD + temporary juice grades
  if (T.warm > 0.08) {
    ctx.fillStyle = `rgba(255,160,70,${0.04 + T.warm * 0.06})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (T.cool > 0.08) {
    ctx.fillStyle = `rgba(90,120,150,${T.cool * 0.07})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (T.evening > 0.35 && T.w !== "rain") {
    // Soft vignette warmth at horizon late in route
    const vg = ctx.createLinearGradient(0, 0, 0, H * 0.35);
    vg.addColorStop(0, `rgba(40,30,80,${T.evening * 0.06})`);
    vg.addColorStop(1, "rgba(40,30,80,0)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H * 0.35);
  }
  if (G.gradeWarm > 0.02) {
    ctx.fillStyle = `rgba(255,200,100,${G.gradeWarm * 0.14})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (G.gradeCyan > 0.02) {
    ctx.fillStyle = `rgba(0,220,255,${G.gradeCyan * 0.12})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawProps() {
  const sorted = G.props.slice().sort((a, b) => a.y - b.y);
  for (const p of sorted) {
    if (p.y < -100 || p.y > H + 90) continue;
    if (p.type === "palm") drawPalm(p.x, p.y, p.scale || 1);
    if (p.type === "pool") drawPool(p.x, p.y);
    if (p.type === "bush") {
      softShadow(6, 0.12);
      ctx.fillStyle = "#558B2F";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 14, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(p.x - 8, p.y + 2, 10, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(p.x + 8, p.y + 1, 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#8BC34A";
      ctx.beginPath();
      ctx.ellipse(p.x - 2, p.y - 3, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (p.type === "pole") {
      ctx.fillStyle = "#6D4C41"; ctx.fillRect(p.x - 2.5, p.y - 20, 5, 70);
      ctx.fillStyle = "#5D4037"; ctx.fillRect(p.x - 12, p.y - 18, 24, 3.5);
    }
    if (p.type === "hydrant") {
      ctx.fillStyle = "#E53935"; roundRect(p.x, p.y, 8, 12, 2); ctx.fill();
      ctx.fillRect(p.x - 3, p.y + 3, 14, 4);
    }
  }
}

function drawPalm(x, y, sc) {
  const T = tod();
  const sway = Math.sin(now() / 900 + x * 0.03) * 0.04;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  // Ground shadow follows sun angle / length from TOD
  const shX = Math.sin(T.shadowAng) * 14 * T.shadowLen;
  softShadow(10, 0.12 + T.evening * 0.04);
  ctx.fillStyle = `rgba(0,0,0,${0.12 + T.evening * 0.06})`;
  ctx.beginPath();
  ctx.ellipse(3 + shX, 36, 16 + T.shadowLen * 6, 5 + T.shadowLen * 2, T.shadowAng * 0.4, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();
  // Trunk with segments
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 8;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 34);
  ctx.quadraticCurveTo(7 + sway * 20, 10, -1 + sway * 10, -40);
  ctx.stroke();
  ctx.strokeStyle = "#A1887F";
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const t = i / 6;
    const px = lerp(0, -0.5, t) + Math.sin(t * 4) * 1.5;
    const py = lerp(30, -28, t);
    ctx.beginPath();
    ctx.moveTo(px - 3, py);
    ctx.lineTo(px + 3, py);
    ctx.stroke();
  }
  // Layered fronds with gentle wind sway
  const baseY = -40;
  ctx.save();
  ctx.translate(-1, baseY);
  ctx.rotate(sway);
  ctx.translate(1, -baseY);
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + (i - 3.5) * 0.36 + sway * 0.5;
    const len = 34 + (i % 3) * 5;
    ctx.fillStyle = i % 2 ? "#43A047" : "#2E7D32";
    ctx.beginPath();
    ctx.moveTo(-1, baseY);
    const mx = -1 + Math.cos(a) * len * 0.55;
    const my = baseY + Math.sin(a) * len * 0.35 - 8;
    const ex = -1 + Math.cos(a) * len;
    const ey = baseY + Math.sin(a) * len * 0.72;
    ctx.quadraticCurveTo(mx, my, ex, ey);
    ctx.quadraticCurveTo(mx + Math.cos(a + 1.2) * 6, my + 4, -1, baseY);
    ctx.fill();
  }
  ctx.strokeStyle = "rgba(129,199,132,0.5)";
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + (i - 1.5) * 0.4;
    ctx.beginPath();
    ctx.moveTo(-1, baseY);
    ctx.quadraticCurveTo(
      -1 + Math.cos(a) * 16, baseY - 10 + Math.sin(a) * 6,
      -1 + Math.cos(a) * 32, baseY + Math.sin(a) * 20
    );
    ctx.stroke();
  }
  ctx.restore();
  // Coconuts
  ctx.fillStyle = "#6D4C41";
  ctx.beginPath();
  ctx.arc(-3, -36, 3.2, 0, Math.PI * 2);
  ctx.arc(2, -34, 2.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPool(x, y) {
  const pg = ctx.createLinearGradient(x, y, x, y + 44);
  pg.addColorStop(0, "#4DD0E1"); pg.addColorStop(1, "#00ACC1");
  ctx.fillStyle = pg; roundRect(x - 30, y, 60, 42, 12); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)"; roundRect(x - 20, y + 5, 26, 10, 5); ctx.fill();
  ctx.strokeStyle = "#00838F"; ctx.lineWidth = 3; roundRect(x - 30, y, 60, 42, 12); ctx.stroke();
}

function drawHouses() {
  for (const h of G.houses.slice().sort((a, b) => a.y - b.y)) {
    if (h.y < -140 || h.y > H + 100) continue;
    drawHouse(h);
  }
}

function drawHouse(h) {
  const L = layoutHouse(h);
  const { hx, hy, hw, hh } = L;
  const facingRight = h.side === 0;
  const T = tod();
  const seed = h.seed || h.number || 1;
  const tNow = now();
  // Ambient: window should glow more as evening / golden / rain
  const wantLit = h.windowLit || (T.lightBias > 0.25 && (Math.sin(seed * 12.3) * 0.5 + 0.5) < T.lightBias);
  const flicker = wantLit && !h.windowBroken
    ? 0.88 + Math.sin(tNow / 180 + seed) * 0.08 + Math.sin(tNow / 47 + seed * 2) * 0.04
    : 1;
  const plantSway = Math.sin(tNow / 700 + seed) * 2.2;

  // Driveway slab BELOW house — ties into garage when present
  if (h.hasDriveway) {
    const top = L.driveTop;
    const dw = Math.min(hw + (h.garage ? 12 : 8), 62);
    const dx = facingRight ? hx + 2 : hx + hw - dw - 2;
    ctx.fillStyle = "#9E9E9E";
    roundRect(dx, top, dw, 52, 3);
    ctx.fill();
    // Soft driveway edge fade into lawn
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    ctx.fillRect(dx, top, 2, 52);
    ctx.fillRect(dx + dw - 2, top, 2, 52);
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(dx + 4, top + i * 12);
      ctx.lineTo(dx + dw - 4, top + i * 12);
      ctx.stroke();
    }
    // curb cut toward road
    ctx.fillStyle = "#BDBDBD";
    if (facingRight) {
      ctx.beginPath();
      ctx.moveTo(dx + dw, top + 20);
      ctx.lineTo(ROAD_L - 4, top + 28);
      ctx.lineTo(ROAD_L - 4, top + 44);
      ctx.lineTo(dx + dw, top + 40);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(dx, top + 20);
      ctx.lineTo(ROAD_R + 4, top + 28);
      ctx.lineTo(ROAD_R + 4, top + 44);
      ctx.lineTo(dx, top + 40);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Parked car first (under driveway, never covering porch)
  if (h.parkedCar) drawParked(h);

  // Soft house shadow (elongates slightly with TOD)
  softShadow(12, 0.16);
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  const shOff = Math.sin(T.shadowAng) * 4 * T.shadowLen;
  ctx.beginPath();
  ctx.ellipse(hx + hw / 2 + 2 + shOff, hy + hh + 5, hw * 0.44 * T.shadowLen * 0.9 + hw * 0.1, 7 + T.shadowLen * 2, 0, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();

  // Foundation / brick skirt
  ctx.fillStyle = h.brick;
  roundRect(hx - 1, hy + hh - 11, hw + 2, 13, 2);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 5; c++) {
      ctx.fillRect(hx + 3 + c * 9 + (r % 2) * 4, hy + hh - 9 + r * 4, 7, 2.5);
    }
  }

  // Stucco body — modern is squarer, cottage slightly taller silhouette already from layout
  const bg = ctx.createLinearGradient(hx, hy, hx + hw, hy + hh);
  bg.addColorStop(0, shade(h.color, 14));
  bg.addColorStop(0.4, h.color);
  bg.addColorStop(1, shade(h.color, -16));
  softShadow(8, 0.1);
  ctx.fillStyle = bg;
  const bodyR = h.style === "modern" ? 3 : h.style === "cottage" ? 7 : 5;
  roundRect(hx, hy, hw, hh - 8, bodyR);
  ctx.fill();
  clearShadow();
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(hx + 4 + (i * 13) % (hw - 10), hy + 10 + (i * 11) % (hh - 28), 3, 2);
  }
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1.2;
  roundRect(hx, hy, hw, hh - 8, bodyR);
  ctx.stroke();
  if (h.style === "modern") {
    // Bold accent bar + flat parapet lip
    ctx.fillStyle = h.accent;
    roundRect(hx, hy + 6, 5, hh - 22, 1);
    ctx.fill();
    ctx.fillStyle = shade(h.roof, 10);
    roundRect(hx - 2, hy - 2, hw + 4, 6, 1);
    ctx.fill();
  }

  // Roof — distinct silhouettes
  softShadow(6, 0.12);
  ctx.fillStyle = h.roof;
  ctx.beginPath();
  if (h.style === "modern") {
    // Low mono-slope
    ctx.moveTo(hx - 3, hy + 8);
    ctx.lineTo(hx + 2, hy - 6);
    ctx.lineTo(hx + hw + 4, hy + 2);
    ctx.lineTo(hx + hw + 2, hy + 8);
  } else if (h.style === "cottage") {
    // Steep A-frame with slight asymmetry
    ctx.moveTo(hx - 6, hy + 12);
    ctx.lineTo(hx + hw * 0.48, hy - 24);
    ctx.lineTo(hx + hw + 6, hy + 12);
  } else {
    // Ranch hip-ish wide roof
    ctx.moveTo(hx - 7, hy + 10);
    ctx.lineTo(hx + hw / 2, hy - 16);
    ctx.lineTo(hx + hw + 7, hy + 10);
  }
  ctx.closePath();
  ctx.fill();
  clearShadow();
  if (h.style !== "modern") {
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = 1;
    const peakY = h.style === "cottage" ? hy - 24 : hy - 16;
    for (let i = 0; i < 4; i++) {
      const t = 0.2 + i * 0.18;
      const y1 = lerp(peakY, hy + 10, t);
      const half = lerp(0, hw / 2 + 6, t);
      ctx.beginPath();
      ctx.moveTo(hx + hw / 2 - half, y1);
      ctx.lineTo(hx + hw / 2 + half, y1);
      ctx.stroke();
    }
  }
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx + 4, hy + 8);
  ctx.lineTo(hx + hw / 2, h.style === "cottage" ? hy - 20 : hy - 12);
  ctx.stroke();
  // Gutter
  ctx.strokeStyle = h.trim;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(hx - 3, hy + 10);
  ctx.lineTo(hx + hw + 3, hy + 10);
  ctx.stroke();
  // Soft flag / plant sway on cottage/ranch
  if (h.hasFlag) {
    const fx = facingRight ? hx + hw - 6 : hx + 6;
    const fy = hy - (h.style === "cottage" ? 8 : 2);
    ctx.strokeStyle = "#8D6E63";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(fx, fy + 22);
    ctx.lineTo(fx, fy);
    ctx.stroke();
    ctx.fillStyle = h.accent;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + (facingRight ? -12 : 12) + plantSway * 0.4, fy + 4 + plantSway * 0.15);
    ctx.lineTo(fx, fy + 9);
    ctx.closePath();
    ctx.fill();
  }

  // Subtle special house accent (no loud billboard text)
  if (h.special && !h.delivered && h.needsDelivery) {
    ctx.fillStyle = h.special === "fresh" ? "rgba(0,200,83,0.55)" : "rgba(255,153,0,0.5)";
    roundRect(hx + hw / 2 - 8, hy - 2, 16, 4, 2);
    ctx.fill();
  }

  // Garage on yard side — integrated with driveway slab
  if (h.garage) {
    const gx = facingRight ? hx + 4 : hx + hw - 28;
    const gw = h.style === "modern" ? 26 : 24;
    const gh = 28;
    const gy = hy + hh - gh - 8;
    // Garage bay sits slightly proud
    ctx.fillStyle = shade(h.color, -8);
    roundRect(gx - 1, gy - 2, gw + 2, gh + 4, 2);
    ctx.fill();
    ctx.fillStyle = "#78909C";
    roundRect(gx, gy, gw, gh, 2);
    ctx.fill();
    ctx.strokeStyle = "#546E7A";
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(gx + 2, gy + 5 + i * 6);
      ctx.lineTo(gx + gw - 2, gy + 5 + i * 6);
      ctx.stroke();
    }
    // Small header lintel
    ctx.fillStyle = h.trim;
    roundRect(gx - 1, gy - 3, gw + 2, 3, 1);
    ctx.fill();
  }

  // Door on road-facing wall
  const doorX = L.doorX;
  const doorY = L.doorY;
  softShadow(3, 0.1);
  ctx.fillStyle = h.trim;
  roundRect(doorX - 2, doorY, 20, 30, 3);
  ctx.fill();
  clearShadow();
  ctx.fillStyle = shade(h.accent, -22);
  roundRect(doorX, doorY + 2, 16, 26, 2);
  ctx.fill();
  // Door window pane — respects ambient lighting
  ctx.globalAlpha = wantLit ? flicker : 1;
  ctx.fillStyle = wantLit ? "rgba(255,249,196,0.65)" : "rgba(187,222,251,0.55)";
  roundRect(doorX + 3, doorY + 5, 10, 7, 1);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(doorX + 12, doorY + 16, 1.4, 0, Math.PI * 2);
  ctx.fill();
  // Occasional porch light (soft glow when on)
  const porchOn = h.porchLight && (wantLit || T.evening > 0.4 || T.w === "golden");
  if (porchOn) {
    const plx = doorX + 8, ply = doorY - 6;
    const glow = ctx.createRadialGradient(plx, ply, 1, plx, ply, 14);
    glow.addColorStop(0, `rgba(255,236,160,${0.35 * flicker})`);
    glow.addColorStop(1, "rgba(255,200,80,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(plx, ply, 14, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = `rgba(255,249,196,${0.85 * flicker})`;
    ctx.beginPath();
    ctx.arc(plx, ply, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  if (h.hasRing) {
    ctx.fillStyle = h.ringHit ? "#FF5252" : "#37474F";
    ctx.beginPath();
    ctx.arc(doorX + 8, doorY - 3, 3.2, 0, Math.PI * 2);
    ctx.fill();
    if (!h.ringHit) {
      ctx.fillStyle = "#81C784";
      ctx.beginPath();
      ctx.arc(doorX + 8, doorY - 3, 1.1, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Window (matches hitbox) — flicker when lit
  drawWin(L.winX, L.winY, L.winW, L.winH, wantLit && !h.windowBroken, h.shutters, h.accent, h.windowBroken, flicker);
  // Second window — ranch/cottage; modern gets a wide ribbon
  if (h.style === "modern" && !h.garage) {
    drawWin(L.winX, L.winY + L.winH + 6, Math.min(L.winW + 4, 30), 10, wantLit && !h.windowBroken, false, h.accent, false, flicker);
  } else if (hw > 52 && !h.garage) {
    const wy2 = L.winY + L.winH + 8;
    if (wy2 + 12 < hy + hh - 16) {
      drawWin(L.winX, wy2, 14, 11, wantLit && T.evening > 0.5 && !h.windowBroken, false, h.accent, false, flicker * 0.9);
    }
  }
  // Planter sway near foundation
  if (h.hasPlanters) {
    const px = facingRight ? hx + 6 : hx + hw - 14;
    const py = hy + hh - 14;
    ctx.fillStyle = "#6D4C41";
    roundRect(px, py, 10, 6, 1);
    ctx.fill();
    ctx.fillStyle = "#66BB6A";
    ctx.beginPath();
    ctx.ellipse(px + 5 + plantSway * 0.15, py - 2, 6, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Quiet house number plaque (small, low contrast)
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  roundRect(hx + hw / 2 - 9, hy + hh - 18, 18, 8, 2);
  ctx.fill();
  ctx.fillStyle = "rgba(55,71,79,0.55)";
  ctx.font = "bold 7px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(String(h.number % 100), hx + hw / 2, hy + hh - 12);

  // Porch stoop — soft stone pad on road face
  softShadow(6, 0.12);
  const pg = ctx.createLinearGradient(L.porchX, L.porchY, L.porchX, L.porchY + L.porchH);
  pg.addColorStop(0, "#F0E8DE");
  pg.addColorStop(1, "#C4B5A5");
  ctx.fillStyle = pg;
  roundRect(L.porchX, L.porchY, L.porchW, L.porchH, 5);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1;
  roundRect(L.porchX, L.porchY, L.porchW, L.porchH, 5);
  ctx.stroke();
  // Paver seam
  ctx.strokeStyle = "rgba(0,0,0,0.06)";
  ctx.beginPath();
  ctx.moveTo(L.porchCx, L.porchY + 2);
  ctx.lineTo(L.porchCx, L.porchY + L.porchH - 2);
  ctx.stroke();
  // Posts + little roof
  ctx.fillStyle = h.trim;
  roundRect(L.porchX + 2, L.porchY - 11, 3, 13, 1);
  ctx.fill();
  roundRect(L.porchX + L.porchW - 5, L.porchY - 11, 3, 13, 1);
  ctx.fill();
  softShadow(4, 0.1);
  ctx.fillStyle = shade(h.roof, 25);
  roundRect(L.porchX - 2, L.porchY - 14, L.porchW + 4, 5, 2);
  ctx.fill();
  clearShadow();

  // Quiet mailbox silhouette
  if (h.hasMailbox) {
    const mx = facingRight ? ROAD_L - 16 : ROAD_R + 9;
    const my = L.porchCy + 12;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#90A4AE";
    ctx.fillRect(mx + 3, my, 1.5, 8);
    roundRect(mx, my - 5, 7, 5, 1);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (isActive(h)) drawDrop(h, L);
  else if (h.needsDelivery && h.delivered) {
    // Quiet delivered mark — soft box, no big check text
    ctx.globalAlpha = 0.55;
    drawBox(L.porchCx, L.porchCy, 0.6, PKG.standard);
    ctx.globalAlpha = 1;
  }

  if (h.hasSnack && !h.snackTaken && isActive(h)) {
    // Soft cooler instead of emoji block
    const sx = L.porchX + 2;
    const sy = L.porchY - 8;
    ctx.fillStyle = "rgba(239,83,80,0.75)";
    roundRect(sx, sy, 8, 7, 1.5);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(sx + 1, sy + 1, 6, 2);
  }
  if (h.hasPirate && !h.pirateHit && !h.pirateStolen && isActive(h)) {
    const px = h.pirateX || (L.porchCx + (facingRight ? 14 : -14));
    const py = h.pirateY || L.porchCy;
    const active = h.pirateState === "active" || h.pirateState === "rush";
    if (active) {
      // Soft threat ring when rushing porch
      ctx.globalAlpha = 0.25 + Math.sin(now() / 120) * 0.1;
      ctx.strokeStyle = "#EF5350";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(px, py + 2, 12, 8, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = active ? "#212121" : "#424242";
    ctx.beginPath();
    ctx.ellipse(px, py + 8, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
    // Hood hint
    ctx.fillStyle = "#616161";
    roundRect(px - 4, py - 6, 8, 4, 1);
    ctx.fill();
  }
  if (h.hasDog && !h.delivered) {
    // Gentle idle: sit-bob, occasional head tilt
    const dx = facingRight ? hx + 12 : hx + hw - 12;
    const dy = L.driveTop + 18 + Math.sin(tNow / 450 + seed) * 1.2;
    drawDog(dx, dy, facingRight ? 1 : -1, tNow / 500 + seed);
  }
}

function drawDrop(h, L) {
  L = L || layoutHouse(h);
  const gx = L.porchCx, gy = L.porchCy;
  const pulse = 0.5 + Math.sin(now() / 320 + h.number) * 0.5;
  const best = bestStop();
  const isBest = best && best.house === h;
  // Soft pulsing pad + package icon only — no text
  const col = isBest ? "rgba(77,208,225,0.95)" : "rgba(255,183,77,0.75)";
  ctx.save();
  // Outer soft pad wash
  ctx.globalAlpha = 0.12 + pulse * 0.12;
  ctx.fillStyle = isBest ? "#4DD0E1" : "#FFB74D";
  ctx.beginPath();
  ctx.ellipse(gx, gy + 1, 12 + pulse * 1.5, 7.5 + pulse * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Expanding ring (best target only)
  if (isBest) {
    const ring = (now() / 700) % 1;
    ctx.globalAlpha = (1 - ring) * 0.35;
    ctx.strokeStyle = "#4DD0E1";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(gx, gy + 1, 10 + ring * 10, 6 + ring * 6, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Thin ring
  ctx.globalAlpha = 0.35 + pulse * 0.25;
  ctx.strokeStyle = col;
  ctx.lineWidth = isBest ? 2.2 : 1.4;
  ctx.beginPath();
  ctx.ellipse(gx, gy + 1, 11 + pulse * 1.2, 7 + pulse * 0.6, 0, 0, Math.PI * 2);
  ctx.stroke();
  // Package icon
  ctx.globalAlpha = isBest ? 0.95 : 0.72;
  if (isBest) {
    ctx.shadowColor = "rgba(77,208,225,0.55)";
    ctx.shadowBlur = 8;
  }
  drawBox(gx, gy - 0.5, isBest ? 0.8 : 0.65, PKG.standard);
  clearShadow();
  ctx.restore();
}

function drawWin(x, y, w, h, lit, shutters, accent, broken, flicker = 1) {
  if (shutters) {
    ctx.fillStyle = accent; roundRect(x - 5, y, 5, h, 1); ctx.fill();
    roundRect(x + w, y, 5, h, 1); ctx.fill();
  }
  if (lit && !broken) {
    // Soft room glow behind glass
    const glow = ctx.createRadialGradient(x + w / 2, y + h / 2, 1, x + w / 2, y + h / 2, w * 0.9);
    glow.addColorStop(0, `rgba(255,236,160,${0.35 * flicker})`);
    glow.addColorStop(1, "rgba(255,200,80,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, w * 0.7, h * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = lit ? flicker : 1;
  ctx.fillStyle = broken ? "#37474F" : lit ? "#FFF9C4" : "#E3F2FD";
  roundRect(x, y, w, h, 2); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "#78909C"; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  if (broken) {
    ctx.strokeStyle = "rgba(200,230,255,0.75)"; ctx.beginPath();
    ctx.moveTo(x + 2, y + 3); ctx.lineTo(x + w * 0.5, y + h * 0.5); ctx.lineTo(x + w - 2, y + 4); ctx.stroke();
  } else {
    ctx.strokeStyle = lit ? "rgba(120,100,40,0.25)" : "#78909C";
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
    ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
  }
}

function drawParked(h) {
  const pc = h.parkedCar; if (!pc) return;
  const L = layoutHouse(h);
  if (!L.car) return;
  const { cx: x, cy: y, w, h: ht } = L.car;
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(x, y + ht * 0.38, w * 0.48, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pc.dented ? shade(pc.color, -25) : pc.color;
  roundRect(x - w / 2, y - ht / 2, w, ht, 6);
  ctx.fill();
  ctx.fillStyle = pc.cracked ? "rgba(80,90,100,0.85)" : "rgba(30,50,70,0.75)";
  roundRect(x - w / 2 + 4, y - ht / 2 + 8, w - 8, ht * 0.28, 3);
  ctx.fill();
  if (pc.cracked) {
    ctx.strokeStyle = "rgba(200,230,255,0.75)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 5, y - ht * 0.2);
    ctx.lineTo(x + 1, y);
    ctx.lineTo(x + 6, y - ht * 0.15);
    ctx.stroke();
  }
  // wheels
  ctx.fillStyle = "#212121";
  roundRect(x - w / 2 - 1, y - ht / 2 + 6, 4, 10, 1);
  roundRect(x + w / 2 - 3, y - ht / 2 + 6, 4, 10, 1);
  roundRect(x - w / 2 - 1, y + ht / 2 - 16, 4, 10, 1);
  roundRect(x + w / 2 - 3, y + ht / 2 - 16, 4, 10, 1);
}

function drawObstacles() {
  for (const o of G.obstacles) {
    if (o.y < -80 || o.y > H + 80) continue;
    if (o.type === "pothole") {
      const s = o.seed || 1;
      softShadow(7, 0.24);
      ctx.fillStyle = "#1A2228";
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, 17 + (s % 5), 11 + (s % 3), 0.15, 0, Math.PI * 2);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#0E1216";
      ctx.beginPath();
      ctx.ellipse(o.x - 2, o.y + 1, 11, 6.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,183,77,0.45)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, 18 + (s % 4), 12, 0.1, 0.15, Math.PI * 1.75);
      ctx.stroke();
    } else if (o.type === "wet") {
      // Shiny wet patch — cool blue read
      softShadow(5, 0.12);
      const wg = ctx.createRadialGradient(o.x - 4, o.y - 2, 2, o.x, o.y, 22);
      wg.addColorStop(0, "rgba(129,212,250,0.55)");
      wg.addColorStop(0.55, "rgba(79,195,247,0.35)");
      wg.addColorStop(1, "rgba(3,169,244,0.08)");
      ctx.fillStyle = wg;
      ctx.beginPath();
      ctx.ellipse(o.x, o.y, 20, 12, 0.1, 0, Math.PI * 2);
      ctx.fill();
      clearShadow();
      ctx.strokeStyle = "rgba(255,255,255,0.45)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(o.x - 3, o.y - 3, 8, 3, -0.3, 0, Math.PI);
      ctx.stroke();
    } else if (o.type === "barrier") {
      softShadow(6, 0.16);
      ctx.fillStyle = "#FAFAFA";
      roundRect(o.x - 22, o.y - 9, 44, 18, 4);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#FF6D00";
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(o.x - 20 + i * 11, o.y - 9);
        ctx.lineTo(o.x - 12 + i * 11, o.y - 9);
        ctx.lineTo(o.x - 14 + i * 11, o.y + 9);
        ctx.lineTo(o.x - 22 + i * 11, o.y + 9);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = "rgba(0,0,0,0.2)";
      ctx.lineWidth = 1.5;
      roundRect(o.x - 22, o.y - 9, 44, 18, 4);
      ctx.stroke();
      ctx.fillStyle = "#607D8B";
      ctx.fillRect(o.x - 19, o.y + 8, 6, 5);
      ctx.fillRect(o.x + 13, o.y + 8, 6, 5);
    } else if (o.type === "branch") {
      softShadow(5, 0.14);
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.rot || 0);
      ctx.strokeStyle = "#5D4037";
      ctx.lineWidth = 4.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-18, 2);
      ctx.quadraticCurveTo(0, -7, 18, 0);
      ctx.stroke();
      ctx.strokeStyle = "#43A047";
      ctx.lineWidth = 2.5;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.moveTo(i * 7, -1);
        ctx.quadraticCurveTo(i * 10, -12, i * 14, -9);
        ctx.stroke();
      }
      ctx.restore();
      clearShadow();
    } else if (o.type === "cone") {
      // High-read orange cone + white band + base
      softShadow(6, 0.16);
      ctx.fillStyle = "#FF6D00";
      ctx.beginPath();
      ctx.moveTo(o.x, o.y - 16);
      ctx.lineTo(o.x + 11, o.y + 9);
      ctx.lineTo(o.x - 11, o.y + 9);
      ctx.closePath();
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#FFF8E1";
      ctx.fillRect(o.x - 6.5, o.y - 2, 13, 4.5);
      ctx.fillStyle = "#E65100";
      ctx.fillRect(o.x - 12, o.y + 9, 24, 4);
      ctx.strokeStyle = "rgba(0,0,0,0.15)";
      ctx.lineWidth = 1;
      ctx.strokeRect(o.x - 12, o.y + 9, 24, 4);
    } else if (o.type === "scooter") {
      softShadow(5, 0.12);
      ctx.strokeStyle = "#00BCD4";
      ctx.lineWidth = 3.2;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + 14);
      ctx.lineTo(o.x, o.y - 10);
      ctx.lineTo(o.x + 9, o.y - 16);
      ctx.stroke();
      clearShadow();
      ctx.fillStyle = "#263238";
      ctx.beginPath();
      ctx.arc(o.x, o.y + 15, 4.2, 0, Math.PI * 2);
      ctx.arc(o.x, o.y - 4, 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#80DEEA";
      roundRect(o.x - 3, o.y + 2, 6, 8, 2);
      ctx.fill();
    } else if (o.type === "car") {
      softShadow(9, 0.18);
      ctx.fillStyle = o.color;
      roundRect(o.x - 22, o.y - 36, 44, 72, 11);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "rgba(20,35,50,0.78)";
      roundRect(o.x - 16, o.y - 22, 32, 24, 5);
      ctx.fill();
      ctx.fillStyle = "rgba(255,236,179,0.9)";
      roundRect(o.x - 17, o.y + 28, 10, 5, 1);
      ctx.fill();
      roundRect(o.x + 7, o.y + 28, 10, 5, 1);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.12)";
      ctx.lineWidth = 1.5;
      roundRect(o.x - 22, o.y - 36, 44, 72, 11);
      ctx.stroke();
    } else if (o.type === "ped") {
      const bob = Math.sin(o.anim) * 2;
      const shirt = pickStable(o.x, ["#42A5F5", "#AB47BC", "#26A69A", "#FF7043"]);
      softShadow(5, 0.12);
      ctx.fillStyle = shirt;
      roundRect(o.x - 7, o.y - 3 + bob, 14, 16, 4);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#FFCC80";
      ctx.beginPath();
      ctx.arc(o.x, o.y - 10 + bob, 6.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#212121";
      roundRect(o.x + 5, o.y - 8 + bob, 5, 8, 1);
      ctx.fill();
      ctx.fillStyle = "#37474F";
      ctx.fillRect(o.x - 5, o.y + 12 + bob, 4, 10);
      ctx.fillRect(o.x + 1, o.y + 12 - bob, 4, 10);
    } else if (o.type === "mower") {
      // Riding lawnmower — green deck + red seat, high read
      softShadow(6, 0.16);
      ctx.fillStyle = o.color || "#2E7D32";
      roundRect(o.x - 18, o.y - 4, 36, 16, 5);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#C62828";
      roundRect(o.x - 8, o.y - 14, 16, 12, 3);
      ctx.fill();
      ctx.fillStyle = "#FFCC80";
      ctx.beginPath();
      ctx.arc(o.x, o.y - 18, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#212121";
      ctx.beginPath();
      ctx.arc(o.x - 12, o.y + 10, 5, 0, Math.PI * 2);
      ctx.arc(o.x + 12, o.y + 10, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#81C784";
      ctx.fillRect(o.x - 16, o.y + 2, 10, 3);
    } else if (o.type === "bike") {
      const bob = Math.sin(o.anim * 1.4) * 1.5;
      softShadow(4, 0.12);
      ctx.strokeStyle = o.color || "#29B6F6";
      ctx.lineWidth = 2.8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(o.x - 10, o.y + 10 + bob, 7, 0, Math.PI * 2);
      ctx.arc(o.x + 10, o.y + 10 + bob, 7, 0, Math.PI * 2);
      ctx.stroke();
      clearShadow();
      ctx.beginPath();
      ctx.moveTo(o.x - 10, o.y + 10 + bob);
      ctx.lineTo(o.x, o.y - 2 + bob);
      ctx.lineTo(o.x + 10, o.y + 10 + bob);
      ctx.lineTo(o.x, o.y + 4 + bob);
      ctx.closePath();
      ctx.stroke();
      ctx.fillStyle = o.color || "#29B6F6";
      roundRect(o.x - 5, o.y - 10 + bob, 10, 12, 3);
      ctx.fill();
      ctx.fillStyle = "#FFCC80";
      ctx.beginPath();
      ctx.arc(o.x, o.y - 16 + bob, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#FFEB3B";
      ctx.beginPath();
      ctx.arc(o.x, o.y - 20 + bob, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.type === "trash") {
      softShadow(6, 0.15);
      ctx.fillStyle = o.color || "#546E7A";
      roundRect(o.x - 12, o.y - 14, 24, 30, 5);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = shade(o.color || "#546E7A", 30);
      roundRect(o.x - 13, o.y - 18, 26, 8, 3);
      ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      ctx.fillRect(o.x - 8, o.y - 8, 4, 18);
      ctx.fillStyle = "#212121";
      ctx.beginPath();
      ctx.arc(o.x - 8, o.y + 16, 3.5, 0, Math.PI * 2);
      ctx.arc(o.x + 8, o.y + 16, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.type === "robot") {
      // Small delivery bot — white body, cyan light, wheels
      softShadow(6, 0.14);
      ctx.fillStyle = "#ECEFF1";
      roundRect(o.x - 14, o.y - 8, 28, 18, 6);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#00E5FF";
      roundRect(o.x - 8, o.y - 4, 16, 6, 2);
      ctx.fill();
      ctx.fillStyle = "#90A4AE";
      roundRect(o.x - 6, o.y - 14, 12, 8, 3);
      ctx.fill();
      ctx.fillStyle = "#37474F";
      ctx.beginPath();
      ctx.arc(o.x - 10, o.y + 10, 4, 0, Math.PI * 2);
      ctx.arc(o.x + 10, o.y + 10, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,229,255,0.5)";
      ctx.lineWidth = 1.5;
      roundRect(o.x - 14, o.y - 8, 28, 18, 6);
      ctx.stroke();
    } else if (o.type === "dog") drawDog(o.x, o.y, o.vx >= 0 ? 1 : -1, o.anim);
    else if (o.type === "lady") drawLady(o);
  }
}

function pickStable(seed, arr) { return arr[Math.abs(Math.floor(seed * 7.13)) % arr.length]; }

function drawDog(x, y, dir, anim = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  const leg = Math.sin(anim * 2) * 3;
  ctx.fillStyle = "#A1887F"; roundRect(-11, -6, 22, 11, 4); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -4, 6.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(-8, 3 + leg, 3.5, 5); ctx.fillRect(3, 3 - leg, 3.5, 5);
  ctx.beginPath(); ctx.ellipse(9, -10, 3.2, 4.5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawLady(o) {
  const run = Math.sin(o.wave || 0) * 4;
  const phoneA = Math.sin((o.wave || 0) * 1.3) * 0.4;
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.phase === "chase") {
    ctx.globalAlpha = 0.22 + Math.sin(now() / 80) * 0.1;
    ctx.fillStyle = "#F48FB1"; ctx.beginPath(); ctx.arc(0, -4, 22, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#F5F5F5";
  ctx.fillRect(-6, 8 + run * 0.3, 5, 12); ctx.fillRect(1, 8 - run * 0.3, 5, 12);
  ctx.fillStyle = "#EC407A";
  ctx.fillRect(-7, 18 + run * 0.3, 7, 3); ctx.fillRect(1, 18 - run * 0.3, 7, 3);
  const robe = ctx.createLinearGradient(-12, -10, 12, 14);
  robe.addColorStop(0, "#CE93D8"); robe.addColorStop(1, "#8E24AA");
  ctx.fillStyle = robe; roundRect(-11, -8, 22, 22, 6); ctx.fill();
  ctx.fillStyle = "#FFCC80"; ctx.fillRect(-13, -2, 5, 10);
  // phone
  ctx.save(); ctx.translate(9, -2); ctx.rotate(phoneA - 0.3);
  ctx.fillStyle = "#FFCC80"; roundRect(-2, -2, 5, 11, 2); ctx.fill();
  ctx.fillStyle = "#212121"; roundRect(-4, -16, 10, 16, 2.5); ctx.fill();
  ctx.fillStyle = "#81D4FA"; roundRect(-2.5, -14, 7, 11, 1); ctx.fill();
  if (o.phase === "chase" && Math.sin(now() / 90) > 0.4) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(1, -13, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = "#FFCC80"; ctx.beginPath(); ctx.arc(0, -16, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#F8BBD0";
  for (const [cx, cy] of [[-6,-22],[0,-24],[6,-22]]) { ctx.beginPath(); ctx.arc(cx, cy, 3.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#212121";
  ctx.beginPath(); ctx.arc(-3, -15, 1.4, 0, Math.PI * 2); ctx.arc(3, -15, 1.4, 0, Math.PI * 2); ctx.fill();
  if (o.yellT > 0.7) {
    ctx.fillStyle = "rgba(255,255,255,0.92)"; roundRect(-22, -50, 44, 16, 6); ctx.fill();
    ctx.fillStyle = "#AD1457"; ctx.font = "bold 7px system-ui"; ctx.textAlign = "center";
    ctx.fillText(o.yellText || "I'M FILMING!", 0, -39);
  }
  ctx.restore();
}

function drawBox(x, y, s, def) {
  def = def || PKG.standard;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * (def.size || 1), s * (def.size || 1));
  if (def.id === "envelope") {
    softShadow(4, 0.15);
    ctx.fillStyle = def.color;
    roundRect(-10, -6, 20, 12, 2);
    ctx.fill();
    clearShadow();
    ctx.strokeStyle = "#5D4037";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-10, -6);
    ctx.lineTo(0, 2);
    ctx.lineTo(10, -6);
    ctx.stroke();
  } else if (def.id === "weird") {
    softShadow(5, 0.15);
    ctx.fillStyle = "#F48FB1";
    ctx.beginPath();
    ctx.ellipse(0, 2, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    clearShadow();
    ctx.fillStyle = "#EC407A";
    ctx.beginPath();
    ctx.ellipse(8, -6, 5, 4, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#C2185B";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, -6);
    ctx.lineTo(14, -14);
    ctx.stroke();
  } else {
    softShadow(5, 0.18);
    const boxG = ctx.createLinearGradient(-11, -9, 11, 8);
    boxG.addColorStop(0, shade(def.color, 20));
    boxG.addColorStop(1, shade(def.color, -15));
    ctx.fillStyle = boxG;
    roundRect(-11, -9, 22, 17, 3);
    ctx.fill();
    clearShadow();
    ctx.strokeStyle = "#232F3E";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.lineTo(0, 8);
    ctx.moveTo(-11, -1);
    ctx.lineTo(11, -1);
    ctx.stroke();
    // Simple tape label (no brand marks)
    ctx.fillStyle = "rgba(255,255,255,0.22)";
    roundRect(-6, -4, 12, 5, 1);
    ctx.fill();
    if (def.id === "heavy") {
      ctx.fillStyle = "#BF360C";
      ctx.font = "bold 6px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("HEAVY", 0, -3);
    }
  }
  ctx.restore();
}

function drawAim() {
  if (state !== ST.PLAY && state !== ST.PAUSE) return;
  // Quiet ambient: only a soft ring on the recommended pad (no crosshair / guide spam)
  const best = bestStop();
  if (best && !G.aimPreview) {
    const p = best.porch;
    const pulse = 0.5 + Math.sin(now() / 280) * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.2 + pulse * 0.15;
    ctx.strokeStyle = "#4DD0E1";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(p.cx, p.cy + 2, 14 + pulse, 9 + pulse * 0.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (!G.aimPreview) return;
  const { x, y, sx, sy, snap, assisted, arc: prevArc } = G.aimPreview;
  // Soft arc — green locked, cyan assisted, warm free. Arc height matches throw feel.
  const col = snap ? "#81C784" : assisted ? "#4DD0E1" : "#FFCC80";
  const arcH = prevArc != null ? prevArc * 0.85 : 32;
  ctx.save();
  for (let i = 1; i <= 10; i++) {
    const u = i / 11;
    const px = lerp(sx, x, smooth(u));
    // Preview ends on current target pos (tracking follows it in flight)
    const py = lerp(sy, y, smooth(u)) - Math.sin(u * Math.PI) * arcH;
    ctx.globalAlpha = 0.1 + u * 0.4;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(px, py, 2.4 - u * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // Landing ellipse on the intended target / world point
  ctx.globalAlpha = snap ? 0.78 : 0.5;
  ctx.strokeStyle = col;
  ctx.lineWidth = snap ? 2.4 : 1.8;
  ctx.beginPath();
  ctx.ellipse(x, y + 3, 13, 8, 0, 0, Math.PI * 2);
  ctx.stroke();
  if (snap) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(x, y + 3, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPackages() {
  for (const pk of G.packages) {
    const u = clamp(pk.t / pk.dur, 0, 1);
    const arcH = Math.sin(u * Math.PI); // 0 ground → 1 peak → 0
    // Longer, softer trails
    const n = pk.trail.length;
    for (let i = 0; i < n; i++) {
      const t = pk.trail[i];
      const k = i / Math.max(1, n - 1);
      ctx.globalAlpha = t.a * 0.38 * (0.35 + k * 0.65);
      ctx.fillStyle = pk.def?.color || "#FF9900";
      const rr = (1.2 + k * 3.2) * (t.r || 1);
      ctx.beginPath();
      ctx.arc(t.x, t.y, rr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // Ground shadow under flight path — shrinks as package rises
    const groundY = lerp(pk.sy, pk.ty, smooth(u)) + 8;
    const shScale = lerp(1, 0.35, arcH);
    const shA = 0.1 + (1 - arcH) * 0.2;
    ctx.fillStyle = `rgba(0,0,0,${shA})`;
    ctx.beginPath();
    ctx.ellipse(pk.x, groundY, 10 * shScale, 3.8 * shScale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.save();
    ctx.translate(pk.x, pk.y);
    ctx.rotate(pk.rot);
    drawBox(0, 0, 1 + arcH * 0.18, pk.def);
    ctx.restore();
  }
}

function drawWheel(wx, wy, flip, rot = 0) {
  // Premium top-down aero wheel — rot spins spoke marker with speed
  ctx.save();
  ctx.translate(wx, wy);
  if (flip) ctx.scale(-1, 1);
  softShadow(4, 0.2);
  ctx.fillStyle = "#121212";
  roundRect(-4.5, -10.5, 9, 21, 4);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 1;
  roundRect(-4, -9.5, 8, 19, 3.5);
  ctx.stroke();
  const rim = ctx.createLinearGradient(-3, -8, 3, 8);
  rim.addColorStop(0, "#CFD8DC");
  rim.addColorStop(0.5, "#90A4AE");
  rim.addColorStop(1, "#607D8B");
  ctx.fillStyle = rim;
  ctx.beginPath();
  ctx.ellipse(0, 0, 3.2, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Spinning hub detail (read as rotation at speed)
  ctx.save();
  ctx.rotate(rot);
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(0, -5.5);
  ctx.lineTo(0, 5.5);
  ctx.moveTo(-2.2, -3);
  ctx.lineTo(2.2, 3);
  ctx.stroke();
  ctx.restore();
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.ellipse(0, 0, 1.4, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ECEFF1";
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.7, 1.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawCar() {
  const x = G.carX, y = CAR_Y;
  const wr = G.wheelRot || 0;
  const braking = G.braking || G.fsd > 0;
  const turnL = G.carVX < -55;
  const turnR = G.carVX > 55;
  const blink = Math.floor(now() / 320) % 2 === 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(G.carLean || 0);

  // Full Self-Delivering path ghost ahead of car
  if (G.fsd > 0) {
    ctx.save();
    ctx.globalAlpha = 0.22;
    for (let i = 1; i <= 5; i++) {
      const gy = -30 - i * 22;
      const gx = Math.sin(now() / 400 + i * 0.4) * 3;
      ctx.strokeStyle = `rgba(0,229,255,${0.35 - i * 0.05})`;
      ctx.lineWidth = 10 - i;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(gx * 0.3, gy + 14);
      ctx.quadraticCurveTo(gx, gy, gx * 0.5, gy - 10);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Layered soft cyan Full Self-Delivering rings
  if (G.fsd > 0) {
    const pulse = 0.5 + Math.sin(now() / 90) * 0.5;
    for (let i = 4; i >= 1; i--) {
      ctx.strokeStyle = `rgba(0,229,255,${0.05 + pulse * 0.05 * i})`;
      ctx.lineWidth = 2 + i * 1.2;
      ctx.beginPath();
      ctx.ellipse(0, 2, 26 + i * 7 + pulse * 3, 46 + i * 6 + pulse * 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(0,176,255,${0.08 + pulse * 0.07})`;
    ctx.beginPath();
    ctx.ellipse(0, 2, 36, 54, 0, 0, Math.PI * 2);
    ctx.fill();
    // Outer soft bloom
    const bloom = ctx.createRadialGradient(0, 0, 20, 0, 0, 70);
    bloom.addColorStop(0, `rgba(0,229,255,${0.1 + pulse * 0.06})`);
    bloom.addColorStop(1, "rgba(0,229,255,0)");
    ctx.fillStyle = bloom;
    ctx.beginPath();
    ctx.arc(0, 0, 70, 0, Math.PI * 2);
    ctx.fill();
  }

  // Soft ground contact shadow — shifts slightly with lean
  softShadow(14, 0.28);
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath();
  ctx.ellipse((G.carLean || 0) * 18, 44, 24, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();

  const flash = G.invuln > 0 && Math.floor(now() / 70) % 2;

  // Wheels under body — rotate with speed
  drawWheel(-22.5, -20, false, wr);
  drawWheel(22.5, -20, true, wr * 1.02);
  drawWheel(-22.5, 22, false, wr * 0.98);
  drawWheel(22.5, 22, true, wr);

  // Pearl white body — clean modern EV silhouette
  if (flash) {
    ctx.fillStyle = "rgba(255,255,255,0.45)";
  } else {
    const bg = ctx.createLinearGradient(-20, -42, 20, 42);
    bg.addColorStop(0, "#F8F8F8");
    bg.addColorStop(0.25, "#FFFFFF");
    bg.addColorStop(0.6, "#F2F2F2");
    bg.addColorStop(1, "#DCDCDC");
    ctx.fillStyle = bg;
  }
  softShadow(10, 0.15);
  // Main body path with softer nose/tail radius
  roundRect(-20, -42, 40, 84, 14);
  ctx.fill();
  clearShadow();

  // Side sculpt highlight + shade
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  roundRect(4, -36, 10, 64, 6);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  roundRect(-20, -42, 8, 84, 12);
  ctx.fill();

  // Door seams
  ctx.strokeStyle = "rgba(0,0,0,0.07)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-17, -4); ctx.lineTo(17, -4);
  ctx.moveTo(-17, 10); ctx.lineTo(17, 10);
  ctx.stroke();

  // Rocker panel
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  roundRect(-19, 28, 38, 6, 2);
  ctx.fill();

  // Wheel arch indents
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  for (const [ax, ay] of [[-20, -20], [20, -20], [-20, 22], [20, 22]]) {
    ctx.beginPath();
    ctx.ellipse(ax, ay, 3.5, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Glasshouse canopy (continuous glass)
  const glass = ctx.createLinearGradient(-15, -28, 15, 14);
  glass.addColorStop(0, "#0A1628");
  glass.addColorStop(0.35, "#1A2A3A");
  glass.addColorStop(0.7, "#2C4050");
  glass.addColorStop(1, "#3D5568");
  ctx.fillStyle = glass;
  roundRect(-15, -28, 30, 40, 9);
  ctx.fill();
  // Blue sky reflection
  ctx.fillStyle = "rgba(129,212,250,0.32)";
  roundRect(-12, -25, 9, 30, 5);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  roundRect(2, -24, 7, 14, 3);
  ctx.fill();
  // A-pillar edge
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 1;
  roundRect(-15, -28, 30, 40, 9);
  ctx.stroke();

  // Rear trunk deck
  const deck = ctx.createLinearGradient(0, 12, 0, 34);
  deck.addColorStop(0, "#F5F5F5");
  deck.addColorStop(1, "#E0E0E0");
  ctx.fillStyle = deck;
  roundRect(-13, 12, 26, 18, 4);
  ctx.fill();

  // Front continuous light bar
  if (G.fsd > 0) {
    ctx.shadowColor = "#00E5FF";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#00E5FF";
  } else {
    const lg = ctx.createLinearGradient(-15, 0, 15, 0);
    lg.addColorStop(0, "#81D4FA");
    lg.addColorStop(0.35, "#FFFFFF");
    lg.addColorStop(0.65, "#E3F2FD");
    lg.addColorStop(1, "#81D4FA");
    ctx.fillStyle = lg;
  }
  roundRect(-15, -40, 30, 4.5, 2);
  ctx.fill();
  clearShadow();
  if (G.fsd <= 0) {
    ctx.fillStyle = "#FFB74D";
    roundRect(-15, -39.5, 3, 3.5, 1);
    ctx.fill();
    roundRect(12, -39.5, 3, 3.5, 1);
    ctx.fill();
  }

  // Rear light bar — brighter when braking / Full Self-Delivering
  if (braking) {
    ctx.shadowColor = "#FF1744";
    ctx.shadowBlur = 14;
  }
  const rl = ctx.createLinearGradient(-13, 0, 13, 0);
  rl.addColorStop(0, braking ? "#FF5252" : "#B71C1C");
  rl.addColorStop(0.5, braking ? "#FF8A80" : "#FF1744");
  rl.addColorStop(1, braking ? "#FF5252" : "#B71C1C");
  ctx.fillStyle = rl;
  roundRect(-13, 32, 26, braking ? 5 : 4, 2);
  ctx.fill();
  clearShadow();
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.fillRect(-3, 33, 6, 1.5);
  // Outer brake lamp ends
  if (braking) {
    ctx.fillStyle = "rgba(255,82,82,0.85)";
    roundRect(-18, 31, 5, 6, 1.5);
    ctx.fill();
    roundRect(13, 31, 5, 6, 1.5);
    ctx.fill();
  }

  // Turn-signal blink when steering hard
  if (turnL && blink) {
    ctx.fillStyle = "#FFB300";
    ctx.shadowColor = "#FFB300";
    ctx.shadowBlur = 8;
    roundRect(-19, -40, 5, 4, 1);
    ctx.fill();
    clearShadow();
  }
  if (turnR && blink) {
    ctx.fillStyle = "#FFB300";
    ctx.shadowColor = "#FFB300";
    ctx.shadowBlur = 8;
    roundRect(14, -40, 5, 4, 1);
    ctx.fill();
    clearShadow();
  }

  // Side mirrors
  softShadow(3, 0.15);
  ctx.fillStyle = "#FAFAFA";
  roundRect(-28, -9, 8, 5.5, 2);
  ctx.fill();
  roundRect(20, -9, 8, 5.5, 2);
  ctx.fill();
  clearShadow();
  ctx.fillStyle = "#263238";
  roundRect(-26.5, -7.5, 4.5, 2.8, 1);
  ctx.fill();
  roundRect(22, -7.5, 4.5, 2.8, 1);
  ctx.fill();

  // Hood sensor nub (generic modern EV — no brand badge)
  ctx.fillStyle = "#90A4AE";
  ctx.beginPath();
  ctx.arc(0, -37, 1.6, 0, Math.PI * 2);
  ctx.fill();

  // Clean FLEX plate on rear deck
  softShadow(3, 0.12);
  ctx.fillStyle = "#1A1A1A";
  roundRect(-11, 16, 22, 9, 2);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle = "#FF9900";
  ctx.lineWidth = 1.2;
  roundRect(-11, 16, 22, 9, 2);
  ctx.stroke();
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 7px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("FLEX", 0, 22.5);

  // Body outline
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1.2;
  roundRect(-20, -42, 40, 84, 14);
  ctx.stroke();

  ctx.restore();

  if (G.fsd > 0) {
    softShadow(8, 0.15);
    drawPill(G.carX - 48, CAR_Y + 52, 96, 18, "rgba(0,176,255,0.92)", "rgba(255,255,255,0.35)");
    clearShadow();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 10px system-ui";
    ctx.textAlign = "center";
    // Compact label for Full Self-Delivering (FSD)
    ctx.fillText("FSD " + G.fsd.toFixed(1) + "s", G.carX, CAR_Y + 64);
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / (p.max || 1), 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  for (const f of G.floatText) {
    ctx.globalAlpha = clamp(f.life * 1.3, 0, 1);
    const sz = Math.max(f.size || 16, 15);
    ctx.font = `bold ${sz}px system-ui`; ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 3.5;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawWeatherOverlay() {
  const T = tod();
  if (G.weather === "rain") {
    ctx.lineCap = "round";
    for (const r of G.rain) {
      ctx.strokeStyle = `rgba(200,220,235,${0.08 + r.z * 0.08})`;
      ctx.lineWidth = 0.8 + r.z * 0.4;

      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x + 1.2 * r.z, r.y + 7 * r.z);

    ctx.fillStyle = `rgba(255,170,80,${a})`;
    ctx.fillRect(0, 0, W, H);
  }
}

/**
 * Soft low-CPU radio waveform under station chips.
 * Driven by procedural kick/hat pattern of current station (no audio analysis).
 */
function drawRadioWave(cx, y, w, h) {
  const st = RADIO[station];
  if (!st || st.silent) {
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    roundRect(cx - w / 2, y, w, h, h / 2);
    ctx.fill();
    return;
  }
  const bpm = st.bpm || 120;
  const t = now() / 1000;
  const beat = (t * bpm / 60) % 1; // 0..1 within quarter
  const step = Math.floor(t * bpm / 60 * 4) % 16;
  // Kick on 0,4,8,12 (house/techno) or station-ish patterns
  let kick = 0, hat = 0;
  if (station === "house" || station === "techno") {
    kick = (step % 4 === 0) ? 1 - beat : 0.15;
    hat = (step % 2 === 1) ? 0.7 : 0.25;
  } else if (station === "dnb") {
    kick = (step === 0 || step === 10) ? 1 - beat : 0.12;
    hat = (step % 2 === 0) ? 0.65 : 0.2;
  } else if (station === "riddim") {
    kick = step === 0 ? 1 - beat * 0.5 : 0.1;
    hat = (step === 4 || step === 12) ? 0.5 : 0.15;
  }
  const bars = 18;
  const bw = w / bars;
  ctx.save();
  for (let i = 0; i < bars; i++) {
    const mid = Math.abs(i - bars / 2) / (bars / 2);
    const wave = Math.sin(t * 8 + i * 0.7) * 0.25 + 0.5;
    const amp = (kick * (1 - mid * 0.55) + hat * wave * 0.55) * h * 0.85 + h * 0.12;
    const bh = clamp(amp, 2, h);
    const bx = cx - w / 2 + i * bw + 1;
    ctx.globalAlpha = 0.35 + kick * 0.35;
    ctx.fillStyle = st.color;
    roundRect(bx, y + (h - bh) / 2, Math.max(2, bw - 2), bh, 1.5);
    ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ─── HUD / SCREENS ─────────────────────────────────────────
function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(10,22,40,0.9)"; roundRect(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = "rgba(255,153,0,0.4)"; ctx.lineWidth = 2; roundRect(x, y, w, h, 16); ctx.stroke();
}
function drawBtn(b) {
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (b.style === "primary") { g.addColorStop(0, "#FFB74D"); g.addColorStop(1, "#FF9900"); }
  else { g.addColorStop(0, "#455A64"); g.addColorStop(1, "#263238"); }
  ctx.fillStyle = g; roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.fillStyle = b.style === "primary" ? "#1A1A1A" : "#ECEFF1";
  ctx.font = "bold 16px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textBaseline = "alphabetic";
}

/**

 */

      ctx.shadowBlur = 6;
    }
    ctx.fillStyle = on ? "rgba(0,229,255,0.95)" : "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.arc(fsdX + i * 14, row2 + 8, 4.5, 0, Math.PI * 2);
    ctx.fill();
    clearShadow();
  }
  // Tiny FSD label when active
  if (G.fsd > 0) {
    ctx.fillStyle = "rgba(0,229,255,0.9)";
    ctx.font = "bold 7px system-ui";
    ctx.textAlign = "left";
    ctx.fillText(G.fsd.toFixed(0) + "s", fsdX + 42, row2 + 11);
  }

  // Radio chip (subtle)
  const rcol = RADIO[station]?.color || "#90A4AE";
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  roundRect(hx + hw - 52, row2 - 2, 42, 18, 8);
  ctx.fill();
  ctx.fillStyle = rcol;
  ctx.font = "bold 8px system-ui";
  ctx.textAlign = "center";
  const rName = RADIO[station]?.silent ? "OFF" : (RADIO[station]?.name || "").slice(0, 4);
  ctx.fillText((RADIO[station]?.silent ? "🔇" : "♪") + rName, hx + hw - 31, row2 + 11);

  // Easy / weather micro-chips under HUD
  let chipY = hy + hh + 6;
  if (elapsed() < EASY_SECS) {
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = "rgba(102,187,106,0.55)";
    roundRect(W / 2 - 22, chipY, 44, 12, 6);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("EASY", W / 2, chipY + 9);
    ctx.globalAlpha = 1;
    chipY += 14;
  }
  if (G.weather !== "sunny") {
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.font = "8px system-ui";
    ctx.textAlign = "right";
    ctx.fillText(weatherInfo(G.weather).name, W - 16, hy + hh + 12);
  }

  drawEventBanner();
  drawToasts(G.eventBanner ? hy + hh + 36 : hy + hh + 14);
  drawCoach();

  // First-seconds coach for returning players
  if (!G.coachInteractive && G.time > ROUTE_TIME - 3.5) {
    const sb = getSteerButtons();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = "#FFCC80";
    roundRect(sb.left.x, sb.left.y, sb.left.w, sb.left.h, 18);
    ctx.fill();
    roundRect(sb.right.x, sb.right.y, sb.right.w, sb.right.h, 18);
    ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("hold arrows to steer · drag anywhere to throw", W / 2, H - 118);
    ctx.globalAlpha = 1;
  }
}

/** Soft semi-transparent L/R steer arrows on the lower road */
function drawSteerControls() {
  const b = getSteerButtons();
  const dir = touchSteerDir();

  drawSteerArrow(b.right, "R", dir > 0 || keys.ArrowRight || keys.KeyD);

function drawSteerArrow(r, side, held) {
  ctx.save();
  // Soft glass pad
  softShadow(held ? 12 : 8, held ? 0.22 : 0.14);
  ctx.globalAlpha = held ? 0.72 : 0.42;
  const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
  g.addColorStop(0, held ? "rgba(255,255,255,0.28)" : "rgba(255,255,255,0.16)");
  g.addColorStop(1, held ? "rgba(20,40,60,0.45)" : "rgba(10,22,40,0.38)");
  ctx.fillStyle = g;
  roundRect(r.x, r.y, r.w, r.h, 20);
  ctx.fill();
  clearShadow();
  ctx.globalAlpha = held ? 0.9 : 0.55;
  ctx.strokeStyle = held ? "rgba(0,229,255,0.55)" : "rgba(255,255,255,0.22)";
  ctx.lineWidth = held ? 2 : 1.4;
  roundRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2, 18);
  ctx.stroke();

  // Chevron
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  ctx.globalAlpha = held ? 0.95 : 0.7;
  ctx.fillStyle = held ? "#E0F7FA" : "#fff";
  ctx.beginPath();
  if (side === "L") {
    ctx.moveTo(cx + 10, cy - 16);
    ctx.lineTo(cx - 14, cy);
    ctx.lineTo(cx + 10, cy + 16);
    ctx.lineTo(cx + 4, cy + 16);
    ctx.lineTo(cx - 14, cy);
    ctx.lineTo(cx + 4, cy - 16);
  } else {
    ctx.moveTo(cx - 10, cy - 16);
    ctx.lineTo(cx + 14, cy);
    ctx.lineTo(cx - 10, cy + 16);
    ctx.lineTo(cx - 4, cy + 16);
    ctx.lineTo(cx + 14, cy);
    ctx.lineTo(cx - 4, cy - 16);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawToasts(startY) {

function drawFlowBar(x, y, w, h) {
  const flow = clamp(G.flexFlow || 0, 0, 100);
  const col = RADIO[station]?.color || "#FF9900";
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  roundRect(x, y, w, h, h / 2);
  ctx.fill();
  if (flow <= 0.5) {
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.font = "bold 7px system-ui";
    ctx.textAlign = "left";
    ctx.fillText("FLOW", x + 6, y + h - 2);
    return;
  }
  const fw = Math.max(h, (w - 2) * (flow / 100));
  const pulse = 0.75 + Math.sin(now() / 180) * 0.25;
  if (flow >= 88) {
    ctx.shadowColor = "rgba(0,229,255,0.55)";
    ctx.shadowBlur = 8 * pulse;
  } else {
    ctx.shadowColor = col;
    ctx.shadowBlur = 3 + pulse * 2;
  }
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, shade(col, 25));
  g.addColorStop(1, col);
  ctx.fillStyle = g;
  roundRect(x + 1, y + 1, fw - 2, h - 2, (h - 2) / 2);
  ctx.fill();
  clearShadow();
  if (flow >= 90) {
    ctx.fillStyle = "rgba(0,229,255,0.95)";
    ctx.font = "bold 7px system-ui";
    ctx.textAlign = "right";
    ctx.fillText("FLOW", x + w - 4, y - 1);
  }
}

function drawCoach() {
  if (!G.coachInteractive || G.coachStep < 1 || G.coachStep > 3) return;
  const pulse = 0.5 + Math.sin(now() / 280) * 0.5;
  ctx.save();
  if (G.coachStep === 1) {
    // Highlight steer arrows
    const sb = getSteerButtons();
    ctx.globalAlpha = 0.15 + pulse * 0.1;
    ctx.fillStyle = "#FFCC80";
    roundRect(sb.left.x - 4, sb.left.y - 4, sb.left.w + 8, sb.left.h + 8, 22);
    ctx.fill();
    roundRect(sb.right.x - 4, sb.right.y - 4, sb.right.w + 8, sb.right.h + 8, 22);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = "rgba(16,28,46,0.82)";
    roundRect(W / 2 - 100, H - 144, 200, 34, 14);
    ctx.fill();
    ctx.fillStyle = "#FFCC80";
    ctx.font = "bold 15px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Hold arrows to steer", W / 2, H - 121);

    ctx.fillStyle = `rgba(129,212,250,${0.07 + pulse * 0.05})`;
    ctx.fillRect(0, HUD_H, W, H - HUD_H - 110);
    ctx.fillStyle = "rgba(16,28,46,0.82)";
    roundRect(W / 2 - 120, H * 0.28, 240, 34, 14);
    ctx.fill();
    ctx.fillStyle = "#81D4FA";
    ctx.font = "bold 15px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Drag anywhere to throw", W / 2, H * 0.28 + 22);
  } else if (G.coachStep === 3) {
    const best = bestStop();
    if (best) {
      const p = best.porch;
      ctx.globalAlpha = 0.25 + pulse * 0.2;
      ctx.strokeStyle = "#4DD0E1";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.ellipse(p.cx, p.cy, 18 + pulse * 4, 12 + pulse * 2, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = "rgba(16,28,46,0.82)";
    roundRect(W / 2 - 110, HUD_H + 40, 220, 34, 14);
    ctx.fill();
    ctx.fillStyle = "#4DD0E1";
    ctx.font = "bold 15px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("Aim for the glowing pad", W / 2, HUD_H + 62);
  }
  ctx.restore();
}

function wrap(text, x, y, maxW, lh) {
  const words = text.split(" "); let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, y); line = w; y += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

    ctx.arc(W / 2, 90, 120, 0, Math.PI * 2);
    ctx.fill();
  } else {
    ctx.fillStyle = G.wrecked ? "#FF8A80" : "#FFB74D";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(G.wrecked ? "ROUTE ENDED" : "ROUTE COMPLETE", W / 2, 66);
  }

  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px system-ui";
  let headline;
  if (G.newHigh) headline = "Peak delivery!";
  else if (G.wrecked && G.score >= 700) headline = "Still a strong Flex";
  else if (G.wrecked) headline = "Needs a tow";
  else headline = "Shift complete!";
  ctx.fillText(headline, W / 2, 98);

  // Score hero
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  roundRect(48, 114, W - 96, 56, 16);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.font = "bold 10px system-ui";
  ctx.fillText("SCORE", W / 2, 134);
  ctx.fillStyle = G.newHigh ? "#FFD54F" : "#fff";
  ctx.font = "bold 28px system-ui";
  ctx.fillText(String(G.score), W / 2, 160);

  // Stats grid
  const rows = [
    ["Deliveries", G.deliveries], ["Best streak", G.bestStreak],
    ["Perfects", G.perfects], ["Threat beans", G.threatBeans],
    ["Peak Flow", Math.round(G.peakFlow || G.flexFlow || 0)],
    ["Hearts left", Math.max(0, G.hearts)],
    ["Difficulty", isHard() ? "Hard" : "Easy"],
    ["Weather", weatherInfo(G.weather).name],
  ];
  let y = 188;
  for (let i = 0; i < rows.length; i++) {
    const [k, v] = rows[i];
    if (i % 2 === 0) {
      ctx.fillStyle = "rgba(255,255,255,0.03)";
      ctx.fillRect(40, y - 14, W - 80, 28);
    }
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.5)";
    ctx.font = "13px system-ui";
    ctx.fillText(k, 52, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px system-ui";
    ctx.fillText(String(v), W - 52, y);
    y += 28;
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#69F0AE";
  ctx.font = "bold 16px system-ui";
  ctx.fillText("Flex Rating: " + grade(), W / 2, y + 8);

  UI.buttons = [];
  btn("again", W / 2 - 110, H - 178, 220, 44, "Another Route", "primary");
  btn("share_card", W / 2 - 110, H - 126, 220, 42, "Share Card", "primary");
  btn("share", W / 2 - 110, H - 78, 220, 32, "Share Text", "secondary");
  btn("menu", W / 2 - 110, H - 42, 220, 28, "Title", "secondary");
  for (const b of UI.buttons) drawBtn(b);
  drawToasts(H - 220);
}

function grade() {
  if (G.wrecked) return "DNF";
  if (G.score >= 2200) return "SSS Peak route";
  if (G.score >= 1600) return "S Peak delivery";
  if (G.score >= 1100) return "A Solid block";
  if (G.score >= 700) return "B Almost on time";
  if (G.score >= 350) return "C Metrics review";
  return "D Support will call";
}

// ═══════════════════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════════════════
// Title ambience seed
G.weather = "sunny";
for (let i = 0; i < 7; i++) G.clouds.push({ x: rand(-40, W + 40), y: rand(18, 100), w: rand(50, 100), s: rand(6, 14), layer: Math.random() });
for (let i = 0; i < 3; i++) G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(20, 36), flap: rand(0, 8) });
for (let i = 0; i < 5; i++) spawnHouse(i * 140 - 30);

function frame(t) {
  let dt = clamp((t - lastT) / 1000, 0, 0.05);
  lastT = t;
  // achievement toast timer
  if (G.unlockQueue.length && state === ST.PLAY) {
    // decay via messages already; shift after 3s using score time hack
  }
  if (G.unlockQueue.length) {
    G._achT = (G._achT || 2.5) - dt;
    if (G._achT <= 0) { G.unlockQueue.shift(); G._achT = 2.5; }
  }
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("gesturestart", e => e.preventDefault());
document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
})();
</script>
