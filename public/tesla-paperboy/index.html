<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Tesla Paperboy – Amazon Flex Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1628;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #0a1628 0%, #132a4a 100%);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    background: #87CEEB;
    box-shadow: 0 0 40px rgba(0,0,0,0.45);
  }
  @media (max-width: 520px) {
    canvas { width: 100%; height: 100%; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";

// ─── Canvas / DPR ───────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = 390, H = 700;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 100));
resize();

// ─── Utils ──────────────────────────────────────────────────
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const smoothstep = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const now = () => performance.now();

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ─── Constants ──────────────────────────────────────────────
const ROUTE_TIME = 90;
const EASY_SECS = 25;          // gentle ramp window
const ROAD_L = 78, ROAD_R = 312;
const ROAD_CX = (ROAD_L + ROAD_R) / 2;
const ROAD_W = ROAD_R - ROAD_L;
const CAR_Y = 560;
const MAX_DAMAGE = 100;
const FSD_DELIVERIES = 5;
const FSD_DURATION = 8;

// ─── Difficulty curve ───────────────────────────────────────
// elapsed: seconds into route (0 → ROUTE_TIME)
function elapsed() { return ROUTE_TIME - G.time; }

/** 0 = brand new, 1 = full difficulty (after easy window + ramp) */
function difficulty() {
  const e = elapsed();
  if (e <= EASY_SECS) return e / EASY_SECS * 0.28; // max 0.28 in first 25s
  // ramp from 0.28 → 1.0 over next ~40s
  return clamp(0.28 + (e - EASY_SECS) / 40 * 0.72, 0, 1);
}

function aimAssistStrength() {
  // Strong early, soft later
  return lerp(0.72, 0.28, difficulty());
}

function porchPad() {
  // Extra hitbox padding early (pixels)
  return lerp(22, 8, difficulty());
}

// ─── Game State ─────────────────────────────────────────────
const STATE = { TITLE: 0, HOWTO: 1, PLAY: 2, GATE: 3, END: 4 };
let state = STATE.TITLE;

const G = {
  score: 0, time: ROUTE_TIME, damage: 0, deliveries: 0, fails: 0,
  snacks: 0, pirateBonus: 0, scroll: 0, speed: 110, baseSpeed: 110,
  fsd: 0, fsdReady: 0, carX: ROAD_CX, carVX: 0, steerTarget: null,
  throwCD: 0, packages: [], obstacles: [], houses: [], props: [],
  particles: [], floatText: [], messages: [], clouds: [], birds: [],
  roadLines: 0, spawnT: 0, houseSide: 0, nextHouseDist: 80,
  nextGateIn: 45, gateActive: false, gateOptions: [], gateCorrect: 0,
  gateTimer: 0, invuln: 0, shake: 0, combo: 0, bestCombo: 0,
  aimPreview: null, // {x,y,assisted} while finger in throw zone
  coachPhase: 0, wrecked: false,
};

const keys = {};
let pointers = new Map();
let touchSteerId = null;
let throwAimId = null;

// ─── Init ───────────────────────────────────────────────────
function resetGame() {
  Object.assign(G, {
    score: 0, time: ROUTE_TIME, damage: 0, deliveries: 0, fails: 0,
    snacks: 0, pirateBonus: 0, scroll: 0, speed: 105, baseSpeed: 105,
    fsd: 0, fsdReady: 0, carX: ROAD_CX, carVX: 0, steerTarget: null,
    throwCD: 0, packages: [], obstacles: [], houses: [], props: [],
    particles: [], floatText: [], messages: [], roadLines: 0,
    spawnT: 3.5, // grace period before first obstacle
    houseSide: 0, nextHouseDist: 30, nextGateIn: rand(42, 55),
    gateActive: false, gateOptions: [], gateCorrect: 0, gateTimer: 0,
    invuln: 0, shake: 0, combo: 0, bestCombo: 0, aimPreview: null,
    coachPhase: 0, wrecked: false, birds: [],
  });
  G.clouds = [];
  for (let i = 0; i < 7; i++) {
    G.clouds.push({
      x: rand(-40, W + 40), y: rand(18, 110),
      w: rand(55, 100), s: rand(6, 14), layer: Math.random(),
    });
  }
  for (let i = 0; i < 3; i++) {
    G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(20, 40), flap: rand(0, 10) });
  }
  // Seed calm houses (easy flags set inside spawn for early route)
  for (let i = 0; i < 5; i++) spawnHouse(-i * 175 - 80);
  spawnMessage("Easy stretch — hit the glowing porches!", 2.8);
  setTimeoutCoach();
}

function setTimeoutCoach() {
  // phased tips via coachPhase checked in update
}

function spawnMessage(text, life = 2) {
  G.messages.push({ text, life, max: life });
}

function floatTxt(x, y, text, color = "#fff", size = 16) {
  G.floatText.push({ x, y, text, color, size, life: 1.25, vy: -38 });
}

function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(35, 130);
    G.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.35, 0.85), max: 0.85, r: rand(2, 5), color,
    });
  }
}

// ─── World spawn ────────────────────────────────────────────
const HOUSE_COLORS = [
  "#F5D0C5", "#C5E1A5", "#B3E5FC", "#FFF59D", "#E1BEE7",
  "#FFE0B2", "#B2DFDB", "#F8BBD0", "#D7CCC8", "#DCEDC8",
];

function spawnHouse(y) {
  const side = G.houseSide++ % 2;
  const color = pick(HOUSE_COLORS);
  const diff = state === STATE.PLAY ? difficulty() : 0.15;
  const early = state === STATE.PLAY && elapsed() < EASY_SECS;

  // Early route: calm yards, bigger clearer targets
  const hasPool = !early && Math.random() < 0.12 + diff * 0.25;
  const hasRing = Math.random() < (early ? 0.15 : 0.35 + diff * 0.2);
  const hasSnack = Math.random() < 0.1 + (early ? 0.08 : 0);
  const hasPirate = !early && Math.random() < 0.08 + diff * 0.18;
  const hasDog = !early && Math.random() < 0.1 + diff * 0.15;
  const hasMailbox = Math.random() < 0.85;
  const hasDriveway = Math.random() < 0.7;
  const hasBush = Math.random() < 0.75;

  const porchW = early ? 46 : lerp(44, 34, diff);
  const porchH = early ? 36 : lerp(34, 28, diff);
  const porchX = side === 0 ? ROAD_L - 8 - porchW : ROAD_R + 8;

  const house = {
    y, side, color,
    porchX, porchW, porchH,
    roof: pick(["#6D4C41", "#455A64", "#5D4037", "#37474F", "#795548", "#8D6E63"]),
    trim: pick(["#FFFFFF", "#FAFAFA", "#FFF8E1", "#EFEBE9"]),
    delivered: false, glow: 1,
    hasPool, hasRing, hasSnack, hasPirate, hasDog, hasMailbox, hasDriveway, hasBush,
    poolX: side === 0 ? ROAD_L - 100 : ROAD_R + 100,
    ringHit: false, snackTaken: false, pirateHit: false,
    number: 100 + ((G.houses.length + 1) * 2 + side),
    windowLit: Math.random() < 0.35,
    garage: Math.random() < 0.4,
  };
  G.houses.push(house);

  G.props.push({
    type: "palm",
    x: side === 0 ? rand(14, 42) : rand(W - 42, W - 14),
    y: y - 18,
    scale: rand(0.85, 1.15),
  });
  if (hasBush) {
    G.props.push({
      type: "bush",
      x: side === 0 ? rand(20, 55) : rand(W - 55, W - 20),
      y: y + 28,
    });
  }
  if (hasPool) {
    G.props.push({ type: "pool", x: house.poolX, y: y + 8, house });
  }
  if (Math.random() < 0.3) {
    G.props.push({
      type: "sign",
      x: side === 0 ? ROAD_L - 22 : ROAD_R + 22,
      y: y - 40,
      label: pick(["SLOW", "KIDS", "HOA", "FLEX"]),
    });
  }
}

function spawnObstacle() {
  const diff = difficulty();
  if (G.fsd > 0 && Math.random() < 0.6) return;
  // Early: only gentle cones, rarely a scooter
  let type;
  if (diff < 0.25) {
    type = Math.random() < 0.75 ? "cone" : "scooter";
  } else if (diff < 0.5) {
    type = pick(["cone", "cone", "scooter", "ped"]);
  } else if (diff < 0.75) {
    type = pick(["cone", "scooter", "ped", "dog", "car"]);
  } else {
    type = pick(["cone", "scooter", "car", "ped", "dog", "car"]);
  }

  let x = rand(ROAD_L + 30, ROAD_R - 30);
  // Early: keep obstacles more to the sides so center is safer
  if (diff < 0.35) {
    x = Math.random() < 0.5
      ? rand(ROAD_L + 28, ROAD_L + 70)
      : rand(ROAD_R - 70, ROAD_R - 28);
  } else if (Math.abs(x - G.carX) < 36 && Math.random() < 0.55) {
    x = G.carX < ROAD_CX ? rand(ROAD_CX + 10, ROAD_R - 30) : rand(ROAD_L + 30, ROAD_CX - 10);
  }

  const o = { type, x, y: -60, w: 28, h: 28, vx: 0, dead: false, hit: false };
  if (type === "cone") { o.w = 18; o.h = 22; }
  if (type === "scooter") { o.w = 16; o.h = 36; o.vx = pick([-18, 18]) * (0.6 + diff); }
  if (type === "car") {
    o.w = 44; o.h = 72;
    o.x = clamp(o.x, ROAD_L + 32, ROAD_R - 32);
    o.color = pick(["#E53935", "#1E88E5", "#43A047", "#FB8C00", "#5E35B1", "#37474F", "#ECEFF1"]);
    o.vy = rand(25, 55 + diff * 40);
  }
  if (type === "ped") { o.w = 18; o.h = 30; o.vx = pick([-22, 22]) * (0.7 + diff * 0.5); }
  if (type === "dog") { o.w = 26; o.h = 16; o.vx = pick([-35, 35]) * (0.7 + diff * 0.4); }
  G.obstacles.push(o);
}

// ─── Aim assist ─────────────────────────────────────────────
function getPorchRect(h) {
  const pad = state === STATE.PLAY ? porchPad() : 8;
  return {
    x: h.porchX - pad * 0.25,
    y: h.y + 6 - pad * 0.2,
    w: h.porchW + pad * 0.5,
    h: h.porchH + pad * 0.4,
    cx: h.porchX + h.porchW / 2,
    cy: h.y + 6 + h.porchH / 2,
  };
}

function findAssistTarget(aimX, aimY) {
  const strength = aimAssistStrength();
  const radius = lerp(110, 55, difficulty()); // generous early magnet radius
  let best = null, bestD = radius;
  for (const h of G.houses) {
    if (h.delivered) continue;
    const p = getPorchRect(h);
    // only assist toward porches in throw zone ahead of car
    if (p.cy > CAR_Y - 20 || p.cy < 40) continue;
    const d = dist(aimX, aimY, p.cx, p.cy);
    if (d < bestD) {
      bestD = d;
      best = p;
    }
  }
  if (!best) return { x: aimX, y: aimY, assisted: false, porch: null };
  // Pull aim toward porch center (stronger when closer & early)
  const pull = strength * (1 - bestD / radius);
  return {
    x: lerp(aimX, best.cx, pull),
    y: lerp(aimY, best.cy, pull * 0.95),
    assisted: pull > 0.12,
    porch: best,
    pull,
  };
}

function clampAim(startX, startY, aimX, aimY) {
  // Shorter max range early so players don't overthrow past porches
  const maxDist = lerp(210, 300, difficulty());
  // Prefer landing in porch band (y ~ 120–420)
  aimY = clamp(aimY, 70, CAR_Y - 50);
  const d = dist(startX, startY, aimX, aimY);
  if (d > maxDist) {
    const k = maxDist / d;
    aimX = startX + (aimX - startX) * k;
    aimY = startY + (aimY - startY) * k;
  }
  // Soft vertical bias: slightly pull long throws closer
  if (startY - aimY > 200) {
    aimY = lerp(aimY, startY - 175, lerp(0.35, 0.1, difficulty()));
  }
  return { x: aimX, y: aimY };
}

// ─── Input ──────────────────────────────────────────────────
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width, scaleY = H / r.height;
  const clientX = e.clientX ?? (e.touches && e.touches[0] && e.touches[0].clientX);
  const clientY = e.clientY ?? (e.touches && e.touches[0] && e.touches[0].clientY);
  return { x: (clientX - r.left) * scaleX, y: (clientY - r.top) * scaleY };
}

function updateAimPreview(px, py) {
  if (state !== STATE.PLAY || py >= H * 0.5) {
    G.aimPreview = null;
    return;
  }
  const startX = G.carX, startY = CAR_Y - 18;
  let { x, y } = clampAim(startX, startY, px, py);
  const assist = findAssistTarget(x, y);
  G.aimPreview = { x: assist.x, y: assist.y, assisted: assist.assisted, sx: startX, sy: startY };
}

function onPointerDown(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = canvasPos(e);
  pointers.set(id, p);

  if (state === STATE.TITLE || state === STATE.HOWTO || state === STATE.END) {
    handleUIClick(p.x, p.y);
    return;
  }
  if (state === STATE.GATE) {
    handleGateClick(p.x, p.y);
    return;
  }
  if (state === STATE.PLAY) {
    if (p.y >= H * 0.5) {
      touchSteerId = id;
      G.steerTarget = p.x;
      G.aimPreview = null;
    } else {
      throwAimId = id;
      updateAimPreview(p.x, p.y);
    }
  }
}

function onPointerMove(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = canvasPos(e);
  pointers.set(id, p);
  if (state === STATE.PLAY && id === touchSteerId) {
    G.steerTarget = p.x;
  }
  if (state === STATE.PLAY && id === throwAimId) {
    updateAimPreview(p.x, p.y);
  }
  // Hover aim on desktop when mouse in throw zone without button
  if (state === STATE.PLAY && e.pointerType === "mouse" && throwAimId == null && touchSteerId == null) {
    if (p.y < H * 0.5) updateAimPreview(p.x, p.y);
    else G.aimPreview = null;
  }
}

function onPointerUp(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = pointers.get(id) || canvasPos(e);
  if (state === STATE.PLAY && id === throwAimId) {
    updateAimPreview(p.x, p.y);
    if (G.aimPreview) throwPackage(G.aimPreview.x, G.aimPreview.y, true);
    else throwPackage(p.x, p.y, false);
    throwAimId = null;
    G.aimPreview = null;
  }
  pointers.delete(id);
  if (id === touchSteerId) {
    touchSteerId = null;
    G.steerTarget = null;
  }
}

canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
canvas.addEventListener("pointermove", onPointerMove, { passive: false });
canvas.addEventListener("pointerup", onPointerUp, { passive: false });
canvas.addEventListener("pointercancel", onPointerUp, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (state === STATE.TITLE && (e.code === "Enter" || e.code === "Space")) {
    state = STATE.PLAY; resetGame();
  }
  if (state === STATE.HOWTO && (e.code === "Enter" || e.code === "Space" || e.code === "Escape")) {
    state = STATE.TITLE;
  }
  if (state === STATE.END && (e.code === "Enter" || e.code === "Space")) {
    state = STATE.TITLE;
  }
  if (state === STATE.PLAY && e.code === "Space") {
    // Smart keyboard throw: nearest undelivered porch in range, else forward
    const target = nearestPorchTarget();
    if (target) throwPackage(target.cx, target.cy, true);
    else throwPackage(G.carX + rand(-15, 15), CAR_Y - 160, false);
  }
  if (state === STATE.GATE && (e.code === "Digit1" || e.code === "Numpad1")) pickGate(0);
  if (state === STATE.GATE && (e.code === "Digit2" || e.code === "Numpad2")) pickGate(1);
  if (state === STATE.GATE && (e.code === "Digit3" || e.code === "Numpad3")) pickGate(2);
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

function nearestPorchTarget() {
  let best = null, bestScore = 1e9;
  for (const h of G.houses) {
    if (h.delivered) continue;
    const p = getPorchRect(h);
    if (p.cy > CAR_Y - 40 || p.cy < 80) continue;
    // Prefer porches near car X and mid-screen
    const score = Math.abs(p.cx - G.carX) * 0.55 + Math.abs(p.cy - (CAR_Y - 180)) * 0.45;
    if (score < bestScore) { bestScore = score; best = p; }
  }
  return best;
}

// ─── UI ─────────────────────────────────────────────────────
const UI = { buttons: [] };
function btn(id, x, y, w, h, label, style = "primary") {
  UI.buttons.push({ id, x, y, w, h, label, style });
}
function handleUIClick(x, y) {
  for (const b of UI.buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      onButton(b.id);
      return;
    }
  }
}
function onButton(id) {
  if (id === "play") { state = STATE.PLAY; resetGame(); }
  if (id === "howto") { state = STATE.HOWTO; }
  if (id === "back") { state = STATE.TITLE; }
  if (id === "again") { state = STATE.PLAY; resetGame(); }
  if (id === "menu") { state = STATE.TITLE; }
}
function handleGateClick(x, y) {
  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) {
      pickGate(i);
      return;
    }
    by += 68;
  }
}
function pickGate(i) {
  if (state !== STATE.GATE) return;
  if (i === G.gateCorrect) {
    G.score += 50;
    floatTxt(W / 2, 280, "GATE OPEN +50", "#4CAF50", 20);
    burst(W / 2, 320, "#4CAF50", 16);
    spawnMessage("Gate code accepted. Welcome, Flexer.", 2);
  } else {
    G.damage = clamp(G.damage + 14, 0, MAX_DAMAGE);
    G.time = Math.max(0, G.time - 2.5);
    G.shake = 10;
    floatTxt(W / 2, 280, "WRONG CODE!", "#FF5252", 18);
    spawnMessage("Wrong code… HOA delay + damage.", 2.4);
  }
  state = STATE.PLAY;
  G.gateActive = false;
  G.nextGateIn = rand(30, 45);
}

// ─── Throw ──────────────────────────────────────────────────
function throwPackage(tx, ty, alreadyAssisted) {
  if (G.throwCD > 0 || state !== STATE.PLAY) return;
  G.throwCD = lerp(0.28, 0.2, difficulty());
  const startX = G.carX;
  const startY = CAR_Y - 18;
  let aimX = tx, aimY = ty;
  if (!alreadyAssisted) {
    const c = clampAim(startX, startY, aimX, aimY);
    const a = findAssistTarget(c.x, c.y);
    aimX = a.x; aimY = a.y;
  } else {
    const c = clampAim(startX, startY, aimX, aimY);
    aimX = c.x; aimY = c.y;
  }
  const d = dist(startX, startY, aimX, aimY);
  // Slightly slower, more readable arcs early
  const flight = clamp(d / lerp(300, 400, difficulty()), 0.42, 0.95);
  G.packages.push({
    x: startX, y: startY,
    sx: startX, sy: startY,
    tx: aimX, ty: aimY,
    t: 0, dur: flight,
    arc: lerp(48, 62, Math.min(d / 250, 1)),
    rot: rand(0, Math.PI),
    vr: rand(-6, 6),
    done: false,
  });
}

function startGate() {
  state = STATE.GATE;
  G.gateActive = true;
  const correct = String(randi(1000, 9999));
  const opts = new Set([correct]);
  while (opts.size < 3) {
    let c;
    if (Math.random() < 0.65) {
      const digits = correct.split("");
      digits[randi(0, 3)] = String(randi(0, 9));
      c = digits.join("");
    } else c = String(randi(1000, 9999));
    opts.add(c);
  }
  G.gateOptions = [...opts].sort(() => Math.random() - 0.5);
  G.gateCorrect = G.gateOptions.indexOf(correct);
  G.gateTimer = 10;
  spawnMessage("GATED COMMUNITY — pick the code!", 2);
}

function tryFSD() {
  G.fsdReady++;
  if (G.fsdReady >= FSD_DELIVERIES) {
    G.fsdReady = 0;
    G.fsd = FSD_DURATION;
    spawnMessage("⚡ FSD ENGAGED — focus on throws!", 2.8);
    burst(G.carX, CAR_Y, "#00B0FF", 22);
  }
}

function carHitbox() {
  return { x: G.carX - 22, y: CAR_Y - 48, w: 44, h: 78 };
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function damagePlayer(amt, reason) {
  if (G.invuln > 0 || G.fsd > 0) return false;
  // Early route: softer damage
  const scaled = amt * lerp(0.55, 1, difficulty());
  G.damage = clamp(G.damage + scaled, 0, MAX_DAMAGE);
  G.invuln = lerp(1.4, 1.0, difficulty());
  G.shake = 8;
  G.combo = 0;
  if (reason) spawnMessage(reason, 2);
  if (G.damage >= MAX_DAMAGE) endRoute(true);
  return true;
}
function endRoute(wrecked) {
  state = STATE.END;
  G.wrecked = wrecked;
}

// ─── Update ─────────────────────────────────────────────────
let lastT = now();

function update(dt) {
  for (const c of G.clouds) {
    c.x += c.s * dt * (0.12 + c.layer * 0.1);
    if (c.x > W + 90) c.x = -90;
  }
  for (const b of G.birds) {
    b.x += b.s * dt;
    b.flap += dt * 8;
    if (b.x > W + 30) { b.x = -30; b.y = rand(40, 110); }
  }

  if (state === STATE.TITLE || state === STATE.HOWTO || state === STATE.END) {
    G.scroll += 28 * dt;
    return;
  }

  if (state === STATE.GATE) {
    G.gateTimer -= dt;
    if (G.gateTimer <= 0) {
      G.damage = clamp(G.damage + 12, 0, MAX_DAMAGE);
      G.shake = 8;
      spawnMessage("Gate timeout! Security noted your plate.", 2.2);
      state = STATE.PLAY;
      G.gateActive = false;
      G.nextGateIn = rand(32, 48);
    }
    updateFX(dt);
    return;
  }

  // PLAY
  G.time -= dt;
  if (G.time <= 0) { G.time = 0; endRoute(false); return; }

  if (G.invuln > 0) G.invuln -= dt;
  if (G.throwCD > 0) G.throwCD -= dt;
  if (G.shake > 0) G.shake -= dt * 18;

  // Coaching phases
  const e = elapsed();
  if (G.coachPhase === 0 && e > 0.8) {
    G.coachPhase = 1;
    spawnMessage("Drag bottom to steer · Tap/hold top to aim & throw", 3.2);
  } else if (G.coachPhase === 1 && e > 6 && G.deliveries === 0) {
    G.coachPhase = 2;
    spawnMessage("Orange glow = porch target. Aim a little short!", 3);
  } else if (G.coachPhase === 2 && e > EASY_SECS) {
    G.coachPhase = 3;
    spawnMessage("Traffic picking up — stay sharp!", 2.4);
  }

  if (G.fsd > 0) {
    G.fsd -= dt;
    if (G.fsd <= 0) {
      G.fsd = 0;
      spawnMessage("Autopilot off — you're driving again.", 2);
    }
  }

  // Speed: slow start → moderate mid → spicy late
  const diff = difficulty();
  G.baseSpeed = lerp(100, 195, easeOut(diff));
  G.speed = G.baseSpeed * (G.fsd > 0 ? 1.08 : 1);

  const scrollAmt = G.speed * dt;
  G.scroll += scrollAmt;
  G.roadLines += scrollAmt;

  // Steering
  let inputX = 0;
  if (keys["ArrowLeft"] || keys["KeyA"]) inputX -= 1;
  if (keys["ArrowRight"] || keys["KeyD"]) inputX += 1;

  if (G.fsd > 0) {
    let avoid = 0, best = 1e9;
    for (const o of G.obstacles) {
      if (o.dead || o.y < CAR_Y - 220 || o.y > CAR_Y + 40) continue;
      const dx = o.x - G.carX;
      const dy = Math.abs(o.y - CAR_Y);
      const threat = Math.abs(dx) + dy * 0.35;
      if (threat < best && Math.abs(dx) < 70) {
        best = threat;
        avoid = dx > 0 ? -1 : 1;
      }
    }
    const centerPull = (ROAD_CX - G.carX) * 0.01;
    G.carVX = lerp(G.carVX, avoid * 200 + centerPull * 50, 1 - Math.pow(0.001, dt));
  } else if (G.steerTarget != null) {
    const dx = G.steerTarget - G.carX;
    G.carVX = lerp(G.carVX, clamp(dx * 5.5, -240, 240), 1 - Math.pow(0.0006, dt));
  } else {
    G.carVX = lerp(G.carVX, inputX * 230, 1 - Math.pow(0.001, dt));
    if (inputX === 0) G.carVX *= Math.pow(0.1, dt);
  }
  G.carX = clamp(G.carX + G.carVX * dt, ROAD_L + 26, ROAD_R - 26);

  // Scroll entities
  for (const h of G.houses) h.y += scrollAmt;
  for (const p of G.props) p.y += scrollAmt;
  for (const o of G.obstacles) {
    o.y += scrollAmt;
    if (o.type === "car") o.y += (o.vy || 0) * dt;
    o.x += (o.vx || 0) * dt;
    if (o.type === "scooter" || o.type === "ped" || o.type === "dog") {
      if (o.x < ROAD_L + 14 || o.x > ROAD_R - 14) o.vx *= -1;
    }
  }

  // Houses — more spacing early
  G.nextHouseDist -= scrollAmt;
  if (G.nextHouseDist <= 0) {
    spawnHouse(-90);
    G.nextHouseDist = lerp(195, 135, diff);
  }

  // Obstacles — long calm start
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    if (diff > 0.08) spawnObstacle();
    G.spawnT = lerp(2.4, 0.55, easeOut(diff));
  }

  // Gates only after easy window
  if (e > EASY_SECS + 8) {
    G.nextGateIn -= dt;
    if (G.nextGateIn <= 0 && !G.gateActive) startGate();
  }

  // Packages
  for (const pk of G.packages) {
    if (pk.done) continue;
    pk.t += dt;
    const u = clamp(pk.t / pk.dur, 0, 1);
    const ease = smoothstep(u);
    pk.x = lerp(pk.sx, pk.tx, ease);
    const linearY = lerp(pk.sy, pk.ty, ease);
    pk.y = linearY - Math.sin(u * Math.PI) * pk.arc;
    pk.rot += pk.vr * dt;
    if (u >= 1) {
      pk.done = true;
      resolvePackageLanding(pk);
    }
  }
  G.packages = G.packages.filter(p => !p.done || ((p.fade = (p.fade ?? 0.2) - dt) > 0));

  // Collisions
  const car = carHitbox();
  for (const o of G.obstacles) {
    if (o.dead || o.hit) continue;
    if (o.y < CAR_Y - 100 || o.y > CAR_Y + 60) continue;
    const ob = { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h };
    if (rectsOverlap(car, ob)) {
      o.hit = true;
      o.dead = true;
      handleObstacleHit(o);
    }
  }

  G.houses = G.houses.filter(h => h.y < H + 120);
  G.props = G.props.filter(p => p.y < H + 120);
  G.obstacles = G.obstacles.filter(o => !o.dead && o.y < H + 100);

  updateFX(dt);
  for (const m of G.messages) m.life -= dt;
  G.messages = G.messages.filter(m => m.life > 0);
}

function updateFX(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const f of G.floatText) {
    f.y += f.vy * dt;
    f.life -= dt;
  }
  G.floatText = G.floatText.filter(f => f.life > 0);
}

function handleObstacleHit(o) {
  if (G.fsd > 0) {
    floatTxt(o.x, o.y, "DODGED", "#00B0FF", 14);
    burst(o.x, o.y, "#00B0FF", 8);
    return;
  }
  const table = {
    cone: { dmg: 7, msg: "Traffic cone! Watch the shoulder." },
    scooter: { dmg: 11, msg: "Lime scooter — classic Florida hazard." },
    car: { dmg: 20, msg: "Fender bender with a sunburned sedan!" },
    ped: { dmg: 12, msg: "Phone zombie stepped out!" },
    dog: { dmg: 9, msg: "Doggo loves your Tesla a little too much." },
  };
  const t = table[o.type] || { dmg: 10, msg: "Ouch!" };
  damagePlayer(t.dmg, t.msg);
  burst(o.x, o.y, "#FF7043", 12);
  floatTxt(o.x, o.y - 10, "ouch", "#FF5252", 13);
}

function resolvePackageLanding(pk) {
  for (const h of G.houses) {
    if (h.delivered) continue;
    const porch = getPorchRect(h);

    // Porch hit (generous rect)
    if (pk.x > porch.x && pk.x < porch.x + porch.w &&
        pk.y > porch.y && pk.y < porch.y + porch.h) {

      if (h.hasPirate && !h.pirateHit) {
        h.pirateHit = true;
        h.delivered = true;
        const bonus = 75;
        G.score += bonus;
        G.pirateBonus++;
        G.deliveries++;
        G.combo++;
        G.bestCombo = Math.max(G.bestCombo, G.combo);
        tryFSD();
        floatTxt(porch.cx, porch.cy, "PIRATE BONKED! +" + bonus, "#FFD54F", 15);
        burst(pk.x, pk.y, "#FFD54F", 14);
        spawnMessage("Beaned a porch pirate. Justice!", 2);
        return;
      }

      if (h.hasRing && Math.random() < lerp(0.08, 0.22, difficulty())) {
        h.ringHit = true;
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 10);
        floatTxt(pk.x, pk.y, "Ring cam −10", "#FF8A65", 13);
        burst(pk.x, pk.y, "#90A4AE", 8);
        spawnMessage("Tagged the Ring camera. HOA has footage.", 2);
        return;
      }

      h.delivered = true;
      let pts = 100 + G.combo * 10;
      let note = "DELIVERED +" + pts;
      if (h.hasSnack && !h.snackTaken) {
        h.snackTaken = true;
        G.snacks++;
        pts += 40;
        note = "SNACKS! +" + pts;
        spawnMessage("Customer left Gatorade & cookies! 🍪", 2);
        burst(pk.x, pk.y, "#FFB74D", 16);
      }
      G.score += pts;
      G.deliveries++;
      G.combo++;
      G.bestCombo = Math.max(G.bestCombo, G.combo);
      tryFSD();
      floatTxt(porch.cx, porch.cy - 12, note, "#69F0AE", 15);
      burst(pk.x, pk.y, "#FF9900", 14);
      return;
    }

    if (h.hasPool) {
      const pool = { x: h.poolX - 30, y: h.y + 4, w: 60, h: 42 };
      if (pk.x > pool.x && pk.x < pool.x + pool.w && pk.y > pool.y && pk.y < pool.y + pool.h) {
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 20);
        floatTxt(pk.x, pk.y, "SPLASH! −20", "#4FC3F7", 14);
        burst(pk.x, pk.y, "#29B6F6", 18);
        spawnMessage("Package went for a swim.", 2);
        return;
      }
    }

    if (h.hasDog) {
      const dogX = h.side === 0 ? h.porchX + h.porchW + 14 : h.porchX - 14;
      const dogY = h.y + 38;
      if (dist(pk.x, pk.y, dogX, dogY) < 32) {
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 8);
        floatTxt(pk.x, pk.y, "DOG GOT IT", "#A1887F", 13);
        burst(pk.x, pk.y, "#8D6E63", 8);
        spawnMessage("Good boy. Bad metrics.", 2);
        if (Math.random() < 0.3) {
          G.obstacles.push({
            type: "dog", x: dogX, y: dogY, w: 26, h: 16,
            vx: (G.carX - dogX) * 0.35, dead: false, hit: false,
          });
        }
        return;
      }
    }
  }

  if (pk.x > ROAD_L && pk.x < ROAD_R) {
    floatTxt(pk.x, pk.y, "road pizza", "#BDBDBD", 12);
    burst(pk.x, pk.y, "#9E9E9E", 5);
  } else {
    floatTxt(pk.x, pk.y, "missed porch", "#BDBDBD", 12);
    G.combo = 0;
  }
}

// ─── Drawing ────────────────────────────────────────────────
function draw() {
  ctx.save();
  if (G.shake > 0) {
    ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake) * 0.6);
  }
  drawSky();
  drawGround();
  drawRoad();
  drawProps();
  drawHouses();
  drawObstacles();
  drawAimPreview();
  drawPackages();
  drawTesla();
  drawParticles();
  drawFloatText();
  ctx.restore();

  if (state === STATE.TITLE) drawTitle();
  else if (state === STATE.HOWTO) drawHowTo();
  else if (state === STATE.PLAY) drawHUD();
  else if (state === STATE.GATE) { drawHUD(); drawGate(); }
  else if (state === STATE.END) drawEnd();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.42);
  g.addColorStop(0, "#4A90D9");
  g.addColorStop(0.45, "#7EC8E8");
  g.addColorStop(1, "#B8DFF0");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // sun + glow
  const sx = W - 52, sy = 48;
  const sg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 50);
  sg.addColorStop(0, "rgba(255,245,157,0.9)");
  sg.addColorStop(0.4, "rgba(255,224,130,0.45)");
  sg.addColorStop(1, "rgba(255,200,100,0)");
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(sx, sy, 50, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFF59D";
  ctx.beginPath();
  ctx.arc(sx, sy, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFE082";
  ctx.beginPath();
  ctx.arc(sx, sy, 14, 0, Math.PI * 2);
  ctx.fill();

  for (const c of G.clouds) drawCloud(c.x, c.y, c.w, 0.75 + c.layer * 0.2);
  for (const b of G.birds) drawBird(b);
}

function drawCloud(x, y, w, a) {
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, w * 0.2, 0, 0, Math.PI * 2);
  ctx.ellipse(x - w * 0.28, y + 3, w * 0.28, w * 0.15, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.25, y + 2, w * 0.32, w * 0.17, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.05, y - 8, w * 0.22, w * 0.14, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBird(b) {
  const flap = Math.sin(b.flap) * 4;
  ctx.strokeStyle = "rgba(40,40,50,0.45)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(b.x - 6, b.y + flap);
  ctx.quadraticCurveTo(b.x, b.y - 3, b.x + 6, b.y + flap);
  ctx.stroke();
}

function drawGround() {
  // deep Florida grass
  const lg = ctx.createLinearGradient(0, 0, ROAD_L, 0);
  lg.addColorStop(0, "#5B8C2A");
  lg.addColorStop(1, "#7CB342");
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, ROAD_L, H);
  const rg = ctx.createLinearGradient(ROAD_R, 0, W, 0);
  rg.addColorStop(0, "#7CB342");
  rg.addColorStop(1, "#5B8C2A");
  ctx.fillStyle = rg;
  ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);

  // grass texture stripes (scroll)
  ctx.fillStyle = "rgba(255,255,255,0.04)";
  for (let i = 0; i < 14; i++) {
    const yy = ((i * 55 + G.scroll * 0.25) % (H + 55)) - 30;
    ctx.fillRect(0, yy, ROAD_L - 8, 18);
    ctx.fillRect(ROAD_R + 8, yy, W - ROAD_R - 8, 18);
  }

  // sidewalks
  ctx.fillStyle = "#C5C0B5";
  ctx.fillRect(ROAD_L - 16, 0, 12, H);
  ctx.fillRect(ROAD_R + 4, 0, 12, H);
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 20; i++) {
    const yy = ((i * 48 - G.scroll * 0.9) % (H + 48));
    ctx.beginPath();
    ctx.moveTo(ROAD_L - 16, yy); ctx.lineTo(ROAD_L - 4, yy);
    ctx.moveTo(ROAD_R + 4, yy); ctx.lineTo(ROAD_R + 16, yy);
    ctx.stroke();
  }

  // sandy curb
  ctx.fillStyle = "#D2B48C";
  ctx.fillRect(ROAD_L - 5, 0, 5, H);
  ctx.fillRect(ROAD_R, 0, 5, H);
}

function drawRoad() {
  // asphalt base
  const ag = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
  ag.addColorStop(0, "#4A5C66");
  ag.addColorStop(0.5, "#546E7A");
  ag.addColorStop(1, "#4A5C66");
  ctx.fillStyle = ag;
  ctx.fillRect(ROAD_L, 0, ROAD_W, H);

  // worn center + subtle patches
  ctx.fillStyle = "rgba(0,0,0,0.06)";
  for (let i = 0; i < 6; i++) {
    const yy = ((i * 130 + G.scroll * 0.4) % (H + 130)) - 40;
    ctx.beginPath();
    ctx.ellipse(ROAD_CX + Math.sin(i * 2) * 20, yy, 40, 18, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // lane dashes
  ctx.strokeStyle = "#F5E96A";
  ctx.lineWidth = 4;
  ctx.lineCap = "butt";
  ctx.setLineDash([22, 20]);
  ctx.lineDashOffset = -G.roadLines * 0.95;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX, 0);
  ctx.lineTo(ROAD_CX, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // edge lines
  ctx.strokeStyle = "#ECEFF1";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 4, 0); ctx.lineTo(ROAD_L + 4, H);
  ctx.moveTo(ROAD_R - 4, 0); ctx.lineTo(ROAD_R - 4, H);
  ctx.stroke();

  // manhole
  const mhY = ((G.scroll * 0.9) % (H + 200)) - 40;
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.ellipse(ROAD_CX + 48, mhY, 12, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#37474F";
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawProps() {
  // draw back-to-front by y
  const sorted = G.props.slice().sort((a, b) => a.y - b.y);
  for (const p of sorted) {
    if (p.y < -100 || p.y > H + 90) continue;
    if (p.type === "palm") drawPalm(p.x, p.y, p.scale || 1);
    if (p.type === "pool") drawPool(p.x, p.y);
    if (p.type === "bush") drawBush(p.x, p.y);
    if (p.type === "sign") drawYardSign(p.x, p.y, p.label);
  }
}

function drawPalm(x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(4, 34, 16, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // trunk segments
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 32);
  ctx.quadraticCurveTo(8, 8, -2, -42);
  ctx.stroke();
  ctx.strokeStyle = "#A1887F";
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const t = i / 5;
    const px = lerp(0, -1, t) + Math.sin(t * 3) * 2;
    const py = lerp(28, -30, t);
    ctx.beginPath();
    ctx.moveTo(px - 3, py);
    ctx.lineTo(px + 3, py);
    ctx.stroke();
  }
  // fronds
  const baseY = -42;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.38;
    const len = 36 + (i % 2) * 6;
    ctx.strokeStyle = i % 2 ? "#2E7D32" : "#388E3C";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-2, baseY);
    ctx.quadraticCurveTo(
      -2 + Math.cos(a) * len * 0.5,
      baseY + Math.sin(a) * len * 0.35 - 8,
      -2 + Math.cos(a) * len,
      baseY + Math.sin(a) * len * 0.7
    );
    ctx.stroke();
  }
  // coconuts
  ctx.fillStyle = "#6D4C41";
  ctx.beginPath();
  ctx.arc(-4, -38, 3, 0, Math.PI * 2);
  ctx.arc(2, -36, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPool(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  roundRect(x - 32, y + 4, 64, 44, 14);
  ctx.fill();
  const pg = ctx.createLinearGradient(x, y, x, y + 44);
  pg.addColorStop(0, "#4DD0E1");
  pg.addColorStop(0.5, "#26C6DA");
  pg.addColorStop(1, "#00ACC1");
  ctx.fillStyle = pg;
  roundRect(x - 30, y, 60, 42, 12);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  roundRect(x - 22, y + 5, 28, 10, 5);
  ctx.fill();
  ctx.strokeStyle = "#00838F";
  ctx.lineWidth = 3;
  roundRect(x - 30, y, 60, 42, 12);
  ctx.stroke();
  // deck
  ctx.fillStyle = "#BCAAA4";
  ctx.fillRect(x - 34, y + 40, 68, 6);
}

function drawBush(x, y) {
  ctx.fillStyle = "#558B2F";
  ctx.beginPath();
  ctx.ellipse(x, y, 14, 10, 0, 0, Math.PI * 2);
  ctx.ellipse(x - 8, y + 2, 10, 8, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 8, y + 1, 10, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#7CB342";
  ctx.beginPath();
  ctx.ellipse(x - 2, y - 2, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawYardSign(x, y, label) {
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(x - 1.5, y, 3, 22);
  ctx.fillStyle = "#FFECB3";
  roundRect(x - 16, y - 16, 32, 16, 2);
  ctx.fill();
  ctx.strokeStyle = "#FF8F00";
  ctx.lineWidth = 1.5;
  roundRect(x - 16, y - 16, 32, 16, 2);
  ctx.stroke();
  ctx.fillStyle = "#E65100";
  ctx.font = "bold 8px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(label, x, y - 5);
}

function drawHouses() {
  const sorted = G.houses.slice().sort((a, b) => a.y - b.y);
  for (const h of sorted) {
    if (h.y < -130 || h.y > H + 90) continue;
    drawHouse(h);
  }
}

function drawHouse(h) {
  const facingRight = h.side === 0;
  const hw = 68, hh = 76;
  const hx = h.side === 0 ? 4 : ROAD_R + 10;
  const hy = h.y - 24;

  // driveway
  if (h.hasDriveway) {
    ctx.fillStyle = "#9E9E9E";
    const dw = 22;
    const dx = facingRight ? ROAD_L - 20 : ROAD_R - 2;
    ctx.beginPath();
    ctx.moveTo(facingRight ? hx + hw : hx, hy + hh - 10);
    ctx.lineTo(dx, h.y + 50);
    ctx.lineTo(dx + (facingRight ? dw : -dw), h.y + 50);
    ctx.lineTo(facingRight ? hx + hw : hx, hy + hh + 10);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    for (let i = 0; i < 3; i++) {
      ctx.fillRect(dx + (facingRight ? 4 : -14), h.y + 10 + i * 14, 10, 2);
    }
  }

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.14)";
  ctx.beginPath();
  ctx.ellipse(hx + hw / 2 + 4, hy + hh + 6, hw * 0.48, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  // body with subtle stucco gradient
  const bg = ctx.createLinearGradient(hx, hy, hx + hw, hy + hh);
  bg.addColorStop(0, h.color);
  bg.addColorStop(1, shade(h.color, -18));
  ctx.fillStyle = bg;
  roundRect(hx, hy, hw, hh, 3);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1.5;
  roundRect(hx, hy, hw, hh, 3);
  ctx.stroke();

  // roof
  ctx.fillStyle = h.roof;
  ctx.beginPath();
  ctx.moveTo(hx - 6, hy + 10);
  ctx.lineTo(hx + hw / 2, hy - 26);
  ctx.lineTo(hx + hw + 6, hy + 10);
  ctx.closePath();
  ctx.fill();
  // roof highlight
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hx + 4, hy + 6);
  ctx.lineTo(hx + hw / 2, hy - 20);
  ctx.stroke();

  // garage
  if (h.garage) {
    const gx = facingRight ? hx + 6 : hx + hw - 30;
    ctx.fillStyle = "#78909C";
    roundRect(gx, hy + 38, 26, 28, 2);
    ctx.fill();
    ctx.strokeStyle = "#546E7A";
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(gx + 2, hy + 44 + i * 6);
      ctx.lineTo(gx + 24, hy + 44 + i * 6);
      ctx.stroke();
    }
  }

  // door
  const doorX = facingRight ? hx + hw - 24 : hx + 10;
  ctx.fillStyle = "#5D4037";
  roundRect(doorX, hy + 30, 18, 34, 2);
  ctx.fill();
  ctx.fillStyle = h.trim;
  ctx.fillRect(doorX + 1, hy + 31, 16, 3);
  ctx.fillStyle = "#BBDEFB";
  ctx.fillRect(doorX + 4, hy + 36, 10, 8);
  // knob
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(doorX + 14, hy + 50, 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Ring
  if (h.hasRing) {
    ctx.fillStyle = h.ringHit ? "#FF5252" : "#263238";
    ctx.beginPath();
    ctx.arc(doorX + 9, hy + 26, 4.5, 0, Math.PI * 2);
    ctx.fill();
    if (!h.ringHit) {
      ctx.fillStyle = "#69F0AE";
      ctx.beginPath();
      ctx.arc(doorX + 9, hy + 26, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // windows
  const wx = facingRight ? hx + 8 : hx + hw - 30;
  drawWindow(wx, hy + 16, 22, 18, h.windowLit);
  if (!h.garage) drawWindow(facingRight ? hx + 8 : hx + hw - 30, hy + 42, 18, 14, false);

  // house number plaque
  ctx.fillStyle = h.trim;
  roundRect(hx + hw / 2 - 14, hy + hh - 16, 28, 12, 2);
  ctx.fill();
  ctx.fillStyle = "#37474F";
  ctx.font = "bold 10px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(String(h.number), hx + hw / 2, hy + hh - 7);

  // mailbox
  if (h.hasMailbox) {
    const mx = facingRight ? ROAD_L - 28 : ROAD_R + 20;
    const my = h.y + 42;
    ctx.fillStyle = "#78909C";
    ctx.fillRect(mx + 5, my, 3, 14);
    ctx.fillStyle = "#546E7A";
    roundRect(mx, my - 10, 14, 10, 2);
    ctx.fill();
    ctx.fillStyle = "#FF8A65";
    ctx.fillRect(mx + 10, my - 6, 5, 2);
  }

  // porch pad (stone)
  const porch = getPorchRect(h);
  const pg = ctx.createLinearGradient(porch.x, porch.y, porch.x, porch.y + h.porchH);
  pg.addColorStop(0, "#D7CCC8");
  pg.addColorStop(1, "#BCAAA4");
  ctx.fillStyle = pg;
  roundRect(h.porchX, h.y + 6, h.porchW, h.porchH, 4);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  ctx.lineWidth = 1;
  roundRect(h.porchX, h.y + 6, h.porchW, h.porchH, 4);
  ctx.stroke();

  // glowing Amazon target
  if (!h.delivered) {
    const gx = h.porchX + h.porchW / 2;
    const gy = h.y + 6 + h.porchH / 2;
    const pulse = 0.55 + Math.sin(now() / 220 + h.number) * 0.45;
    // soft ground ring
    ctx.save();
    ctx.globalAlpha = 0.25 + pulse * 0.35;
    ctx.strokeStyle = "#FF9900";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(gx, gy + 2, 16 + pulse * 4, 10 + pulse * 2, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.shadowColor = "#FF9900";
    ctx.shadowBlur = 16;
    drawAmazonBox(gx, gy, 1);
    ctx.restore();
  } else {
    ctx.save();
    ctx.translate(h.porchX + h.porchW / 2, h.y + 14);
    drawAmazonBox(0, 0, 0.85);
    ctx.fillStyle = "#2E7D32";
    ctx.font = "bold 11px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("✓", 0, 20);
    ctx.restore();
  }

  if (h.hasSnack && !h.snackTaken && !h.delivered) {
    const sx = h.side === 0 ? h.porchX - 14 : h.porchX + h.porchW + 2;
    ctx.fillStyle = "#EF5350";
    roundRect(sx, h.y + 12, 12, 14, 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "9px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("🍪", sx + 6, h.y + 23);
  }

  if (h.hasPirate && !h.pirateHit && !h.delivered) {
    const px = h.side === 0 ? h.porchX + h.porchW + 4 : h.porchX - 16;
    const py = h.y + 10;
    ctx.fillStyle = "#424242";
    ctx.beginPath();
    ctx.ellipse(px + 6, py + 16, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 6, py + 6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#212121";
    ctx.fillRect(px + 1, py + 2, 10, 4);
  }

  if (h.hasDog && !h.delivered) {
    const dx = h.side === 0 ? h.porchX + h.porchW + 14 : h.porchX - 14;
    drawDog(dx, h.y + 40, h.side === 0 ? 1 : -1);
  }
}

function drawWindow(x, y, w, h, lit) {
  ctx.fillStyle = lit ? "#FFF9C4" : "#E3F2FD";
  roundRect(x, y, w, h, 2);
  ctx.fill();
  ctx.strokeStyle = "#90A4AE";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  ctx.beginPath();
  ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
  ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
  ctx.stroke();
  if (lit) {
    ctx.fillStyle = "rgba(255,249,196,0.25)";
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x - 4, y + h + 10);
    ctx.lineTo(x + w + 4, y + h + 10);
    ctx.lineTo(x + w, y + h);
    ctx.fill();
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
  return `rgb(${r|0},${g|0},${b|0})`;
}

function drawAmazonBox(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.fillStyle = "#FF9900";
  roundRect(-11, -9, 22, 17, 2);
  ctx.fill();
  ctx.strokeStyle = "#232F3E";
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(0, -9); ctx.lineTo(0, 8);
  ctx.moveTo(-11, -1); ctx.lineTo(11, -1);
  ctx.stroke();
  // smile arrow
  ctx.beginPath();
  ctx.arc(0, 1, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(4, 5); ctx.lineTo(6, 3); ctx.lineTo(7, 6);
  ctx.stroke();
  ctx.restore();
}

function drawDog(x, y, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(0, 6, 12, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#A1887F";
  roundRect(-11, -6, 22, 11, 4);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(11, -4, 6.5, 5.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#8D6E63";
  ctx.beginPath();
  ctx.ellipse(9, -10, 3.2, 4.5, -0.3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#5D4037";
  ctx.beginPath();
  ctx.arc(14, -4, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#A1887F";
  ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(-11, -2);
  ctx.quadraticCurveTo(-17, -12, -12, -14);
  ctx.stroke();
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(-8, 3, 3.5, 5);
  ctx.fillRect(3, 3, 3.5, 5);
  ctx.restore();
}

function drawObstacles() {
  for (const o of G.obstacles) {
    if (o.y < -80 || o.y > H + 80) continue;
    if (o.type === "cone") drawCone(o.x, o.y);
    else if (o.type === "scooter") drawScooter(o.x, o.y);
    else if (o.type === "car") drawOtherCar(o);
    else if (o.type === "ped") drawPed(o.x, o.y);
    else if (o.type === "dog") drawDog(o.x, o.y, o.vx >= 0 ? 1 : -1);
  }
}

function drawCone(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.15)";
  ctx.beginPath();
  ctx.ellipse(x, y + 10, 10, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FF6D00";
  ctx.beginPath();
  ctx.moveTo(x, y - 16);
  ctx.lineTo(x + 11, y + 9);
  ctx.lineTo(x - 11, y + 9);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#FFF";
  ctx.fillRect(x - 7, y - 2, 14, 4);
  ctx.fillStyle = "#E65100";
  ctx.fillRect(x - 12, y + 9, 24, 4);
}

function drawScooter(x, y) {
  ctx.strokeStyle = "#00ACC1";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y + 14);
  ctx.lineTo(x, y - 10);
  ctx.lineTo(x + 8, y - 16);
  ctx.stroke();
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x - 3, y + 10);
  ctx.lineTo(x + 3, y + 10);
  ctx.stroke();
  ctx.fillStyle = "#263238";
  ctx.beginPath();
  ctx.arc(x, y + 16, 4, 0, Math.PI * 2);
  ctx.arc(x, y - 4, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFEB3B";
  ctx.fillRect(x + 6, y - 18, 4, 3);
  ctx.lineCap = "butt";
}

function drawOtherCar(o) {
  const x = o.x, y = o.y, w = o.w, h = o.h;
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.42, w * 0.48, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = o.color;
  roundRect(x - w / 2, y - h / 2, w, h, 9);
  ctx.fill();
  ctx.fillStyle = "rgba(30,40,50,0.78)";
  roundRect(x - w / 2 + 6, y - h / 2 + 12, w - 12, h * 0.34, 5);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  roundRect(x - w / 2 + 8, y - h / 2 + 14, 8, h * 0.28, 2);
  ctx.fill();
  ctx.fillStyle = "#FFECB3";
  roundRect(x - w / 2 + 5, y + h / 2 - 11, 11, 5, 2);
  ctx.fill();
  roundRect(x + w / 2 - 16, y + h / 2 - 11, 11, 5, 2);
  ctx.fill();
  ctx.fillStyle = "#E53935";
  roundRect(x - w / 2 + 6, y - h / 2 + 4, 8, 4, 1);
  ctx.fill();
  roundRect(x + w / 2 - 14, y - h / 2 + 4, 8, 4, 1);
  ctx.fill();
}

function drawPed(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(x, y + 22, 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pickStable(x, ["#42A5F5", "#AB47BC", "#26A69A", "#EF5350"]);
  roundRect(x - 7, y - 4, 14, 16, 3);
  ctx.fill();
  ctx.fillStyle = "#FFCC80";
  ctx.beginPath();
  ctx.arc(x, y - 10, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#212121";
  roundRect(x + 6, y - 8, 5, 9, 1);
  ctx.fill();
  ctx.fillStyle = "#81D4FA";
  ctx.fillRect(x + 7, y - 6, 3, 5);
  ctx.fillStyle = "#37474F";
  ctx.fillRect(x - 5, y + 12, 4, 10);
  ctx.fillRect(x + 1, y + 12, 4, 10);
}

function pickStable(seed, arr) {
  return arr[Math.abs(Math.floor(seed * 7.13)) % arr.length];
}

function drawAimPreview() {
  if (!G.aimPreview || state !== STATE.PLAY) return;
  const { x, y, sx, sy, assisted } = G.aimPreview;
  // trajectory dots
  ctx.save();
  for (let i = 1; i <= 8; i++) {
    const u = i / 9;
    const px = lerp(sx, x, smoothstep(u));
    const py = lerp(sy, y, smoothstep(u)) - Math.sin(u * Math.PI) * 50;
    ctx.globalAlpha = 0.15 + u * 0.45;
    ctx.fillStyle = assisted ? "#00E5FF" : "#FFB74D";
    ctx.beginPath();
    ctx.arc(px, py, 3 - u * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
  // landing marker
  ctx.globalAlpha = 0.7;
  ctx.strokeStyle = assisted ? "#00E5FF" : "#FF9900";
  ctx.lineWidth = 2;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.ellipse(x, y + 4, 14, 8, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  if (assisted) {
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "#00E5FF";
    ctx.font = "bold 10px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("assist", x, y - 12);
  }
  ctx.restore();
}

function drawPackages() {
  for (const pk of G.packages) {
    const u = clamp(pk.t / pk.dur, 0, 1);
    const shadowY = lerp(pk.sy, pk.ty, smoothstep(u));
    ctx.fillStyle = `rgba(0,0,0,${0.12 + u * 0.18})`;
    ctx.beginPath();
    ctx.ellipse(pk.x, shadowY + 8, 9 * (1 - Math.sin(u * Math.PI) * 0.35), 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(pk.x, pk.y);
    ctx.rotate(pk.rot);
    const s = 1 + Math.sin(u * Math.PI) * 0.18;
    drawAmazonBox(0, 0, s);
    ctx.restore();
  }
}

function drawTesla() {
  const x = G.carX, y = CAR_Y;
  ctx.save();
  ctx.translate(x, y);
  const lean = clamp(G.carVX / 420, -0.1, 0.1);
  ctx.rotate(lean);

  if (G.fsd > 0) {
    const pulse = 0.5 + Math.sin(now() / 120) * 0.5;
    ctx.shadowColor = "#00B0FF";
    ctx.shadowBlur = 20 + pulse * 10;
    ctx.fillStyle = `rgba(0,176,255,${0.12 + pulse * 0.1})`;
    ctx.beginPath();
    ctx.ellipse(0, 4, 38, 54, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ground shadow
  ctx.fillStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(1, 44, 26, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // wheels + arches
  const flash = G.invuln > 0 && Math.floor(now() / 70) % 2;
  const body = flash ? "rgba(245,245,245,0.45)" : "#F5F5F5";

  // tire rubber
  ctx.fillStyle = "#1A1A1A";
  roundRect(-26, -30, 11, 20, 3);
  roundRect(15, -30, 11, 20, 3);
  roundRect(-26, 16, 11, 20, 3);
  roundRect(15, 16, 11, 20, 3);
  // rims
  ctx.fillStyle = "#B0BEC5";
  for (const [wx, wy] of [[-20.5, -20], [20.5, -20], [-20.5, 26], [20.5, 26]]) {
    ctx.beginPath();
    ctx.arc(wx, wy, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#78909C";
    ctx.beginPath();
    ctx.arc(wx, wy, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#B0BEC5";
  }

  // main body
  ctx.fillStyle = body;
  roundRect(-23, -44, 46, 88, 13);
  ctx.fill();
  // side sculpt
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  roundRect(-23, -44, 9, 88, 13);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  roundRect(8, -40, 10, 70, 6);
  ctx.fill();

  // dark glass canopy (Model 3 continuous roof)
  const glass = ctx.createLinearGradient(-16, -30, 16, 20);
  glass.addColorStop(0, "#1A237E");
  glass.addColorStop(0.35, "#263238");
  glass.addColorStop(0.7, "#37474F");
  glass.addColorStop(1, "#455A64");
  ctx.fillStyle = glass;
  roundRect(-17, -30, 34, 46, 9);
  ctx.fill();
  // canopy reflection
  ctx.fillStyle = "rgba(144,202,249,0.22)";
  roundRect(-14, -27, 11, 38, 6);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  roundRect(2, -26, 10, 20, 4);
  ctx.fill();

  // rear deck
  ctx.fillStyle = "#EEEEEE";
  roundRect(-15, 16, 30, 22, 5);
  ctx.fill();

  // front continuous light bar
  if (G.fsd > 0) {
    ctx.fillStyle = "#00E5FF";
    ctx.shadowColor = "#00E5FF";
    ctx.shadowBlur = 10;
  } else {
    const lg = ctx.createLinearGradient(-17, 0, 17, 0);
    lg.addColorStop(0, "#E3F2FD");
    lg.addColorStop(0.5, "#FFFFFF");
    lg.addColorStop(1, "#E3F2FD");
    ctx.fillStyle = lg;
  }
  roundRect(-17, -42, 34, 5, 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // rear red light bar (Model 3 signature)
  const rl = ctx.createLinearGradient(-15, 0, 15, 0);
  rl.addColorStop(0, "#C62828");
  rl.addColorStop(0.5, "#FF1744");
  rl.addColorStop(1, "#C62828");
  ctx.fillStyle = rl;
  roundRect(-15, 36, 30, 4.5, 2);
  ctx.fill();

  // side mirrors
  ctx.fillStyle = "#FAFAFA";
  roundRect(-30, -10, 9, 6, 2);
  roundRect(21, -10, 9, 6, 2);
  ctx.fillStyle = "#37474F";
  ctx.fillRect(-28, -8.5, 5, 3);
  ctx.fillRect(23, -8.5, 5, 3);

  // Tesla T logo on hood
  ctx.fillStyle = "#90A4AE";
  ctx.font = "bold 12px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("T", 0, -36);
  ctx.textBaseline = "alphabetic";

  // Amazon Flex door badge
  ctx.fillStyle = "#232F3E";
  roundRect(-13, 22, 26, 11, 2);
  ctx.fill();
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 8px system-ui";
  ctx.fillText("FLEX", 0, 30);

  // front plate highlight
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1;
  roundRect(-23, -44, 46, 88, 13);
  ctx.stroke();

  ctx.restore();

  if (G.fsd > 0) {
    ctx.fillStyle = "rgba(0,176,255,0.95)";
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("FSD " + G.fsd.toFixed(1) + "s", G.carX, CAR_Y + 58);
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / (p.max || 1), 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatText() {
  for (const f of G.floatText) {
    ctx.globalAlpha = clamp(f.life * 1.2, 0, 1);
    ctx.font = `bold ${f.size}px system-ui`;
    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ─── HUD / Screens ──────────────────────────────────────────
function drawHUD() {
  ctx.fillStyle = "rgba(10,22,40,0.75)";
  roundRect(10, 10, W - 20, 52, 12);
  ctx.fill();

  ctx.textAlign = "left";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 12px system-ui";
  ctx.fillText("SCORE", 22, 28);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(String(G.score), 22, 50);

  ctx.textAlign = "center";
  ctx.fillStyle = "#90CAF9";
  ctx.font = "bold 12px system-ui";
  ctx.fillText("TIME", W / 2, 28);
  ctx.fillStyle = G.time < 15 ? "#FF5252" : "#fff";
  ctx.font = "bold 20px system-ui";
  const m = Math.floor(G.time / 60);
  const s = Math.floor(G.time % 60);
  ctx.fillText(`${m}:${s.toString().padStart(2, "0")}`, W / 2, 50);

  ctx.textAlign = "right";
  ctx.fillStyle = "#A5D6A7";
  ctx.font = "bold 12px system-ui";
  ctx.fillText("DROPS", W - 22, 28);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(String(G.deliveries), W - 22, 50);

  // FSD pips
  const pipY = 72;
  for (let i = 0; i < FSD_DELIVERIES; i++) {
    ctx.fillStyle = i < G.fsdReady ? "#00B0FF" : "rgba(255,255,255,0.18)";
    ctx.beginPath();
    ctx.arc(W / 2 - 32 + i * 16, pipY, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.font = "10px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("FSD charge", W / 2, pipY + 15);

  // Easy stretch badge
  if (elapsed() < EASY_SECS) {
    ctx.fillStyle = "rgba(76,175,80,0.85)";
    roundRect(W / 2 - 54, 92, 108, 20, 10);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px system-ui";
    ctx.fillText("EASY STRETCH", W / 2, 106);
  }

  // damage bar
  const bx = 20, by = H - 36, bw = W - 40, bh = 16;
  ctx.fillStyle = "rgba(10,22,40,0.78)";
  roundRect(bx - 4, by - 18, bw + 8, bh + 28, 10);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "left";
  ctx.fillText("VEHICLE INTEGRITY", bx, by - 4);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  roundRect(bx, by, bw, bh, 6);
  ctx.fill();
  const pct = 1 - G.damage / MAX_DAMAGE;
  ctx.fillStyle = pct > 0.5 ? "#66BB6A" : pct > 0.25 ? "#FFA726" : "#EF5350";
  roundRect(bx, by, Math.max(4, bw * pct), bh, 6);
  ctx.fill();

  // first-seconds zone hints
  if (G.time > ROUTE_TIME - 5) {
    ctx.globalAlpha = clamp((G.time - (ROUTE_TIME - 5)) / 5, 0, 0.3);
    ctx.fillStyle = "#00B0FF";
    ctx.fillRect(0, 0, W, H * 0.5);
    ctx.fillStyle = "#FF9900";
    ctx.fillRect(0, H * 0.5, W, H * 0.5);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("AIM & THROW (top half)", W / 2, H * 0.25);
    ctx.fillText("STEER (bottom half)", W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }

  let my = 118;
  for (const msg of G.messages) {
    ctx.globalAlpha = clamp(msg.life * 2, 0, 0.95);
    ctx.font = "13px system-ui";
    const w = Math.min(W - 36, ctx.measureText(msg.text).width + 24);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect((W - w) / 2, my, w, 28, 8);
    ctx.fill();
    ctx.fillStyle = "#FFF8E1";
    ctx.textAlign = "center";
    ctx.fillText(msg.text, W / 2, my + 18);
    my += 32;
  }
  ctx.globalAlpha = 1;
}

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(10, 22, 40, 0.9)";
  roundRect(x, y, w, h, 16);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,153,0,0.45)";
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 16);
  ctx.stroke();
}

function drawButton(b) {
  const primary = b.style === "primary";
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (primary) {
    g.addColorStop(0, "#FFB74D");
    g.addColorStop(1, "#FF9900");
  } else {
    g.addColorStop(0, "#37474F");
    g.addColorStop(1, "#263238");
  }
  ctx.fillStyle = g;
  roundRect(b.x, b.y, b.w, b.h, 12);
  ctx.fill();
  ctx.fillStyle = primary ? "#1A1A1A" : "#ECEFF1";
  ctx.font = "bold 16px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textBaseline = "alphabetic";
}

function drawTitle() {
  ctx.fillStyle = "rgba(5,15,30,0.52)";
  ctx.fillRect(0, 0, W, H);

  const prevX = G.carX;
  G.carX = W / 2;
  ctx.save();
  ctx.translate(0, -50);
  drawTesla();
  ctx.restore();
  G.carX = prevX;

  panel(24, 155, W - 48, 370);
  ctx.textAlign = "center";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 13px system-ui";
  ctx.fillText("AMAZON FLEX EDITION", W / 2, 190);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 30px system-ui";
  ctx.fillText("Tesla Paperboy", W / 2, 232);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "13px system-ui";
  ctx.fillText("Florida suburbs · 90-second routes", W / 2, 260);
  ctx.fillText("Gentle start · Soft aim assist · FSD boosts", W / 2, 280);

  const chips = ["📦 Glowing porches", "⚡ FSD every 5 drops", "🚪 Gate codes later", "🍪 Snack bonuses"];
  let cy = 312;
  ctx.font = "12px system-ui";
  for (const c of chips) {
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    roundRect(W / 2 - 105, cy - 14, 210, 26, 8);
    ctx.fill();
    ctx.fillStyle = "#E3F2FD";
    ctx.fillText(c, W / 2, cy + 2);
    cy += 30;
  }

  UI.buttons = [];
  btn("play", W / 2 - 110, 455, 220, 50, "Quick Start", "primary");
  btn("howto", W / 2 - 110, 518, 220, 46, "How to Play", "secondary");
  for (const b of UI.buttons) drawButton(b);

  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.font = "11px system-ui";
  ctx.fillText("Desktop: A/D or ←/→ · Space throws to nearest porch", W / 2, H - 28);
}

function drawHowTo() {
  ctx.fillStyle = "rgba(5,15,30,0.72)";
  ctx.fillRect(0, 0, W, H);
  panel(18, 36, W - 36, H - 92);

  ctx.textAlign = "center";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 22px system-ui";
  ctx.fillText("How to Play", W / 2, 72);

  const lines = [
    ["STEER", "Drag the bottom half (or A/D / arrows)."],
    ["THROW", "Press on the top half to aim (ghost arc). Release to throw. Space auto-aims nearest porch."],
    ["ASSIST", "Early route: soft magnet + bigger porches. Aim a little short of the glow."],
    ["RAMP", "First ~25s is an Easy Stretch — slower, calmer, then traffic ramps up."],
    ["FSD", "Every 5 deliveries: Autopilot ~8s — car dodges so you can focus on throws."],
    ["GATES", "Later in the route, pick the correct 4-digit gate code."],
    ["BONUS", "Snacks, pirate beanings. Avoid pools, dogs, and Ring cams."],
  ];
  let y = 100;
  ctx.textAlign = "left";
  for (const [title, body] of lines) {
    ctx.fillStyle = "#00B0FF";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(title, 40, y);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "12px system-ui";
    wrapText(body, 40, y + 16, W - 80, 15);
    y += 58;
  }

  UI.buttons = [];
  btn("play", W / 2 - 110, H - 100, 220, 48, "Start Route", "primary");
  btn("back", W / 2 - 110, H - 48, 220, 36, "Back", "secondary");
  for (const b of UI.buttons) drawButton(b);
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(" ");
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW) {
      ctx.fillText(line, x, y);
      line = w;
      y += lineH;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

function drawGate() {
  ctx.fillStyle = "rgba(5,10,20,0.72)";
  ctx.fillRect(0, 0, W, H);
  panel(24, 150, W - 48, 400);

  ctx.fillStyle = "#455A64";
  ctx.fillRect(50, 170, 16, 80);
  ctx.fillRect(W - 66, 170, 16, 80);
  ctx.fillStyle = "#607D8B";
  for (let i = 0; i < 7; i++) ctx.fillRect(70 + i * 36, 175, 4, 70);
  ctx.fillStyle = "#90A4AE";
  ctx.fillRect(50, 168, W - 100, 10);

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText("GATED COMMUNITY", W / 2, 280);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "13px system-ui";
  ctx.fillText("Which code did the customer text you?", W / 2, 305);
  ctx.fillStyle = "#FF8A65";
  ctx.font = "bold 12px system-ui";
  ctx.fillText(`Time: ${Math.ceil(G.gateTimer)}s`, W / 2, 326);

  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    ctx.fillStyle = "#37474F";
    roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = "#FF9900";
    ctx.lineWidth = 1.5;
    roundRect(bx, by, bw, bh, 10);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px system-ui";
    ctx.fillText(G.gateOptions[i], W / 2, by + 34);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "11px system-ui";
    ctx.fillText(String(i + 1), bx + 18, by + 32);
    by += 68;
  }
}

function drawEnd() {
  ctx.fillStyle = "rgba(5,15,30,0.7)";
  ctx.fillRect(0, 0, W, H);
  panel(24, 100, W - 48, 460);

  ctx.textAlign = "center";
  ctx.fillStyle = G.wrecked ? "#FF5252" : "#FF9900";
  ctx.font = "bold 14px system-ui";
  ctx.fillText(G.wrecked ? "ROUTE FAILED" : "ROUTE COMPLETE", W / 2, 135);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px system-ui";
  ctx.fillText(G.wrecked ? "Tesla needs a body shop" : "Flex shift done!", W / 2, 172);

  const rows = [
    ["Score", String(G.score)],
    ["Deliveries", String(G.deliveries)],
    ["Best combo", String(G.bestCombo)],
    ["Pirate justice", String(G.pirateBonus)],
    ["Snacks claimed", String(G.snacks)],
    ["Failed drops", String(G.fails)],
    ["Vehicle damage", Math.round(G.damage) + "%"],
  ];
  let y = 215;
  for (const [k, v] of rows) {
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "14px system-ui";
    ctx.fillText(k, 56, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px system-ui";
    ctx.fillText(v, W - 56, y);
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(56, y + 10);
    ctx.lineTo(W - 56, y + 10);
    ctx.stroke();
    y += 34;
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#69F0AE";
  ctx.font = "bold 17px system-ui";
  ctx.fillText("Flex Rating: " + scoreGrade(), W / 2, y + 14);

  UI.buttons = [];
  btn("again", W / 2 - 110, H - 160, 220, 48, "Another Route", "primary");
  btn("menu", W / 2 - 110, H - 100, 220, 42, "Title Screen", "secondary");
  for (const b of UI.buttons) drawButton(b);
}

function scoreGrade() {
  if (G.wrecked) return "DNF";
  const s = G.score;
  if (s >= 2000) return "SSS — Elon would be proud";
  if (s >= 1400) return "S — Peak Flex";
  if (s >= 900) return "A — Solid block";
  if (s >= 500) return "B — Almost on time";
  if (s >= 250) return "C — Metrics under review";
  return "D — Support will call";
}

// ─── Title ambient ──────────────────────────────────────────
function updateTitle(dt) {
  G.scroll += 36 * dt;
  G.roadLines += 36 * dt;
  if (G.houses.length === 0) {
    for (let i = 0; i < 6; i++) spawnHouse(i * 160 - 100);
  }
  for (const h of G.houses) h.y += 36 * dt;
  for (const p of G.props) p.y += 36 * dt;
  G.houses = G.houses.filter(h => h.y < H + 100);
  G.props = G.props.filter(p => p.y < H + 100);
  if (G.houses.length < 5) spawnHouse(-80);
  for (const c of G.clouds) {
    c.x += c.s * dt * 0.18;
    if (c.x > W + 80) c.x = -80;
  }
  for (const b of G.birds) {
    b.x += b.s * dt;
    b.flap += dt * 8;
    if (b.x > W + 30) b.x = -20;
  }
  G.carX = ROAD_CX + Math.sin(now() / 900) * 36;
}

// ─── Main loop ──────────────────────────────────────────────
for (let i = 0; i < 7; i++) {
  G.clouds.push({
    x: rand(-40, W + 40), y: rand(18, 110),
    w: rand(55, 100), s: rand(6, 14), layer: Math.random(),
  });
}
for (let i = 0; i < 3; i++) {
  G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(20, 40), flap: rand(0, 10) });
}
for (let i = 0; i < 5; i++) spawnHouse(i * 165 - 40);
G.carX = ROAD_CX;

function frame(t) {
  const dt = clamp((t - lastT) / 1000, 0, 0.05);
  lastT = t;
  if (state === STATE.TITLE || state === STATE.HOWTO) updateTitle(dt);
  else update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("gesturestart", e => e.preventDefault());
document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

})();
</script>
