function drawPed(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(x, y + 22, 8, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pickStable(x, ["#42A5F5", "#AB47BC", "#26A69A", "#EF5350"]);
  roundRect(x - 7, y - 4, 14, 16, 3);
  ctx.fill();
  ctx.fillStyle = "#FFCC80";
  ctx.beginPath();
  ctx.arc(x, y - 10, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#212121";
  roundRect(x + 6, y - 8, 5, 9, 1);

  ctx.fillRect(x + 7, y - 6, 3, 5);
  ctx.fillStyle = "#37474F";
  ctx.fillRect(x - 5, y + 12, 4, 10);
  ctx.fillRect(x + 1, y + 12, 4, 10);
}

function pickStable(seed, arr) {
  return arr[Math.abs(Math.floor(seed * 7.13)) % arr.length];
}

function drawAimPreview() {
  if (state !== STATE.PLAY) return;
  ctx.save();

  // Always highlight best DROP (reticle + guide line)
  const best = bestActiveStop();
  if (best) {
    const p = best.porch;
    const pulse = 0.5 + Math.sin(now() / 180) * 0.5;
    ctx.globalAlpha = 0.35 + pulse * 0.25;
    ctx.strokeStyle = "#00E5FF";
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(G.carX, CAR_Y - 22);
    ctx.lineTo(p.cx, p.cy);
    ctx.stroke();
    ctx.setLineDash([]);
    // pad landing X ghost
    ctx.globalAlpha = 0.5 + pulse * 0.35;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(p.cx - 10, p.cy - 8); ctx.lineTo(p.cx + 10, p.cy + 8);
    ctx.moveTo(p.cx + 10, p.cy - 8); ctx.lineTo(p.cx - 10, p.cy + 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(p.cx, p.cy + 2, 18, 11, 0, 0, Math.PI * 2);
    ctx.stroke();
  }

  if (!G.aimPreview) { ctx.restore(); return; }
  const { x, y, sx, sy, assisted } = G.aimPreview;
  const snap = G.aimPreview.snap;
  // trajectory dots (match flatter arc)
  for (let i = 1; i <= 10; i++) {
    const u = i / 11;
    const px = lerp(sx, x, smoothstep(u));
    const py = lerp(sy, y, smoothstep(u)) - Math.sin(u * Math.PI) * 32;
    ctx.globalAlpha = 0.22 + u * 0.5;
    ctx.fillStyle = snap ? "#69F0AE" : assisted ? "#00E5FF" : "#FFB74D";
    ctx.beginPath();
    ctx.arc(px, py, 3.4 - u * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // predicted landing on pad
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = snap ? "#69F0AE" : assisted ? "#00E5FF" : "#FF9900";
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(x, y + 4, 17, 11, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x - 8, y - 4); ctx.lineTo(x + 8, y + 8);
  ctx.moveTo(x + 8, y - 4); ctx.lineTo(x - 8, y + 8);
  ctx.stroke();
  ctx.fillStyle = snap ? "#69F0AE" : assisted ? "#00E5FF" : "#FFB74D";
  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(snap ? "LOCKED" : assisted ? "assist" : "aim", x, y - 14);
  ctx.restore();
}

function drawPackages() {
  for (const pk of G.packages) {
    const u = clamp(pk.t / pk.dur, 0, 1);
    const shadowY = lerp(pk.sy, pk.ty, smoothstep(u));
    ctx.fillStyle = `rgba(0,0,0,${0.12 + u * 0.18})`;
    ctx.beginPath();
    ctx.ellipse(pk.x, shadowY + 8, 9 * (1 - Math.sin(u * Math.PI) * 0.35), 3.5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(pk.x, pk.y);
    ctx.rotate(pk.rot);
    const s = 1 + Math.sin(u * Math.PI) * 0.18;
    drawAmazonBox(0, 0, s);
    ctx.restore();
  }
}

function drawTesla() {
  const x = G.carX, y = CAR_Y;
  ctx.save();
  ctx.translate(x, y);
  const lean = clamp(G.carVX / 420, -0.1, 0.1);
  ctx.rotate(lean);

  if (G.fsd > 0) {
    const pulse = 0.5 + Math.sin(now() / 120) * 0.5;
    ctx.shadowColor = "#00B0FF";
    ctx.shadowBlur = 22 + pulse * 12;
    ctx.fillStyle = `rgba(0,176,255,${0.14 + pulse * 0.12})`;
    ctx.beginPath();
    ctx.ellipse(0, 4, 40, 56, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // soft ground contact shadow
  ctx.fillStyle = "rgba(0,0,0,0.28)";
  ctx.beginPath();
  ctx.ellipse(2, 46, 28, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  const flash = G.invuln > 0 && Math.floor(now() / 70) % 2;

  // tires (wider, more Model 3 stance)
  ctx.fillStyle = "#111";
  roundRect(-27, -32, 12, 22, 3.5);
  roundRect(15, -32, 12, 22, 3.5);
  roundRect(-27, 14, 12, 22, 3.5);
  roundRect(15, 14, 12, 22, 3.5);
  // aero wheel covers / multi-spoke rims
  for (const [wx, wy] of [[-21, -21], [21, -21], [-21, 25], [21, 25]]) {
    ctx.fillStyle = "#CFD8DC";
    ctx.beginPath();
    ctx.arc(wx, wy, 5.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#90A4AE";
    ctx.beginPath();
    ctx.arc(wx, wy, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#546E7A";
    ctx.beginPath();
    ctx.arc(wx, wy, 1.4, 0, Math.PI * 2);
    ctx.fill();
    // spoke ticks
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1;
    for (let s = 0; s < 5; s++) {
      const a = (s / 5) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(wx + Math.cos(a) * 1.6, wy + Math.sin(a) * 1.6);
      ctx.lineTo(wx + Math.cos(a) * 4.5, wy + Math.sin(a) * 4.5);
      ctx.stroke();
    }
  }

  // body shell — pearl white with curvature shading
  const bodyGrad = ctx.createLinearGradient(-24, -46, 24, 46);
  if (flash) {
    ctx.fillStyle = "rgba(250,250,250,0.4)";
  } else {
    bodyGrad.addColorStop(0, "#E8E8E8");
    bodyGrad.addColorStop(0.35, "#FAFAFA");
    bodyGrad.addColorStop(0.65, "#F0F0F0");
    bodyGrad.addColorStop(1, "#DCDCDC");
    ctx.fillStyle = bodyGrad;
  }
  roundRect(-24, -46, 48, 92, 14);
  ctx.fill();

  // door character line
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-22, -8);
  ctx.lineTo(22, -8);
  ctx.moveTo(-22, 14);
  ctx.lineTo(22, 14);
  ctx.stroke();

  // side skirts / rocker
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  roundRect(-24, 30, 48, 6, 2);
  ctx.fill();

  // glass canopy (flush glasshouse look)
  const glass = ctx.createLinearGradient(-18, -32, 18, 18);
  glass.addColorStop(0, "#0D1B2A");
  glass.addColorStop(0.3, "#1B2838");
  glass.addColorStop(0.55, "#2C3E50");
  glass.addColorStop(0.8, "#3D5A73");
  glass.addColorStop(1, "#4A6741");
  ctx.fillStyle = glass;
  roundRect(-17.5, -32, 35, 48, 10);
  ctx.fill();
  // A-pillar edges
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1.5;
  roundRect(-17.5, -32, 35, 48, 10);
  ctx.stroke();
  // sky reflection streak
  ctx.fillStyle = "rgba(160,210,255,0.28)";
  roundRect(-14, -28, 10, 36, 5);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  roundRect(4, -28, 8, 18, 3);
  ctx.fill();

  // rear trunk deck
  const deck = ctx.createLinearGradient(0, 16, 0, 40);
  deck.addColorStop(0, "#F5F5F5");
  deck.addColorStop(1, "#E0E0E0");
  ctx.fillStyle = deck;
  roundRect(-16, 16, 32, 24, 5);
  ctx.fill();

  // front hood panel seam
  ctx.strokeStyle = "rgba(0,0,0,0.06)";
  ctx.beginPath();
  ctx.moveTo(-14, -38);
  ctx.lineTo(14, -38);
  ctx.stroke();

  // front continuous light bar (Model 3 / Highland vibe)
  if (G.fsd > 0) {
    ctx.fillStyle = "#00E5FF";
    ctx.shadowColor = "#00E5FF";
    ctx.shadowBlur = 14;
  } else {
    const lg = ctx.createLinearGradient(-18, 0, 18, 0);
    lg.addColorStop(0, "#BBDEFB");
    lg.addColorStop(0.2, "#FFFFFF");
    lg.addColorStop(0.5, "#E3F2FD");
    lg.addColorStop(0.8, "#FFFFFF");
    lg.addColorStop(1, "#BBDEFB");
    ctx.fillStyle = lg;
  }
  roundRect(-18, -44, 36, 5.5, 2.5);
  ctx.fill();
  ctx.shadowBlur = 0;
  // amber marker hints at corners
  if (G.fsd <= 0) {
    ctx.fillStyle = "#FFB74D";
    ctx.fillRect(-18, -43, 4, 3.5);
    ctx.fillRect(14, -43, 4, 3.5);
  }

  // rear continuous red light bar
  const rl = ctx.createLinearGradient(-16, 0, 16, 0);
  rl.addColorStop(0, "#B71C1C");
  rl.addColorStop(0.35, "#FF1744");
  rl.addColorStop(0.65, "#FF1744");
  rl.addColorStop(1, "#B71C1C");
  ctx.fillStyle = rl;
  roundRect(-16, 38, 32, 5, 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.25)";
  ctx.fillRect(-4, 39, 8, 1.5);

  // side mirrors (body-colored + black glass)
  ctx.fillStyle = "#F5F5F5";
  roundRect(-32, -12, 10, 7, 2.5);
  roundRect(22, -12, 10, 7, 2.5);
  ctx.fillStyle = "#263238";
  roundRect(-30, -10, 6, 3.5, 1);
  roundRect(24, -10, 6, 3.5, 1);
  // mirror stalks
  ctx.strokeStyle = "#BDBDBD";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-22, -8); ctx.lineTo(-24, -8);
  ctx.moveTo(22, -8); ctx.lineTo(24, -8);
  ctx.stroke();

  // camera / badge cluster on front
  ctx.fillStyle = "#B0BEC5";
  ctx.beginPath();
  ctx.arc(0, -40, 2, 0, Math.PI * 2);
  ctx.fill();

  // Tesla wordmark-style T
  ctx.fillStyle = "#78909C";
  ctx.font = "bold 13px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("T", 0, -36);
  ctx.textBaseline = "alphabetic";

  // Amazon Flex magnetic sign
  ctx.fillStyle = "#232F3E";
  roundRect(-14, 22, 28, 12, 2.5);
  ctx.fill();
  ctx.strokeStyle = "#FF9900";
  ctx.lineWidth = 1;
  roundRect(-14, 22, 28, 12, 2.5);
  ctx.stroke();
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 8px system-ui";
  ctx.fillText("FLEX", 0, 30.5);

  // subtle body outline
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1.2;
  roundRect(-24, -46, 48, 92, 14);
  ctx.stroke();

  // windshield wiper parking hint
  ctx.strokeStyle = "rgba(0,0,0,0.2)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-6, 12);
  ctx.quadraticCurveTo(0, 8, 8, 12);
  ctx.stroke();

  ctx.restore();

  if (G.fsd > 0) {
    ctx.fillStyle = "rgba(0,176,255,0.95)";
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("FSD " + G.fsd.toFixed(1) + "s", G.carX, CAR_Y + 60);
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / (p.max || 1), 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatText() {
  for (const f of G.floatText) {
    ctx.globalAlpha = clamp(f.life * 1.2, 0, 1);
    ctx.font = `bold ${f.size}px system-ui`;
    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ─── HUD / Screens ──────────────────────────────────────────
function drawHUD() {
  ctx.fillStyle = "rgba(10,22,40,0.75)";
  roundRect(10, 10, W - 20, 52, 12);
  ctx.fill();

  ctx.textAlign = "left";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 12px system-ui";
  ctx.fillText("SCORE", 22, 28);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(String(G.score), 22, 50);

  ctx.textAlign = "center";
  ctx.fillStyle = "#90CAF9";
  ctx.font = "bold 12px system-ui";
  ctx.fillText("TIME", W / 2, 28);
  ctx.fillStyle = G.time < 15 ? "#FF5252" : "#fff";
  ctx.font = "bold 20px system-ui";
  const m = Math.floor(G.time / 60);
  const s = Math.floor(G.time % 60);
  ctx.fillText(`${m}:${s.toString().padStart(2, "0")}`, W / 2, 50);

  ctx.textAlign = "right";
  ctx.fillStyle = "#A5D6A7";
  ctx.font = "bold 12px system-ui";
  ctx.fillText("DROPS", W - 22, 28);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(String(G.deliveries), W - 22, 50);

  // FSD pips
  const pipY = 72;
  for (let i = 0; i < FSD_DELIVERIES; i++) {
    ctx.fillStyle = i < G.fsdReady ? "#00B0FF" : "rgba(255,255,255,0.18)";
    ctx.beginPath();
    ctx.arc(W / 2 - 32 + i * 16, pipY, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.font = "10px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("FSD charge", W / 2, pipY + 15);

  // Easy stretch badge
  if (elapsed() < EASY_SECS) {
    ctx.fillStyle = "rgba(76,175,80,0.85)";
    roundRect(W / 2 - 54, 92, 108, 20, 10);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px system-ui";
    ctx.fillText("EASY STRETCH", W / 2, 106);
  }

  // damage bar
  const bx = 20, by = H - 36, bw = W - 40, bh = 16;
  ctx.fillStyle = "rgba(10,22,40,0.78)";
  roundRect(bx - 4, by - 18, bw + 8, bh + 28, 10);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "left";
  ctx.fillText("VEHICLE INTEGRITY", bx, by - 4);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  roundRect(bx, by, bw, bh, 6);
  ctx.fill();
  const pct = 1 - G.damage / MAX_DAMAGE;
  ctx.fillStyle = pct > 0.5 ? "#66BB6A" : pct > 0.25 ? "#FFA726" : "#EF5350";
  roundRect(bx, by, Math.max(4, bw * pct), bh, 6);
  ctx.fill();

  // first-seconds zone hints
  if (G.time > ROUTE_TIME - 5) {
    ctx.globalAlpha = clamp((G.time - (ROUTE_TIME - 5)) / 5, 0, 0.3);
    ctx.fillStyle = "#00B0FF";
    ctx.fillRect(0, 0, W, H * 0.5);
    ctx.fillStyle = "#FF9900";
    ctx.fillRect(0, H * 0.5, W, H * 0.5);
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("AIM & THROW (top half)", W / 2, H * 0.25);
    ctx.fillText("STEER (bottom half)", W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }

  let my = 118;
  for (const msg of G.messages) {
    ctx.globalAlpha = clamp(msg.life * 2, 0, 0.95);
    ctx.font = "13px system-ui";
    const w = Math.min(W - 36, ctx.measureText(msg.text).width + 24);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    roundRect((W - w) / 2, my, w, 28, 8);
    ctx.fill();
    ctx.fillStyle = "#FFF8E1";
    ctx.textAlign = "center";
    ctx.fillText(msg.text, W / 2, my + 18);
    my += 32;
  }
  ctx.globalAlpha = 1;
}

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(10, 22, 40, 0.9)";
  roundRect(x, y, w, h, 16);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,153,0,0.45)";
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 16);
  ctx.stroke();
}

function drawButton(b) {
  const primary = b.style === "primary";
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (primary) {
    g.addColorStop(0, "#FFB74D");
    g.addColorStop(1, "#FF9900");
  } else {
    g.addColorStop(0, "#37474F");
    g.addColorStop(1, "#263238");
  }
  ctx.fillStyle = g;
  roundRect(b.x, b.y, b.w, b.h, 12);
  ctx.fill();
  ctx.fillStyle = primary ? "#1A1A1A" : "#ECEFF1";
  ctx.font = "bold 16px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textBaseline = "alphabetic";
}

function drawTitle() {
  ctx.fillStyle = "rgba(5,15,30,0.52)";
  ctx.fillRect(0, 0, W, H);

  const prevX = G.carX;
  G.carX = W / 2;
  ctx.save();
  ctx.translate(0, -50);
  drawTesla();
  ctx.restore();
  G.carX = prevX;

  panel(24, 155, W - 48, 370);
  ctx.textAlign = "center";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 13px system-ui";
  ctx.fillText("AMAZON FLEX EDITION", W / 2, 190);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 30px system-ui";
  ctx.fillText("Tesla Paperboy", W / 2, 232);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "13px system-ui";
  ctx.fillText("Florida suburbs · 90-second routes", W / 2, 260);
  ctx.fillText("DROP pads only · Aim lock · SFX · FSD every 3", W / 2, 280);

  const chips = ["📦 Orange DROP pads", "👵 Angry lawn lady", "⚡ FSD every 3 drops", "🔊 Built-in sounds"];
  let cy = 312;
  ctx.font = "12px system-ui";
  for (const c of chips) {
    ctx.fillStyle = "rgba(255,255,255,0.1)";
    roundRect(W / 2 - 105, cy - 14, 210, 26, 8);
    ctx.fill();
    ctx.fillStyle = "#E3F2FD";
    ctx.fillText(c, W / 2, cy + 2);
    cy += 30;
  }

  UI.buttons = [];
  btn("play", W / 2 - 110, 455, 220, 50, "Quick Start", "primary");
  btn("howto", W / 2 - 110, 518, 220, 46, "How to Play", "secondary");
  for (const b of UI.buttons) drawButton(b);

  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.font = "11px system-ui";
  ctx.fillText("Desktop: A/D · Space = nearest DROP · M mutes sound", W / 2, H - 28);
}

function drawHowTo() {
  ctx.fillStyle = "rgba(5,15,30,0.72)";
  ctx.fillRect(0, 0, W, H);
  panel(18, 36, W - 36, H - 92);

  ctx.textAlign = "center";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 22px system-ui";
  ctx.fillText("How to Play", W / 2, 72);

  const lines = [
    ["STEER", "Drag the bottom half (or A/D / arrows)."],
    ["THROW", "Hold top half to aim (ghost arc). Release to throw. Space locks nearest DROP."],
    ["TARGETS", "Only orange DROP pads need packages. Cyan X = best stop."],
    ["ASSIST", "Aim near a pad to LOCK. Hold top half, release to throw."],
    ["CHAOS", "Bean threats for bonus. Miss onto cars/windows = cracks & dings."],
    ["FSD", "Every 3 deliveries: Autopilot ~10s so you can focus on throws."],
    ["LADY", "Speed too much and she runs out filming you on her phone."],
    ["SOUND", "SFX on. Press M to mute."],
  ];
  let y = 100;
  ctx.textAlign = "left";
  for (const [title, body] of lines) {
    ctx.fillStyle = "#00B0FF";
    ctx.font = "bold 12px system-ui";
    ctx.fillText(title, 40, y);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "12px system-ui";
    wrapText(body, 40, y + 16, W - 80, 15);
    y += 58;
  }

  UI.buttons = [];
  btn("play", W / 2 - 110, H - 100, 220, 48, "Start Route", "primary");
  btn("back", W / 2 - 110, H - 48, 220, 36, "Back", "secondary");
  for (const b of UI.buttons) drawButton(b);
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(" ");
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW) {
      ctx.fillText(line, x, y);
      line = w;
      y += lineH;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

function drawGate() {
  ctx.fillStyle = "rgba(5,10,20,0.72)";
  ctx.fillRect(0, 0, W, H);
  panel(24, 150, W - 48, 400);

  ctx.fillStyle = "#455A64";
  ctx.fillRect(50, 170, 16, 80);
  ctx.fillRect(W - 66, 170, 16, 80);
  ctx.fillStyle = "#607D8B";
  for (let i = 0; i < 7; i++) ctx.fillRect(70 + i * 36, 175, 4, 70);
  ctx.fillStyle = "#90A4AE";
  ctx.fillRect(50, 168, W - 100, 10);

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText("GATED COMMUNITY", W / 2, 280);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "13px system-ui";
  ctx.fillText("Which code did the customer text you?", W / 2, 305);
  ctx.fillStyle = "#FF8A65";
  ctx.font = "bold 12px system-ui";
  ctx.fillText(`Time: ${Math.ceil(G.gateTimer)}s`, W / 2, 326);

  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    ctx.fillStyle = "#37474F";
    roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = "#FF9900";
    ctx.lineWidth = 1.5;
    roundRect(bx, by, bw, bh, 10);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px system-ui";
    ctx.fillText(G.gateOptions[i], W / 2, by + 34);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "11px system-ui";
    ctx.fillText(String(i + 1), bx + 18, by + 32);
    by += 68;
  }
}

function drawEnd() {
  ctx.fillStyle = "rgba(5,15,30,0.7)";
  ctx.fillRect(0, 0, W, H);
  panel(24, 100, W - 48, 460);

  ctx.textAlign = "center";
  ctx.fillStyle = G.wrecked ? "#FF5252" : "#FF9900";
  ctx.font = "bold 14px system-ui";
  ctx.fillText(G.wrecked ? "ROUTE FAILED" : "ROUTE COMPLETE", W / 2, 135);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 24px system-ui";
  ctx.fillText(G.wrecked ? "Tesla needs a body shop" : "Flex shift done!", W / 2, 172);

  const rows = [
    ["Score", String(G.score)],
    ["Deliveries", String(G.deliveries)],
    ["Best combo", String(G.bestCombo)],
    ["Pirate justice", String(G.pirateBonus)],
    ["Snacks claimed", String(G.snacks)],
    ["Failed drops", String(G.fails)],
    ["Phone assaults", String(G.ladyHits || 0)],
    ["Threat beans", String(G.threatBeans || 0)],
    ["Vehicle damage", Math.round(G.damage) + "%"],
  ];
  let y = 215;
  for (const [k, v] of rows) {
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "14px system-ui";
    ctx.fillText(k, 56, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px system-ui";
    ctx.fillText(v, W - 56, y);
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(56, y + 10);
    ctx.lineTo(W - 56, y + 10);
    ctx.stroke();
    y += 34;
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "#69F0AE";
  ctx.font = "bold 17px system-ui";
  ctx.fillText("Flex Rating: " + scoreGrade(), W / 2, y + 14);

  UI.buttons = [];
  btn("again", W / 2 - 110, H - 160, 220, 48, "Another Route", "primary");
  btn("menu", W / 2 - 110, H - 100, 220, 42, "Title Screen", "secondary");
  for (const b of UI.buttons) drawButton(b);
}

function scoreGrade() {
  if (G.wrecked) return "DNF";
  const s = G.score;
  if (s >= 2000) return "SSS — Elon would be proud";
  if (s >= 1400) return "S — Peak Flex";
  if (s >= 900) return "A — Solid block";
  if (s >= 500) return "B — Almost on time";
  if (s >= 250) return "C — Metrics under review";
  return "D — Support will call";
}

// ─── Title ambient ──────────────────────────────────────────
function updateTitle(dt) {
  G.scroll += 36 * dt;
  G.roadLines += 36 * dt;
  if (G.houses.length === 0) {
    for (let i = 0; i < 6; i++) spawnHouse(i * 160 - 100);
  }
  for (const h of G.houses) h.y += 36 * dt;
  for (const p of G.props) p.y += 36 * dt;
  G.houses = G.houses.filter(h => h.y < H + 100);
  G.props = G.props.filter(p => p.y < H + 100);
  if (G.houses.length < 5) spawnHouse(-80);
  for (const c of G.clouds) {
    c.x += c.s * dt * 0.18;
    if (c.x > W + 80) c.x = -80;
  }
  for (const b of G.birds) {
    b.x += b.s * dt;
    b.flap += dt * 8;
    if (b.x > W + 30) b.x = -20;
  }
  G.carX = ROAD_CX + Math.sin(now() / 900) * 36;
}

// ─── Main loop ──────────────────────────────────────────────
for (let i = 0; i < 7; i++) {
  G.clouds.push({
    x: rand(-40, W + 40), y: rand(18, 110),
    w: rand(55, 100), s: rand(6, 14), layer: Math.random(),
  });
}
for (let i = 0; i < 3; i++) {
  G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(20, 40), flap: rand(0, 10) });
}
for (let i = 0; i < 5; i++) spawnHouse(i * 165 - 40);
G.carX = ROAD_CX;

function frame(t) {
  const dt = clamp((t - lastT) / 1000, 0, 0.05);
  lastT = t;
  if (state === STATE.TITLE || state === STATE.HOWTO) updateTitle(dt);
  else update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("gesturestart", e => e.preventDefault());
document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

})();
</script>
