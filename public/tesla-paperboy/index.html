<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Tesla Paperboy – Amazon Flex Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1628;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #0a1628 0%, #132a4a 100%);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    background: #87CEEB;
    border-radius: 0;
    box-shadow: 0 0 40px rgba(0,0,0,0.45);
  }
  @media (max-width: 520px) {
    canvas { width: 100%; height: 100%; border-radius: 0; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";

// ─── Canvas / DPR ───────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = 390, H = 700; // logical design size (phone-ish)
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  const cssW = Math.floor(W * scale);
  const cssH = Math.floor(H * scale);
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 100));
resize();

// ─── Utils ──────────────────────────────────────────────────
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const now = () => performance.now();

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ─── Constants ──────────────────────────────────────────────
const ROUTE_TIME = 90;
const ROAD_L = 78, ROAD_R = 312;
const ROAD_CX = (ROAD_L + ROAD_R) / 2;
const ROAD_W = ROAD_R - ROAD_L;
const CAR_Y = 560;
const MAX_DAMAGE = 100;
const FSD_DELIVERIES = 5;
const FSD_DURATION = 8;

// ─── Game State ─────────────────────────────────────────────
const STATE = { TITLE: 0, HOWTO: 1, PLAY: 2, GATE: 3, END: 4 };
let state = STATE.TITLE;

const G = {
  score: 0,
  time: ROUTE_TIME,
  damage: 0,
  deliveries: 0,
  fails: 0,
  snacks: 0,
  pirateBonus: 0,
  scroll: 0,
  speed: 170,
  baseSpeed: 170,
  fsd: 0,
  fsdReady: 0, // deliveries since last FSD
  carX: ROAD_CX,
  carVX: 0,
  steerTarget: null, // touch steer
  throwCD: 0,
  packages: [],
  obstacles: [],
  houses: [],
  props: [], // palm trees, pools, etc
  particles: [],
  floatText: [],
  messages: [],
  clouds: [],
  roadLines: 0,
  spawnT: 0,
  houseSide: 0,
  nextHouseDist: 80,
  nextGateIn: 28,
  gateActive: false,
  gateOptions: [],
  gateCorrect: 0,
  gateTimer: 0,
  invuln: 0,
  shake: 0,
  bgHue: 0,
  snackHouse: null,
  routeNum: 1,
  // stats for end
  bestCombo: 0,
  combo: 0,
};

// Input
const keys = {};
let pointers = new Map();
let touchSteerId = null;
let lastThrowTap = 0;

// ─── Init helpers ───────────────────────────────────────────
function resetGame() {
  Object.assign(G, {
    score: 0, time: ROUTE_TIME, damage: 0, deliveries: 0, fails: 0,
    snacks: 0, pirateBonus: 0, scroll: 0, speed: 170, baseSpeed: 170,
    fsd: 0, fsdReady: 0, carX: ROAD_CX, carVX: 0, steerTarget: null,
    throwCD: 0, packages: [], obstacles: [], houses: [], props: [],
    particles: [], floatText: [], messages: [], roadLines: 0,
    spawnT: 0, houseSide: 0, nextHouseDist: 40, nextGateIn: rand(22, 35),
    gateActive: false, gateOptions: [], gateCorrect: 0, gateTimer: 0,
    invuln: 0, shake: 0, combo: 0, bestCombo: 0, snackHouse: null,
  });
  G.clouds = [];
  for (let i = 0; i < 6; i++) {
    G.clouds.push({
      x: rand(-40, W + 40), y: rand(20, 120),
      w: rand(50, 90), s: rand(8, 18),
    });
  }
  // seed a few houses ahead
  for (let i = 0; i < 5; i++) spawnHouse(-i * 160 - 100);
  spawnMessage("Route started — deliver those packages!", 2.2);
}

function spawnMessage(text, life = 2) {
  G.messages.push({ text, life, max: life });
}

function floatTxt(x, y, text, color = "#fff", size = 16) {
  G.floatText.push({ x, y, text, color, size, life: 1.2, vy: -40 });
}

function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(40, 140);
    G.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.4, 0.9), max: 0.9, r: rand(2, 5), color,
    });
  }
}

// ─── Spawning world ─────────────────────────────────────────
const HOUSE_COLORS = ["#F7C6C7", "#C8E6C9", "#BBDEFB", "#FFF9C4", "#E1BEE7", "#FFE0B2", "#B2DFDB", "#F8BBD0"];
const FAIL_POOL = "pool", FAIL_RING = "ring", FAIL_PIRATE = "pirate", FAIL_DOG = "dog";

function spawnHouse(y) {
  const side = G.houseSide++ % 2; // 0 left, 1 right
  const color = pick(HOUSE_COLORS);
  const hasPool = Math.random() < 0.28;
  const hasRing = Math.random() < 0.45;
  const hasSnack = Math.random() < 0.12;
  const hasPirate = Math.random() < 0.18;
  const hasDog = Math.random() < 0.2;
  const porchX = side === 0 ? ROAD_L - 40 : ROAD_R + 6;
  const house = {
    y, side, color,
    porchX, porchY: 0,
    porchW: 36, porchH: 28,
    roof: pick(["#6D4C41", "#455A64", "#5D4037", "#37474F", "#795548"]),
    delivered: false, glow: 1,
    hasPool, hasRing, hasSnack, hasPirate, hasDog,
    dogState: 0, // 0 idle, 1 chase package, 2 hit car
    poolX: side === 0 ? ROAD_L - 95 : ROAD_R + 95,
    ringHit: false, snackTaken: false, pirateHit: false,
    number: 100 + (G.houses.length * 2 + side),
  };
  G.houses.push(house);

  // palm tree near house
  G.props.push({
    type: "palm",
    x: side === 0 ? rand(18, 48) : rand(W - 48, W - 18),
    y: y - 20,
  });
  if (hasPool) {
    G.props.push({ type: "pool", x: house.poolX, y: y + 10, house });
  }
}

const OB_TYPES = ["cone", "scooter", "car", "ped", "dog"];
function spawnObstacle() {
  if (G.fsd > 0 && Math.random() < 0.55) return; // fewer while FSD (still some for chaos)
  const type = pick(OB_TYPES);
  let x = rand(ROAD_L + 28, ROAD_R - 28);
  // bias away from player a bit
  if (Math.abs(x - G.carX) < 40 && Math.random() < 0.5) {
    x = G.carX < ROAD_CX ? rand(ROAD_CX, ROAD_R - 30) : rand(ROAD_L + 30, ROAD_CX);
  }
  const o = {
    type, x, y: -60,
    w: 28, h: 28,
    vx: 0, rot: 0,
    dead: false, hit: false,
  };
  if (type === "cone") { o.w = 18; o.h = 22; }
  if (type === "scooter") { o.w = 16; o.h = 36; o.vx = pick([-25, 25]); }
  if (type === "car") {
    o.w = 44; o.h = 72;
    o.x = clamp(o.x, ROAD_L + 30, ROAD_R - 30);
    o.color = pick(["#E53935", "#1E88E5", "#43A047", "#FB8C00", "#5E35B1", "#212121"]);
    o.vy = rand(40, 90); // slower relative = oncoming-ish
  }
  if (type === "ped") { o.w = 18; o.h = 30; o.vx = pick([-35, 35]); o.phone = true; }
  if (type === "dog") { o.w = 26; o.h = 16; o.vx = pick([-50, 50]); o.bark = 0; }
  G.obstacles.push(o);
}

// ─── Input ──────────────────────────────────────────────────
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width, scaleY = H / r.height;
  const clientX = e.clientX ?? (e.touches && e.touches[0] && e.touches[0].clientX);
  const clientY = e.clientY ?? (e.touches && e.touches[0] && e.touches[0].clientY);
  return { x: (clientX - r.left) * scaleX, y: (clientY - r.top) * scaleY };
}

function onPointerDown(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = canvasPos(e);
  pointers.set(id, p);

  if (state === STATE.TITLE) {
    // buttons handled in hit test
    handleUIClick(p.x, p.y);
    return;
  }
  if (state === STATE.HOWTO) {
    handleUIClick(p.x, p.y);
    return;
  }
  if (state === STATE.END) {
    handleUIClick(p.x, p.y);
    return;
  }
  if (state === STATE.GATE) {
    handleGateClick(p.x, p.y);
    return;
  }
  if (state === STATE.PLAY) {
    if (p.y >= H * 0.5) {
      // steer zone
      touchSteerId = id;
      G.steerTarget = p.x;
    } else {
      // throw zone
      throwPackage(p.x, p.y);
    }
  }
}

function onPointerMove(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  if (!pointers.has(id) && touchSteerId !== id) return;
  const p = canvasPos(e);
  pointers.set(id, p);
  if (state === STATE.PLAY && id === touchSteerId) {
    G.steerTarget = p.x;
  }
}

function onPointerUp(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  pointers.delete(id);
  if (id === touchSteerId) {
    touchSteerId = null;
    G.steerTarget = null;
  }
}

canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
canvas.addEventListener("pointermove", onPointerMove, { passive: false });
canvas.addEventListener("pointerup", onPointerUp, { passive: false });
canvas.addEventListener("pointercancel", onPointerUp, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (state === STATE.TITLE && (e.code === "Enter" || e.code === "Space")) {
    state = STATE.PLAY; resetGame();
  }
  if (state === STATE.HOWTO && (e.code === "Enter" || e.code === "Space" || e.code === "Escape")) {
    state = STATE.TITLE;
  }
  if (state === STATE.END && (e.code === "Enter" || e.code === "Space")) {
    state = STATE.TITLE;
  }
  if (state === STATE.PLAY && e.code === "Space") {
    throwPackage(G.carX + rand(-20, 20), CAR_Y - 180);
  }
  if (state === STATE.GATE && (e.code === "Digit1" || e.code === "Numpad1")) pickGate(0);
  if (state === STATE.GATE && (e.code === "Digit2" || e.code === "Numpad2")) pickGate(1);
  if (state === STATE.GATE && (e.code === "Digit3" || e.code === "Numpad3")) pickGate(2);
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

// ─── UI hit testing ─────────────────────────────────────────
const UI = { buttons: [] };

function btn(id, x, y, w, h, label, style = "primary") {
  UI.buttons.push({ id, x, y, w, h, label, style });
}

function handleUIClick(x, y) {
  for (const b of UI.buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      onButton(b.id);
      return;
    }
  }
}

function onButton(id) {
  if (id === "play") { state = STATE.PLAY; resetGame(); }
  if (id === "howto") { state = STATE.HOWTO; }
  if (id === "back") { state = STATE.TITLE; }
  if (id === "again") { state = STATE.PLAY; resetGame(); }
  if (id === "menu") { state = STATE.TITLE; }
}

function handleGateClick(x, y) {
  const opts = G.gateOptions;
  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 300;
  for (let i = 0; i < opts.length; i++) {
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) {
      pickGate(i);
      return;
    }
    by += 68;
  }
}

function pickGate(i) {
  if (state !== STATE.GATE) return;
  if (i === G.gateCorrect) {
    G.score += 50;
    floatTxt(W / 2, 280, "GATE OPEN +50", "#4CAF50", 20);
    burst(W / 2, 320, "#4CAF50", 16);
    spawnMessage("Gate code accepted. Welcome, Flexer.", 2);
  } else {
    G.damage = clamp(G.damage + 18, 0, MAX_DAMAGE);
    G.time = Math.max(0, G.time - 3);
    G.shake = 12;
    floatTxt(W / 2, 280, "WRONG CODE! +damage", "#FF5252", 18);
    spawnMessage("Wrong code… HOA is watching. Delay + damage.", 2.5);
  }
  state = STATE.PLAY;
  G.gateActive = false;
  G.nextGateIn = rand(28, 42);
}

// ─── Throwing packages ──────────────────────────────────────
function throwPackage(tx, ty) {
  if (G.throwCD > 0 || state !== STATE.PLAY) return;
  G.throwCD = 0.22;
  const startX = G.carX;
  const startY = CAR_Y - 18;
  // aim toward touch, with max range
  let aimX = tx, aimY = ty;
  const maxDist = 320;
  const d = dist(startX, startY, aimX, aimY);
  if (d > maxDist) {
    const k = maxDist / d;
    aimX = startX + (aimX - startX) * k;
    aimY = startY + (aimY - startY) * k;
  }
  // flight time based on distance
  const flight = clamp(d / 380, 0.35, 0.85);
  G.packages.push({
    x: startX, y: startY,
    sx: startX, sy: startY,
    tx: aimX, ty: aimY,
    t: 0, dur: flight,
    arc: rand(40, 70),
    rot: rand(0, Math.PI),
    vr: rand(-8, 8),
    done: false,
  });
}

// ─── Gate mini-game ─────────────────────────────────────────
function startGate() {
  state = STATE.GATE;
  G.gateActive = true;
  // generate plausible codes
  const correct = String(randi(1000, 9999));
  const opts = new Set([correct]);
  while (opts.size < 3) {
    // near-miss codes
    let c;
    if (Math.random() < 0.6) {
      const digits = correct.split("");
      digits[randi(0, 3)] = String(randi(0, 9));
      c = digits.join("");
    } else {
      c = String(randi(1000, 9999));
    }
    opts.add(c);
  }
  G.gateOptions = [...opts].sort(() => Math.random() - 0.5);
  G.gateCorrect = G.gateOptions.indexOf(correct);
  G.gateTimer = 8;
  spawnMessage("GATED COMMUNITY — pick the code!", 2);
}

// ─── FSD ────────────────────────────────────────────────────
function tryFSD() {
  G.fsdReady++;
  if (G.fsdReady >= FSD_DELIVERIES) {
    G.fsdReady = 0;
    G.fsd = FSD_DURATION;
    spawnMessage("⚡ FSD ENGAGED — Autopilot on! Focus on throws.", 2.8);
    burst(G.carX, CAR_Y, "#00B0FF", 20);
  }
}

// ─── Collision helpers ──────────────────────────────────────
function carHitbox() {
  return { x: G.carX - 22, y: CAR_Y - 48, w: 44, h: 78 };
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function damagePlayer(amt, reason) {
  if (G.invuln > 0 || G.fsd > 0) return false;
  G.damage = clamp(G.damage + amt, 0, MAX_DAMAGE);
  G.invuln = 1.1;
  G.shake = 10;
  G.combo = 0;
  if (reason) spawnMessage(reason, 2);
  if (G.damage >= MAX_DAMAGE) endRoute(true);
  return true;
}

function endRoute(wrecked) {
  state = STATE.END;
  G.wrecked = wrecked;
}

// ─── Update ─────────────────────────────────────────────────
let lastT = now();

function update(dt) {
  // clouds always drift a bit
  for (const c of G.clouds) {
    c.x += c.s * dt * 0.15;
    if (c.x > W + 80) c.x = -80;
  }

  if (state === STATE.TITLE || state === STATE.HOWTO || state === STATE.END) {
    G.scroll += 30 * dt;
    return;
  }

  if (state === STATE.GATE) {
    G.gateTimer -= dt;
    if (G.gateTimer <= 0) {
      // timeout = fail
      G.damage = clamp(G.damage + 15, 0, MAX_DAMAGE);
      G.shake = 10;
      spawnMessage("Gate timeout! Security noted your plate.", 2.2);
      state = STATE.PLAY;
      G.gateActive = false;
      G.nextGateIn = rand(28, 42);
    }
    // still update particles/float for polish
    updateFX(dt);
    return;
  }

  // PLAY
  G.time -= dt;
  if (G.time <= 0) {
    G.time = 0;
    endRoute(false);
    return;
  }

  if (G.invuln > 0) G.invuln -= dt;
  if (G.throwCD > 0) G.throwCD -= dt;
  if (G.shake > 0) G.shake -= dt * 20;

  // FSD
  if (G.fsd > 0) {
    G.fsd -= dt;
    if (G.fsd <= 0) {
      G.fsd = 0;
      spawnMessage("Autopilot disengaged. You're driving again.", 2);
    }
  }

  // Speed scales slightly over route
  G.baseSpeed = 160 + (1 - G.time / ROUTE_TIME) * 55;
  G.speed = G.baseSpeed * (G.fsd > 0 ? 1.12 : 1);

  // Scroll world
  const scrollAmt = G.speed * dt;
  G.scroll += scrollAmt;
  G.roadLines += scrollAmt;

  // Move car
  let inputX = 0;
  if (keys["ArrowLeft"] || keys["KeyA"]) inputX -= 1;
  if (keys["ArrowRight"] || keys["KeyD"]) inputX += 1;

  if (G.fsd > 0) {
    // Autopilot: steer away from nearest threat
    let avoid = 0;
    let best = 1e9;
    for (const o of G.obstacles) {
      if (o.dead || o.y < CAR_Y - 220 || o.y > CAR_Y + 40) continue;
      const dx = o.x - G.carX;
      const dy = Math.abs(o.y - CAR_Y);
      const threat = Math.abs(dx) + dy * 0.35;
      if (threat < best && Math.abs(dx) < 70) {
        best = threat;
        avoid = dx > 0 ? -1 : 1;
      }
    }
    // gentle center bias
    const centerPull = (ROAD_CX - G.carX) * 0.008;
    G.carVX = lerp(G.carVX, avoid * 220 + centerPull * 60, 1 - Math.pow(0.001, dt));
  } else if (G.steerTarget != null) {
    const dx = G.steerTarget - G.carX;
    G.carVX = lerp(G.carVX, clamp(dx * 6, -280, 280), 1 - Math.pow(0.0005, dt));
  } else {
    G.carVX = lerp(G.carVX, inputX * 260, 1 - Math.pow(0.001, dt));
    if (inputX === 0) G.carVX *= Math.pow(0.08, dt);
  }

  G.carX += G.carVX * dt;
  G.carX = clamp(G.carX, ROAD_L + 26, ROAD_R - 26);

  // Scroll entities
  for (const h of G.houses) h.y += scrollAmt;
  for (const p of G.props) p.y += scrollAmt;
  for (const o of G.obstacles) {
    o.y += scrollAmt;
    if (o.type === "car") o.y += (o.vy || 0) * dt;
    o.x += (o.vx || 0) * dt;
    if (o.type === "scooter" || o.type === "ped" || o.type === "dog") {
      if (o.x < ROAD_L + 12 || o.x > ROAD_R - 12) o.vx *= -1;
    }
  }

  // Spawn houses
  G.nextHouseDist -= scrollAmt;
  if (G.nextHouseDist <= 0) {
    spawnHouse(-80);
    G.nextHouseDist = rand(130, 200);
  }

  // Spawn obstacles
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    spawnObstacle();
    G.spawnT = rand(0.55, 1.15) * (G.fsd > 0 ? 1.3 : 1);
  }

  // Gate countdown by distance/time
  G.nextGateIn -= dt;
  if (G.nextGateIn <= 0 && !G.gateActive) {
    startGate();
  }

  // Packages
  for (const pk of G.packages) {
    if (pk.done) continue;
    pk.t += dt;
    const u = clamp(pk.t / pk.dur, 0, 1);
    // ease
    const e = u * u * (3 - 2 * u);
    pk.x = lerp(pk.sx, pk.tx, e);
    // arc: up then down relative to linear path
    const linearY = lerp(pk.sy, pk.ty, e);
    const arcOff = Math.sin(u * Math.PI) * -pk.arc;
    pk.y = linearY + arcOff;
    pk.rot += pk.vr * dt;

    if (u >= 1) {
      pk.done = true;
      resolvePackageLanding(pk);
    }
  }
  G.packages = G.packages.filter(p => !p.done || (p.fade = (p.fade ?? 0.25) - dt) > 0);

  // Package mid-air dog chase near houses
  for (const h of G.houses) {
    if (!h.hasDog || h.delivered) continue;
    const hy = h.y + 20;
    if (hy < -50 || hy > H + 50) continue;
  }

  // Car vs obstacles
  const car = carHitbox();
  for (const o of G.obstacles) {
    if (o.dead || o.hit) continue;
    if (o.y < CAR_Y - 100 || o.y > CAR_Y + 60) continue;
    const ob = { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h };
    if (rectsOverlap(car, ob)) {
      o.hit = true;
      o.dead = true;
      handleObstacleHit(o);
    }
  }

  // Cleanup offscreen
  G.houses = G.houses.filter(h => h.y < H + 120);
  G.props = G.props.filter(p => p.y < H + 120);
  G.obstacles = G.obstacles.filter(o => !o.dead && o.y < H + 100);

  updateFX(dt);

  // Messages
  for (const m of G.messages) m.life -= dt;
  G.messages = G.messages.filter(m => m.life > 0);
}

function updateFX(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const f of G.floatText) {
    f.y += f.vy * dt;
    f.life -= dt;
  }
  G.floatText = G.floatText.filter(f => f.life > 0);
}

function handleObstacleHit(o) {
  if (G.fsd > 0) {
    // auto-dodge flash
    floatTxt(o.x, o.y, "DODGED", "#00B0FF", 14);
    burst(o.x, o.y, "#00B0FF", 8);
    return;
  }
  const table = {
    cone: { dmg: 8, msg: "Traffic cone! Flex van not built for this." },
    scooter: { dmg: 12, msg: "Lime scooter — classic Florida hazard." },
    car: { dmg: 22, msg: "Fender bender with a sunburned sedan!" },
    ped: { dmg: 14, msg: "Distracted walker looking at their phone!" },
    dog: { dmg: 10, msg: "Doggo loves your Tesla… a little too much." },
  };
  const t = table[o.type] || { dmg: 10, msg: "Ouch!" };
  damagePlayer(t.dmg, t.msg);
  burst(o.x, o.y, "#FF7043", 12);
  floatTxt(o.x, o.y - 10, `-${t.dmg} dmg`, "#FF5252", 14);
}

function resolvePackageLanding(pk) {
  // Check porches
  for (const h of G.houses) {
    if (h.delivered) continue;
    const porch = getPorchRect(h);
    if (pk.x > porch.x - 8 && pk.x < porch.x + porch.w + 8 &&
        pk.y > porch.y - 8 && pk.y < porch.y + porch.h + 8) {

      // Porch pirate on porch?
      if (h.hasPirate && !h.pirateHit) {
        h.pirateHit = true;
        h.delivered = true;
        h.glow = 0;
        const bonus = 75;
        G.score += bonus;
        G.pirateBonus++;
        G.deliveries++;
        G.combo++;
        G.bestCombo = Math.max(G.bestCombo, G.combo);
        tryFSD();
        floatTxt(porch.x + 18, porch.y, "PIRATE BONKED! +" + bonus, "#FFD54F", 15);
        burst(pk.x, pk.y, "#FFD54F", 14);
        spawnMessage("Package beaned a porch pirate. Justice + points!", 2.2);
        return;
      }

      // Ring camera near door
      if (h.hasRing && Math.random() < 0.22) {
        h.ringHit = true;
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 15);
        floatTxt(pk.x, pk.y, "HIT RING CAM −15", "#FF8A65", 14);
        burst(pk.x, pk.y, "#90A4AE", 10);
        spawnMessage("You tagged the Ring camera. HOA has footage.", 2.2);
        return;
      }

      // Success
      h.delivered = true;
      h.glow = 0;
      let pts = 100 + G.combo * 10;
      let note = "DELIVERED +" + pts;
      if (h.hasSnack && !h.snackTaken) {
        h.snackTaken = true;
        G.snacks++;
        pts += 40;
        note = "SNACKS! +" + pts;
        spawnMessage("Customer left cold Gatorade & cookies! 🍪", 2);
        burst(pk.x, pk.y, "#FFB74D", 16);
      }
      G.score += pts;
      G.deliveries++;
      G.combo++;
      G.bestCombo = Math.max(G.bestCombo, G.combo);
      tryFSD();
      floatTxt(porch.x + 18, porch.y - 10, note, "#69F0AE", 15);
      burst(pk.x, pk.y, "#FF9900", 12);
      return;
    }

    // Pool
    if (h.hasPool) {
      const pool = { x: h.poolX - 28, y: h.y + 5, w: 56, h: 40 };
      if (pk.x > pool.x && pk.x < pool.x + pool.w && pk.y > pool.y && pk.y < pool.y + pool.h) {
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 25);
        floatTxt(pk.x, pk.y, "SPLASH! Pool drop −25", "#4FC3F7", 14);
        burst(pk.x, pk.y, "#29B6F6", 18);
        spawnMessage("Package went for a swim. Waterproof? Nope.", 2.2);
        return;
      }
    }

    // Dog intercept near yard
    if (h.hasDog) {
      const dogX = h.side === 0 ? h.porchX + 20 : h.porchX - 20;
      const dogY = h.y + 35;
      if (dist(pk.x, pk.y, dogX, dogY) < 36) {
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 10);
        floatTxt(pk.x, pk.y, "DOG GOT IT −10", "#A1887F", 14);
        burst(pk.x, pk.y, "#8D6E63", 10);
        spawnMessage("Good boy intercepted the package. Bad for your metrics.", 2.3);
        // chance dog runs at car
        if (Math.random() < 0.35) {
          G.obstacles.push({
            type: "dog", x: dogX, y: dogY, w: 26, h: 16,
            vx: (G.carX - dogX) * 0.4, dead: false, hit: false, bark: 1,
          });
        }
        return;
      }
    }
  }

  // Miss — road or yard
  if (pk.x > ROAD_L && pk.x < ROAD_R) {
    floatTxt(pk.x, pk.y, "road pizza", "#BDBDBD", 12);
    burst(pk.x, pk.y, "#9E9E9E", 6);
  } else {
    floatTxt(pk.x, pk.y, "missed porch", "#BDBDBD", 12);
    G.combo = 0;
  }
}

function getPorchRect(h) {
  // porch between house and street (toward the road)
  const px = h.porchX != null ? h.porchX : (h.side === 0 ? ROAD_L - 40 : ROAD_R + 6);
  return { x: px, y: h.y + 8, w: 36, h: 30 };
}

// ─── Drawing ────────────────────────────────────────────────
function draw() {
  ctx.save();
  if (G.shake > 0) {
    ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  }

  drawSky();
  drawGround();
  drawRoad();
  drawProps();
  drawHouses();
  drawObstacles();
  drawPackages();
  drawTesla();
  drawParticles();
  drawFloatText();

  ctx.restore();

  // UI overlays (no shake)
  if (state === STATE.TITLE) drawTitle();
  else if (state === STATE.HOWTO) drawHowTo();
  else if (state === STATE.PLAY) drawHUD();
  else if (state === STATE.GATE) { drawHUD(); drawGate(); }
  else if (state === STATE.END) drawEnd();
}

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.45);
  g.addColorStop(0, "#5BA3E0");
  g.addColorStop(0.55, "#87CEEB");
  g.addColorStop(1, "#B8E0F0");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // sun
  ctx.beginPath();
  ctx.arc(W - 55, 55, 28, 0, Math.PI * 2);
  ctx.fillStyle = "#FFE082";
  ctx.fill();
  ctx.beginPath();
  ctx.arc(W - 55, 55, 22, 0, Math.PI * 2);
  ctx.fillStyle = "#FFF59D";
  ctx.fill();

  // clouds
  for (const c of G.clouds) {
    drawCloud(c.x, c.y, c.w);
  }
}

function drawCloud(x, y, w) {
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.5, w * 0.22, 0, 0, Math.PI * 2);
  ctx.ellipse(x - w * 0.25, y + 4, w * 0.28, w * 0.16, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.22, y + 2, w * 0.3, w * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawGround() {
  // grass / yards
  ctx.fillStyle = "#7CB342";
  ctx.fillRect(0, 0, ROAD_L, H);
  ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);
  // lighter grass strips
  ctx.fillStyle = "#8BC34A";
  ctx.fillRect(ROAD_L - 18, 0, 18, H);
  ctx.fillRect(ROAD_R, 0, 18, H);
  // sandier Florida dirt near curb
  ctx.fillStyle = "#C4A574";
  ctx.fillRect(ROAD_L - 6, 0, 6, H);
  ctx.fillRect(ROAD_R, 0, 6, H);
}

function drawRoad() {
  ctx.fillStyle = "#546E7A";
  ctx.fillRect(ROAD_L, 0, ROAD_W, H);
  // asphalt noise bands
  ctx.fillStyle = "#607D8B";
  for (let i = 0; i < 8; i++) {
    const yy = ((i * 90 + G.scroll * 0.3) % (H + 90)) - 45;
    ctx.globalAlpha = 0.15;
    ctx.fillRect(ROAD_L, yy, ROAD_W, 40);
  }
  ctx.globalAlpha = 1;

  // lane dashes
  ctx.strokeStyle = "#FFEE58";
  ctx.lineWidth = 3;
  ctx.setLineDash([18, 22]);
  ctx.lineDashOffset = -G.roadLines * 0.9;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX, 0);
  ctx.lineTo(ROAD_CX, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // edge lines
  ctx.strokeStyle = "#ECEFF1";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 3, 0); ctx.lineTo(ROAD_L + 3, H);
  ctx.moveTo(ROAD_R - 3, 0); ctx.lineTo(ROAD_R - 3, H);
  ctx.stroke();
}

function drawProps() {
  for (const p of G.props) {
    if (p.y < -80 || p.y > H + 80) continue;
    if (p.type === "palm") drawPalm(p.x, p.y);
    if (p.type === "pool") drawPool(p.x, p.y);
  }
}

function drawPalm(x, y) {
  // trunk
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y + 30);
  ctx.quadraticCurveTo(x + 6, y, x - 2, y - 40);
  ctx.stroke();
  // fronds
  ctx.strokeStyle = "#2E7D32";
  ctx.lineWidth = 4;
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i - 2) * 0.45;
    ctx.beginPath();
    ctx.moveTo(x - 2, y - 40);
    ctx.quadraticCurveTo(
      x - 2 + Math.cos(a) * 20,
      y - 40 + Math.sin(a) * 10 - 10,
      x - 2 + Math.cos(a) * 38,
      y - 40 + Math.sin(a) * 28
    );
    ctx.stroke();
  }
  ctx.lineCap = "butt";
}

function drawPool(x, y) {
  ctx.fillStyle = "#4DD0E1";
  roundRect(x - 30, y, 60, 42, 12);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  roundRect(x - 22, y + 6, 30, 12, 6);
  ctx.fill();
  ctx.strokeStyle = "#26A69A";
  ctx.lineWidth = 3;
  roundRect(x - 30, y, 60, 42, 12);
  ctx.stroke();
}

function drawHouses() {
  for (const h of G.houses) {
    if (h.y < -120 || h.y > H + 80) continue;
    drawHouse(h);
  }
}

function drawHouse(h) {
  const facingRight = h.side === 0; // house on left faces road (right)
  const baseX = h.side === 0 ? 8 : ROAD_R + 12;
  const hw = 62, hh = 70;
  const hx = baseX;
  const hy = h.y - 20;

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(hx + hw / 2, hy + hh + 8, hw * 0.45, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // body
  ctx.fillStyle = h.color;
  roundRect(hx, hy, hw, hh, 4);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  ctx.lineWidth = 1.5;
  roundRect(hx, hy, hw, hh, 4);
  ctx.stroke();

  // roof
  ctx.fillStyle = h.roof || "#5D4037";
  ctx.beginPath();
  ctx.moveTo(hx - 4, hy + 8);
  ctx.lineTo(hx + hw / 2, hy - 22);
  ctx.lineTo(hx + hw + 4, hy + 8);
  ctx.closePath();
  ctx.fill();

  // door
  const doorX = facingRight ? hx + hw - 22 : hx + 8;
  ctx.fillStyle = "#5D4037";
  roundRect(doorX, hy + 28, 16, 30, 2);
  ctx.fill();
  // door window
  ctx.fillStyle = "#BBDEFB";
  ctx.fillRect(doorX + 3, hy + 32, 10, 8);

  // Ring camera
  if (h.hasRing) {
    ctx.fillStyle = h.ringHit ? "#FF5252" : "#37474F";
    ctx.beginPath();
    ctx.arc(doorX + 8, hy + 24, 4, 0, Math.PI * 2);
    ctx.fill();
    if (!h.ringHit) {
      ctx.fillStyle = "#69F0AE";
      ctx.beginPath();
      ctx.arc(doorX + 8, hy + 24, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // windows
  ctx.fillStyle = "#E3F2FD";
  const wx = facingRight ? hx + 8 : hx + hw - 28;
  roundRect(wx, hy + 18, 20, 16, 2);
  ctx.fill();
  ctx.strokeStyle = "#90CAF9";
  ctx.strokeRect(wx + 0.5, hy + 18.5, 19, 15);

  // house number
  ctx.fillStyle = "#37474F";
  ctx.font = "bold 10px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(String(h.number), hx + hw / 2, hy + hh - 6);

  // porch pad
  const porch = getPorchRect(h);
  ctx.fillStyle = "#BCAAA4";
  roundRect(porch.x, porch.y, porch.w, porch.h, 3);
  ctx.fill();

  // glowing Amazon target
  if (!h.delivered) {
    const gx = porch.x + porch.w / 2;
    const gy = porch.y + porch.h / 2;
    const pulse = 0.65 + Math.sin(now() / 200 + h.number) * 0.35;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.shadowColor = "#FF9900";
    ctx.shadowBlur = 14;
    // package icon
    ctx.fillStyle = "#FF9900";
    roundRect(gx - 10, gy - 9, 20, 16, 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#232F3E";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(gx, gy - 9); ctx.lineTo(gx, gy + 7);
    ctx.moveTo(gx - 10, gy - 1); ctx.lineTo(gx + 10, gy - 1);
    ctx.stroke();
    // smile arrow
    ctx.strokeStyle = "#232F3E";
    ctx.beginPath();
    ctx.arc(gx, gy + 1, 5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.restore();
  } else {
    // delivered box
    ctx.fillStyle = "#FF9900";
    roundRect(porch.x + 8, porch.y + 8, 18, 14, 2);
    ctx.fill();
    ctx.fillStyle = "#232F3E";
    ctx.font = "bold 9px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("✓", porch.x + 17, porch.y + 18);
  }

  // snack cooler
  if (h.hasSnack && !h.snackTaken && !h.delivered) {
    ctx.fillStyle = "#EF5350";
    roundRect(porch.x + (h.side === 0 ? -14 : porch.w + 2), porch.y + 6, 12, 14, 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "8px system-ui";
    ctx.fillText("🍪", porch.x + (h.side === 0 ? -8 : porch.w + 8), porch.y + 16);
  }

  // porch pirate
  if (h.hasPirate && !h.pirateHit && !h.delivered) {
    const px = porch.x + (h.side === 0 ? porch.w + 6 : -14);
    const py = porch.y + 4;
    // hoodie figure crouching
    ctx.fillStyle = "#424242";
    ctx.beginPath();
    ctx.ellipse(px + 6, py + 16, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 6, py + 6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#212121";
    ctx.fillRect(px + 1, py + 2, 10, 4); // hood shadow
  }

  // yard dog
  if (h.hasDog && !h.delivered) {
    const dx = h.side === 0 ? h.porchX + 18 : h.porchX - 18;
    const dy = h.y + 38;
    drawDog(dx, dy, h.side === 0 ? 1 : -1);
  }
}

function drawDog(x, y, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(dir, 1);
  ctx.fillStyle = "#A1887F";
  roundRect(-10, -6, 20, 10, 4);
  ctx.fill();
  // head
  ctx.beginPath();
  ctx.ellipse(10, -4, 6, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // ear
  ctx.fillStyle = "#8D6E63";
  ctx.beginPath();
  ctx.ellipse(8, -9, 3, 4, -0.3, 0, Math.PI * 2);
  ctx.fill();
  // tail
  ctx.strokeStyle = "#A1887F";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-10, -2);
  ctx.quadraticCurveTo(-16, -10, -12, -12);
  ctx.stroke();
  // legs
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(-7, 2, 3, 5);
  ctx.fillRect(2, 2, 3, 5);
  ctx.restore();
}

function drawObstacles() {
  for (const o of G.obstacles) {
    if (o.y < -80 || o.y > H + 80) continue;
    if (o.type === "cone") drawCone(o.x, o.y);
    else if (o.type === "scooter") drawScooter(o.x, o.y);
    else if (o.type === "car") drawOtherCar(o);
    else if (o.type === "ped") drawPed(o.x, o.y);
    else if (o.type === "dog") drawDog(o.x, o.y, o.vx >= 0 ? 1 : -1);
  }
}

function drawCone(x, y) {
  ctx.fillStyle = "#FF6D00";
  ctx.beginPath();
  ctx.moveTo(x, y - 16);
  ctx.lineTo(x + 10, y + 8);
  ctx.lineTo(x - 10, y + 8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = "#FFF";
  ctx.fillRect(x - 6, y - 2, 12, 4);
  ctx.fillStyle = "#FF6D00";
  ctx.fillRect(x - 11, y + 8, 22, 4);
}

function drawScooter(x, y) {
  ctx.strokeStyle = "#00ACC1";
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x, y + 14);
  ctx.lineTo(x, y - 10);
  ctx.lineTo(x + 8, y - 16);
  ctx.stroke();
  // deck
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x - 2, y + 10);
  ctx.lineTo(x + 2, y + 10);
  ctx.stroke();
  // wheels
  ctx.fillStyle = "#263238";
  ctx.beginPath();
  ctx.arc(x, y + 16, 4, 0, Math.PI * 2);
  ctx.arc(x, y - 4, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineCap = "butt";
}

function drawOtherCar(o) {
  const x = o.x, y = o.y, w = o.w, h = o.h;
  ctx.save();
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(x, y + h * 0.4, w * 0.45, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  // body
  ctx.fillStyle = o.color;
  roundRect(x - w / 2, y - h / 2, w, h, 8);
  ctx.fill();
  // cabin
  ctx.fillStyle = "rgba(30,40,50,0.75)";
  roundRect(x - w / 2 + 6, y - h / 2 + 12, w - 12, h * 0.35, 4);
  ctx.fill();
  // lights
  ctx.fillStyle = "#FFECB3";
  roundRect(x - w / 2 + 4, y + h / 2 - 10, 10, 5, 2);
  ctx.fill();
  roundRect(x + w / 2 - 14, y + h / 2 - 10, 10, 5, 2);
  ctx.fill();
  ctx.restore();
}

function drawPed(x, y) {
  // body
  ctx.fillStyle = "#42A5F5";
  roundRect(x - 7, y - 4, 14, 16, 3);
  ctx.fill();
  // head
  ctx.fillStyle = "#FFCC80";
  ctx.beginPath();
  ctx.arc(x, y - 10, 7, 0, Math.PI * 2);
  ctx.fill();
  // phone
  ctx.fillStyle = "#212121";
  roundRect(x + 6, y - 8, 5, 8, 1);
  ctx.fill();
  ctx.fillStyle = "#81D4FA";
  ctx.fillRect(x + 7, y - 6, 3, 4);
  // legs
  ctx.fillStyle = "#37474F";
  ctx.fillRect(x - 5, y + 12, 4, 10);
  ctx.fillRect(x + 1, y + 12, 4, 10);
}

function drawPackages() {
  for (const pk of G.packages) {
    ctx.save();
    ctx.translate(pk.x, pk.y);
    ctx.rotate(pk.rot);
    const s = 1 + Math.sin(clamp(pk.t / pk.dur, 0, 1) * Math.PI) * 0.15;
    ctx.scale(s, s);
    // box
    ctx.fillStyle = "#FF9900";
    roundRect(-9, -7, 18, 14, 2);
    ctx.fill();
    ctx.strokeStyle = "#232F3E";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, -7); ctx.lineTo(0, 7);
    ctx.moveTo(-9, 0); ctx.lineTo(9, 0);
    ctx.stroke();
    // tape smile
    ctx.beginPath();
    ctx.arc(0, 1, 4, 0.2 * Math.PI, 0.8 * Math.PI);
    ctx.stroke();
    // shadow under (screen space-ish)
    ctx.restore();
    // ground shadow projection
    const u = clamp(pk.t / pk.dur, 0, 1);
    const shadowY = lerp(pk.sy, pk.ty, u * u * (3 - 2 * u));
    ctx.fillStyle = `rgba(0,0,0,${0.15 + u * 0.15})`;
    ctx.beginPath();
    ctx.ellipse(pk.x, shadowY + 10, 8 * (1 - Math.sin(u * Math.PI) * 0.3), 3, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTesla() {
  const x = G.carX, y = CAR_Y;
  ctx.save();
  ctx.translate(x, y);
  // slight lean into turn
  const lean = clamp(G.carVX / 400, -0.12, 0.12);
  ctx.rotate(lean);

  // FSD glow
  if (G.fsd > 0) {
    ctx.shadowColor = "#00B0FF";
    ctx.shadowBlur = 22 + Math.sin(now() / 100) * 6;
    ctx.fillStyle = "rgba(0,176,255,0.2)";
    ctx.beginPath();
    ctx.ellipse(0, 5, 36, 52, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // car shadow
  ctx.shadowBlur = 0;
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath();
  ctx.ellipse(2, 42, 24, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── Tesla Model 3 top-down / rear-ish ──
  // wheels
  ctx.fillStyle = "#1A1A1A";
  roundRect(-24, -28, 10, 18, 3); // FL
  roundRect(14, -28, 10, 18, 3);  // FR
  roundRect(-24, 18, 10, 18, 3);  // RL
  roundRect(14, 18, 10, 18, 3);   // RR
  // wheel rims
  ctx.fillStyle = "#90A4AE";
  ctx.fillRect(-21, -23, 4, 8);
  ctx.fillRect(17, -23, 4, 8);
  ctx.fillRect(-21, 23, 4, 8);
  ctx.fillRect(17, 23, 4, 8);

  // body white
  ctx.fillStyle = G.invuln > 0 && Math.floor(now() / 80) % 2 ? "rgba(255,255,255,0.5)" : "#F5F5F5";
  roundRect(-22, -42, 44, 84, 12);
  ctx.fill();
  // subtle body shading
  ctx.fillStyle = "rgba(0,0,0,0.06)";
  roundRect(-22, -42, 10, 84, 12);
  ctx.fill();

  // dark glass canopy
  ctx.fillStyle = "#263238";
  roundRect(-16, -28, 32, 42, 8);
  ctx.fill();
  // glass highlight
  ctx.fillStyle = "rgba(144,202,249,0.25)";
  roundRect(-14, -26, 12, 36, 6);
  ctx.fill();

  // roof spine / rear deck
  ctx.fillStyle = "#EEEEEE";
  roundRect(-14, 14, 28, 22, 4);
  ctx.fill();

  // continuous light bar (front, toward top of screen = front of car going up road)
  // In Paperboy view car faces "up" the road (away from player? classic is toward bottom scrolling toward player)
  // Street scrolls toward player → car drives "into" the street, nose toward top.
  const lightGrad = ctx.createLinearGradient(-16, -40, 16, -40);
  lightGrad.addColorStop(0, "#E3F2FD");
  lightGrad.addColorStop(0.5, "#FFFFFF");
  lightGrad.addColorStop(1, "#E3F2FD");
  ctx.fillStyle = lightGrad;
  roundRect(-16, -40, 32, 5, 2);
  ctx.fill();
  if (G.fsd > 0) {
    ctx.fillStyle = "#00E5FF";
    roundRect(-16, -40, 32, 5, 2);
    ctx.fill();
  }

  // rear red light bar
  ctx.fillStyle = "#E53935";
  roundRect(-14, 34, 28, 4, 2);
  ctx.fill();

  // side mirrors
  ctx.fillStyle = "#ECEFF1";
  roundRect(-28, -8, 8, 5, 2);
  roundRect(20, -8, 8, 5, 2);
  ctx.fillStyle = "#37474F";
  ctx.fillRect(-26, -7, 4, 3);
  ctx.fillRect(22, -7, 4, 3);

  // Tesla logo (T) on hood
  ctx.fillStyle = "#B0BEC5";
  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("T", 0, -34);

  // front plate-ish Amazon Flex badge
  ctx.fillStyle = "#232F3E";
  roundRect(-12, 22, 24, 10, 2);
  ctx.fill();
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 7px system-ui";
  ctx.fillText("FLEX", 0, 27);

  ctx.restore();

  // FSD label
  if (G.fsd > 0) {
    ctx.fillStyle = "rgba(0,176,255,0.9)";
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("FSD " + G.fsd.toFixed(1) + "s", G.carX, CAR_Y + 58);
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / (p.max || 1), 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloatText() {
  for (const f of G.floatText) {
    ctx.globalAlpha = clamp(f.life * 1.2, 0, 1);
    ctx.font = `bold ${f.size}px system-ui`;
    ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.45)";
    ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

// ─── HUD / Screens ──────────────────────────────────────────
function drawHUD() {
  // top bar
  ctx.fillStyle = "rgba(10,22,40,0.72)";
  roundRect(10, 10, W - 20, 52, 12);
  ctx.fill();

  ctx.textAlign = "left";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 13px system-ui";
  ctx.fillText("SCORE", 22, 28);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(String(G.score), 22, 50);

  ctx.textAlign = "center";
  ctx.fillStyle = "#90CAF9";
  ctx.font = "bold 13px system-ui";
  ctx.fillText("TIME", W / 2, 28);
  ctx.fillStyle = G.time < 15 ? "#FF5252" : "#fff";
  ctx.font = "bold 20px system-ui";
  const m = Math.floor(G.time / 60);
  const s = Math.floor(G.time % 60);
  ctx.fillText(`${m}:${s.toString().padStart(2, "0")}`, W / 2, 50);

  ctx.textAlign = "right";
  ctx.fillStyle = "#A5D6A7";
  ctx.font = "bold 13px system-ui";
  ctx.fillText("DROPS", W - 22, 28);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText(String(G.deliveries), W - 22, 50);

  // FSD charge pips
  const pipY = 70;
  for (let i = 0; i < FSD_DELIVERIES; i++) {
    ctx.fillStyle = i < G.fsdReady ? "#00B0FF" : "rgba(255,255,255,0.2)";
    ctx.beginPath();
    ctx.arc(W / 2 - 32 + i * 16, pipY, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = "10px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("FSD charge", W / 2, pipY + 16);

  // damage bar bottom
  const bx = 20, by = H - 36, bw = W - 40, bh = 16;
  ctx.fillStyle = "rgba(10,22,40,0.75)";
  roundRect(bx - 4, by - 18, bw + 8, bh + 28, 10);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.6)";
  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "left";
  ctx.fillText("VEHICLE INTEGRITY", bx, by - 4);
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  roundRect(bx, by, bw, bh, 6);
  ctx.fill();
  const pct = 1 - G.damage / MAX_DAMAGE;
  const barColor = pct > 0.5 ? "#66BB6A" : pct > 0.25 ? "#FFA726" : "#EF5350";
  ctx.fillStyle = barColor;
  roundRect(bx, by, Math.max(4, bw * pct), bh, 6);
  ctx.fill();

  // touch zones hint (subtle)
  if (G.time > ROUTE_TIME - 4) {
    ctx.globalAlpha = clamp((G.time - (ROUTE_TIME - 4)) / 4, 0, 0.35);
    ctx.fillStyle = "#00B0FF";
    ctx.fillRect(0, 0, W, H * 0.5);
    ctx.fillStyle = "#FF9900";
    ctx.fillRect(0, H * 0.5, W, H * 0.5);
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = "#fff";
    ctx.font = "bold 14px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("TAP TOP = THROW", W / 2, H * 0.25);
    ctx.fillText("DRAG BOTTOM = STEER", W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }

  // messages
  let my = 100;
  for (const m of G.messages) {
    ctx.globalAlpha = clamp(m.life * 2, 0, 0.95);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    const tw = ctx.measureText(m.text).width;
    // measure with font
    ctx.font = "13px system-ui";
    const w = Math.min(W - 40, ctx.measureText(m.text).width + 24);
    roundRect((W - w) / 2, my, w, 28, 8);
    ctx.fill();
    ctx.fillStyle = "#FFF8E1";
    ctx.textAlign = "center";
    ctx.fillText(m.text, W / 2, my + 18);
    my += 32;
  }
  ctx.globalAlpha = 1;
}

function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(10, 22, 40, 0.88)";
  roundRect(x, y, w, h, 16);
  ctx.fill();
  ctx.strokeStyle = "rgba(255,153,0,0.45)";
  ctx.lineWidth = 2;
  roundRect(x, y, w, h, 16);
  ctx.stroke();
}

function drawButton(b) {
  const primary = b.style === "primary";
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (primary) {
    g.addColorStop(0, "#FFB74D");
    g.addColorStop(1, "#FF9900");
  } else {
    g.addColorStop(0, "#37474F");
    g.addColorStop(1, "#263238");
  }
  ctx.fillStyle = g;
  roundRect(b.x, b.y, b.w, b.h, 12);
  ctx.fill();
  ctx.fillStyle = primary ? "#1A1A1A" : "#ECEFF1";
  ctx.font = "bold 16px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textBaseline = "alphabetic";
}

function drawTitle() {
  // animated bg road already drawing underneath — dim it
  ctx.fillStyle = "rgba(5,15,30,0.55)";
  ctx.fillRect(0, 0, W, H);

  // mini tesla decoration
  const prevX = G.carX;
  G.carX = W / 2;
  ctx.save();
  ctx.translate(0, -40);
  drawTesla();
  ctx.restore();
  G.carX = prevX;

  panel(24, 160, W - 48, 360);

  ctx.textAlign = "center";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 14px system-ui";
  ctx.fillText("AMAZON FLEX EDITION", W / 2, 195);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 32px system-ui";
  ctx.fillText("Tesla Paperboy", W / 2, 240);

  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "14px system-ui";
  ctx.fillText("Florida suburbs. 90-second routes.", W / 2, 270);
  ctx.fillText("Throw packages. Dodge chaos. Hit porches.", W / 2, 292);

  // feature chips
  const chips = ["📦 Porch drops", "⚡ FSD autopilot", "🚪 Gate codes", "🍪 Snack bonuses"];
  ctx.font = "12px system-ui";
  let cy = 325;
  for (const c of chips) {
    ctx.fillStyle = "rgba(255,255,255,0.12)";
    roundRect(W / 2 - 100, cy - 14, 200, 26, 8);
    ctx.fill();
    ctx.fillStyle = "#E3F2FD";
    ctx.fillText(c, W / 2, cy + 2);
    cy += 32;
  }

  UI.buttons = [];
  btn("play", W / 2 - 110, 460, 220, 50, "Quick Start", "primary");
  btn("howto", W / 2 - 110, 522, 220, 46, "How to Play", "secondary");
  for (const b of UI.buttons) drawButton(b);

  ctx.fillStyle = "rgba(255,255,255,0.4)";
  ctx.font = "11px system-ui";
  ctx.fillText("Desktop: A/D or ←/→  ·  Space to throw", W / 2, H - 28);
}

function drawHowTo() {
  ctx.fillStyle = "rgba(5,15,30,0.72)";
  ctx.fillRect(0, 0, W, H);
  panel(18, 40, W - 36, H - 100);

  ctx.textAlign = "center";
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 22px system-ui";
  ctx.fillText("How to Play", W / 2, 78);

  const lines = [
    ["STEER", "Drag on the bottom half of the screen (or A/D / arrows)."],
    ["THROW", "Tap the top half to lob an Amazon package (or Space)."],
    ["DELIVER", "Hit the glowing orange porch targets for points."],
    ["FSD", "Every 5 deliveries: Autopilot ~8s — car dodges for you."],
    ["GATES", "Pick the correct 4-digit gate code. Wrong = delay + damage."],
    ["CHAOS", "Avoid cones, scooters, cars, phone-zombies & dogs."],
    ["BONUS", "Bean porch pirates. Grab snack coolers. Don't hit pools/Rings."],
  ];

  let y = 110;
  ctx.textAlign = "left";
  for (const [title, body] of lines) {
    ctx.fillStyle = "#00B0FF";
    ctx.font = "bold 13px system-ui";
    ctx.fillText(title, 40, y);
    ctx.fillStyle = "rgba(255,255,255,0.85)";
    ctx.font = "12px system-ui";
    wrapText(body, 40, y + 18, W - 80, 16);
    y += 62;
  }

  UI.buttons = [];
  btn("play", W / 2 - 110, H - 100, 220, 48, "Start Route", "primary");
  btn("back", W / 2 - 110, H - 48, 220, 36, "Back", "secondary");
  for (const b of UI.buttons) drawButton(b);
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(" ");
  let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW) {
      ctx.fillText(line, x, y);
      line = w;
      y += lineH;
    } else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

function drawGate() {
  ctx.fillStyle = "rgba(5,10,20,0.72)";
  ctx.fillRect(0, 0, W, H);

  panel(24, 150, W - 48, 380);

  // gate graphic
  ctx.fillStyle = "#455A64";
  ctx.fillRect(50, 170, 16, 80);
  ctx.fillRect(W - 66, 170, 16, 80);
  ctx.fillStyle = "#607D8B";
  for (let i = 0; i < 7; i++) {
    ctx.fillRect(70 + i * 36, 175, 4, 70);
  }
  ctx.fillStyle = "#90A4AE";
  ctx.fillRect(50, 168, W - 100, 10);

  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.font = "bold 20px system-ui";
  ctx.fillText("GATED COMMUNITY", W / 2, 270);
  ctx.fillStyle = "rgba(255,255,255,0.7)";
  ctx.font = "13px system-ui";
  ctx.fillText("Which code did the customer text you?", W / 2, 295);
  ctx.fillStyle = "#FF8A65";
  ctx.font = "bold 12px system-ui";
  ctx.fillText(`Time: ${Math.ceil(G.gateTimer)}s`, W / 2, 318);

  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    const g = ctx.createLinearGradient(bx, by, bx, by + bh);
    g.addColorStop(0, "#455A64");
    g.addColorStop(1, "#37474F");
    ctx.fillStyle = g;
    roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.strokeStyle = "#FF9900";
    ctx.lineWidth = 1.5;
    roundRect(bx, by, bw, bh, 10);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px system-ui, monospace";
    ctx.textAlign = "center";
    ctx.fillText(G.gateOptions[i], W / 2, by + 34);
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "11px system-ui";
    ctx.fillText((i + 1).toString(), bx + 18, by + 32);
    by += 68;
  }
}

function drawEnd() {
  ctx.fillStyle = "rgba(5,15,30,0.7)";
  ctx.fillRect(0, 0, W, H);
  panel(24, 100, W - 48, 460);

  ctx.textAlign = "center";
  ctx.fillStyle = G.wrecked ? "#FF5252" : "#FF9900";
  ctx.font = "bold 14px system-ui";
  ctx.fillText(G.wrecked ? "ROUTE FAILED" : "ROUTE COMPLETE", W / 2, 135);

  ctx.fillStyle = "#fff";
  ctx.font = "bold 26px system-ui";
  ctx.fillText(G.wrecked ? "Tesla needs a body shop" : "Flex shift done!", W / 2, 175);

  const rows = [
    ["Score", String(G.score)],
    ["Deliveries", String(G.deliveries)],
    ["Best combo", String(G.bestCombo)],
    ["Pirate justice", String(G.pirateBonus)],
    ["Snacks claimed", String(G.snacks)],
    ["Failed drops", String(G.fails)],
    ["Vehicle damage", Math.round(G.damage) + "%"],
  ];

  let y = 220;
  for (const [k, v] of rows) {
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "14px system-ui";
    ctx.fillText(k, 56, y);
    ctx.textAlign = "right";
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px system-ui";
    ctx.fillText(v, W - 56, y);
    // divider
    ctx.strokeStyle = "rgba(255,255,255,0.08)";
    ctx.beginPath();
    ctx.moveTo(56, y + 10);
    ctx.lineTo(W - 56, y + 10);
    ctx.stroke();
    y += 34;
  }

  // grade
  const grade = scoreGrade();
  ctx.textAlign = "center";
  ctx.fillStyle = "#69F0AE";
  ctx.font = "bold 18px system-ui";
  ctx.fillText("Flex Rating: " + grade, W / 2, y + 16);

  UI.buttons = [];
  btn("again", W / 2 - 110, H - 160, 220, 48, "Another Route", "primary");
  btn("menu", W / 2 - 110, H - 100, 220, 42, "Title Screen", "secondary");
  for (const b of UI.buttons) drawButton(b);
}

function scoreGrade() {
  if (G.wrecked) return "DNF";
  const s = G.score;
  if (s >= 2000) return "SSS — Elon would be proud";
  if (s >= 1400) return "S — Peak Flex";
  if (s >= 900) return "A — Solid block";
  if (s >= 500) return "B — Almost on time";
  if (s >= 250) return "C — Metrics under review";
  return "D — Support will call";
}

// ─── Title ambient motion ───────────────────────────────────
function updateTitle(dt) {
  G.scroll += 40 * dt;
  G.roadLines += 40 * dt;
  // keep a few houses scrolling for ambiance
  if (G.houses.length === 0) {
    for (let i = 0; i < 6; i++) spawnHouse(i * 150 - 100);
  }
  for (const h of G.houses) h.y += 40 * dt;
  for (const p of G.props) p.y += 40 * dt;
  G.houses = G.houses.filter(h => h.y < H + 100);
  G.props = G.props.filter(p => p.y < H + 100);
  if (G.houses.length < 5) spawnHouse(-80);
  for (const c of G.clouds) {
    c.x += c.s * dt * 0.2;
    if (c.x > W + 80) c.x = -80;
  }
  G.carX = ROAD_CX + Math.sin(now() / 900) * 40;
}

// ─── Main loop ──────────────────────────────────────────────
// seed title world
for (let i = 0; i < 6; i++) {
  G.clouds.push({ x: rand(-40, W + 40), y: rand(20, 120), w: rand(50, 90), s: rand(8, 18) });
}
for (let i = 0; i < 5; i++) spawnHouse(i * 160 - 50);
G.carX = ROAD_CX;

function frame(t) {
  const dt = clamp((t - lastT) / 1000, 0, 0.05);
  lastT = t;

  if (state === STATE.TITLE || state === STATE.HOWTO) updateTitle(dt);
  else update(dt);

  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Prevent iOS bounce / pinch
document.addEventListener("gesturestart", e => e.preventDefault());
document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });

})();
</script>
