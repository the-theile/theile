  ctx.beginPath(); ctx.ellipse(9, -10, 3.2, 4.5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawLady(o) {
  const run = Math.sin(o.wave || 0) * 4;
  const phoneA = Math.sin((o.wave || 0) * 1.3) * 0.4;
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.phase === "chase") {
    ctx.globalAlpha = 0.22 + Math.sin(now() / 80) * 0.1;
    ctx.fillStyle = "#F48FB1"; ctx.beginPath(); ctx.arc(0, -4, 22, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#F5F5F5";
  ctx.fillRect(-6, 8 + run * 0.3, 5, 12); ctx.fillRect(1, 8 - run * 0.3, 5, 12);
  ctx.fillStyle = "#EC407A";
  ctx.fillRect(-7, 18 + run * 0.3, 7, 3); ctx.fillRect(1, 18 - run * 0.3, 7, 3);
  const robe = ctx.createLinearGradient(-12, -10, 12, 14);
  robe.addColorStop(0, "#CE93D8"); robe.addColorStop(1, "#8E24AA");
  ctx.fillStyle = robe; roundRect(-11, -8, 22, 22, 6); ctx.fill();
  ctx.fillStyle = "#FFCC80"; ctx.fillRect(-13, -2, 5, 10);
  // phone
  ctx.save(); ctx.translate(9, -2); ctx.rotate(phoneA - 0.3);
  ctx.fillStyle = "#FFCC80"; roundRect(-2, -2, 5, 11, 2); ctx.fill();
  ctx.fillStyle = "#212121"; roundRect(-4, -16, 10, 16, 2.5); ctx.fill();
  ctx.fillStyle = "#81D4FA"; roundRect(-2.5, -14, 7, 11, 1); ctx.fill();
  if (o.phase === "chase" && Math.sin(now() / 90) > 0.4) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(1, -13, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = "#FFCC80"; ctx.beginPath(); ctx.arc(0, -16, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#F8BBD0";
  for (const [cx, cy] of [[-6,-22],[0,-24],[6,-22]]) { ctx.beginPath(); ctx.arc(cx, cy, 3.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#212121";
  ctx.beginPath(); ctx.arc(-3, -15, 1.4, 0, Math.PI * 2); ctx.arc(3, -15, 1.4, 0, Math.PI * 2); ctx.fill();
  if (o.yellT > 0.7) {
    ctx.fillStyle = "rgba(255,255,255,0.92)"; roundRect(-22, -50, 44, 16, 6); ctx.fill();
    ctx.fillStyle = "#AD1457"; ctx.font = "bold 7px system-ui"; ctx.textAlign = "center";
    ctx.fillText(o.yellText || "I'M FILMING!", 0, -39);
  }
  ctx.restore();
}

function drawBox(x, y, s, def) {
  def = def || PKG.standard;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * (def.size || 1), s * (def.size || 1));
  if (def.id === "envelope") {
    ctx.fillStyle = def.color; roundRect(-10, -6, 20, 12, 2); ctx.fill();
    ctx.strokeStyle = "#5D4037"; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-10, -6); ctx.lineTo(0, 2); ctx.lineTo(10, -6); ctx.stroke();
  } else if (def.id === "weird") {
    // flamingo pool float chaos
    ctx.fillStyle = "#F48FB1";
    ctx.beginPath(); ctx.ellipse(0, 2, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#EC407A";
    ctx.beginPath(); ctx.ellipse(8, -6, 5, 4, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#C2185B"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(10, -6); ctx.lineTo(14, -14); ctx.stroke();
  } else {
    ctx.fillStyle = def.color; roundRect(-11, -9, 22, 17, 2); ctx.fill();
    ctx.strokeStyle = "#232F3E"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(0, -9); ctx.lineTo(0, 8); ctx.moveTo(-11, -1); ctx.lineTo(11, -1); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 1, 5.5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    if (def.id === "heavy") {
      ctx.fillStyle = "#BF360C"; ctx.font = "bold 7px system-ui"; ctx.textAlign = "center";
      ctx.fillText("HEAVY", 0, -2);
    }
  }
  ctx.restore();
}

function drawAim() {
  if (state !== ST.PLAY && state !== ST.PAUSE) return;
  const best = bestStop();
  if (best) {
    const p = best.porch;
    const pulse = 0.5 + Math.sin(now() / 180) * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.3 + pulse * 0.25;
    ctx.strokeStyle = "#00E5FF"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
    ctx.beginPath(); ctx.moveTo(G.carX, CAR_Y - 22); ctx.lineTo(p.cx, p.cy); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(p.cx - 10, p.cy - 8); ctx.lineTo(p.cx + 10, p.cy + 8);
    ctx.moveTo(p.cx + 10, p.cy - 8); ctx.lineTo(p.cx - 10, p.cy + 8); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(p.cx, p.cy + 2, 18, 11, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
  if (!G.aimPreview) return;
  const { x, y, sx, sy, snap, assisted } = G.aimPreview;
  ctx.save();
  for (let i = 1; i <= 10; i++) {
    const u = i / 11;
    const px = lerp(sx, x, smooth(u));
    const py = lerp(sy, y, smooth(u)) - Math.sin(u * Math.PI) * 32;
    ctx.globalAlpha = 0.2 + u * 0.5;
    ctx.fillStyle = snap ? "#69F0AE" : assisted ? "#00E5FF" : "#FFB74D";
    ctx.beginPath(); ctx.arc(px, py, 3.3 - u * 0.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 0.9;
  ctx.strokeStyle = snap ? "#69F0AE" : assisted ? "#00E5FF" : "#FF9900";
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.ellipse(x, y + 4, 17, 11, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = ctx.strokeStyle; ctx.font = "bold 11px system-ui"; ctx.textAlign = "center";
  ctx.fillText(snap ? "LOCKED" : "aim", x, y - 14);
  ctx.restore();
}

function drawPackages() {
  for (const pk of G.packages) {
    // trail
    for (let i = 0; i < pk.trail.length; i++) {
      const t = pk.trail[i];
      ctx.globalAlpha = t.a * 0.45;
      ctx.fillStyle = pk.def?.color || "#FF9900";
      ctx.beginPath(); ctx.arc(t.x, t.y, 3 * (i / pk.trail.length), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const u = clamp(pk.t / pk.dur, 0, 1);
    const shadowY = lerp(pk.sy, pk.ty, smooth(u));
    ctx.fillStyle = `rgba(0,0,0,${0.12 + u * 0.18})`;
    ctx.beginPath(); ctx.ellipse(pk.x, shadowY + 8, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(pk.x, pk.y); ctx.rotate(pk.rot);
    drawBox(0, 0, 1 + Math.sin(u * Math.PI) * 0.15, pk.def);
    ctx.restore();
  }
}

function drawWheel(wx, wy, flip) {
  // Top-down Model 3 style: tire as rounded pill, aero-ish rim inside
  ctx.save();
  ctx.translate(wx, wy);
  if (flip) ctx.scale(-1, 1);
  // tire rubber
  ctx.fillStyle = "#1A1A1A";
  roundRect(-5, -11, 10, 22, 4);
  ctx.fill();
  // outer sidewall highlight
  ctx.strokeStyle = "rgba(255,255,255,0.08)";
  ctx.lineWidth = 1;
  roundRect(-4.5, -10, 9, 20, 3.5);
  ctx.stroke();
  // aero cover / multi-spoke disc
  ctx.fillStyle = "#B0BEC5";
  ctx.beginPath();
  ctx.ellipse(0, 0, 3.6, 7.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#78909C";
  ctx.beginPath();
  ctx.ellipse(0, 0, 2.2, 5.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // hub
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.ellipse(0, 0, 1.1, 2.2, 0, 0, Math.PI * 2);
  ctx.fill();
  // spoke lines
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 0.8;
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + 0.2;
    ctx.beginPath();
    ctx.moveTo(Math.cos(a) * 1.2, Math.sin(a) * 2.2);
    ctx.lineTo(Math.cos(a) * 2.8, Math.sin(a) * 5.5);
    ctx.stroke();
  }
  ctx.restore();
}

function drawTesla() {
  const x = G.carX, y = CAR_Y;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(G.carLean || 0);

  if (G.fsd > 0) {
    const pulse = 0.5 + Math.sin(now() / 100) * 0.5;
    ctx.shadowColor = "#00B0FF";
    ctx.shadowBlur = 24 + pulse * 12;
    ctx.fillStyle = `rgba(0,176,255,${0.14 + pulse * 0.1})`;
    ctx.beginPath();
    ctx.ellipse(0, 4, 40, 56, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ground shadow
  ctx.fillStyle = "rgba(0,0,0,0.26)";
  ctx.beginPath();
  ctx.ellipse(1, 46, 26, 8, 0, 0, Math.PI * 2);
  ctx.fill();

  const flash = G.invuln > 0 && Math.floor(now() / 70) % 2;

  // Wheels first (peek under arches) — narrower stance, flush ovals
  drawWheel(-23, -22, false);
  drawWheel(23, -22, true);
  drawWheel(-23, 24, false);
  drawWheel(23, 24, true);

  // Body shell (pearl white Model 3 silhouette)
  if (flash) {
    ctx.fillStyle = "rgba(250,250,250,0.45)";
  } else {
    const bg = ctx.createLinearGradient(-22, -44, 22, 44);
    bg.addColorStop(0, "#E8E8E8");
    bg.addColorStop(0.35, "#FAFAFA");
    bg.addColorStop(0.7, "#F0F0F0");
    bg.addColorStop(1, "#D8D8D8");
    ctx.fillStyle = bg;
  }
  // Slightly tapered nose/tail for car shape
  roundRect(-21, -44, 42, 88, 13);
  ctx.fill();
  // side character line
  ctx.strokeStyle = "rgba(0,0,0,0.06)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-19, -6); ctx.lineTo(19, -6);
  ctx.moveTo(-19, 12); ctx.lineTo(19, 12);
  ctx.stroke();
  // rocker shade
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  roundRect(-21, 28, 42, 8, 2);
  ctx.fill();

  // Wheel arch cutouts (subtle dark crescent so tires read as inset)
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  for (const [ax, ay] of [[-21, -22], [21, -22], [-21, 24], [21, 24]]) {
    ctx.beginPath();
    ctx.ellipse(ax, ay, 4, 10, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Glass canopy (continuous roof glass)
  const glass = ctx.createLinearGradient(-16, -30, 16, 16);
  glass.addColorStop(0, "#0D1B2A");
  glass.addColorStop(0.4, "#1B2838");
  glass.addColorStop(0.75, "#37474F");
  glass.addColorStop(1, "#546E7A");
  ctx.fillStyle = glass;
  roundRect(-16, -30, 32, 44, 9);
  ctx.fill();
  // reflection streak
  ctx.fillStyle = "rgba(144,202,249,0.28)";
  roundRect(-13, -27, 10, 34, 5);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.08)";
  roundRect(2, -26, 8, 16, 3);
  ctx.fill();

  // Rear deck
  ctx.fillStyle = "#EEEEEE";
  roundRect(-14, 14, 28, 20, 4);
  ctx.fill();

  // Front light bar
  if (G.fsd > 0) {
    ctx.fillStyle = "#00E5FF";
    ctx.shadowColor = "#00E5FF";
    ctx.shadowBlur = 12;
  } else {
    const lg = ctx.createLinearGradient(-16, 0, 16, 0);
    lg.addColorStop(0, "#90CAF9");
    lg.addColorStop(0.5, "#FFFFFF");
    lg.addColorStop(1, "#90CAF9");
    ctx.fillStyle = lg;
  }
  roundRect(-16, -42, 32, 4.5, 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  // amber corner markers
  if (G.fsd <= 0) {
    ctx.fillStyle = "#FFB74D";
    ctx.fillRect(-16, -41.5, 3.5, 3.5);
    ctx.fillRect(12.5, -41.5, 3.5, 3.5);
  }

  // Rear red bar
  const rl = ctx.createLinearGradient(-14, 0, 14, 0);
  rl.addColorStop(0, "#B71C1C");
  rl.addColorStop(0.5, "#FF1744");
  rl.addColorStop(1, "#B71C1C");
  ctx.fillStyle = rl;
  roundRect(-14, 34, 28, 4.5, 2);
  ctx.fill();

  // Side mirrors
  ctx.fillStyle = "#F5F5F5";
  roundRect(-29, -10, 9, 6, 2);
  roundRect(20, -10, 9, 6, 2);
  ctx.fillStyle = "#263238";
  roundRect(-27, -8.5, 5, 3, 1);
  roundRect(22, -8.5, 5, 3, 1);

  // Subtle T on hood (not a floating package)
  ctx.fillStyle = "rgba(120,144,156,0.55)";
  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("T", 0, -36);
  ctx.textBaseline = "alphabetic";

  // Door Flex badge (rear quarter, not blocking the nose)
  ctx.fillStyle = "#232F3E";
  roundRect(-12, 18, 24, 10, 2);
  ctx.fill();
  ctx.strokeStyle = "#FF9900";
  ctx.lineWidth = 1;
  roundRect(-12, 18, 24, 10, 2);
  ctx.stroke();
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 7px system-ui";
  ctx.fillText("FLEX", 0, 25);

  // Clean body outline
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1.2;
  roundRect(-21, -44, 42, 88, 13);
  ctx.stroke();

  ctx.restore();

  if (G.fsd > 0) {
    ctx.fillStyle = "rgba(0,176,255,0.95)";
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("FSD " + G.fsd.toFixed(1) + "s", G.carX, CAR_Y + 60);
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / (p.max || 1), 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  for (const f of G.floatText) {
    ctx.globalAlpha = clamp(f.life * 1.3, 0, 1);
    ctx.font = `bold ${f.size}px system-ui`; ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawWeatherOverlay() {
  if (G.weather === "rain") {
    ctx.strokeStyle = "rgba(180,210,230,0.35)"; ctx.lineWidth = 1.2;
    for (const r of G.rain) {
      ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x + 3 * r.z, r.y + 12 * r.z); ctx.stroke();
    }
    ctx.fillStyle = "rgba(80,100,120,0.08)"; ctx.fillRect(0, 0, W, H);
  }
  if (G.weather === "golden") {
    ctx.fillStyle = "rgba(255,160,60,0.06)"; ctx.fillRect(0, 0, W, H);
  }
}

// ─── HUD / SCREENS ─────────────────────────────────────────
function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(10,22,40,0.9)"; roundRect(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = "rgba(255,153,0,0.4)"; ctx.lineWidth = 2; roundRect(x, y, w, h, 16); ctx.stroke();
}
function drawBtn(b) {
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (b.style === "primary") { g.addColorStop(0, "#FFB74D"); g.addColorStop(1, "#FF9900"); }
  else { g.addColorStop(0, "#455A64"); g.addColorStop(1, "#263238"); }
  ctx.fillStyle = g; roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.fillStyle = b.style === "primary" ? "#1A1A1A" : "#ECEFF1";
  ctx.font = "bold 16px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textBaseline = "alphabetic";
}

function drawHUD() {
  // top bar
  ctx.fillStyle = "rgba(10,22,40,0.78)"; roundRect(8, 8, W - 16, 56, 14); ctx.fill();

  // hearts
  for (let i = 0; i < MAX_HEARTS; i++) {
    ctx.font = "16px system-ui";
    ctx.globalAlpha = i < G.hearts ? 1 : 0.25;
    ctx.fillText("❤️", 22 + i * 22, 32);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = "#FF9900"; ctx.font = "bold 11px system-ui"; ctx.textAlign = "left";
  ctx.fillText("SCORE", 20, 48);
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui";
  ctx.fillText(String(G.score), 62, 50);

  ctx.textAlign = "center";
  ctx.fillStyle = "#90CAF9"; ctx.font = "bold 11px system-ui";
  ctx.fillText("TIME", W / 2 - 30, 28);
  ctx.fillStyle = G.time < 15 ? "#FF5252" : "#fff"; ctx.font = "bold 18px system-ui";
  const m = Math.floor(G.time / 60), s = Math.floor(G.time % 60);
  ctx.fillText(`${m}:${String(s).padStart(2, "0")}`, W / 2 - 30, 50);

  ctx.fillStyle = "#FFD54F"; ctx.font = "bold 11px system-ui";
  ctx.fillText("STREAK", W / 2 + 40, 28);
  ctx.fillStyle = "#fff"; ctx.font = "bold 18px system-ui";
  ctx.fillText(String(G.streak), W / 2 + 40, 50);

  // pause
  ctx.fillStyle = "rgba(255,255,255,0.15)"; roundRect(W - 48, 14, 32, 32, 8); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.fillRect(W - 38, 22, 4, 16); ctx.fillRect(W - 30, 22, 4, 16);

  // FSD pips
  for (let i = 0; i < FSD_NEED; i++) {
    ctx.fillStyle = i < G.fsdReady ? "#00B0FF" : "rgba(255,255,255,0.18)";
    ctx.beginPath(); ctx.arc(W / 2 - 20 + i * 20, 74, 5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.font = "10px system-ui"; ctx.textAlign = "center";
  ctx.fillText("FSD", W / 2, 90);

  // next package chip
  const nd = PKG[G.nextPkg] || PKG.standard;
  ctx.fillStyle = "rgba(0,0,0,0.4)"; roundRect(10, 68, 86, 28, 8); ctx.fill();
  drawBox(26, 82, 0.55, nd);
  ctx.fillStyle = "#fff"; ctx.font = "bold 10px system-ui"; ctx.textAlign = "left";
  ctx.fillText(nd.label, 40, 86);

  // weather chip
  ctx.fillStyle = "rgba(0,0,0,0.35)"; roundRect(W - 100, 68, 90, 28, 8); ctx.fill();
  ctx.fillStyle = "#E3F2FD"; ctx.font = "9px system-ui"; ctx.textAlign = "center";
  ctx.fillText(weatherInfo(G.weather).name, W - 55, 86);

  if (elapsed() < EASY_SECS) {
    ctx.fillStyle = "rgba(76,175,80,0.85)"; roundRect(W / 2 - 52, 98, 104, 18, 9); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "bold 10px system-ui";
    ctx.fillText("EASY STRETCH", W / 2, 111);
  }
  if (G.event) {
    ctx.fillStyle = "rgba(255,153,0,0.85)"; roundRect(W / 2 - 70, 120, 140, 18, 9); ctx.fill();
    ctx.fillStyle = "#1A1A1A"; ctx.font = "bold 10px system-ui";
    ctx.fillText(G.event.replace("_", " ").toUpperCase(), W / 2, 133);
  }

  // radio + high score
  ctx.fillStyle = RADIO[station].color; ctx.font = "bold 10px system-ui"; ctx.textAlign = "left";
  ctx.fillText("♪ " + RADIO[station].name, 14, H - 14);
  ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.font = "10px system-ui"; ctx.textAlign = "right";
  ctx.fillText("BEST " + META.highScore, W - 14, H - 14);

  // messages
  let my = 145;
  for (const m of G.messages) {
    ctx.globalAlpha = clamp(m.life * 2, 0, 0.95);
    ctx.font = "12px system-ui";
    const tw = Math.min(W - 40, ctx.measureText(m.text).width + 22);
    ctx.fillStyle = "rgba(0,0,0,0.55)"; roundRect((W - tw) / 2, my, tw, 26, 8); ctx.fill();
    ctx.fillStyle = "#FFF8E1"; ctx.textAlign = "center"; ctx.fillText(m.text, W / 2, my + 17);
    my += 30;
  }
  ctx.globalAlpha = 1;

  // zone hint
  if (G.time > ROUTE_TIME - 4) {
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = "#00B0FF"; ctx.fillRect(0, 0, W, H * 0.5);
    ctx.fillStyle = "#FF9900"; ctx.fillRect(0, H * 0.5, W, H * 0.5);
    ctx.globalAlpha = 0.9; ctx.fillStyle = "#fff"; ctx.font = "bold 14px system-ui"; ctx.textAlign = "center";
    ctx.fillText("AIM & THROW", W / 2, H * 0.25);
    ctx.fillText("STEER", W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }
}

function drawTitle() {
  ctx.fillStyle = "rgba(5,15,30,0.5)"; ctx.fillRect(0, 0, W, H);
  const prev = G.carX; G.carX = W / 2;
  ctx.save(); ctx.translate(0, -50); drawTesla(); ctx.restore(); G.carX = prev;

  panel(18, 130, W - 36, 430);
  ctx.textAlign = "center";
  ctx.fillStyle = "#FF9900"; ctx.font = "bold 12px system-ui";
  ctx.fillText("AMAZON FLEX DELIVERY", W / 2, 158);
  ctx.fillStyle = "#fff"; ctx.font = "bold 32px system-ui";
  ctx.fillText("Tesla Flex", W / 2, 194);
  ctx.fillStyle = "rgba(255,255,255,0.65)"; ctx.font = "12px system-ui";
  ctx.fillText("High " + META.highScore + " · Streak " + META.bestStreak, W / 2, 214);

  // ── Tune-in radio ──
  ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "bold 13px system-ui";
  ctx.fillText("Tune in", W / 2, 242);
  ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.font = "11px system-ui";
  ctx.fillText("What are we flexing to?", W / 2, 258);

  UI.buttons = [];
  const stations = ["house", "dnb", "riddim", "techno"];
  const bw = 78, gap = 6;
  const totalW = stations.length * bw + (stations.length - 1) * gap;
  let bx = (W - totalW) / 2;
  const by = 270;
  for (const id of stations) {
    const r = RADIO[id];
    const sel = station === id;
    ctx.fillStyle = sel ? r.color : "rgba(255,255,255,0.1)";
    roundRect(bx, by, bw, 48, 10); ctx.fill();
    if (sel) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      roundRect(bx, by, bw, 48, 10); ctx.stroke();
    }
    ctx.fillStyle = sel ? "#1A1A1A" : "#ECEFF1";
    ctx.font = "bold 12px system-ui"; ctx.textAlign = "center";
    ctx.fillText(r.name, bx + bw / 2, by + 20);
    ctx.font = "8px system-ui";
    ctx.globalAlpha = sel ? 0.85 : 0.55;
    ctx.fillText(r.bpm + " BPM", bx + bw / 2, by + 36);
    ctx.globalAlpha = 1;
    btn("radio_" + id, bx, by, bw, 48, "", "secondary");
    bx += bw + gap;
  }
  ctx.fillStyle = RADIO[station].color; ctx.font = "11px system-ui"; ctx.textAlign = "center";
  ctx.fillText("♪ " + RADIO[station].tag, W / 2, 338);

  const chips = ["❤️ 3 hearts", "⚡ FSD", "🌦️ Weather", "📦 Packages"];
  let cx = 36;
  for (const c of chips) {
    ctx.fillStyle = "rgba(255,255,255,0.08)"; roundRect(cx, 358, 78, 22, 8); ctx.fill();
    ctx.fillStyle = "#B0BEC5"; ctx.font = "10px system-ui";
    ctx.fillText(c, cx + 39, 373); cx += 82;
  }

  btn("play", W / 2 - 110, 400, 220, 48, "Tap to Start", "primary");
  btn("howto", W / 2 - 110, 458, 220, 40, "How to Play", "secondary");
  for (const b of UI.buttons) {
    if (b.label) drawBtn(b); // radio chips already drawn
  }
  ctx.fillStyle = "rgba(255,255,255,0.4)"; ctx.font = "10px system-ui"; ctx.textAlign = "center";
  ctx.fillText("Keys 1–4 station · M mute · P pause", W / 2, H - 24);
}

function drawHowTo() {
  ctx.fillStyle = "rgba(5,15,30,0.75)"; ctx.fillRect(0, 0, W, H);
  panel(16, 30, W - 32, H - 80);
  ctx.fillStyle = "#FF9900"; ctx.font = "bold 22px system-ui"; ctx.textAlign = "center";
  ctx.fillText("How to Play", W / 2, 65);
  const lines = [
    ["STEER", "Drag bottom half (or A/D). Tesla has weight."],
    ["THROW", "Hold top half to aim (ghost arc). Release to throw."],
    ["DROP", "Only orange DROP pads. Cyan X = best target. LOCK snaps."],
    ["PACKAGES", "Standard / Heavy (+score) / Envelope (fast) / Weird bonuses."],
    ["COMBO", "Streak multiplies score. Perfect center shots sparkle."],
    ["HEARTS", "Crashes cost hearts. Soft misses are oops — not instant death."],
    ["FSD", "Every 3 deliveries: Autopilot ~10s. Focus on packages."],
    ["WEATHER", "Golden hour +score. Rain makes throws a bit floatier."],
    ["RADIO", "Tune House / DnB / Riddim / Techno (keys 1–4)."],
  ];
  let y = 90;
  ctx.textAlign = "left";
  for (const [t, b] of lines) {
    ctx.fillStyle = "#00B0FF"; ctx.font = "bold 12px system-ui"; ctx.fillText(t, 36, y);
    ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "12px system-ui";
    wrap(b, 36, y + 16, W - 72, 15); y += 52;
  }
  UI.buttons = [];
  btn("play", W / 2 - 110, H - 90, 220, 46, "Start Route", "primary");
  for (const b of UI.buttons) drawBtn(b);
}

function wrap(text, x, y, maxW, lh) {
  const words = text.split(" "); let line = "";
  for (const w of words) {
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW) { ctx.fillText(line, x, y); line = w; y += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, y);
}

function drawGate() {
  ctx.fillStyle = "rgba(5,10,20,0.72)"; ctx.fillRect(0, 0, W, H);
  panel(24, 150, W - 48, 400);
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff"; ctx.font = "bold 20px system-ui"; ctx.fillText("GATED COMMUNITY", W / 2, 280);
  ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.font = "13px system-ui";
  ctx.fillText("Which code did they text you?", W / 2, 305);
  ctx.fillStyle = "#FF8A65"; ctx.font = "bold 12px system-ui";
  ctx.fillText(`Time: ${Math.ceil(G.gateTimer)}s`, W / 2, 326);
  const bw = 280, bh = 52, bx = (W - bw) / 2; let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    ctx.fillStyle = "#37474F"; roundRect(bx, by, bw, bh, 10); ctx.fill();
    ctx.strokeStyle = "#FF9900"; roundRect(bx, by, bw, bh, 10); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.font = "bold 22px system-ui";
    ctx.fillText(G.gateOptions[i], W / 2, by + 34); by += 68;
  }
}

function drawPause() {
  ctx.fillStyle = "rgba(5,15,30,0.65)"; ctx.fillRect(0, 0, W, H);
  panel(30, 150, W - 60, 380);
  ctx.fillStyle = "#fff"; ctx.font = "bold 26px system-ui"; ctx.textAlign = "center";
  ctx.fillText("Paused", W / 2, 195);
  ctx.fillStyle = "rgba(255,255,255,0.6)"; ctx.font = "13px system-ui";
  ctx.fillText("Score " + G.score + " · Streak " + G.streak, W / 2, 222);

  ctx.fillStyle = "rgba(255,255,255,0.85)"; ctx.font = "bold 12px system-ui";
  ctx.fillText("Radio", W / 2, 252);
  UI.buttons = [];
  const stations = ["house", "dnb", "riddim", "techno"];
  const bw = 72, gap = 6;
  let bx = (W - (stations.length * bw + (stations.length - 1) * gap)) / 2;
  for (const id of stations) {
    const r = RADIO[id];
    const sel = station === id;
    ctx.fillStyle = sel ? r.color : "rgba(255,255,255,0.12)";
    roundRect(bx, 265, bw, 40, 8); ctx.fill();
    ctx.fillStyle = sel ? "#1A1A1A" : "#ECEFF1";
    ctx.font = "bold 11px system-ui";
    ctx.fillText(r.name, bx + bw / 2, 290);
    btn("radio_" + id, bx, 265, bw, 40, "", "secondary");
    bx += bw + gap;
  }

  btn("resume", W / 2 - 100, 330, 200, 46, "Resume", "primary");
  btn("menu", W / 2 - 100, 390, 200, 42, "Quit to Title", "secondary");
  for (const b of UI.buttons) if (b.label) drawBtn(b);
}

function drawEnd() {
  ctx.fillStyle = "rgba(5,15,30,0.72)"; ctx.fillRect(0, 0, W, H);
  panel(22, 70, W - 44, 520);
  ctx.textAlign = "center";
  ctx.fillStyle = G.wrecked ? "#FF5252" : "#FF9900";
  ctx.font = "bold 14px system-ui";
  ctx.fillText(G.wrecked ? "ROUTE FAILED" : "ROUTE COMPLETE", W / 2, 105);
  ctx.fillStyle = "#fff"; ctx.font = "bold 24px system-ui";
  ctx.fillText(G.wrecked ? "Needs a body shop" : "Flex shift done!", W / 2, 140);
  if (G.newHigh) {
    ctx.fillStyle = "#FFD54F"; ctx.font = "bold 16px system-ui";
    ctx.fillText("★ NEW HIGH SCORE ★", W / 2, 168);
  }

  const rows = [
    ["Score", G.score], ["Deliveries", G.deliveries], ["Best streak", G.bestStreak],
    ["Perfects", G.perfects], ["Threat beans", G.threatBeans],
    ["Hearts left", Math.max(0, G.hearts)], ["Weather", weatherInfo(G.weather).name],
  ];
  let y = 200;
  for (const [k, v] of rows) {
    ctx.textAlign = "left"; ctx.fillStyle = "rgba(255,255,255,0.55)"; ctx.font = "14px system-ui";
    ctx.fillText(k, 50, y);
    ctx.textAlign = "right"; ctx.fillStyle = "#fff"; ctx.font = "bold 15px system-ui";
    ctx.fillText(String(v), W - 50, y); y += 30;
  }
  ctx.textAlign = "center"; ctx.fillStyle = "#69F0AE"; ctx.font = "bold 16px system-ui";
  ctx.fillText("Flex Rating: " + grade(), W / 2, y + 10);

  UI.buttons = [];
  btn("again", W / 2 - 110, H - 150, 220, 46, "Another Route", "primary");
  btn("share", W / 2 - 110, H - 96, 220, 40, "Share Score", "secondary");
  btn("menu", W / 2 - 110, H - 50, 220, 36, "Title", "secondary");
  for (const b of UI.buttons) drawBtn(b);
}

function grade() {
  if (G.wrecked) return "DNF";
  if (G.score >= 2200) return "SSS Peak Flex";
  if (G.score >= 1600) return "S Elon would nod";
  if (G.score >= 1100) return "A Solid block";
  if (G.score >= 700) return "B Almost on time";
  if (G.score >= 350) return "C Metrics review";
  return "D Support will call";
}

// ═══════════════════════════════════════════════════════════
// LOOP
// ═══════════════════════════════════════════════════════════
// Title ambience seed
G.weather = "sunny";
for (let i = 0; i < 7; i++) G.clouds.push({ x: rand(-40, W + 40), y: rand(18, 100), w: rand(50, 100), s: rand(6, 14), layer: Math.random() });
for (let i = 0; i < 3; i++) G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(20, 36), flap: rand(0, 8) });
for (let i = 0; i < 4; i++) spawnHouse(i * 200 - 40);

function frame(t) {
  let dt = clamp((t - lastT) / 1000, 0, 0.05);
  lastT = t;
  // achievement toast timer
  if (G.unlockQueue.length && state === ST.PLAY) {
    // decay via messages already; shift after 3s using score time hack
  }
  if (G.unlockQueue.length) {
    G._achT = (G._achT || 2.5) - dt;
    if (G._achT <= 0) { G.unlockQueue.shift(); G._achT = 2.5; }
  }
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener("gesturestart", e => e.preventDefault());
document.body.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
})();
</script>
