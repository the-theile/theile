const HOUSE_COLORS = ["#F5D0C5","#C5E1A5","#B3E5FC","#FFF59D","#E1BEE7","#FFE0B2","#B2DFDB","#F8BBD0","#D7CCC8","#DCEDC8","#FFCCBC"];

function spawnHouse(y) {
  const side = G.houseSide++ % 2;
  const diff = state === ST.PLAY ? difficulty() : 0.12;
  const early = state === ST.PLAY && elapsed() < EASY_SECS;
  const needsDelivery = Math.random() < (early ? 0.72 : lerp(0.62, 0.45, diff / MAX_DIFF));
  const special = needsDelivery && Math.random() < 0.1 ? pick(["fresh", "prime"]) : null;

  // Compact porches that sit in the yard strip, not over the house body
  const porchW = needsDelivery ? (early ? 36 : lerp(34, 28, diff / MAX_DIFF)) : 22;
  const porchH = needsDelivery ? (early ? 30 : lerp(28, 24, diff / MAX_DIFF)) : 18;
  const hasDriveway = Math.random() < 0.85;
  // Parked cars only when driveway exists; placed BELOW house (see layoutParked)
  const hasParked = hasDriveway && Math.random() < 0.5;

  const h = {
    y, side, color: pick(HOUSE_COLORS), scale: 1,
    porchW, porchH, needsDelivery, delivered: false, special,
    roof: pick(["#6D4C41","#455A64","#5D4037","#37474F","#795548","#BF360C"]),
    trim: pick(["#FFFFFF","#FAFAFA","#FFF8E1","#EFEBE9"]),
    accent: pick(["#1565C0","#2E7D32","#6A1B9A","#C62828","#00838F","#EF6C00"]),
    brick: pick(["#A1887F","#8D6E63","#BCAAA4"]),
    style: pick(["ranch","ranch","cottage","modern"]),
    hasPool: needsDelivery && !early && Math.random() < 0.1,
    hasRing: needsDelivery && Math.random() < 0.22,
    hasSnack: needsDelivery && Math.random() < 0.14,
    hasPirate: needsDelivery && !early && Math.random() < 0.06,
    hasDog: !early && Math.random() < 0.07,
    hasMailbox: true, hasDriveway, hasBush: Math.random() < 0.75,
    hasFence: Math.random() < 0.5, hasPlanters: Math.random() < 0.55,
    poolX: side === 0 ? 28 : W - 28,
    ringHit: false, snackTaken: false, pirateHit: false, windowBroken: false,
    number: 100 + (G.houses.length * 2 + side + 1),
    windowLit: Math.random() < 0.4, garage: Math.random() < 0.42, shutters: Math.random() < 0.55,
    ladySpawned: false, dogPhase: 0,
    hasParked,
    parkedCar: hasParked ? {
      color: pick(["#ECEFF1","#E53935","#1E88E5","#43A047","#FB8C00","#37474F","#FAFAFA"]),
      cracked: false, dented: false, w: 28, h: 42,
    } : null,
  };
  G.houses.push(h);

  G.props.push({ type: "palm", x: side === 0 ? rand(12, 40) : rand(W - 40, W - 12), y: y - 16, scale: rand(0.9, 1.2) });
  if (h.hasBush) G.props.push({ type: "bush", x: side === 0 ? rand(18, 52) : rand(W - 52, W - 18), y: y + 30 });
  if (h.hasPool) G.props.push({ type: "pool", x: h.poolX, y: y + 8 });
  if (Math.random() < 0.35) G.props.push({ type: "pole", x: side === 0 ? rand(8, 26) : rand(W - 26, W - 8), y: y - 48 });
  if (Math.random() < 0.2) G.props.push({ type: "hydrant", x: side === 0 ? ROAD_L - 24 : ROAD_R + 18, y: y + 55 });
  // No yard-sign text clutter (kept rare decorative option off by default)
}

function spawnObstacle() {
  const diff = difficulty();
  if (Math.random() < lerp(0.42, 0.12, diff / MAX_DIFF)) return;
  if (G.fsd > 0 && Math.random() < 0.7) return;
  if (G.obstacles.filter(o => !o.dead).length >= (diff < 0.25 ? 1 : diff < 0.5 ? 2 : 3)) return;

  let type;
  if (diff < 0.2) type = Math.random() < 0.82 ? "cone" : "scooter";
  else if (diff < 0.4) type = pick(["cone","cone","scooter","cone"]);
  else if (diff < 0.6) type = pick(["cone","scooter","ped","cone"]);
  else type = pick(["cone","scooter","ped","dog","car","scooter"]);

  // Construction zone event: more cones
  if (G.event === "construction") type = Math.random() < 0.7 ? "cone" : type;

  let x = rand(ROAD_L + 28, ROAD_R - 28);
  if (Math.random() < (diff < 0.35 ? 0.9 : 0.68)) {
    x = Math.random() < 0.5 ? rand(ROAD_L + 24, ROAD_L + 58) : rand(ROAD_R - 58, ROAD_R - 24);
  }

  const o = { type, x, y: -70, w: 28, h: 28, vx: 0, dead: false, hit: false, anim: 0, pkgHit: false };
  if (type === "cone") { o.w = 18; o.h = 22; }
  if (type === "scooter") { o.w = 16; o.h = 36; o.vx = pick([-14, 14]) * (0.5 + diff * 0.4); }
  if (type === "car") {
    o.w = 46; o.h = 74; o.color = pick(["#E53935","#1E88E5","#43A047","#FB8C00","#5E35B1","#FAFAFA","#37474F"]);
    if (Math.random() < 0.7) { o.x = Math.random() < 0.5 ? ROAD_L + 40 : ROAD_R - 40; o.vy = rand(8, 24); }
    else o.vy = rand(16, 38 + diff * 20);
  }
  if (type === "ped") { o.w = 18; o.h = 32; o.vx = pick([-16, 16]) * (0.5 + diff * 0.35); }
  if (type === "dog") { o.w = 28; o.h = 16; o.vx = pick([-28, 28]) * (0.55 + diff * 0.3); }
  G.obstacles.push(o);
}

// ═══════════════════════════════════════════════════════════
// AIM
// ═══════════════════════════════════════════════════════════
/**
 * Shared house geometry so draw + collisions never disagree.
 * Layout: house sits in the outer yard; porch is a stoop on the
 * road-facing wall; parked car sits on the driveway BELOW the house
 * (toward the player), never under the porch.
 */
function layoutHouse(h) {
  // Compact footprint so porch never sits on the roof/body
  const hw = h.style === "modern" ? 44 : h.style === "cottage" ? 42 : 46;
  const hh = h.style === "cottage" ? 50 : 54;
  // Left: house against left edge. Right: house against right edge.
  const hx = h.side === 0 ? 5 : W - 5 - hw;
  const hy = h.y - 14;

  // Porch = stoop on the road-facing wall, in the strip between house and curb
  let porchW = Math.min(h.porchW || 30, 32);
  let porchH = Math.min(h.porchH || 26, 28);
  let porchX, porchY;
  if (h.side === 0) {
    porchX = hx + hw; // starts at house wall, extends toward road
    const maxW = Math.max(18, ROAD_L - 8 - porchX);
    porchW = Math.min(porchW, maxW);
  } else {
    porchX = ROAD_R + 8;
    const maxW = Math.max(18, hx - porchX);
    porchW = Math.min(porchW, maxW);
    // keep stoop snug against house wall
    porchX = hx - porchW;
  }
  porchY = hy + hh * 0.4; // door height — beside wall, not over roof

  // Driveway BELOW house (higher y = toward player / bottom of screen)
  const driveTop = hy + hh + 2;
  let car = null;
  if (h.parkedCar) {
    const cw = h.parkedCar.w || 26, ch = h.parkedCar.h || 40;
    // Centered under house footprint on the driveway slab
    const cx = hx + hw / 2;
    const cy = driveTop + 26;
    car = { cx, cy, w: cw, h: ch, x: cx - cw / 2, y: cy - ch / 2 };
  }

  // Window on main wall facing road (on the house body only)
  const winW = 20, winH = 15;
  const winX = h.side === 0 ? hx + 6 : hx + hw - 26;
  const winY = hy + 14;

  return {
    hx, hy, hw, hh,
    porchX, porchY, porchW, porchH,
    porchCx: porchX + porchW / 2,
    porchCy: porchY + porchH / 2,
    doorX: h.side === 0 ? hx + hw - 18 : hx + 4,
    doorY: hy + hh * 0.38,
    winX, winY, winW, winH,
    car, driveTop,
  };
}

function getPorch(h) {
  const L = layoutHouse(h);
  const pad = state === ST.PLAY ? padExtra() * 0.65 : 6;
  return {
    x: L.porchX - pad * 0.15,
    y: L.porchY - pad * 0.1,
    w: L.porchW + pad * 0.3,
    h: L.porchH + pad * 0.25,
    cx: L.porchCx,
    cy: L.porchCy,
  };
}
function isActive(h) { return h && h.needsDelivery && !h.delivered; }

function bestStop() {
  let best = null, bestH = null, s = 1e9;
  for (const h of G.houses) {
    if (!isActive(h)) continue;
    const p = getPorch(h);
    if (p.cy > CAR_Y - 40 || p.cy < 70) continue;
    const sc = Math.abs(p.cx - G.carX) * 0.5 + Math.abs(p.cy - (CAR_Y - 170)) * 0.5;
    if (sc < s) { s = sc; best = p; bestH = h; }
  }
  return best ? { porch: best, house: bestH } : null;
}

function findAssist(ax, ay) {
  const R = assistR(), str = aimStrength();
  let best = null, bestH = null, bestD = R;
  for (const h of G.houses) {
    if (!isActive(h)) continue;
    const p = getPorch(h);
    if (p.cy > CAR_Y - 30 || p.cy < 60) continue;
    const d = dist(ax, ay, p.cx, p.cy);
    if (d < bestD) { bestD = d; best = p; bestH = h; }
  }
  if (!best) return { x: ax, y: ay, snap: false, house: null, porch: null };
  if (bestD < snapD()) return { x: best.cx, y: best.cy, snap: true, house: bestH, porch: best };
  const pull = Math.min(1, str * (1 - bestD / R) * 1.25);
  return {
    x: lerp(ax, best.cx, pull), y: lerp(ay, best.cy, pull),
    snap: pull > 0.88, house: bestH, porch: best, assisted: pull > 0.12,
  };
}

function clampAim(sx, sy, ax, ay) {
  const maxD = lerp(195, 260, difficulty() / MAX_DIFF);
  ay = clamp(ay, 95, CAR_Y - 75);
  if (ax > ROAD_L + 14 && ax < ROAD_R - 14) {
    const curb = ax < ROAD_CX ? ROAD_L - 18 : ROAD_R + 18;
    ax = lerp(ax, curb, 0.32);
  }
  let d = dist(sx, sy, ax, ay);
  if (d > maxD) { const k = maxD / d; ax = sx + (ax - sx) * k; ay = sy + (ay - sy) * k; }
  if (sy - ay > 155) ay = lerp(ay, sy - 145, lerp(0.55, 0.28, difficulty() / MAX_DIFF));
  // rain: slightly flatter aim band
  if (G.weather === "rain") ay = lerp(ay, sy - 140, 0.08);
  return { x: ax, y: ay };
}

function stickyAim(ax, ay) {
  const b = bestStop();
  if (!b) return findAssist(ax, ay);
  const p = b.porch;
  const d = dist(ax, ay, p.cx, p.cy);
  if (d < snapD() * 1.4 || (Math.abs(ax - p.cx) < 72 && Math.abs(ay - p.cy) < 95)) {
    return { x: p.cx, y: p.cy, snap: true, house: b.house, porch: p };
  }
  return findAssist(ax, ay);
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
function cpos(e) {
  const r = canvas.getBoundingClientRect();
  const id = e.changedTouches ? e.changedTouches[0] : e;
  return {
    x: ((id.clientX ?? e.clientX) - r.left) * (W / r.width),
    y: ((id.clientY ?? e.clientY) - r.top) * (H / r.height),
  };
}

function onDown(e) {
  e.preventDefault();
  ensureAudio();
  const id = e.pointerId ?? 0;
  const p = cpos(e);
  pointers.set(id, p);

  if (state === ST.TITLE || state === ST.HOWTO || state === ST.END) { hitUI(p.x, p.y); return; }
  if (state === ST.PAUSE) { hitUI(p.x, p.y); return; }
  if (state === ST.GATE) { hitGate(p.x, p.y); return; }
  if (state === ST.PLAY) {
    // pause button
    if (p.x > W - 52 && p.y < 58) { state = ST.PAUSE; SFX.click(); return; }
    if (p.y >= H * 0.5) { touchSteerId = id; G.steerTarget = p.x; G.aimPreview = null; }
    else { throwAimId = id; updateAim(p.x, p.y); }
  }
}
function onMove(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = cpos(e);
  pointers.set(id, p);
  if (state === ST.PLAY && id === touchSteerId) G.steerTarget = p.x;
  if (state === ST.PLAY && id === throwAimId) updateAim(p.x, p.y);
  if (state === ST.PLAY && e.pointerType === "mouse" && throwAimId == null && touchSteerId == null) {
    if (p.y < H * 0.5) updateAim(p.x, p.y); else G.aimPreview = null;
  }
}
function onUp(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = pointers.get(id) || cpos(e);
  if (state === ST.PLAY && id === throwAimId) {
    updateAim(p.x, p.y);
    if (G.aimPreview) throwPkg(G.aimPreview.x, G.aimPreview.y);
    else throwPkg(p.x, p.y);
    throwAimId = null; G.aimPreview = null;
  }
  pointers.delete(id);
  if (id === touchSteerId) { touchSteerId = null; G.steerTarget = null; }
}

function updateAim(px, py) {
  if (state !== ST.PLAY || py >= H * 0.5) { G.aimPreview = null; return; }
  const sx = G.carX, sy = CAR_Y - 18;
  const c = clampAim(sx, sy, px, py);
  const s = stickyAim(c.x, c.y);
  G.aimPreview = { x: s.x, y: s.y, snap: !!s.snap, assisted: !!s.assisted || !!s.snap, sx, sy, house: s.house };
}

canvas.addEventListener("pointerdown", onDown, { passive: false });
canvas.addEventListener("pointermove", onMove, { passive: false });
canvas.addEventListener("pointerup", onUp, { passive: false });
canvas.addEventListener("pointercancel", onUp, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

addEventListener("keydown", e => {
  keys[e.code] = true;
  ensureAudio();
  if (["Space","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyM") {
    muted = !muted;
    if (muted) stopRadio();
    else if (state === ST.PLAY || state === ST.PAUSE) startRadio();
    msg(muted ? "Sound off" : "Tuned to " + RADIO[station].name, 1.4);
  }
  // Station switch: 1 House · 2 DnB · 3 Riddim · 4 Techno · 0 Silent
  if ((state === ST.PLAY || state === ST.PAUSE || state === ST.TITLE) && state !== ST.GATE && !e.repeat) {
    if (e.code === "Digit1" || e.code === "Numpad1") { setStation("house"); if (state !== ST.TITLE) msg("House", 1); }
    if (e.code === "Digit2" || e.code === "Numpad2") { setStation("dnb"); if (state !== ST.TITLE) msg("DnB", 1); }
    if (e.code === "Digit3" || e.code === "Numpad3") { setStation("riddim"); if (state !== ST.TITLE) msg("Riddim", 1); }
    if (e.code === "Digit4" || e.code === "Numpad4") { setStation("techno"); if (state !== ST.TITLE) msg("Techno", 1); }
    if (e.code === "Digit0" || e.code === "Numpad0") { setStation("silent"); if (state !== ST.TITLE) msg("Silent ride", 1); }
  }
  if (e.code === "KeyP" || e.code === "Escape") {
    if (state === ST.PLAY) { state = ST.PAUSE; SFX.click(); }
    else if (state === ST.PAUSE) { state = ST.PLAY; SFX.click(); }
  }
  if (state === ST.TITLE && (e.code === "Enter" || e.code === "Space")) { state = ST.PLAY; resetGame(); }
  if (state === ST.PLAY && e.code === "Space") {
    const b = bestStop();
    if (b) throwPkg(b.porch.cx, b.porch.cy);
    else throwPkg(G.carX + rand(-12, 12), CAR_Y - 160);
  }
  if (state === ST.GATE) {
    if (e.code === "Digit1" || e.code === "Numpad1") pickGate(0);
    if (e.code === "Digit2" || e.code === "Numpad2") pickGate(1);
    if (e.code === "Digit3" || e.code === "Numpad3") pickGate(2);
  }
});
addEventListener("keyup", e => { keys[e.code] = false; });

// ═══════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════
function btn(id, x, y, w, h, label, style = "primary") {
  UI.buttons.push({ id, x, y, w, h, label, style });
}
function hitUI(x, y) {
  for (const b of UI.buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { onBtn(b.id); return; }
  }
  // title: tap anywhere also starts if quick start zone
  if (state === ST.TITLE && y > H * 0.55) onBtn("play");
}
function onBtn(id) {
  if (id.startsWith("radio_")) {
    ensureAudio();
    setStation(id.slice(6));
    // Preview the station on title/pause
    if (state === ST.TITLE || state === ST.PAUSE || state === ST.HOWTO) startRadio();
    return;
  }
  SFX.click();
  if (id === "play") { state = ST.PLAY; resetGame(); }
  if (id === "howto") state = ST.HOWTO;
  if (id === "back" || id === "menu") { stopRadio(); state = ST.TITLE; }
  if (id === "again") { state = ST.PLAY; resetGame(); }
  if (id === "resume") { state = ST.PLAY; if (!muted) startRadio(); }
  if (id === "share") shareScore();
}
function hitGate(x, y) {
  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) { pickGate(i); return; }
    by += 68;
  }
}
function pickGate(i) {
  if (state !== ST.GATE) return;
  if (i === G.gateCorrect) {
    G.score += Math.round(50 * G.weatherMult);
    floatT(W / 2, 280, "GATE OPEN +50", "#69F0AE", 20);
    confetti(W / 2, 320); SFX.perfect(); msg("Gate accepted. Welcome, Flexer.", 2);
  } else {
    loseHeart("Wrong gate code — HOA delay!");
    shake(12); SFX.fail();
  }
  state = ST.PLAY;
  G.nextGateIn = rand(32, 48);
}

function shareScore() {
  const text = `⚡ Tesla Flex\nScore: ${G.score} · Drops: ${G.deliveries} · Streak: ${G.bestStreak}\nTuned to ${RADIO[station].name} · ${weatherInfo(G.weather).name}\nBeat my route? 📦🚗`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => msg("Score copied — paste anywhere!", 2.4)).catch(() => msg(text.slice(0, 60) + "…", 3));
  } else msg("Score: " + G.score + " · Streak " + G.bestStreak, 3);
  SFX.click();
}

// ═══════════════════════════════════════════════════════════
// THROW
// ═══════════════════════════════════════════════════════════
function throwPkg(tx, ty) {
  if (G.throwCD > 0 || state !== ST.PLAY) return;
  G.throwCD = 0.2;
  const sx = G.carX, sy = CAR_Y - 18;
  const c = clampAim(sx, sy, tx, ty);
  const s = stickyAim(c.x, c.y);
  let ax = s.x, ay = s.y, th = s.house;
  const b = bestStop();
  if (b && Math.abs(b.porch.cx - G.carX) < 100 && Math.abs(c.x - b.porch.cx) < 95) {
    ax = b.porch.cx; ay = b.porch.cy; th = b.house;
  }

  const def = PKG[G.nextPkg] || PKG.standard;
  const wi = weatherInfo(G.weather);
  const d = dist(sx, sy, ax, ay);
  const flight = clamp((d / 300) * def.mass / wi.throw, 0.34, 0.88);

  G.packages.push({
    x: sx, y: sy, sx, sy, tx: ax, ty: ay,
    t: 0, dur: flight,
    arc: lerp(26, 40, Math.min(d / 220, 1)) * def.arc * (G.weather === "rain" ? 0.9 : 1),
    rot: rand(0, Math.PI), vr: rand(-10, 10) / def.mass,
    done: false, type: def.id, def, targetHouse: th,
    trail: [],
  });
  // throw juice
  burst(sx, sy, def.color, 6, 80);
  G.carVX += (sx - ax) * 0.015; // slight recoil weight
  SFX.throw();
  pickNextPackage();
}

// ═══════════════════════════════════════════════════════════
// COMBAT / HEARTS / FSD
// ═══════════════════════════════════════════════════════════
function loseHeart(reason) {
  if (G.invuln > 0 || G.fsd > 0) return false;
  G.hearts--;
  G.invuln = 1.5;
  G.streak = 0;
  shake(14); flash(0.35); hitStop(0.06);
  SFX.heart();
  if (reason) msg(reason, 2.2);
  if (G.hearts <= 0) endRoute(true);
  return true;
}

function oops(reason) {
  // Non-lethal soft fail
  G.fails++;
  G.streak = 0;
  shake(5);
  if (reason) floatT(G.carX, CAR_Y - 60, reason, "#FFCC80", 13);
  SFX.miss();
}

function tryFSD() {
  G.fsdReady++;
  if (G.fsdReady >= FSD_NEED) {
    G.fsdReady = 0;
    G.fsd = FSD_DUR;
    G.fsdTriggers++;
    burst(G.carX, CAR_Y, "#00B0FF", 20, 160);
    ringBurst(G.carX, CAR_Y, "#00E5FF");
    flash(0.3); shake(5); SFX.fsd();
    if (G.fsdTriggers >= 2) unlockAch("fsdSavant");
  }
}

function addScore(base, x, y, showPop = true) {
  const pts = Math.round(base * G.weatherMult * (1 + G.streak * 0.04));
  G.score += pts;
  // Soft score tick — no long words, just a quiet +n
  if (showPop) floatT(x, y, "+" + pts, "rgba(200,230,201,0.95)", 13, 0.65);
  return pts;
}

function endRoute(wrecked) {
  state = ST.END;
  G.wrecked = wrecked;
  stopBgHum();
  META.games++;
  META.totalDrops += G.deliveries;
  if (G.score > META.highScore) { META.highScore = G.score; G.newHigh = true; }
  if (G.bestStreak > META.bestStreak) META.bestStreak = G.bestStreak;
  saveMeta(META);
  if (!wrecked) unlockAch("firstFlex");
  if (G.bestStreak >= 10) unlockAch("porchPerfect");
  if (G.dogIncidents === 0 && G.deliveries >= 3) unlockAch("noDogs");
  if (G.threatBeans >= 5) unlockAch("beanQueen");
  if (G.weather === "golden" && G.score >= 1500) unlockAch("goldenFlex");
  if (!wrecked && G.hearts === 1) unlockAch("survivor");
  if (wrecked) SFX.fail(); else SFX.win();
}

// ═══════════════════════════════════════════════════════════
// LADY
// ═══════════════════════════════════════════════════════════
const SPEED_LIMIT = 120;
function isSpeeding() { return G.speed >= SPEED_LIMIT; }

function tryLady(e, diff) {
  if (G.ladyCD > 0) return;
  if (e < 16 || !isSpeeding()) return;
  if (G.obstacles.some(o => o.type === "lady" && !o.dead)) return;
  const cands = G.houses.filter(h => !h.ladySpawned && h.y > 120 && h.y < CAR_Y - 140);
  if (!cands.length) return;
  const over = clamp((G.speed - SPEED_LIMIT) / 40, 0, 1);
  if (Math.random() > 0.012 + over * 0.03 + diff * 0.015) return;
  spawnLady(pick(cands));
}

function spawnLady(h) {
  h.ladySpawned = true;
  G.ladyCD = rand(10, 16);
  const p = getPorch(h);
  G.obstacles.push({
    type: "lady", x: p.cx, y: h.y + 18, w: 22, h: 36,
    vx: 0, dead: false, hit: false, phase: "exit",
    roadX: h.side === 0 ? ROAD_L + rand(36, 70) : ROAD_R - rand(36, 70),
    age: 0, wave: 0, yellT: 0, yellText: "I'M FILMING!", anim: 0,
  });
  floatT(p.cx, h.y, "!", "#F8BBD0", 18, 0.7);
  SFX.lady(); burst(p.cx, h.y + 18, "#F8BBD0", 10);
}

function updateLady(o, dt) {
  o.age += dt; o.wave += dt * 14; o.yellT -= dt; o.anim += dt * 10;
  if (o.phase === "exit") {
    o.x += Math.sign(o.roadX - o.x) * Math.min(Math.abs(o.roadX - o.x), 150 * dt);
    o.y += 55 * dt;
    if (Math.abs(o.x - o.roadX) < 6) {
      o.phase = "chase"; o.x = o.roadX;
      o.yellText = pick(["I'M FILMING!","HOA CHAT!","SLOW DOWN!"]);
      o.yellT = 1.1; SFX.lady();
    }
  } else {
    o.vx = lerp(o.vx || 0, clamp((G.carX - o.x) * 3.2, -170, 170), 1 - Math.pow(0.02, dt));
    o.x = clamp(o.x + o.vx * dt, ROAD_L + 16, ROAD_R - 16);
    o.y += 100 * dt;
    if (o.yellT <= 0 && Math.random() < 0.02) {
      o.yellText = pick(["SENDING TO HOA!","GOT YOUR PLATE!","TESLA HOOLIGAN!"]);
      o.yellT = 1.3;
    }
  }
  if (o.y > CAR_Y + 80 || o.age > 8) o.dead = true;
}

// ═══════════════════════════════════════════════════════════
// PACKAGE RESOLUTION
// ═══════════════════════════════════════════════════════════
function resolveMidair(pk) {
  for (const o of G.obstacles) {
    if (o.dead || o.pkgHit) continue;
    const r = o.type === "car" ? 28 : o.type === "lady" ? 22 : 17;
    if (dist(pk.x, pk.y, o.x, o.y) < r) return hitEntity(pk, o);
  }
  // Windows first (specific), then parked cars — geometry from layoutHouse
  for (const h of G.houses) {
    if (!h.windowBroken && hitsWindow(pk, h)) return hitWindow(pk, h);
  }
  for (const h of G.houses) {
    if (h.parkedCar && hitsParked(pk, h)) return hitParked(pk, h);
  }
  return false;
}

function hitsWindow(pk, h) {
  const L = layoutHouse(h);
  return pk.x > L.winX && pk.x < L.winX + L.winW &&
         pk.y > L.winY && pk.y < L.winY + L.winH;
}

function hitsParked(pk, h) {
  const L = layoutHouse(h);
  if (!L.car) return false;
  const c = L.car;
  return pk.x > c.x + 3 && pk.x < c.x + c.w - 3 &&
         pk.y > c.y + 4 && pk.y < c.y + c.h - 4;
}

function hitEntity(pk, o) {
  o.pkgHit = true;
  const dismiss = { lady: 60, ped: 40, dog: 35, scooter: 28, cone: 22 };
  if (dismiss[o.type] != null) {
    const bonus = Math.round(dismiss[o.type] * (pk.def?.mult || 1));
    G.score += Math.round(bonus * G.weatherMult);
    G.threatBeans++;
    G.streak++; // still counts as stylish
    G.bestStreak = Math.max(G.bestStreak, G.streak);
    o.dead = true; o.hit = true;
    confetti(o.x, o.y); shake(7); hitStop(0.05);
    floatT(o.x, o.y - 14, "+" + bonus, "#A5D6A7", 13, 0.7);
    SFX.dismiss();
    if (o.type === "dog") SFX.bark();
    return true;
  }
  if (o.type === "car") {
    G.score = Math.max(0, G.score - 15); G.streak = 0;
    burst(pk.x, pk.y, "#90A4AE", 14); shake(6);
    burst(pk.x, pk.y, "#90A4AE", 10); shake(4);
    SFX.horn(); SFX.crack(); return true;
  }
  return false;
}

function hitParked(pk, h) {
  const pc = h.parkedCar;
  if (!pc.cracked) {
    pc.cracked = pc.dented = true;
    G.score = Math.max(0, G.score - 20); G.fails++; G.streak = 0;
    burst(pk.x, pk.y, "#B0BEC5", 14); shake(6);
    floatT(pk.x, pk.y, "−20", "rgba(239,154,154,0.9)", 12, 0.55);
    SFX.crack();
  } else {
    burst(pk.x, pk.y, "#9E9E9E", 6); SFX.land();
  }
  return true;
}

function hitWindow(pk, h) {
  h.windowBroken = true; h.windowLit = false;
  G.score = Math.max(0, G.score - 25); G.fails++; G.streak = 0;
  burst(pk.x, pk.y, "#E1F5FE", 14); shake(6); flash(0.12);
  floatT(pk.x, pk.y, "−25", "rgba(129,212,250,0.9)", 12, 0.55);
  SFX.crack();
  return true;
}

function resolveLand(pk) {
  if (resolveMidair(pk)) return;
  const ordered = [];
  if (pk.targetHouse && isActive(pk.targetHouse)) ordered.push(pk.targetHouse);
  for (const h of G.houses) if (h !== pk.targetHouse) ordered.push(h);

  for (const h of ordered) {
    const porch = getPorch(h);
    const on = pk.x > porch.x && pk.x < porch.x + porch.w && pk.y > porch.y && pk.y < porch.y + porch.h;
    const near = isActive(h) && dist(pk.x, pk.y, porch.cx, porch.cy) < lerp(50, 34, difficulty() / MAX_DIFF);
    const perfect = isActive(h) && dist(pk.x, pk.y, porch.cx, porch.cy) < 16;

    if (on || near) {
      if (!h.needsDelivery) { oops(); return; }
      if (h.delivered) return;

      if (h.hasPirate && !h.pirateHit) {
        h.pirateHit = h.delivered = true;
        G.pirateBonus++; G.deliveries++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
        const pts = addScore(75 * (pk.def?.mult || 1), porch.cx, porch.cy, "PIRATE +{n}");
        confetti(porch.cx, porch.cy); shake(8); tryFSD(); SFX.dismiss(); return;
      }
      if (h.hasRing && Math.random() < lerp(0.05, 0.14, difficulty() / MAX_DIFF)) {
        h.ringHit = true; G.fails++; G.streak = 0;
        G.score = Math.max(0, G.score - 10);
        floatT(pk.x, pk.y, "−10", "rgba(255,171,145,0.9)", 12, 0.5); SFX.miss(); return;
      }

      h.delivered = true;
      G.deliveries++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
      let base = 100 * (pk.def?.mult || 1);
      if (h.special === "fresh") base *= 2;
      if (h.special === "prime") base *= 1.5;
      if (perfect) { base *= 1.35; G.perfects++; }

      if (h.hasSnack && !h.snackTaken) {
        h.snackTaken = true; G.snacks++; base += 40;
        confetti(porch.cx, porch.cy); SFX.perfect();
      } else if (perfect) {
        confetti(porch.cx, porch.cy); ringBurst(porch.cx, porch.cy, "#FFD54F"); SFX.perfect();
      } else {
        burst(porch.cx, porch.cy, "#FF9900", 14); SFX.deliver();
      }

      addScore(base, porch.cx, porch.cy - 8, "+");
      shake(perfect ? 10 : 5); hitStop(0.035); tryFSD();
      return;
    }

    if (h.hasPool) {
      const pool = { x: h.poolX - 30, y: h.y + 4, w: 60, h: 42 };
      if (pk.x > pool.x && pk.x < pool.x + pool.w && pk.y > pool.y && pk.y < pool.y + pool.h) {
        G.fails++; G.streak = 0; G.score = Math.max(0, G.score - 20);
        burst(pk.x, pk.y, "#29B6F6", 16); floatT(pk.x, pk.y, "−20", "rgba(79,195,247,0.9)", 12, 0.5);
        SFX.splash(); return;
      }
    }
    if (h.hasDog) {
      const Ldog = layoutHouse(h);
      const dx = h.side === 0 ? Ldog.hx + 12 : Ldog.hx + Ldog.hw - 12;
      const dy = Ldog.driveTop + 18;
      if (dist(pk.x, pk.y, dx, dy) < 30) {
        G.fails++; G.dogIncidents++; G.streak = 0; G.score = Math.max(0, G.score - 8);
        burst(pk.x, pk.y, "#A1887F", 8); SFX.bark(); SFX.miss();
        return;
      }
    }
  }

  // driveway slab (below house — not porch)
  for (const h of G.houses) {
    if (!h.hasDriveway) continue;
    const L = layoutHouse(h);
    const top = L.driveTop;
    const dw = Math.min(L.hw + 8, 58);
    const dx = h.side === 0 ? L.hx + 4 : L.hx + L.hw - dw - 4;
    if (pk.x > dx && pk.x < dx + dw && pk.y > top && pk.y < top + 52) {
      if (h.parkedCar && hitsParked(pk, h)) continue;
      burst(pk.x, pk.y, "#9E9E9E", 6); G.streak = 0; SFX.land(); return;
    }
  }

  if (pk.x > ROAD_L && pk.x < ROAD_R) {
    burst(pk.x, pk.y, "#546E7A", 6); G.streak = 0; SFX.miss();
  } else {
    burst(pk.x, pk.y, "#7CB342", 6); G.streak = 0; SFX.miss();
  }
}

// ═══════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════
let lastT = now();

function update(dt) {
  // ambient always
  for (const c of G.clouds) {
    c.x += c.s * dt * (0.1 + c.layer * 0.12);
    if (c.x > W + 100) c.x = -100;
  }
  for (const b of G.birds) {
    b.x += b.s * dt; b.flap += dt * 9;
    if (b.x > W + 30) { b.x = -20; b.y = rand(40, 110); }
  }
  for (const r of G.rain) {
    r.y += 220 * r.z * dt;
    r.x += 18 * dt;
    if (r.y > H) { r.y = -10; r.x = rand(-20, W); }
  }

  if (state === ST.TITLE || state === ST.HOWTO) {
    G.scroll += 32 * dt; G.roadLines += 32 * dt;
    if (!G.houses.length) for (let i = 0; i < 5; i++) spawnHouse(i * 200 - 80);
    for (const h of G.houses) h.y += 32 * dt;
    for (const p of G.props) p.y += 32 * dt;
    G.houses = G.houses.filter(h => h.y < H + 120);
    G.props = G.props.filter(p => p.y < H + 120);
    if (G.houses.length < 4) spawnHouse(-90);
    G.carX = ROAD_CX + Math.sin(now() / 900) * 40;
    return;
  }
  if (state === ST.PAUSE || state === ST.END) return;

  if (G.hitStop > 0) { G.hitStop -= dt; return; } // freeze frames for juice

  if (state === ST.GATE) {
    G.gateTimer -= dt;
    if (G.gateTimer <= 0) { loseHeart("Gate timeout!"); state = ST.PLAY; G.nextGateIn = rand(35, 50); }
    updateFX(dt); return;
  }

  // PLAY
  G.time -= dt;
  if (G.time <= 0) { G.time = 0; endRoute(false); return; }

  if (G.invuln > 0) G.invuln -= dt;
  if (G.throwCD > 0) G.throwCD -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 28);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.2);
  if (G.eventT > 0) { G.eventT -= dt; if (G.eventT <= 0) G.event = null; }
  if (G.ladyCD > 0) G.ladyCD -= dt;

  const e = elapsed();
  // One short tip early, then stay quiet
  if (G.coachPhase === 0 && e > 0.8) {
    G.coachPhase = 1;
    msg("Bottom = steer · Top = throw", 2.4);
  } else if (G.coachPhase === 1 && e > 4) {
    G.coachPhase = 2;
  }

  // Special events (banner only — no long toast spam)
  if (!G.event && e > 20 && Math.random() < 0.0025) {
    G.event = pick(["fresh_boost", "construction", "dog_zone"]);
    G.eventT = 12;
  }

  if (G.fsd > 0) {
    G.fsd -= dt;
    if (G.fsd <= 0) G.fsd = 0;
  }

  const diff = difficulty();
  G.baseSpeed = lerp(90, 158, easeOut(diff / MAX_DIFF));
  if (G.event === "construction") G.baseSpeed *= 0.92;
  G.speed = G.baseSpeed * (G.fsd > 0 ? 1.06 : 1);
  const scrollAmt = G.speed * dt;
  G.scroll += scrollAmt; G.roadLines += scrollAmt;
  // subtle camera sway
  G.cameraY = lerp(G.cameraY, Math.sin(now() / 700) * 2 + G.carVX * 0.01, 0.1);

  // Steering with weight
  let inputX = 0;
  if (keys.ArrowLeft || keys.KeyA) inputX -= 1;
  if (keys.ArrowRight || keys.KeyD) inputX += 1;

  if (G.fsd > 0) {
    let avoid = 0, best = 1e9;
    for (const o of G.obstacles) {
      if (o.dead || o.y < CAR_Y - 220 || o.y > CAR_Y + 40) continue;
      const dx = o.x - G.carX, threat = Math.abs(dx) + Math.abs(o.y - CAR_Y) * 0.35;
      if (threat < best && Math.abs(dx) < 72) { best = threat; avoid = dx > 0 ? -1 : 1; }
    }
    G.carVX = lerp(G.carVX, avoid * 210 + (ROAD_CX - G.carX) * 0.5, 1 - Math.pow(0.001, dt));
  } else if (G.steerTarget != null) {
    G.carVX = lerp(G.carVX, clamp((G.steerTarget - G.carX) * 5.2, -250, 250), 1 - Math.pow(0.0005, dt));
  } else {
    G.carVX = lerp(G.carVX, inputX * 240, 1 - Math.pow(0.001, dt));
    if (!inputX) G.carVX *= Math.pow(0.08, dt);
  }
  // weight: clamp accel feel
  G.carX = clamp(G.carX + G.carVX * dt, ROAD_L + 26, ROAD_R - 26);
  G.carLean = lerp(G.carLean, clamp(G.carVX / 380, -0.12, 0.12), 0.15);

  // Scroll world
  for (const h of G.houses) h.y += scrollAmt;
  for (const p of G.props) p.y += scrollAmt;
  for (const o of G.obstacles) {
    o.y += scrollAmt; o.anim += dt * 8;
    if (o.type === "lady") updateLady(o, dt);
    else {
      if (o.type === "car") o.y += (o.vy || 0) * dt;
      o.x += (o.vx || 0) * dt;
      if ((o.type === "scooter" || o.type === "ped" || o.type === "dog") && (o.x < ROAD_L + 14 || o.x > ROAD_R - 14)) o.vx *= -1;
    }
  }

  G.nextHouseDist -= scrollAmt;
  if (G.nextHouseDist <= 0) {
    spawnHouse(-100);
    G.nextHouseDist = lerp(235, 175, diff / MAX_DIFF);
  }

  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    if (e > 7) spawnObstacle();
    G.spawnT = lerp(4.6, 1.7, easeOut(diff / MAX_DIFF)) * (G.event === "construction" ? 0.65 : 1);
  }

  if (e > EASY_SECS + 10) {
    G.nextGateIn -= dt;
    if (G.nextGateIn <= 0) startGate();
  }

  tryLady(e, diff);

  // Packages
  for (const pk of G.packages) {
    if (pk.done) continue;
    pk.t += dt;
    const u = clamp(pk.t / pk.dur, 0, 1);
    const ease = smooth(u);
    pk.x = lerp(pk.sx, pk.tx, ease);
    pk.y = lerp(pk.sy, pk.ty, ease) - Math.sin(u * Math.PI) * pk.arc;
    pk.rot += pk.vr * dt;
    // trail
    pk.trail.push({ x: pk.x, y: pk.y, a: 1 });
    if (pk.trail.length > 10) pk.trail.shift();
    for (const t of pk.trail) t.a *= 0.88;

    if (u > 0.12 && u < 0.98 && resolveMidair(pk)) { pk.done = true; continue; }
    if (u >= 1) { pk.done = true; resolveLand(pk); }
  }
  G.packages = G.packages.filter(p => !p.done || ((p.fade = (p.fade ?? 0.18) - dt) > 0));

  // Collisions car
  const car = { x: G.carX - 22, y: CAR_Y - 48, w: 44, h: 78 };
  for (const o of G.obstacles) {
    if (o.dead || o.hit) continue;
    if (o.y < CAR_Y - 100 || o.y > CAR_Y + 55) continue;
    const ob = { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h };
    if (car.x < ob.x + ob.w && car.x + car.w > ob.x && car.y < ob.y + ob.h && car.y + car.h > ob.y) {
      o.hit = true; o.dead = true;
      onCarHit(o);
    }
  }

  G.houses = G.houses.filter(h => h.y < H + 130);
  G.props = G.props.filter(p => p.y < H + 130);
  G.obstacles = G.obstacles.filter(o => !o.dead && o.y < H + 100);
  updateFX(dt);
  for (const m of G.messages) m.life -= dt;
  G.messages = G.messages.filter(m => m.life > 0);
}

function onCarHit(o) {
  if (G.fsd > 0) {
    burst(o.x, o.y, "#00B0FF", 8); return;
  }
  if (o.type === "lady") {
    G.ladyHits++;
    loseHeart(pick(["Too fast — HOA noticed!", "Watch the speed on this block!"]));
    burst(o.x, o.y, "#CE93D8", 12); SFX.lady();
    return;
  }
  const table = {
    cone: "Traffic cone!", scooter: "Lime scooter!", car: "Fender bender!",
    ped: "Phone zombie!", dog: "Doggo attack!",
  };
  if (o.type === "dog") { G.dogIncidents++; SFX.bark(); }
  if (o.type === "car") SFX.horn();
  loseHeart(table[o.type] || "Ouch!");
  burst(o.x, o.y, "#FF7043", 14); SFX.hit();
}

function startGate() {
  state = ST.GATE;
  const correct = String(randi(1000, 9999));
  const opts = new Set([correct]);
  while (opts.size < 3) {
    const digits = correct.split("");
    digits[randi(0, 3)] = String(randi(0, 9));
    opts.add(digits.join(""));
  }
  G.gateOptions = [...opts].sort(() => Math.random() - 0.5);
  G.gateCorrect = G.gateOptions.indexOf(correct);
  G.gateTimer = 10;
  msg("GATED COMMUNITY — pick the code!", 2);
}

function updateFX(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.g ?? 160) * dt; p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const f of G.floatText) { f.y += f.vy * dt; f.life -= dt; }
  G.floatText = G.floatText.filter(f => f.life > 0);
}

// ═══════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════
function draw() {
  ctx.save();
  // camera + shake
  let sx = 0, sy = G.cameraY || 0;
  if (G.shake > 0) {
    sx += rand(-G.shake, G.shake);
    sy += rand(-G.shake, G.shake) * 0.7;
  }
  ctx.translate(sx, sy);

  drawSky();
  drawParallaxFar();
  drawGround();
  drawRoad();
  drawProps();
  drawHouses();
  drawObstacles();
  drawAim();
  drawPackages();
  drawTesla();
  drawParticles();
  drawFloats();
  drawWeatherOverlay();

  ctx.restore();

  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === ST.TITLE) drawTitle();
  else if (state === ST.HOWTO) drawHowTo();
  else if (state === ST.PLAY || state === ST.GATE) { drawHUD(); if (state === ST.GATE) drawGate(); }
  else if (state === ST.PAUSE) { drawHUD(); drawPause(); }
  else if (state === ST.END) drawEnd();

  // achievement toast
  if (G.unlockQueue.length) {
    const a = G.unlockQueue[0];
    ctx.fillStyle = "rgba(10,22,40,0.9)";
    roundRect(30, H - 90, W - 60, 44, 12); ctx.fill();
    ctx.strokeStyle = "#FFD54F"; ctx.lineWidth = 2;
    roundRect(30, H - 90, W - 60, 44, 12); ctx.stroke();
    ctx.fillStyle = "#FFD54F"; ctx.font = "bold 13px system-ui"; ctx.textAlign = "center";
    ctx.fillText("🏆 " + a.title, W / 2, H - 72);
    ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.font = "11px system-ui";
    ctx.fillText(a.desc, W / 2, H - 56);
    if (state === ST.PLAY) {
      // auto pop after a moment via life on fake message
    }
  }
}

function drawSky() {
  let g;
  if (G.weather === "golden") {
    g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, "#1A237E"); g.addColorStop(0.4, "#E65100"); g.addColorStop(0.75, "#FFB74D"); g.addColorStop(1, "#FFE0B2");
  } else if (G.weather === "rain" || G.weather === "cloudy") {
    g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, "#546E7A"); g.addColorStop(0.5, "#90A4AE"); g.addColorStop(1, "#B0BEC5");
  } else {
    g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, "#3B7DD6"); g.addColorStop(0.45, "#6BB3E0"); g.addColorStop(1, "#D4EBF5");
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // sun
  if (G.weather !== "rain") {
    const sx = G.weather === "golden" ? 60 : W - 50;
    const sy = G.weather === "golden" ? 90 : 48;
    const rg = ctx.createRadialGradient(sx, sy, 2, sx, sy, 70);
    rg.addColorStop(0, G.weather === "golden" ? "rgba(255,180,80,0.95)" : "rgba(255,252,220,1)");
    rg.addColorStop(0.4, "rgba(255,210,100,0.3)");
    rg.addColorStop(1, "rgba(255,180,80,0)");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, 70, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = G.weather === "golden" ? "#FF8A65" : "#FFF59D";
    ctx.beginPath(); ctx.arc(sx, sy, 16, 0, Math.PI * 2); ctx.fill();
  }
  for (const c of G.clouds) drawCloud(c);
  for (const b of G.birds) {
    const flap = Math.sin(b.flap) * 5;
    ctx.strokeStyle = "rgba(40,45,55,0.45)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x - 7, b.y + flap); ctx.quadraticCurveTo(b.x, b.y - 3, b.x + 7, b.y + flap);
    ctx.stroke();
  }
}

function drawCloud(c) {
  const a = G.weather === "rain" ? 0.55 : 0.75 + c.layer * 0.2;
  ctx.fillStyle = G.weather === "rain" || G.weather === "cloudy" ? `rgba(176,190,197,${a})` : `rgba(255,255,255,${a})`;
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.w * 0.5, c.w * 0.2, 0, 0, Math.PI * 2);
  ctx.ellipse(c.x - c.w * 0.28, c.y + 3, c.w * 0.28, c.w * 0.15, 0, 0, Math.PI * 2);
  ctx.ellipse(c.x + c.w * 0.25, c.y + 2, c.w * 0.3, c.w * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawParallaxFar() {
  // distant treeline
  ctx.fillStyle = G.weather === "golden" ? "rgba(80,50,30,0.2)" : "rgba(60,100,45,0.18)";
  ctx.beginPath(); ctx.moveTo(0, H * 0.36);
  for (let i = 0; i <= 14; i++) {
    const tx = (i / 14) * W;
    const th = 8 + Math.sin(i * 1.7 + G.scroll * 0.0015) * 5 + (i % 3) * 3;
    ctx.lineTo(tx, H * 0.36 - th);
  }
  ctx.lineTo(W, H * 0.4); ctx.lineTo(0, H * 0.4); ctx.fill();
}

function drawGround() {
  // Warm Florida lawns — richer greens with soft depth
  const g1 = ctx.createLinearGradient(0, 0, ROAD_L, 0);
  g1.addColorStop(0, "#5A8F35");
  g1.addColorStop(0.55, "#7CB342");
  g1.addColorStop(1, "#9CCC65");
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, ROAD_L, H);
  const g2 = ctx.createLinearGradient(ROAD_R, 0, W, 0);
  g2.addColorStop(0, "#9CCC65");
  g2.addColorStop(0.45, "#7CB342");
  g2.addColorStop(1, "#5A8F35");
  ctx.fillStyle = g2;
  ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);

  // Soft mower bands
  for (let i = 0; i < 18; i++) {
    const yy = ((i * 48 + G.scroll * 0.22) % (H + 48)) - 24;
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.025)";
    ctx.fillRect(0, yy, ROAD_L - 12, 22);
    ctx.fillRect(ROAD_R + 12, yy, W - ROAD_R - 12, 22);
  }
  // Sandy Florida soil flecks
  ctx.fillStyle = "rgba(210,180,120,0.12)";
  for (let i = 0; i < 8; i++) {
    const yy = ((i * 90 + G.scroll * 0.15) % (H + 90)) - 20;
    ctx.beginPath();
    ctx.ellipse(18 + (i % 3) * 14, yy, 14, 5, 0, 0, Math.PI * 2);
    ctx.ellipse(W - 22 - (i % 2) * 12, yy + 30, 12, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Concrete sidewalks with soft edge
  const sw = ctx.createLinearGradient(ROAD_L - 18, 0, ROAD_L, 0);
  sw.addColorStop(0, "#D5CFC4");
  sw.addColorStop(1, "#C4BDB0");
  ctx.fillStyle = sw;
  ctx.fillRect(ROAD_L - 17, 0, 13, H);
  const sw2 = ctx.createLinearGradient(ROAD_R, 0, ROAD_R + 18, 0);
  sw2.addColorStop(0, "#C4BDB0");
  sw2.addColorStop(1, "#D5CFC4");
  ctx.fillStyle = sw2;
  ctx.fillRect(ROAD_R + 4, 0, 13, H);
  // expansion joints
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 22; i++) {
    const yy = ((i * 46 - G.scroll * 0.9) % (H + 46));
    ctx.beginPath();
    ctx.moveTo(ROAD_L - 17, yy); ctx.lineTo(ROAD_L - 4, yy);
    ctx.moveTo(ROAD_R + 4, yy); ctx.lineTo(ROAD_R + 17, yy);
    ctx.stroke();
  }

  // Warm sand curb
  ctx.fillStyle = "#E0C9A0";
  ctx.fillRect(ROAD_L - 5, 0, 5, H);
  ctx.fillRect(ROAD_R, 0, 5, H);
  ctx.fillStyle = "rgba(255,255,255,0.2)";
  ctx.fillRect(ROAD_L - 5, 0, 1.5, H);
  ctx.fillRect(ROAD_R + 3.5, 0, 1.5, H);
}

function drawRoad() {
  // Sun-bleached asphalt with center crown
  const ag = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
  ag.addColorStop(0, "#4A5A63");
  ag.addColorStop(0.2, "#5A6C76");
  ag.addColorStop(0.5, "#667A85");
  ag.addColorStop(0.8, "#5A6C76");
  ag.addColorStop(1, "#4A5A63");
  ctx.fillStyle = ag;
  ctx.fillRect(ROAD_L, 0, ROAD_W, H);

  // Soft asphalt grain
  ctx.fillStyle = "rgba(0,0,0,0.04)";
  for (let i = 0; i < 10; i++) {
    const yy = ((i * 85 + G.scroll * 0.4) % (H + 85)) - 30;
    ctx.beginPath();
    ctx.ellipse(ROAD_CX + Math.sin(i * 1.7) * 30, yy, 42, 12, 0.05, 0, Math.PI * 2);
    ctx.fill();
  }

  // Yellow center dashes with soft glow
  ctx.strokeStyle = "rgba(255,236,100,0.25)";
  ctx.lineWidth = 7;
  ctx.setLineDash([24, 18]);
  ctx.lineDashOffset = -G.roadLines * 0.95;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX, 0);
  ctx.lineTo(ROAD_CX, H);
  ctx.stroke();
  ctx.strokeStyle = "#FFE566";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX, 0);
  ctx.lineTo(ROAD_CX, H);
  ctx.stroke();
  ctx.setLineDash([]);

  // White edge lines
  ctx.strokeStyle = "rgba(255,255,255,0.85)";
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 5, 0); ctx.lineTo(ROAD_L + 5, H);
  ctx.moveTo(ROAD_R - 5, 0); ctx.lineTo(ROAD_R - 5, H);
  ctx.stroke();
  // Soft outer edge shadow into curb
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 1, 0); ctx.lineTo(ROAD_L + 1, H);
  ctx.moveTo(ROAD_R - 1, 0); ctx.lineTo(ROAD_R - 1, H);
  ctx.stroke();
}

function drawProps() {
  const sorted = G.props.slice().sort((a, b) => a.y - b.y);
  for (const p of sorted) {
    if (p.y < -100 || p.y > H + 90) continue;
    if (p.type === "palm") drawPalm(p.x, p.y, p.scale || 1);
    if (p.type === "pool") drawPool(p.x, p.y);
    if (p.type === "bush") {
      softShadow(6, 0.12);
      ctx.fillStyle = "#558B2F";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 14, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(p.x - 8, p.y + 2, 10, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(p.x + 8, p.y + 1, 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#8BC34A";
      ctx.beginPath();
      ctx.ellipse(p.x - 2, p.y - 3, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (p.type === "pole") {
      ctx.fillStyle = "#6D4C41"; ctx.fillRect(p.x - 2.5, p.y - 20, 5, 70);
      ctx.fillStyle = "#5D4037"; ctx.fillRect(p.x - 12, p.y - 18, 24, 3.5);
    }
    if (p.type === "hydrant") {
      ctx.fillStyle = "#E53935"; roundRect(p.x, p.y, 8, 12, 2); ctx.fill();
      ctx.fillRect(p.x - 3, p.y + 3, 14, 4);
    }
    }
}

function drawPalm(x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  // Soft ground shadow
  softShadow(10, 0.15);
  ctx.fillStyle = "rgba(0,0,0,0.14)";
  ctx.beginPath();
  ctx.ellipse(3, 36, 18, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();
  // Trunk with segments
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 8;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 34);
  ctx.quadraticCurveTo(7, 10, -1, -40);
  ctx.stroke();
  ctx.strokeStyle = "#A1887F";
  ctx.lineWidth = 2;
  for (let i = 0; i < 6; i++) {
    const t = i / 6;
    const px = lerp(0, -0.5, t) + Math.sin(t * 4) * 1.5;
    const py = lerp(30, -28, t);
    ctx.beginPath();
    ctx.moveTo(px - 3, py);
    ctx.lineTo(px + 3, py);
    ctx.stroke();
  }
  // Layered fronds (filled teardrops for silhouette)
  const baseY = -40;
  for (let i = 0; i < 8; i++) {
    const a = -Math.PI / 2 + (i - 3.5) * 0.36;
    const len = 34 + (i % 3) * 5;
    ctx.fillStyle = i % 2 ? "#43A047" : "#2E7D32";
    ctx.beginPath();
    ctx.moveTo(-1, baseY);
    const mx = -1 + Math.cos(a) * len * 0.55;
    const my = baseY + Math.sin(a) * len * 0.35 - 8;
    const ex = -1 + Math.cos(a) * len;
    const ey = baseY + Math.sin(a) * len * 0.72;
    ctx.quadraticCurveTo(mx, my, ex, ey);
    ctx.quadraticCurveTo(mx + Math.cos(a + 1.2) * 6, my + 4, -1, baseY);
    ctx.fill();
  }
  // Highlight fronds
  ctx.strokeStyle = "rgba(129,199,132,0.5)";
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 4; i++) {
    const a = -Math.PI / 2 + (i - 1.5) * 0.4;
    ctx.beginPath();
    ctx.moveTo(-1, baseY);
    ctx.quadraticCurveTo(
      -1 + Math.cos(a) * 16, baseY - 10 + Math.sin(a) * 6,
      -1 + Math.cos(a) * 32, baseY + Math.sin(a) * 20
    );
    ctx.stroke();
  }
  // Coconuts
  ctx.fillStyle = "#6D4C41";
  ctx.beginPath();
  ctx.arc(-3, -36, 3.2, 0, Math.PI * 2);
  ctx.arc(2, -34, 2.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPool(x, y) {
  const pg = ctx.createLinearGradient(x, y, x, y + 44);
  pg.addColorStop(0, "#4DD0E1"); pg.addColorStop(1, "#00ACC1");
  ctx.fillStyle = pg; roundRect(x - 30, y, 60, 42, 12); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)"; roundRect(x - 20, y + 5, 26, 10, 5); ctx.fill();
  ctx.strokeStyle = "#00838F"; ctx.lineWidth = 3; roundRect(x - 30, y, 60, 42, 12); ctx.stroke();
}

function drawHouses() {
  for (const h of G.houses.slice().sort((a, b) => a.y - b.y)) {
    if (h.y < -140 || h.y > H + 100) continue;
    drawHouse(h);
  }
}

function drawHouse(h) {
  const L = layoutHouse(h);
  const { hx, hy, hw, hh } = L;
  const facingRight = h.side === 0;

  // Driveway slab BELOW house (toward player) — car parks here, not under porch
  if (h.hasDriveway) {
    const top = L.driveTop;
    const dw = Math.min(hw + 8, 58);
    const dx = facingRight ? hx + 4 : hx + hw - dw - 4;
    ctx.fillStyle = "#9E9E9E";
    roundRect(dx, top, dw, 52, 3);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(dx + 4, top + i * 12);
      ctx.lineTo(dx + dw - 4, top + i * 12);
      ctx.stroke();
    }
    // curb cut toward road
    ctx.fillStyle = "#BDBDBD";
    if (facingRight) {
      ctx.beginPath();
      ctx.moveTo(dx + dw, top + 20);
      ctx.lineTo(ROAD_L - 4, top + 28);
      ctx.lineTo(ROAD_L - 4, top + 44);
      ctx.lineTo(dx + dw, top + 40);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(dx, top + 20);
      ctx.lineTo(ROAD_R + 4, top + 28);
      ctx.lineTo(ROAD_R + 4, top + 44);
      ctx.lineTo(dx, top + 40);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Parked car first (under driveway, never covering porch)
  if (h.parkedCar) drawParked(h);

  // Soft house shadow
  softShadow(12, 0.16);
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(hx + hw / 2 + 2, hy + hh + 5, hw * 0.44, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();

  // Foundation / brick skirt
  ctx.fillStyle = h.brick;
  roundRect(hx - 1, hy + hh - 11, hw + 2, 13, 2);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  for (let r = 0; r < 2; r++) {
    for (let c = 0; c < 5; c++) {
      ctx.fillRect(hx + 3 + c * 9 + (r % 2) * 4, hy + hh - 9 + r * 4, 7, 2.5);
    }
  }

  // Stucco body with soft lighting
  const bg = ctx.createLinearGradient(hx, hy, hx + hw, hy + hh);
  bg.addColorStop(0, shade(h.color, 14));
  bg.addColorStop(0.4, h.color);
  bg.addColorStop(1, shade(h.color, -16));
  softShadow(8, 0.1);
  ctx.fillStyle = bg;
  roundRect(hx, hy, hw, hh - 8, 5);
  ctx.fill();
  clearShadow();
  // Subtle stucco speckles
  ctx.fillStyle = "rgba(255,255,255,0.06)";
  for (let i = 0; i < 8; i++) {
    ctx.fillRect(hx + 4 + (i * 13) % (hw - 10), hy + 10 + (i * 11) % (hh - 28), 3, 2);
  }
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1.2;
  roundRect(hx, hy, hw, hh - 8, 5);
  ctx.stroke();
  if (h.style === "modern") {
    ctx.fillStyle = h.accent;
    roundRect(hx, hy + 8, 5, hh - 26, 1);
    ctx.fill();
  }

  // Roof with soft volume
  softShadow(6, 0.12);
  ctx.fillStyle = h.roof;
  ctx.beginPath();
  if (h.style === "modern") {
    ctx.moveTo(hx - 3, hy + 10);
    ctx.lineTo(hx + 2, hy - 8);
    ctx.lineTo(hx + hw + 4, hy + 4);
    ctx.lineTo(hx + hw + 2, hy + 10);
  } else {
    ctx.moveTo(hx - 5, hy + 10);
    ctx.lineTo(hx + hw / 2, hy - 18);
    ctx.lineTo(hx + hw + 5, hy + 10);
  }
  ctx.closePath();
  ctx.fill();
  clearShadow();
  // Shingle bands
  if (h.style !== "modern") {
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      const t = 0.2 + i * 0.18;
      const y1 = lerp(hy - 18, hy + 10, t);
      const half = lerp(0, hw / 2 + 5, t);
      ctx.beginPath();
      ctx.moveTo(hx + hw / 2 - half, y1);
      ctx.lineTo(hx + hw / 2 + half, y1);
      ctx.stroke();
    }
  }
  // Roof highlight edge
  ctx.strokeStyle = "rgba(255,255,255,0.12)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(hx + 4, hy + 8);
  ctx.lineTo(hx + hw / 2, hy - 14);
  ctx.stroke();
  // Gutter
  ctx.strokeStyle = h.trim;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(hx - 3, hy + 10);
  ctx.lineTo(hx + hw + 3, hy + 10);
  ctx.stroke();

  // Subtle special house accent (no loud billboard text)
  if (h.special && !h.delivered && h.needsDelivery) {
    ctx.fillStyle = h.special === "fresh" ? "rgba(0,200,83,0.55)" : "rgba(255,153,0,0.5)";
    roundRect(hx + hw / 2 - 8, hy - 2, 16, 4, 2);
    ctx.fill();
  }

  // Garage on yard side (away from road)
  if (h.garage) {
    const gx = facingRight ? hx + 4 : hx + hw - 26;
    ctx.fillStyle = "#78909C";
    roundRect(gx, hy + hh - 36, 24, 26, 2);
    ctx.fill();
    ctx.strokeStyle = "#546E7A";
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(gx + 2, hy + hh - 30 + i * 6);
      ctx.lineTo(gx + 22, hy + hh - 30 + i * 6);
      ctx.stroke();
    }
  }

  // Door on road-facing wall
  const doorX = L.doorX;
  const doorY = L.doorY;
  ctx.fillStyle = h.trim;
  roundRect(doorX - 1, doorY, 18, 28, 2);
  ctx.fill();
  ctx.fillStyle = shade(h.accent, -25);
  roundRect(doorX, doorY + 2, 16, 24, 2);
  ctx.fill();
  if (h.hasRing) {
    ctx.fillStyle = h.ringHit ? "#FF5252" : "#263238";
    ctx.beginPath();
    ctx.arc(doorX + 8, doorY - 2, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Window (matches hitbox)
  drawWin(L.winX, L.winY, L.winW, L.winH, h.windowLit && !h.windowBroken, h.shutters, h.accent, h.windowBroken);

  // Quiet house number plaque (small, low contrast)
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  roundRect(hx + hw / 2 - 9, hy + hh - 18, 18, 8, 2);
  ctx.fill();
  ctx.fillStyle = "rgba(55,71,79,0.55)";
  ctx.font = "bold 7px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(String(h.number % 100), hx + hw / 2, hy + hh - 12);

  // Porch stoop — soft stone pad on road face
  softShadow(6, 0.12);
  const pg = ctx.createLinearGradient(L.porchX, L.porchY, L.porchX, L.porchY + L.porchH);
  pg.addColorStop(0, "#F0E8DE");
  pg.addColorStop(1, "#C4B5A5");
  ctx.fillStyle = pg;
  roundRect(L.porchX, L.porchY, L.porchW, L.porchH, 5);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1;
  roundRect(L.porchX, L.porchY, L.porchW, L.porchH, 5);
  ctx.stroke();
  // Paver seam
  ctx.strokeStyle = "rgba(0,0,0,0.06)";
  ctx.beginPath();
  ctx.moveTo(L.porchCx, L.porchY + 2);
  ctx.lineTo(L.porchCx, L.porchY + L.porchH - 2);
  ctx.stroke();
  // Posts + little roof
  ctx.fillStyle = h.trim;
  roundRect(L.porchX + 2, L.porchY - 11, 3, 13, 1);
  ctx.fill();
  roundRect(L.porchX + L.porchW - 5, L.porchY - 11, 3, 13, 1);
  ctx.fill();
  softShadow(4, 0.1);
  ctx.fillStyle = shade(h.roof, 25);
  roundRect(L.porchX - 2, L.porchY - 14, L.porchW + 4, 5, 2);
  ctx.fill();
  clearShadow();

  // Quiet mailbox silhouette
  if (h.hasMailbox) {
    const mx = facingRight ? ROAD_L - 16 : ROAD_R + 9;
    const my = L.porchCy + 12;
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = "#90A4AE";
    ctx.fillRect(mx + 3, my, 1.5, 8);
    roundRect(mx, my - 5, 7, 5, 1);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (isActive(h)) drawDrop(h, L);
  else if (h.needsDelivery && h.delivered) {
    // Quiet delivered mark — soft box, no big check text
    ctx.globalAlpha = 0.55;
    drawBox(L.porchCx, L.porchCy, 0.6, PKG.standard);
    ctx.globalAlpha = 1;
  }

  if (h.hasSnack && !h.snackTaken && isActive(h)) {
    // Soft cooler instead of emoji block
    const sx = L.porchX + 2;
    const sy = L.porchY - 8;
    ctx.fillStyle = "rgba(239,83,80,0.75)";
    roundRect(sx, sy, 8, 7, 1.5);
    ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fillRect(sx + 1, sy + 1, 6, 2);
  }
  if (h.hasPirate && !h.pirateHit && isActive(h)) {
    const px = L.porchCx + (facingRight ? 14 : -14);
    const py = L.porchCy;
    ctx.fillStyle = "#424242";
    ctx.beginPath();
    ctx.ellipse(px, py + 8, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  if (h.hasDog && !h.delivered) {
    // Dog in yard near driveway, not on porch
    const dx = facingRight ? hx + 12 : hx + hw - 12;
    const dy = L.driveTop + 18;
    drawDog(dx, dy, facingRight ? 1 : -1, now() / 200);
  }
}

function drawDrop(h, L) {
  L = L || layoutHouse(h);
  const gx = L.porchCx, gy = L.porchCy;
  const pulse = 0.5 + Math.sin(now() / 320 + h.number) * 0.5;
  const best = bestStop();
  const isBest = best && best.house === h;
  // Calm target language: soft pad glow only — no squares, no labels
  const col = isBest ? "rgba(77,208,225,0.95)" : "rgba(255,183,77,0.75)";
  ctx.save();
  // Porch wash
  ctx.globalAlpha = 0.14 + pulse * 0.1;
  ctx.fillStyle = isBest ? "#4DD0E1" : "#FFB74D";
  ctx.beginPath();
  ctx.ellipse(gx, gy + 1, 10 + pulse, 6.5 + pulse * 0.5, 0, 0, Math.PI * 2);
  ctx.fill();
  // Thin ring
  ctx.globalAlpha = 0.35 + pulse * 0.2;
  ctx.strokeStyle = col;
  ctx.lineWidth = isBest ? 2 : 1.4;
  ctx.beginPath();
  ctx.ellipse(gx, gy + 1, 11 + pulse * 1.2, 7 + pulse * 0.6, 0, 0, Math.PI * 2);
  ctx.stroke();
  // Small package icon (sits on pad, not a UI chip)
  ctx.globalAlpha = isBest ? 0.95 : 0.7;
  if (isBest) {
    ctx.shadowColor = "rgba(77,208,225,0.55)";
    ctx.shadowBlur = 8;
  }
  drawBox(gx, gy - 0.5, isBest ? 0.78 : 0.65, PKG.standard);
  clearShadow();
  ctx.restore();
}

function drawWin(x, y, w, h, lit, shutters, accent, broken) {
  if (shutters) {
    ctx.fillStyle = accent; roundRect(x - 5, y, 5, h, 1); ctx.fill();
    roundRect(x + w, y, 5, h, 1); ctx.fill();
  }
  ctx.fillStyle = broken ? "#37474F" : lit ? "#FFF9C4" : "#E3F2FD";
  roundRect(x, y, w, h, 2); ctx.fill();
  ctx.strokeStyle = "#78909C"; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  if (broken) {
    ctx.strokeStyle = "rgba(200,230,255,0.75)"; ctx.beginPath();
    ctx.moveTo(x + 2, y + 3); ctx.lineTo(x + w * 0.5, y + h * 0.5); ctx.lineTo(x + w - 2, y + 4); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
    ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
  }
}

function drawParked(h) {
  const pc = h.parkedCar; if (!pc) return;
  const L = layoutHouse(h);
  if (!L.car) return;
  const { cx: x, cy: y, w, h: ht } = L.car;
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(x, y + ht * 0.38, w * 0.48, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pc.dented ? shade(pc.color, -25) : pc.color;
  roundRect(x - w / 2, y - ht / 2, w, ht, 6);
  ctx.fill();
  ctx.fillStyle = pc.cracked ? "rgba(80,90,100,0.85)" : "rgba(30,50,70,0.75)";
  roundRect(x - w / 2 + 4, y - ht / 2 + 8, w - 8, ht * 0.28, 3);
  ctx.fill();
  if (pc.cracked) {
    ctx.strokeStyle = "rgba(200,230,255,0.75)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 5, y - ht * 0.2);
    ctx.lineTo(x + 1, y);
    ctx.lineTo(x + 6, y - ht * 0.15);
    ctx.stroke();
  }
  // wheels
  ctx.fillStyle = "#212121";
  roundRect(x - w / 2 - 1, y - ht / 2 + 6, 4, 10, 1);
  roundRect(x + w / 2 - 3, y - ht / 2 + 6, 4, 10, 1);
  roundRect(x - w / 2 - 1, y + ht / 2 - 16, 4, 10, 1);
  roundRect(x + w / 2 - 3, y + ht / 2 - 16, 4, 10, 1);
}

function drawObstacles() {
  for (const o of G.obstacles) {
    if (o.y < -80 || o.y > H + 80) continue;
    if (o.type === "cone") {
      // Soft construction cone matching pastel world
      softShadow(5, 0.12);
      ctx.fillStyle = "#FF8A50";
      ctx.beginPath();
      ctx.moveTo(o.x, o.y - 14);
      ctx.lineTo(o.x + 9, o.y + 8);
      ctx.lineTo(o.x - 9, o.y + 8);
      ctx.closePath();
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.fillRect(o.x - 5.5, o.y - 1, 11, 3.5);
      ctx.fillStyle = "rgba(230,100,40,0.9)";
      ctx.fillRect(o.x - 10, o.y + 8, 20, 3);
    } else if (o.type === "scooter") {
      softShadow(4, 0.1);
      ctx.strokeStyle = "#26C6DA";
      ctx.lineWidth = 2.5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(o.x, o.y + 12);
      ctx.lineTo(o.x, o.y - 8);
      ctx.lineTo(o.x + 7, o.y - 14);
      ctx.stroke();
      clearShadow();
      ctx.fillStyle = "#37474F";
      ctx.beginPath();
      ctx.arc(o.x, o.y + 14, 3.5, 0, Math.PI * 2);
      ctx.arc(o.x, o.y - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    } else if (o.type === "car") {
      softShadow(8, 0.15);
      ctx.fillStyle = o.color;
      roundRect(o.x - 21, o.y - 34, 42, 68, 10);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "rgba(30,45,60,0.72)";
      roundRect(o.x - 15, o.y - 20, 30, 22, 5);
      ctx.fill();
      ctx.fillStyle = "rgba(255,236,179,0.85)";
      roundRect(o.x - 16, o.y + 26, 9, 4, 1);
      ctx.fill();
      roundRect(o.x + 7, o.y + 26, 9, 4, 1);
      ctx.fill();
    } else if (o.type === "ped") {
      const bob = Math.sin(o.anim) * 2;
      const shirt = pickStable(o.x, ["#64B5F6", "#BA68C8", "#4DB6AC", "#FF8A65"]);
      softShadow(4, 0.1);
      ctx.fillStyle = shirt;
      roundRect(o.x - 6, o.y - 3 + bob, 12, 14, 3);
      ctx.fill();
      clearShadow();
      ctx.fillStyle = "#FFCC80";
      ctx.beginPath();
      ctx.arc(o.x, o.y - 9 + bob, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#263238";
      roundRect(o.x + 5, o.y - 7 + bob, 4, 7, 1);
      ctx.fill();
      ctx.fillStyle = "#455A64";
      ctx.fillRect(o.x - 4, o.y + 11 + bob, 3.5, 9);
      ctx.fillRect(o.x + 1, o.y + 11 - bob, 3.5, 9);
    } else if (o.type === "dog") drawDog(o.x, o.y, o.vx >= 0 ? 1 : -1, o.anim);
    else if (o.type === "lady") drawLady(o);
  }
}

function pickStable(seed, arr) { return arr[Math.abs(Math.floor(seed * 7.13)) % arr.length]; }

function drawDog(x, y, dir, anim = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  const leg = Math.sin(anim * 2) * 3;
  ctx.fillStyle = "#A1887F"; roundRect(-11, -6, 22, 11, 4); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -4, 6.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(-8, 3 + leg, 3.5, 5); ctx.fillRect(3, 3 - leg, 3.5, 5);
  ctx.beginPath(); ctx.ellipse(9, -10, 3.2, 4.5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawLady(o) {
  const run = Math.sin(o.wave || 0) * 4;
  const phoneA = Math.sin((o.wave || 0) * 1.3) * 0.4;
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.phase === "chase") {
    ctx.globalAlpha = 0.22 + Math.sin(now() / 80) * 0.1;
    ctx.fillStyle = "#F48FB1"; ctx.beginPath(); ctx.arc(0, -4, 22, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = "#F5F5F5";
  ctx.fillRect(-6, 8 + run * 0.3, 5, 12); ctx.fillRect(1, 8 - run * 0.3, 5, 12);
  ctx.fillStyle = "#EC407A";
  ctx.fillRect(-7, 18 + run * 0.3, 7, 3); ctx.fillRect(1, 18 - run * 0.3, 7, 3);
  const robe = ctx.createLinearGradient(-12, -10, 12, 14);
  robe.addColorStop(0, "#CE93D8"); robe.addColorStop(1, "#8E24AA");
  ctx.fillStyle = robe; roundRect(-11, -8, 22, 22, 6); ctx.fill();
  ctx.fillStyle = "#FFCC80"; ctx.fillRect(-13, -2, 5, 10);
  // phone
  ctx.save(); ctx.translate(9, -2); ctx.rotate(phoneA - 0.3);
  ctx.fillStyle = "#FFCC80"; roundRect(-2, -2, 5, 11, 2); ctx.fill();
  ctx.fillStyle = "#212121"; roundRect(-4, -16, 10, 16, 2.5); ctx.fill();
  ctx.fillStyle = "#81D4FA"; roundRect(-2.5, -14, 7, 11, 1); ctx.fill();
  if (o.phase === "chase" && Math.sin(now() / 90) > 0.4) {
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(1, -13, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  ctx.fillStyle = "#FFCC80"; ctx.beginPath(); ctx.arc(0, -16, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#F8BBD0";
  for (const [cx, cy] of [[-6,-22],[0,-24],[6,-22]]) { ctx.beginPath(); ctx.arc(cx, cy, 3.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#212121";
  ctx.beginPath(); ctx.arc(-3, -15, 1.4, 0, Math.PI * 2); ctx.arc(3, -15, 1.4, 0, Math.PI * 2); ctx.fill();
  if (o.yellT > 0.7) {
    ctx.fillStyle = "rgba(255,255,255,0.92)"; roundRect(-22, -50, 44, 16, 6); ctx.fill();
    ctx.fillStyle = "#AD1457"; ctx.font = "bold 7px system-ui"; ctx.textAlign = "center";
    ctx.fillText(o.yellText || "I'M FILMING!", 0, -39);
  }
  ctx.restore();
}

function drawBox(x, y, s, def) {
  def = def || PKG.standard;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s * (def.size || 1), s * (def.size || 1));
  if (def.id === "envelope") {
    softShadow(4, 0.15);
    ctx.fillStyle = def.color;
    roundRect(-10, -6, 20, 12, 2);
    ctx.fill();
    clearShadow();
    ctx.strokeStyle = "#5D4037";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-10, -6);
    ctx.lineTo(0, 2);
    ctx.lineTo(10, -6);
    ctx.stroke();
  } else if (def.id === "weird") {
    softShadow(5, 0.15);
    ctx.fillStyle = "#F48FB1";
    ctx.beginPath();
    ctx.ellipse(0, 2, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    clearShadow();
    ctx.fillStyle = "#EC407A";
    ctx.beginPath();
    ctx.ellipse(8, -6, 5, 4, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#C2185B";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(10, -6);
    ctx.lineTo(14, -14);
    ctx.stroke();
  } else {
    softShadow(5, 0.18);
    const boxG = ctx.createLinearGradient(-11, -9, 11, 8);
    boxG.addColorStop(0, shade(def.color, 20));
    boxG.addColorStop(1, shade(def.color, -15));
    ctx.fillStyle = boxG;
    roundRect(-11, -9, 22, 17, 3);
    ctx.fill();
    clearShadow();
    ctx.strokeStyle = "#232F3E";
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.moveTo(0, -9);
    ctx.lineTo(0, 8);
    ctx.moveTo(-11, -1);
    ctx.lineTo(11, -1);
    ctx.stroke();
    // Amazon smile
    ctx.beginPath();
    ctx.arc(0, 1, 5.5, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4, 5);
    ctx.lineTo(6.5, 3);
    ctx.lineTo(7, 6);
    ctx.stroke();
    if (def.id === "heavy") {
      ctx.fillStyle = "#BF360C";
      ctx.font = "bold 6px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("HEAVY", 0, -3);
    }
  }
  ctx.restore();
}

function drawAim() {
  if (state !== ST.PLAY && state !== ST.PAUSE) return;
  // Quiet ambient: only a soft ring on the recommended pad (no crosshair / guide spam)
  const best = bestStop();
  if (best && !G.aimPreview) {
    const p = best.porch;
    const pulse = 0.5 + Math.sin(now() / 280) * 0.5;
    ctx.save();
    ctx.globalAlpha = 0.2 + pulse * 0.15;
    ctx.strokeStyle = "#4DD0E1";
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.ellipse(p.cx, p.cy + 2, 14 + pulse, 9 + pulse * 0.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  if (!G.aimPreview) return;
  const { x, y, sx, sy, snap, assisted } = G.aimPreview;
  // Soft arc only — green when locked, cyan when assisted, warm when free
  const col = snap ? "#81C784" : assisted ? "#4DD0E1" : "#FFCC80";
  ctx.save();
  for (let i = 1; i <= 10; i++) {
    const u = i / 11;
    const px = lerp(sx, x, smooth(u));
    const py = lerp(sy, y, smooth(u)) - Math.sin(u * Math.PI) * 32;
    ctx.globalAlpha = 0.1 + u * 0.4;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(px, py, 2.4 - u * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  // Landing ellipse — no LOCKED/AIM text
  ctx.globalAlpha = snap ? 0.75 : 0.5;
  ctx.strokeStyle = col;
  ctx.lineWidth = snap ? 2.4 : 1.8;
  ctx.beginPath();
  ctx.ellipse(x, y + 3, 13, 8, 0, 0, Math.PI * 2);
  ctx.stroke();
  if (snap) {
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.ellipse(x, y + 3, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawPackages() {
  for (const pk of G.packages) {
    // trail
    for (let i = 0; i < pk.trail.length; i++) {
      const t = pk.trail[i];
      ctx.globalAlpha = t.a * 0.45;
      ctx.fillStyle = pk.def?.color || "#FF9900";
      ctx.beginPath(); ctx.arc(t.x, t.y, 3 * (i / pk.trail.length), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const u = clamp(pk.t / pk.dur, 0, 1);
    const shadowY = lerp(pk.sy, pk.ty, smooth(u));
    ctx.fillStyle = `rgba(0,0,0,${0.12 + u * 0.18})`;
    ctx.beginPath(); ctx.ellipse(pk.x, shadowY + 8, 9, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.save(); ctx.translate(pk.x, pk.y); ctx.rotate(pk.rot);
    drawBox(0, 0, 1 + Math.sin(u * Math.PI) * 0.15, pk.def);
    ctx.restore();
  }
}

function drawWheel(wx, wy, flip) {
  // Premium top-down aero wheel
  ctx.save();
  ctx.translate(wx, wy);
  if (flip) ctx.scale(-1, 1);
  // tire
  softShadow(4, 0.2);
  ctx.fillStyle = "#121212";
  roundRect(-4.5, -10.5, 9, 21, 4);
  ctx.fill();
  clearShadow();
  // sidewall
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 1;
  roundRect(-4, -9.5, 8, 19, 3.5);
  ctx.stroke();
  // aero cover
  const rim = ctx.createLinearGradient(-3, -8, 3, 8);
  rim.addColorStop(0, "#CFD8DC");
  rim.addColorStop(0.5, "#90A4AE");
  rim.addColorStop(1, "#607D8B");
  ctx.fillStyle = rim;
  ctx.beginPath();
  ctx.ellipse(0, 0, 3.2, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.ellipse(0, 0, 1.4, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#ECEFF1";
  ctx.beginPath();
  ctx.ellipse(0, 0, 0.7, 1.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawTesla() {
  const x = G.carX, y = CAR_Y;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(G.carLean || 0);

  // Premium FSD aura
  if (G.fsd > 0) {
    const pulse = 0.5 + Math.sin(now() / 90) * 0.5;
    for (let i = 3; i >= 1; i--) {
      ctx.strokeStyle = `rgba(0,229,255,${0.08 + pulse * 0.06 * i})`;
      ctx.lineWidth = 3 + i;
      ctx.beginPath();
      ctx.ellipse(0, 2, 28 + i * 6 + pulse * 2, 48 + i * 5, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = `rgba(0,176,255,${0.1 + pulse * 0.08})`;
    ctx.beginPath();
    ctx.ellipse(0, 2, 34, 52, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Soft ground contact shadow
  softShadow(14, 0.28);
  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath();
  ctx.ellipse(1, 44, 24, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  clearShadow();

  const flash = G.invuln > 0 && Math.floor(now() / 70) % 2;

  // Wheels under body
  drawWheel(-22.5, -20, false);
  drawWheel(22.5, -20, true);
  drawWheel(-22.5, 22, false);
  drawWheel(22.5, 22, true);

  // Pearl white body — slightly tapered Model 3 silhouette
  if (flash) {
    ctx.fillStyle = "rgba(255,255,255,0.45)";
  } else {
    const bg = ctx.createLinearGradient(-20, -42, 20, 42);
    bg.addColorStop(0, "#F8F8F8");
    bg.addColorStop(0.25, "#FFFFFF");
    bg.addColorStop(0.6, "#F2F2F2");
    bg.addColorStop(1, "#DCDCDC");
    ctx.fillStyle = bg;
  }
  softShadow(10, 0.15);
  // Main body path with softer nose/tail radius
  roundRect(-20, -42, 40, 84, 14);
  ctx.fill();
  clearShadow();

  // Side sculpt highlight + shade
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  roundRect(4, -36, 10, 64, 6);
  ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  roundRect(-20, -42, 8, 84, 12);
  ctx.fill();

  // Door seams
  ctx.strokeStyle = "rgba(0,0,0,0.07)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-17, -4); ctx.lineTo(17, -4);
  ctx.moveTo(-17, 10); ctx.lineTo(17, 10);
  ctx.stroke();

  // Rocker panel
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  roundRect(-19, 28, 38, 6, 2);
  ctx.fill();

  // Wheel arch indents
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  for (const [ax, ay] of [[-20, -20], [20, -20], [-20, 22], [20, 22]]) {
    ctx.beginPath();
    ctx.ellipse(ax, ay, 3.5, 9, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Glasshouse canopy (signature Model 3 continuous glass)
  const glass = ctx.createLinearGradient(-15, -28, 15, 14);
  glass.addColorStop(0, "#0A1628");
  glass.addColorStop(0.35, "#1A2A3A");
  glass.addColorStop(0.7, "#2C4050");
  glass.addColorStop(1, "#3D5568");
  ctx.fillStyle = glass;
  roundRect(-15, -28, 30, 40, 9);
  ctx.fill();
  // Blue sky reflection
  ctx.fillStyle = "rgba(129,212,250,0.32)";
  roundRect(-12, -25, 9, 30, 5);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  roundRect(2, -24, 7, 14, 3);
  ctx.fill();
  // A-pillar edge
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.lineWidth = 1;
  roundRect(-15, -28, 30, 40, 9);
  ctx.stroke();

  // Rear trunk deck
  const deck = ctx.createLinearGradient(0, 12, 0, 34);
  deck.addColorStop(0, "#F5F5F5");
  deck.addColorStop(1, "#E0E0E0");
  ctx.fillStyle = deck;
  roundRect(-13, 12, 26, 18, 4);
  ctx.fill();

  // Front continuous light bar (Highland / Model 3 vibe)
  if (G.fsd > 0) {
    ctx.shadowColor = "#00E5FF";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#00E5FF";
  } else {
    const lg = ctx.createLinearGradient(-15, 0, 15, 0);
    lg.addColorStop(0, "#81D4FA");
    lg.addColorStop(0.35, "#FFFFFF");
    lg.addColorStop(0.65, "#E3F2FD");
    lg.addColorStop(1, "#81D4FA");
    ctx.fillStyle = lg;
  }
  roundRect(-15, -40, 30, 4.5, 2);
  ctx.fill();
  clearShadow();
  if (G.fsd <= 0) {
    ctx.fillStyle = "#FFB74D";
    roundRect(-15, -39.5, 3, 3.5, 1);
    ctx.fill();
    roundRect(12, -39.5, 3, 3.5, 1);
    ctx.fill();
  }

  // Rear signature light bar
  const rl = ctx.createLinearGradient(-13, 0, 13, 0);
  rl.addColorStop(0, "#B71C1C");
  rl.addColorStop(0.5, "#FF1744");
  rl.addColorStop(1, "#B71C1C");
  ctx.fillStyle = rl;
  roundRect(-13, 32, 26, 4, 2);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.3)";
  ctx.fillRect(-3, 33, 6, 1.5);

  // Side mirrors
  softShadow(3, 0.15);
  ctx.fillStyle = "#FAFAFA";
  roundRect(-28, -9, 8, 5.5, 2);
  ctx.fill();
  roundRect(20, -9, 8, 5.5, 2);
  ctx.fill();
  clearShadow();
  ctx.fillStyle = "#263238";
  roundRect(-26.5, -7.5, 4.5, 2.8, 1);
  ctx.fill();
  roundRect(22, -7.5, 4.5, 2.8, 1);
  ctx.fill();

  // Hood camera nub + subtle T
  ctx.fillStyle = "#90A4AE";
  ctx.beginPath();
  ctx.arc(0, -37, 1.6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "rgba(96,125,139,0.45)";
  ctx.font = "bold 10px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("T", 0, -34);
  ctx.textBaseline = "alphabetic";

  // Clean FLEX plate on rear deck
  softShadow(3, 0.12);
  ctx.fillStyle = "#1A1A1A";
  roundRect(-11, 16, 22, 9, 2);
  ctx.fill();
  clearShadow();
  ctx.strokeStyle = "#FF9900";
  ctx.lineWidth = 1.2;
  roundRect(-11, 16, 22, 9, 2);
  ctx.stroke();
  ctx.fillStyle = "#FF9900";
  ctx.font = "bold 7px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("FLEX", 0, 22.5);

  // Body outline
  ctx.strokeStyle = "rgba(0,0,0,0.08)";
  ctx.lineWidth = 1.2;
  roundRect(-20, -42, 40, 84, 14);
  ctx.stroke();

  ctx.restore();

  if (G.fsd > 0) {
    softShadow(8, 0.15);
    drawPill(G.carX - 36, CAR_Y + 52, 72, 18, "rgba(0,176,255,0.92)", "rgba(255,255,255,0.35)");
    clearShadow();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 11px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("FSD " + G.fsd.toFixed(1) + "s", G.carX, CAR_Y + 64);
  }
}

function drawParticles() {
  for (const p of G.particles) {
    ctx.globalAlpha = clamp(p.life / (p.max || 1), 0, 1);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFloats() {
  for (const f of G.floatText) {
    ctx.globalAlpha = clamp(f.life * 1.3, 0, 1);
    ctx.font = `bold ${f.size}px system-ui`; ctx.textAlign = "center";
    ctx.strokeStyle = "rgba(0,0,0,0.45)"; ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawWeatherOverlay() {
  if (G.weather === "rain") {
    // Soft atmospheric rain — short translucent streaks, low opacity
    ctx.lineCap = "round";
    for (const r of G.rain) {
      ctx.strokeStyle = `rgba(200,220,235,${0.08 + r.z * 0.08})`;
      ctx.lineWidth = 0.8 + r.z * 0.4;
      ctx.beginPath();
      ctx.moveTo(r.x, r.y);
      ctx.lineTo(r.x + 1.2 * r.z, r.y + 7 * r.z);
      ctx.stroke();
    }
    ctx.lineCap = "butt";
    // Cool wash over scene (not fighting lane paint)
    ctx.fillStyle = "rgba(90,110,130,0.06)";
    ctx.fillRect(0, 0, W, H);
  }
  if (G.weather === "golden") {
    ctx.fillStyle = "rgba(255,170,80,0.05)";
    ctx.fillRect(0, 0, W, H);
  }
}

// ─── HUD / SCREENS ─────────────────────────────────────────
function panel(x, y, w, h) {
  ctx.fillStyle = "rgba(10,22,40,0.9)"; roundRect(x, y, w, h, 16); ctx.fill();
  ctx.strokeStyle = "rgba(255,153,0,0.4)"; ctx.lineWidth = 2; roundRect(x, y, w, h, 16); ctx.stroke();
}
function drawBtn(b) {
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
  if (b.style === "primary") { g.addColorStop(0, "#FFB74D"); g.addColorStop(1, "#FF9900"); }
  else { g.addColorStop(0, "#455A64"); g.addColorStop(1, "#263238"); }
  ctx.fillStyle = g; roundRect(b.x, b.y, b.w, b.h, 12); ctx.fill();
  ctx.fillStyle = b.style === "primary" ? "#1A1A1A" : "#ECEFF1";
  ctx.font = "bold 16px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textBaseline = "alphabetic";
}

function drawHUD() {
  // Lighter top strip — less “heavy panel”
  softShadow(10, 0.18);
  ctx.fillStyle = "rgba(16, 28, 46, 0.62)";
  roundRect(12, 10, W - 24, 48, 14);
  ctx.fill();
  clearShadow();

  // Hearts
  for (let i = 0; i < MAX_HEARTS; i++) {
    ctx.font = "14px system-ui";
    ctx.globalAlpha = i < G.hearts ? 1 : 0.2;
    ctx.fillText("❤", 24 + i * 18, 30);
  }
  ctx.globalAlpha = 1;

  // Score / time / streak — single row values, tiny captions
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.font = "bold 8px system-ui";
  ctx.fillText("SCORE", 20, 44);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 15px system-ui";
  ctx.fillText(String(G.score), 52, 46);

  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.font = "bold 8px system-ui";
  ctx.fillText("TIME", W / 2 - 20, 26);
  ctx.fillStyle = G.time < 15 ? "#FF8A80" : "#fff";
  ctx.font = "bold 15px system-ui";
  const m = Math.floor(G.time / 60), s = Math.floor(G.time % 60);
  ctx.fillText(`${m}:${String(s).padStart(2, "0")}`, W / 2 - 20, 44);

  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.font = "bold 8px system-ui";
  ctx.fillText("STREAK", W / 2 + 48, 26);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 15px system-ui";
  ctx.fillText(String(G.streak), W / 2 + 48, 44);

  // Pause
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  roundRect(W - 46, 16, 26, 26, 8);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  ctx.fillRect(W - 37, 22, 3, 14);
  ctx.fillRect(W - 30, 22, 3, 14);

  // FSD pips — minimal, no caption unless charging
  for (let i = 0; i < FSD_NEED; i++) {
    ctx.fillStyle = i < G.fsdReady ? "rgba(0,176,255,0.95)" : "rgba(255,255,255,0.12)";
    ctx.beginPath();
    ctx.arc(W / 2 - 14 + i * 14, 68, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Next package — icon only, tiny
  const nd = PKG[G.nextPkg] || PKG.standard;
  ctx.fillStyle = "rgba(16,28,46,0.45)";
  roundRect(12, 62, 36, 22, 8);
  ctx.fill();
  drawBox(30, 73, 0.42, nd);

  // Weather — tiny, bottom-right of top area when not default sunny
  if (G.weather !== "sunny") {
    ctx.fillStyle = "rgba(255,255,255,0.4)";
    ctx.font = "8px system-ui";
    ctx.textAlign = "right";
    ctx.fillText(weatherInfo(G.weather).name, W - 16, 72);
  }

  // Zone cues — almost invisible chips
  if (elapsed() < EASY_SECS) {
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = "rgba(102,187,106,0.55)";
    roundRect(W / 2 - 22, 82, 44, 12, 6);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("EASY", W / 2, 91);
    ctx.globalAlpha = 1;
  }
  if (G.event) {
    const short = G.event === "fresh_boost" ? "2×" : G.event === "dog_zone" ? "🐕" : "△";
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = "rgba(255,167,38,0.65)";
    roundRect(W / 2 - 16, 98, 32, 12, 6);
    ctx.fill();
    ctx.fillStyle = "#1A1A1A";
    ctx.font = "bold 8px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(short, W / 2, 107);
    ctx.globalAlpha = 1;
  }

  // Bottom meta — very light
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = RADIO[station].color;
  ctx.font = "9px system-ui";
  ctx.textAlign = "left";
  ctx.fillText((RADIO[station].silent ? "🔇" : "♪") + " " + RADIO[station].name, 14, H - 12);
  ctx.fillStyle = "#fff";
  ctx.textAlign = "right";
  ctx.fillText(META.highScore > 0 ? "Best " + META.highScore : "", W - 14, H - 12);
  ctx.globalAlpha = 1;

  // Toasts — rare, soft
  let my = 118;
  for (const m of G.messages) {
    ctx.globalAlpha = clamp(m.life * 1.8, 0, 0.85);
    ctx.font = "11px system-ui";
    const tw = Math.min(W - 48, ctx.measureText(m.text).width + 20);
    ctx.fillStyle = "rgba(16,28,46,0.72)";
    roundRect((W - tw) / 2, my, tw, 24, 10);
    ctx.fill();
    ctx.fillStyle = "rgba(255,248,225,0.95)";
    ctx.textAlign = "center";
    ctx.fillText(m.text, W / 2, my + 16);
    my += 28;
  }
  ctx.globalAlpha = 1;

  // First-seconds: very soft tint, no big banners
  if (G.time > ROUTE_TIME - 3.5) {
    ctx.globalAlpha = 0.1;
    ctx.fillStyle = "#81D4FA";
    ctx.fillRect(0, 0, W, H * 0.48);
    ctx.fillStyle = "#FFCC80";
    ctx.fillRect(0, H * 0.52, W, H * 0.48);
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = "#fff";
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("throw", W / 2, H * 0.24);
    ctx.fillText("steer", W / 2, H * 0.72);
    ctx.globalAlpha = 1;
  }
}
