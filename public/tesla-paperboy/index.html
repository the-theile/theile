<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0a1628" />
<title>Tesla Flex</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1628;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #132a4a 0%, #0a1628 70%);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    box-shadow: 0 0 60px rgba(0,0,0,0.55);
  }
  @media (max-width: 520px) {
    canvas { width: 100%; height: 100%; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";
/**
 * Tesla Flex — Amazon Flex Paperboy rave delivery game
 * Juicy single-file mobile web game. No external assets.
 *
 * Controls: bottom half drag = steer · top half aim/throw · A/D/←→ · Space throw · P pause · M mute
 * Radio: 1 House · 2 DnB · 3 Riddim · 4 Techno
 *
 * Visual polish pass: Model 3 car, cohesive Florida pastel env, modern HUD, soft juice.
 */

// ═══════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const W = 390, H = 700;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const now = () => performance.now();

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shade(hex, amt) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  return `rgb(${clamp(r,0,255)|0},${clamp(g,0,255)|0},${clamp(b,0,255)|0})`;
}

/** Soft drop shadow helper (Canvas) */
function softShadow(blur = 8, a = 0.18) {
  ctx.shadowColor = `rgba(0,0,0,${a})`;
  ctx.shadowBlur = blur;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 2;
}
function clearShadow() {
  ctx.shadowColor = "transparent";
  ctx.shadowBlur = 0;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 0;
}

/** Pill badge for HUD */
function drawPill(x, y, w, h, fill, stroke) {
  softShadow(6, 0.2);
  ctx.fillStyle = fill;
  roundRect(x, y, w, h, h / 2);
  ctx.fill();
  clearShadow();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    roundRect(x, y, w, h, h / 2);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const ROUTE_TIME = 90;
const EASY_SECS = 30;
const ROAD_L = 76, ROAD_R = 314;
const ROAD_CX = (ROAD_L + ROAD_R) / 2;
const ROAD_W = ROAD_R - ROAD_L;
const CAR_Y = 555;
const MAX_DIFF = 0.78;
const FSD_NEED = 3;
const FSD_DUR = 10;
const MAX_HEARTS = 3;
const LS_KEY = "teslaPaperboy_v2";

// Package types: mass affects arc & flight, score mult
const PKG = {
  standard: { id: "standard", label: "Box", mult: 1, mass: 1, arc: 1, size: 1, color: "#FF9900" },
  heavy:    { id: "heavy", label: "Heavy", mult: 1.45, mass: 1.45, arc: 0.72, size: 1.25, color: "#E65100" },
  envelope: { id: "envelope", label: "Envelope", mult: 0.85, mass: 0.65, arc: 1.15, size: 0.75, color: "#FFE082" },
  weird:    { id: "weird", label: "Weird", mult: 1.8, mass: 1.1, arc: 1.05, size: 1.35, color: "#AB47BC" },
};

// ═══════════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════════
function loadMeta() {
  try {
    return Object.assign({
      highScore: 0, bestStreak: 0, games: 0, totalDrops: 0,
      achievements: {}, station: "house",
    }, JSON.parse(localStorage.getItem(LS_KEY) || "{}"));
  } catch { return { highScore: 0, bestStreak: 0, games: 0, totalDrops: 0, achievements: {}, station: "house" }; }
}
function saveMeta(m) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(m)); } catch {}
}
let META = loadMeta();

const ACHIEVEMENTS = {
  porchPerfect: { id: "porchPerfect", title: "Porch Perfect", desc: "10 streak in one route" },
  fsdSavant: { id: "fsdSavant", title: "FSD Savant", desc: "Trigger FSD twice in one route" },
  noDogs: { id: "noDogs", title: "No Dogs Harmed", desc: "Finish with 0 dog incidents" },
  firstFlex: { id: "firstFlex", title: "First Flex", desc: "Complete any route" },
  beanQueen: { id: "beanQueen", title: "Bean Queen", desc: "Dismiss 5 threats with packages" },
  goldenFlex: { id: "goldenFlex", title: "Golden Flex", desc: "Score 1500+ in golden hour" },
  survivor: { id: "survivor", title: "Still Rolling", desc: "Finish with 1 heart left" },
};

// ═══════════════════════════════════════════════════════════
// AUDIO (Web Audio — SFX + procedural rave radio)
// ═══════════════════════════════════════════════════════════
let audioCtx = null, muted = false;
let sfxBus = null, musicBus = null;

/** Radio stations — procedural EDM, no external files */
const RADIO = {
  house:  { id: "house",  name: "House",  bpm: 124, tag: "4/4 Flex cruise",     color: "#FF6D00", silent: false },
  dnb:    { id: "dnb",    name: "DnB",    bpm: 174, tag: "Neuro package rush",  color: "#00E5FF", silent: false },
  riddim: { id: "riddim", name: "Riddim", bpm: 140, tag: "Half-time HOA bass",  color: "#E040FB", silent: false },
  techno: { id: "techno", name: "Techno", bpm: 132, tag: "Warehouse night run", color: "#69F0AE", silent: false },
  silent: { id: "silent", name: "Silent", bpm: 0,   tag: "Quiet Flex ride",      color: "#90A4AE", silent: true },
};
let station = (META.station && RADIO[META.station]) ? META.station : "house";

// Music scheduler state
const music = {
  running: false,
  nextT: 0,
  step: 0,
  timer: null,
  master: null,
};

function ensureAudio() {
  if (muted) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    audioCtx = new AC();
    sfxBus = audioCtx.createGain(); sfxBus.gain.value = 0.9;
    musicBus = audioCtx.createGain(); musicBus.gain.value = 0.22;
    sfxBus.connect(audioCtx.destination);
    musicBus.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone({ freq = 440, dur = 0.12, type = "sine", gain = 0.07, slide = 0, delay = 0 }) {
  const ac = ensureAudio(); if (!ac) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxBus || ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

function noise(dur = 0.08, gain = 0.04, freq = 1200) {
  const ac = ensureAudio(); if (!ac) return;
  const n = (ac.sampleRate * dur) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(sfxBus || ac.destination); src.start();
}

// ── Music synth voices (route through musicBus) ──
function mKick(t, g = 0.55) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + 0.3);
}
function mHat(t, open = false, g = 0.06) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const n = (ac.sampleRate * (open ? 0.12 : 0.04)) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = open ? 7000 : 9000;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + (open ? 0.12 : 0.04));
  src.connect(f); f.connect(gn); gn.connect(musicBus);
  src.start(t);
}
function mSnare(t, g = 0.2) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const n = (ac.sampleRate * 0.12) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.7;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  src.connect(f); f.connect(gn); gn.connect(musicBus);
  src.start(t);
  // body
  const o = ac.createOscillator(), g2 = ac.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.08);
  g2.gain.setValueAtTime(g * 0.5, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  o.connect(g2); g2.connect(musicBus); o.start(t); o.stop(t + 0.12);
}
function mBass(t, freq, dur = 0.18, g = 0.14, type = "sawtooth") {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), gn = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  f.type = "lowpass";
  f.frequency.setValueAtTime(600, t);
  f.frequency.exponentialRampToValueAtTime(180, t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(g, t + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + dur + 0.02);
}
function mReese(t, freq, dur = 0.35, g = 0.1) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  const f = ac.createBiquadFilter(), gn = ac.createGain(), lfo = ac.createOscillator(), lfoG = ac.createGain();
  o1.type = "sawtooth"; o2.type = "sawtooth";
  o1.frequency.setValueAtTime(freq, t);
  o2.frequency.setValueAtTime(freq * 1.01, t);
  f.type = "lowpass"; f.Q.value = 8;
  f.frequency.setValueAtTime(220, t);
  lfo.type = "sine"; lfo.frequency.setValueAtTime(station === "riddim" ? 2.2 : 5.5, t);
  lfoG.gain.value = 160;
  lfo.connect(lfoG); lfoG.connect(f.frequency);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(g, t + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.connect(f); o2.connect(f); f.connect(gn); gn.connect(musicBus);
  o1.start(t); o2.start(t); lfo.start(t);
  o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
}
function mStab(t, freq, g = 0.05) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = "square"; o.frequency.setValueAtTime(freq, t);
  gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + 0.14);
}

// Chord roots for variety (Hz, roughly F minor / related)
const BASS_NOTES = [87.31, 92.5, 103.83, 116.54, 130.81]; // F G Ab Bb C
function noteAt(step) {
  const bar = Math.floor(step / 16) % 4;
  return BASS_NOTES[bar % BASS_NOTES.length];
}

function scheduleStep(step, t) {
  const st = station;
  const s = step % 16; // 16th-note grid, 1 bar
  if (st === "house") {
    // 4-on-the-floor
    if (s % 4 === 0) mKick(t, 0.5);
    if (s % 2 === 1) mHat(t, false, 0.045);
    if (s === 6 || s === 14) mHat(t, true, 0.05);
    if (s === 4 || s === 12) mSnare(t, 0.12);
    if (s % 4 === 0) mBass(t, noteAt(step) / 2, 0.2, 0.12, "sawtooth");
    if (s === 0 || s === 8) mStab(t, noteAt(step) * 2, 0.035);
  } else if (st === "dnb") {
    // Amen-ish / 2-step-ish approximation at 16ths
    if (s === 0 || s === 10) mKick(t, 0.48);
    if (s === 4 || s === 12) mSnare(t, 0.22);
    if (s === 6 || s === 14) mSnare(t, 0.08); // ghost
    if (s % 2 === 0) mHat(t, false, 0.04);
    if (s === 3 || s === 11) mHat(t, true, 0.045);
    if (s === 0 || s === 8) mReese(t, noteAt(step) / 2, 0.28, 0.09);
    else if (s % 4 === 0) mBass(t, noteAt(step) / 2, 0.12, 0.08, "square");
  } else if (st === "riddim") {
    // Riddim — half-time, heavy
    if (s === 0) mKick(t, 0.58);
    if (s === 8) mSnare(t, 0.28);
    if (s === 4 || s === 12) mHat(t, false, 0.03);
    if (s === 14) mHat(t, true, 0.04);
    if (s === 0) mReese(t, noteAt(step) / 2, 0.55, 0.12);
    if (s === 8) mBass(t, noteAt(step) / 2 * 0.75, 0.25, 0.1, "sawtooth");
  } else {
    // Techno — driving 4/4, minimal, hypnotic
    if (s % 4 === 0) mKick(t, 0.52);
    if (s % 4 === 2) mHat(t, false, 0.05);          // offbeat hats
    if (s === 4 || s === 12) mHat(t, true, 0.035);  // open
    if (s === 0) mBass(t, noteAt(step) / 2, 0.22, 0.13, "square");
    if (s === 8) mBass(t, noteAt(step) / 2 * 1.5, 0.14, 0.08, "sawtooth");
    if (s === 0 || s === 6) mStab(t, noteAt(step) * 3, 0.028); // icy stabs
  }
}

function musicSchedulerTick() {
  if (!music.running || !audioCtx || RADIO[station]?.silent) return;
  const ac = audioCtx;
  const bpm = RADIO[station].bpm || 120;
  const stepDur = (60 / bpm) / 4; // 16th
  const horizon = 0.12;
  while (music.nextT < ac.currentTime + horizon) {
    scheduleStep(music.step, music.nextT);
    music.nextT += stepDur;
    music.step++;
  }
  music.timer = setTimeout(musicSchedulerTick, 25);
}

function startRadio() {
  const ac = ensureAudio();
  if (!ac || muted) return;
  stopRadio();
  // Silent ride: no procedural music, SFX only
  if (RADIO[station]?.silent) {
    if (musicBus) musicBus.gain.setValueAtTime(0, ac.currentTime);
    return;
  }
  music.running = true;
  music.step = 0;
  music.nextT = ac.currentTime + 0.05;
  if (musicBus) {
    musicBus.gain.cancelScheduledValues(ac.currentTime);
    musicBus.gain.setValueAtTime(0.001, ac.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.2, ac.currentTime + 0.6);
  }
  musicSchedulerTick();
}
function stopRadio() {
  music.running = false;
  if (music.timer) { clearTimeout(music.timer); music.timer = null; }
}
function setStation(id) {
  if (!RADIO[id]) return;
  station = id;
  META.station = id;
  saveMeta(META);
  if (!muted) startRadio();
  SFX.click();
}

// Back-compat aliases used elsewhere
function startBgHum() { startRadio(); }
function stopBgHum() { stopRadio(); }

const SFX = {
  click() { tone({ freq: 540, dur: 0.05, type: "triangle", gain: 0.04 }); },
  throw() { tone({ freq: 240, dur: 0.1, type: "sawtooth", gain: 0.03, slide: 200 }); noise(0.07, 0.025, 2000); },
  land() { tone({ freq: 180, dur: 0.08, type: "triangle", gain: 0.05 }); noise(0.05, 0.03, 900); },
  perfect() {
    tone({ freq: 523, dur: 0.08, type: "sine", gain: 0.06 });
    tone({ freq: 659, dur: 0.1, type: "sine", gain: 0.05, delay: 0.06 });
    tone({ freq: 784, dur: 0.14, type: "sine", gain: 0.05, delay: 0.12 });
  },
  deliver() {
    tone({ freq: 440, dur: 0.07, type: "sine", gain: 0.055 });
    tone({ freq: 554, dur: 0.1, type: "sine", gain: 0.045, delay: 0.06 });
  },
  miss() { tone({ freq: 160, dur: 0.14, type: "triangle", gain: 0.04, slide: -50 }); },
  crack() { noise(0.1, 0.05, 2600); tone({ freq: 800, dur: 0.06, type: "square", gain: 0.025, slide: -250 }); },
  hit() { noise(0.1, 0.055, 500); tone({ freq: 90, dur: 0.14, type: "sawtooth", gain: 0.035, slide: -30 }); },
  heart() { tone({ freq: 300, dur: 0.15, type: "sine", gain: 0.05, slide: -120 }); tone({ freq: 200, dur: 0.2, type: "triangle", gain: 0.04, delay: 0.05 }); },
  fsd() {
    tone({ freq: 440, dur: 0.1, type: "sine", gain: 0.05, slide: 200 });
    tone({ freq: 660, dur: 0.16, type: "sine", gain: 0.045, delay: 0.07, slide: 160 });
    tone({ freq: 880, dur: 0.2, type: "triangle", gain: 0.04, delay: 0.14 });
  },
  bark() { tone({ freq: 280, dur: 0.08, type: "square", gain: 0.035, slide: 80 }); tone({ freq: 220, dur: 0.1, type: "square", gain: 0.03, delay: 0.08 }); },
  horn() { tone({ freq: 380, dur: 0.18, type: "sawtooth", gain: 0.03 }); tone({ freq: 400, dur: 0.15, type: "sawtooth", gain: 0.025, delay: 0.02 }); },
  splash() { noise(0.16, 0.045, 800); tone({ freq: 200, dur: 0.12, type: "sine", gain: 0.03, slide: -70 }); },
  dismiss() { tone({ freq: 420, dur: 0.08, type: "sine", gain: 0.05, slide: 160 }); tone({ freq: 640, dur: 0.12, type: "triangle", gain: 0.04, delay: 0.05 }); },
  lady() {
    tone({ freq: 720, dur: 0.1, type: "sawtooth", gain: 0.04, slide: 260 });
    tone({ freq: 960, dur: 0.14, type: "square", gain: 0.03, delay: 0.07, slide: -100 });
  },
  fail() { tone({ freq: 180, dur: 0.25, type: "sawtooth", gain: 0.04, slide: -80 }); tone({ freq: 120, dur: 0.3, type: "triangle", gain: 0.035, delay: 0.1 }); },
  win() {
    [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, dur: 0.14, type: "sine", gain: 0.045, delay: i * 0.08 }));
  },
  weather() { tone({ freq: 300, dur: 0.2, type: "sine", gain: 0.03, slide: 100 }); },
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const ST = { TITLE: 0, HOWTO: 1, PLAY: 2, PAUSE: 3, GATE: 4, END: 5 };
let state = ST.TITLE;

const G = {

// ═══════════════════════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════════════════════
function rollWeather() {
  // Weighted: sunny common, rain/golden rarer
  const r = Math.random();
  if (r < 0.38) return "sunny";
  if (r < 0.62) return "cloudy";
  if (r < 0.82) return "golden";
  return "rain";
}

function weatherInfo(w) {
  return {
    sunny:  { name: "Florida Sun", mult: 1, throw: 1, note: "Clear skies — clean throws" },
    cloudy: { name: "Overcast", mult: 1, throw: 1, note: "Soft light, same rules" },
    golden: { name: "Golden Hour", mult: 1.12, throw: 1, note: "+12% score · peak Flex vibes" },
    rain:   { name: "Pop-up Shower", mult: 0.95, throw: 0.88, note: "Slippery arcs · slightly lower score" },
  }[w] || { name: w, mult: 1, throw: 1, note: "" };
}

// ═══════════════════════════════════════════════════════════
// DIFFICULTY
// ═══════════════════════════════════════════════════════════
function elapsed() { return ROUTE_TIME - G.time; }

function difficulty() {
  const e = elapsed();
  if (e <= EASY_SECS) return (e / EASY_SECS) * 0.16;
  // mid ramp, then spicy last ~20s
  if (e < 70) return clamp(0.16 + (e - EASY_SECS) / 40 * 0.42, 0, 0.58);
  return clamp(0.58 + (e - 70) / 20 * (MAX_DIFF - 0.58), 0, MAX_DIFF);
}

function aimStrength() { return lerp(0.95, 0.7, difficulty() / MAX_DIFF); }
function padExtra() { return lerp(40, 22, difficulty() / MAX_DIFF); }
function assistR() { return lerp(170, 110, difficulty() / MAX_DIFF); }
function snapD() { return lerp(105, 70, difficulty() / MAX_DIFF); }

// ═══════════════════════════════════════════════════════════
// JUICE HELPERS
// ═══════════════════════════════════════════════════════════
function shake(n = 8) { G.shake = Math.max(G.shake, n); }
function flash(n = 0.25) { G.flash = Math.max(G.flash, n); }
function hitStop(t = 0.04) { G.hitStop = Math.max(G.hitStop, t); }

function msg(text, life = 2.2) {
  G.messages.push({ text, life, max: life });
}
function floatT(x, y, text, color = "#fff", size = 14, life = 0.7) {
  // Very calm: few concurrent floats, short life
  if (G.floatText.length > 3) G.floatText.shift();
  G.floatText.push({ x, y, text, color, size, life, vy: -32 });
}
function burst(x, y, color, n = 12, speed = 140) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(speed * 0.3, speed);
    G.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.35, 0.9), max: 0.9, r: rand(2, 6), color, g: 180,
    });
  }
}
function ringBurst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    G.particles.push({
      x, y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
      life: 0.45, max: 0.45, r: 3, color, g: 0,
    });
  }
}
function confetti(x, y) {
  const cols = ["#FF9900", "#00E5FF", "#69F0AE", "#FFD54F", "#F48FB1"];
  for (let i = 0; i < 18; i++) {
    const a = rand(0, Math.PI * 2);
    G.particles.push({
      x, y, vx: Math.cos(a) * rand(40, 160), vy: Math.sin(a) * rand(-120, -40),
      life: rand(0.6, 1.1), max: 1.1, r: rand(2, 4), color: pick(cols), g: 220,
    });
  }
}

function unlockAch(id) {
  if (META.achievements[id]) return;
  META.achievements[id] = true;
  saveMeta(META);
  const a = ACHIEVEMENTS[id];
  if (a) {
    G.unlockQueue.push(a);
    msg("🏆 " + a.title + " unlocked!", 2.8);
    SFX.perfect();
  }
}

function resetGame() {
  const weather = rollWeather();
  const wi = weatherInfo(weather);
  Object.assign(G, {
    score: 0, time: ROUTE_TIME, hearts: MAX_HEARTS,
    deliveries: 0, fails: 0, snacks: 0, pirateBonus: 0, threatBeans: 0, ladyHits: 0,
    streak: 0, bestStreak: 0, perfects: 0,
    fsd: 0, fsdReady: 0, fsdTriggers: 0,
    dogIncidents: 0, ladyCD: 8,
    scroll: 0, speed: 92, baseSpeed: 92,
    carX: ROAD_CX, carVX: 0, carLean: 0, steerTarget: null,
    throwCD: 0, invuln: 0, shake: 0, hitStop: 0,
    packages: [], obstacles: [], houses: [], props: [],
    particles: [], floatText: [], messages: [], trails: [],
    roadLines: 0, spawnT: 7, houseSide: 0, nextHouseDist: 20,
    nextGateIn: rand(48, 62), gateOptions: [], gateCorrect: 0, gateTimer: 0,
    aimPreview: null, coachPhase: 0, wrecked: false, newHigh: false,
    weather, weatherMult: wi.mult, event: null, eventT: 0,
    nextPkg: "standard", cameraY: 0, flash: 0, unlockQueue: [],
    birds: [], rain: [],
  });
  G.clouds = [];
  for (let i = 0; i < 8; i++) {
    G.clouds.push({ x: rand(-50, W + 50), y: rand(16, 100), w: rand(50, 110), s: rand(5, 16), layer: Math.random() });
  }
  for (let i = 0; i < 3; i++) G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(18, 36), flap: rand(0, 8) });
  if (weather === "rain") {
    for (let i = 0; i < 28; i++) G.rain.push({ x: rand(0, W), y: rand(0, H), z: rand(0.5, 1.1) });
  }
  for (let i = 0; i < 4; i++) spawnHouse(-i * 220 - 70);
  pickNextPackage();
  msg(wi.name, 2);
  startBgHum();
  SFX.weather();
}

function pickNextPackage() {
  const d = difficulty();
  const r = Math.random();
  if (r < 0.04) G.nextPkg = "weird";
  else if (r < 0.18 + d * 0.08) G.nextPkg = "heavy";
  else if (r < 0.38) G.nextPkg = "envelope";
  else G.nextPkg = "standard";
}
