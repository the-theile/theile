<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Tesla Paperboy – Amazon Flex Edition</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1628;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #0a1628 0%, #132a4a 100%);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    width: auto; height: auto;
    background: #87CEEB;
    box-shadow: 0 0 40px rgba(0,0,0,0.45);
  }
  @media (max-width: 520px) {
    canvas { width: 100%; height: 100%; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";

// ─── Canvas / DPR ───────────────────────────────────────────
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = 390, H = 700;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / W, vh / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 100));
resize();

// ─── Utils ──────────────────────────────────────────────────
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const smoothstep = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const now = () => performance.now();

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ─── Constants ──────────────────────────────────────────────
const ROUTE_TIME = 90;
const EASY_SECS = 35;          // longer calm opening
const ROAD_L = 78, ROAD_R = 312;
const ROAD_CX = (ROAD_L + ROAD_R) / 2;
const ROAD_W = ROAD_R - ROAD_L;
const CAR_Y = 560;
const MAX_DAMAGE = 100;
const FSD_DELIVERIES = 3;      // easier first Autopilot unlock
const FSD_DURATION = 10;
const MAX_DIFF = 0.72;         // never reaches old "full chaos"

// ─── Difficulty curve ───────────────────────────────────────
function elapsed() { return ROUTE_TIME - G.time; }

/** 0 = brand new → MAX_DIFF late route (softer ceiling) */
function difficulty() {
  const e = elapsed();
  if (e <= EASY_SECS) return (e / EASY_SECS) * 0.14; // very gentle open
  // slow ramp after easy window; caps below old max
  return clamp(0.14 + (e - EASY_SECS) / 55 * (MAX_DIFF - 0.14), 0, MAX_DIFF);
}

function aimAssistStrength() {
  // Very strong magnet — full pass aims for fairness first
  return lerp(0.96, 0.72, difficulty() / MAX_DIFF);
}

function porchPad() {
  return lerp(42, 24, difficulty() / MAX_DIFF);
}

function assistRadius() {
  return lerp(175, 115, difficulty() / MAX_DIFF);
}

function snapDistance() {
  return lerp(100, 68, difficulty() / MAX_DIFF);
}

// ─── Sound (Web Audio, no external files) ───────────────────
let audioCtx = null;
let sfxMuted = false;

function ensureAudio() {
  if (sfxMuted) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) audioCtx = new AC();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone({ freq = 440, dur = 0.12, type = "sine", gain = 0.08, slide = 0, delay = 0 }) {
  const ac = ensureAudio();
  if (!ac) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator();
  const g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(ac.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

function noiseBurst(dur = 0.08, gain = 0.04, filterFreq = 1200) {
  const ac = ensureAudio();
  if (!ac) return;
  const n = Math.floor(ac.sampleRate * dur);
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < n; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource();
  src.buffer = buf;
  const f = ac.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = filterFreq;
  const g = ac.createGain();
  g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(ac.destination);
  src.start();
}

const SFX = {
  click() { tone({ freq: 520, dur: 0.06, type: "triangle", gain: 0.05 }); },
  throw() {
    tone({ freq: 280, dur: 0.1, type: "square", gain: 0.035, slide: 160 });
    noiseBurst(0.06, 0.03, 1800);
  },
  deliver() {
    tone({ freq: 523, dur: 0.09, type: "sine", gain: 0.07 });
    tone({ freq: 659, dur: 0.1, type: "sine", gain: 0.06, delay: 0.07 });
    tone({ freq: 784, dur: 0.14, type: "sine", gain: 0.05, delay: 0.14 });
  },
  miss() { tone({ freq: 180, dur: 0.14, type: "triangle", gain: 0.04, slide: -60 }); },
  splash() {
    noiseBurst(0.18, 0.05, 900);
    tone({ freq: 220, dur: 0.12, type: "sine", gain: 0.03, slide: -80 });
  },
  hit() {
    noiseBurst(0.1, 0.06, 500);
    tone({ freq: 90, dur: 0.15, type: "sawtooth", gain: 0.04, slide: -40 });
  },
  fsd() {
    tone({ freq: 440, dur: 0.12, type: "sine", gain: 0.05, slide: 220 });
    tone({ freq: 660, dur: 0.18, type: "sine", gain: 0.045, delay: 0.08, slide: 180 });
    tone({ freq: 880, dur: 0.22, type: "triangle", gain: 0.04, delay: 0.16 });
  },
  pirate() {
    tone({ freq: 300, dur: 0.08, type: "square", gain: 0.05 });
    tone({ freq: 450, dur: 0.12, type: "square", gain: 0.04, delay: 0.08 });
  },
  gateOk() {
    tone({ freq: 392, dur: 0.1, type: "sine", gain: 0.06 });
    tone({ freq: 523, dur: 0.16, type: "sine", gain: 0.06, delay: 0.1 });
  },
  gateBad() {
    tone({ freq: 200, dur: 0.2, type: "sawtooth", gain: 0.04, slide: -80 });
  },
  snack() {
    tone({ freq: 700, dur: 0.07, type: "sine", gain: 0.05 });
    tone({ freq: 900, dur: 0.1, type: "sine", gain: 0.04, delay: 0.06 });
  },
  crack() {
    noiseBurst(0.1, 0.05, 2800);
    tone({ freq: 900, dur: 0.06, type: "square", gain: 0.03, slide: -200 });
  },
  knock() {
    tone({ freq: 160, dur: 0.1, type: "triangle", gain: 0.05, slide: -40 });
    noiseBurst(0.08, 0.04, 800);
  },
  dismiss() {
    tone({ freq: 400, dur: 0.08, type: "sine", gain: 0.05, slide: 180 });
    tone({ freq: 620, dur: 0.12, type: "triangle", gain: 0.04, delay: 0.06 });
  },
  /** Classic Paperboy shriek — angry old lady */
  lady() {
    tone({ freq: 720, dur: 0.12, type: "sawtooth", gain: 0.045, slide: 280 });
    tone({ freq: 980, dur: 0.16, type: "square", gain: 0.035, delay: 0.08, slide: -120 });
    tone({ freq: 640, dur: 0.2, type: "sawtooth", gain: 0.03, delay: 0.18, slide: 200 });
    noiseBurst(0.12, 0.035, 2200);
  },
};

// ─── Game State ─────────────────────────────────────────────
const STATE = { TITLE: 0, HOWTO: 1, PLAY: 2, GATE: 3, END: 4 };
let state = STATE.TITLE;

const G = {
  score: 0, time: ROUTE_TIME, damage: 0, deliveries: 0, fails: 0,
  snacks: 0, pirateBonus: 0, scroll: 0, speed: 110, baseSpeed: 110,
  fsd: 0, fsdReady: 0, carX: ROAD_CX, carVX: 0, steerTarget: null,
  throwCD: 0, packages: [], obstacles: [], houses: [], props: [],
  particles: [], floatText: [], messages: [], clouds: [], birds: [],
  roadLines: 0, spawnT: 0, houseSide: 0, nextHouseDist: 80,
  nextGateIn: 45, gateActive: false, gateOptions: [], gateCorrect: 0,
  gateTimer: 0, invuln: 0, shake: 0, combo: 0, bestCombo: 0,
  aimPreview: null, // {x,y,assisted} while finger in throw zone
  coachPhase: 0, wrecked: false,
  ladyCD: 0,       // cooldown before next angry lady
  ladyHits: 0,     // end-screen stat
};

const keys = {};
let pointers = new Map();
let touchSteerId = null;
let throwAimId = null;

// ─── Init ───────────────────────────────────────────────────
function resetGame() {
  Object.assign(G, {
    score: 0, time: ROUTE_TIME, damage: 0, deliveries: 0, fails: 0,
    snacks: 0, pirateBonus: 0, scroll: 0, speed: 105, baseSpeed: 105,
    fsd: 0, fsdReady: 0, carX: ROAD_CX, carVX: 0, steerTarget: null,
    throwCD: 0, packages: [], obstacles: [], houses: [], props: [],
    particles: [], floatText: [], messages: [], roadLines: 0,
    spawnT: 8, // long calm before first obstacle
    houseSide: 0, nextHouseDist: 30, nextGateIn: rand(50, 65),
    gateActive: false, gateOptions: [], gateCorrect: 0, gateTimer: 0,
    invuln: 0, shake: 0, combo: 0, bestCombo: 0, aimPreview: null,
    coachPhase: 0, wrecked: false, birds: [],
    ladyCD: 6, ladyHits: 0, threatBeans: 0,
  });
  G.clouds = [];
  for (let i = 0; i < 7; i++) {
    G.clouds.push({
      x: rand(-40, W + 40), y: rand(18, 110),
      w: rand(55, 100), s: rand(6, 14), layer: Math.random(),
    });
  }
  for (let i = 0; i < 3; i++) {
    G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(20, 40), flap: rand(0, 10) });
  }
  // Seed calm houses (roomier for larger buildings)
  for (let i = 0; i < 4; i++) spawnHouse(-i * 210 - 80);
  G.threatBeans = 0;
  spawnMessage("Only DROP pads need packages — orange rings!", 3);
  setTimeoutCoach();
}

function setTimeoutCoach() {
  // phased tips via coachPhase checked in update
}

function spawnMessage(text, life = 2) {
  G.messages.push({ text, life, max: life });
}

function floatTxt(x, y, text, color = "#fff", size = 16) {
  G.floatText.push({ x, y, text, color, size, life: 1.25, vy: -38 });
}

function burst(x, y, color, n = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(35, 130);
    G.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.35, 0.85), max: 0.85, r: rand(2, 5), color,
    });
  }
}

// ─── World spawn ────────────────────────────────────────────
const HOUSE_COLORS = [
  "#F5D0C5", "#C5E1A5", "#B3E5FC", "#FFF59D", "#E1BEE7",
  "#FFE0B2", "#B2DFDB", "#F8BBD0", "#D7CCC8", "#DCEDC8",
];

function spawnHouse(y) {
  const side = G.houseSide++ % 2;
  const color = pick(HOUSE_COLORS);
  const diff = state === STATE.PLAY ? difficulty() : 0.15;
  const early = state === STATE.PLAY && elapsed() < EASY_SECS;

  // Not every house needs a package — clearer focus on real drops
  const deliveryChance = early ? 0.7 : lerp(0.6, 0.44, diff / MAX_DIFF);
  const needsDelivery = Math.random() < deliveryChance;

  const hasPool = needsDelivery && !early && Math.random() < 0.08 + diff * 0.15;
  const hasRing = needsDelivery && Math.random() < (early ? 0.08 : 0.2 + diff * 0.12);
  const hasSnack = needsDelivery && Math.random() < 0.14 + (early ? 0.1 : 0);
  const hasPirate = needsDelivery && !early && Math.random() < 0.05 + diff * 0.1;
  const hasDog = !early && Math.random() < 0.05 + diff * 0.08;
  const hasMailbox = Math.random() < 0.85;
  const hasDriveway = Math.random() < 0.88;
  const hasParkedCar = hasDriveway && Math.random() < 0.58;
  const hasBush = Math.random() < 0.8;
  const hasFence = Math.random() < 0.55;
  const hasPlanters = Math.random() < 0.6;
  const style = pick(["ranch", "ranch", "cottage", "modern"]);

  // Bigger homes + oversized DROP pads (aim readability)
  const scale = 1.28;
  const porchW = needsDelivery ? (early ? 58 : lerp(56, 46, diff / MAX_DIFF)) : 32;
  const porchH = needsDelivery ? (early ? 46 : lerp(44, 36, diff / MAX_DIFF)) : 22;
  const porchX = side === 0 ? ROAD_L - 6 - porchW : ROAD_R + 6;

  // Parked car sits on driveway (not a Tesla collision trap — package target)
  let parkedCar = null;
  if (hasParkedCar) {
    parkedCar = {
      // world-relative offsets updated each draw/hit via house.y
      ox: side === 0 ? ROAD_L - 48 : ROAD_R + 28,
      oy: 38,
      w: 34,
      h: 52,
      color: pick(["#ECEFF1", "#E53935", "#1E88E5", "#43A047", "#FB8C00", "#5E35B1", "#37474F", "#FAFAFA"]),
      cracked: false,
      dented: false,
    };
  }

  const house = {
    y, side, color, scale,
    porchX, porchW, porchH,
    roof: pick(["#6D4C41", "#455A64", "#5D4037", "#37474F", "#795548", "#8D6E63", "#BF360C"]),
    trim: pick(["#FFFFFF", "#FAFAFA", "#FFF8E1", "#EFEBE9", "#ECEFF1"]),
    accent: pick(["#1565C0", "#2E7D32", "#6A1B9A", "#C62828", "#00838F", "#EF6C00"]),
    brick: pick(["#A1887F", "#8D6E63", "#BCAAA4", "#D7CCC8"]),
    delivered: false, glow: 1,
    needsDelivery,
    hasPool, hasRing, hasSnack, hasPirate, hasDog, hasMailbox, hasDriveway, hasBush,
    hasFence, hasPlanters, hasParkedCar, parkedCar, style,
    poolX: side === 0 ? ROAD_L - 105 : ROAD_R + 105,
    ringHit: false, snackTaken: false, pirateHit: false, windowBroken: false,
    number: 100 + ((G.houses.length + 1) * 2 + side),
    windowLit: Math.random() < 0.4,
    garage: Math.random() < 0.45,
    shutters: Math.random() < 0.55,
    ladySpawned: false,
  };
  G.houses.push(house);

  G.props.push({
    type: "palm",
    x: side === 0 ? rand(14, 42) : rand(W - 42, W - 14),
    y: y - 18,
    scale: rand(0.85, 1.15),
  });
  if (hasBush) {
    G.props.push({
      type: "bush",
      x: side === 0 ? rand(20, 55) : rand(W - 55, W - 20),
      y: y + 28,
    });
  }
  if (hasPool) {
    G.props.push({ type: "pool", x: house.poolX, y: y + 8, house });
  }
  if (Math.random() < 0.28) {
    G.props.push({
      type: "sign",
      x: side === 0 ? ROAD_L - 22 : ROAD_R + 22,
      y: y - 40,
      label: pick(["SLOW", "KIDS", "HOA", "FLEX"]),
    });
  }
  if (Math.random() < 0.4) {
    G.props.push({
      type: "pole",
      x: side === 0 ? rand(10, 28) : rand(W - 28, W - 10),
      y: y - 50,
    });
  }
  if (Math.random() < 0.22) {
    G.props.push({
      type: "firehydrant",
      x: side === 0 ? ROAD_L - 24 : ROAD_R + 18,
      y: y + 55,
    });
  }
}

function spawnObstacle() {
  const diff = difficulty();
  // Skip many spawn attempts — keeps the road breathing room
  if (Math.random() < lerp(0.45, 0.15, diff / MAX_DIFF)) return;
  if (G.fsd > 0 && Math.random() < 0.75) return;
  // Cap concurrent hazards
  if (G.obstacles.length >= (diff < 0.25 ? 1 : diff < 0.45 ? 2 : 3)) return;

  let type;
  if (diff < 0.2) {
    type = Math.random() < 0.85 ? "cone" : "scooter";
  } else if (diff < 0.4) {
    type = pick(["cone", "cone", "cone", "scooter"]);
  } else if (diff < 0.55) {
    type = pick(["cone", "cone", "scooter", "ped"]);
  } else {
    // cars & dogs rare even late
    type = pick(["cone", "cone", "scooter", "scooter", "ped", "dog", "car"]);
  }

  let x = rand(ROAD_L + 30, ROAD_R - 30);
  // Prefer shoulders most of the time so the middle lane stays deliverable
  const shoulderBias = diff < 0.35 ? 0.92 : 0.7;
  if (Math.random() < shoulderBias) {
    x = Math.random() < 0.5
      ? rand(ROAD_L + 26, ROAD_L + 58)
      : rand(ROAD_R - 58, ROAD_R - 26);
  } else if (Math.abs(x - G.carX) < 48 && Math.random() < 0.7) {
    x = G.carX < ROAD_CX ? rand(ROAD_CX + 20, ROAD_R - 30) : rand(ROAD_L + 30, ROAD_CX - 20);
  }

  const o = { type, x, y: -70, w: 28, h: 28, vx: 0, dead: false, hit: false };
  if (type === "cone") { o.w = 18; o.h = 22; }
  if (type === "scooter") { o.w = 16; o.h = 36; o.vx = pick([-12, 12]) * (0.5 + diff * 0.5); }
  if (type === "car") {
    o.w = 44; o.h = 72;
    o.x = clamp(o.x, ROAD_L + 34, ROAD_R - 34);
    // park-ish on a shoulder so player can slip by
    if (Math.random() < 0.65) {
      o.x = Math.random() < 0.5 ? ROAD_L + 38 : ROAD_R - 38;
      o.vy = rand(10, 28);
    } else {
      o.vy = rand(18, 40 + diff * 25);
    }
    o.color = pick(["#E53935", "#1E88E5", "#43A047", "#FB8C00", "#5E35B1", "#37474F", "#ECEFF1", "#FAFAFA"]);
  }
  if (type === "ped") { o.w = 18; o.h = 30; o.vx = pick([-14, 14]) * (0.5 + diff * 0.4); }
  if (type === "dog") { o.w = 26; o.h = 16; o.vx = pick([-22, 22]) * (0.5 + diff * 0.35); }
  G.obstacles.push(o);
}

// ─── Aim assist ─────────────────────────────────────────────
function getPorchRect(h) {
  const pad = state === STATE.PLAY ? porchPad() : 8;
  return {
    x: h.porchX - pad * 0.25,
    y: h.y + 6 - pad * 0.2,
    w: h.porchW + pad * 0.5,
    h: h.porchH + pad * 0.4,
    cx: h.porchX + h.porchW / 2,
    cy: h.y + 6 + h.porchH / 2,
  };
}

function isActiveStop(h) {
  return h && h.needsDelivery && !h.delivered;
}

function findAssistTarget(aimX, aimY) {
  const strength = aimAssistStrength();
  const radius = assistRadius();
  let best = null, bestH = null, bestD = radius;
  for (const h of G.houses) {
    if (!isActiveStop(h)) continue;
    const p = getPorchRect(h);
    // only assist toward pads in the throw band ahead of the car
    if (p.cy > CAR_Y - 30 || p.cy < 60) continue;
    const d = dist(aimX, aimY, p.cx, p.cy);
    if (d < bestD) {
      bestD = d;
      best = p;
      bestH = h;
    }
  }
  if (!best) return { x: aimX, y: aimY, assisted: false, porch: null, house: null, snap: false };

  // Close enough → hard snap to pad center
  const snapDist = snapDistance();
  if (bestD < snapDist) {
    return {
      x: best.cx, y: best.cy,
      assisted: true, snap: true,
      porch: best, house: bestH, pull: 1,
    };
  }

  // Soft pull, then extra sticky bias on release range
  const pull = Math.min(1, strength * (1 - bestD / radius) * 1.25);
  return {
    x: lerp(aimX, best.cx, pull),
    y: lerp(aimY, best.cy, pull),
    assisted: pull > 0.12,
    snap: pull > 0.85,
    porch: best,
    house: bestH,
    pull,
  };
}

function clampAim(startX, startY, aimX, aimY) {
  const maxDist = lerp(195, 265, difficulty() / MAX_DIFF);
  aimY = clamp(aimY, 95, CAR_Y - 75);
  // Soft curb bias (don't hard-yank over the road — was confusing aim)
  if (aimX > ROAD_L + 16 && aimX < ROAD_R - 16) {
    const curb = aimX < ROAD_CX ? ROAD_L - 18 : ROAD_R + 18;
    aimX = lerp(aimX, curb, 0.35);
  }
  const d = dist(startX, startY, aimX, aimY);
  if (d > maxDist) {
    const k = maxDist / d;
    aimX = startX + (aimX - startX) * k;
    aimY = startY + (aimY - startY) * k;
  }
  if (startY - aimY > 160) {
    aimY = lerp(aimY, startY - 148, lerp(0.55, 0.3, difficulty() / MAX_DIFF));
  }
  return { x: aimX, y: aimY };
}

/** If player is roughly aiming at best stop, force lock (release stickiness) */
function stickyReleaseAim(aimX, aimY) {
  const best = bestActiveStop();
  if (!best) return { x: aimX, y: aimY, snap: false, house: null, porch: null };
  const p = best.porch;
  const d = dist(aimX, aimY, p.cx, p.cy);
  // Generous sticky zone — main anti-frustration tool
  if (d < snapDistance() * 1.35 || (Math.abs(aimX - p.cx) < 70 && Math.abs(aimY - p.cy) < 90)) {
    return { x: p.cx, y: p.cy, snap: true, house: best.house, porch: p };
  }
  const a = findAssistTarget(aimX, aimY);
  return { x: a.x, y: a.y, snap: !!a.snap, house: a.house, porch: a.porch };
}

/** Best active delivery pad for HUD highlight / space throw */
function bestActiveStop() {
  let best = null, bestH = null, bestScore = 1e9;
  for (const h of G.houses) {
    if (!isActiveStop(h)) continue;
    const p = getPorchRect(h);
    if (p.cy > CAR_Y - 40 || p.cy < 70) continue;
    const score = Math.abs(p.cx - G.carX) * 0.5 + Math.abs(p.cy - (CAR_Y - 170)) * 0.5;
    if (score < bestScore) { bestScore = score; best = p; bestH = h; }
  }
  return best ? { porch: best, house: bestH } : null;
}

// ─── Input ──────────────────────────────────────────────────
function canvasPos(e) {
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width, scaleY = H / r.height;
  const clientX = e.clientX ?? (e.touches && e.touches[0] && e.touches[0].clientX);
  const clientY = e.clientY ?? (e.touches && e.touches[0] && e.touches[0].clientY);
  return { x: (clientX - r.left) * scaleX, y: (clientY - r.top) * scaleY };
}

function updateAimPreview(px, py) {
  if (state !== STATE.PLAY || py >= H * 0.5) {
    G.aimPreview = null;
    return;
  }
  const startX = G.carX, startY = CAR_Y - 18;
  let { x, y } = clampAim(startX, startY, px, py);
  const sticky = stickyReleaseAim(x, y);
  G.aimPreview = {
    x: sticky.x, y: sticky.y,
    assisted: sticky.snap || dist(x, y, sticky.x, sticky.y) > 2,
    snap: !!sticky.snap,
    sx: startX, sy: startY,
  };
}

function onPointerDown(e) {
  e.preventDefault();
  ensureAudio();
  const id = e.pointerId ?? 0;
  const p = canvasPos(e);
  pointers.set(id, p);

  if (state === STATE.TITLE || state === STATE.HOWTO || state === STATE.END) {
    handleUIClick(p.x, p.y);
    return;
  }
  if (state === STATE.GATE) {
    handleGateClick(p.x, p.y);
    return;
  }
  if (state === STATE.PLAY) {
    if (p.y >= H * 0.5) {
      touchSteerId = id;
      G.steerTarget = p.x;
      G.aimPreview = null;
    } else {
      throwAimId = id;
      updateAimPreview(p.x, p.y);
    }
  }
}

function onPointerMove(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = canvasPos(e);
  pointers.set(id, p);
  if (state === STATE.PLAY && id === touchSteerId) {
    G.steerTarget = p.x;
  }
  if (state === STATE.PLAY && id === throwAimId) {
    updateAimPreview(p.x, p.y);
  }
  // Hover aim on desktop when mouse in throw zone without button
  if (state === STATE.PLAY && e.pointerType === "mouse" && throwAimId == null && touchSteerId == null) {
    if (p.y < H * 0.5) updateAimPreview(p.x, p.y);
    else G.aimPreview = null;
  }
}

function onPointerUp(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = pointers.get(id) || canvasPos(e);
  if (state === STATE.PLAY && id === throwAimId) {
    updateAimPreview(p.x, p.y);
    if (G.aimPreview) throwPackage(G.aimPreview.x, G.aimPreview.y, true);
    else throwPackage(p.x, p.y, false);
    throwAimId = null;
    G.aimPreview = null;
  }
  pointers.delete(id);
  if (id === touchSteerId) {
    touchSteerId = null;
    G.steerTarget = null;
  }
}

canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
canvas.addEventListener("pointermove", onPointerMove, { passive: false });
canvas.addEventListener("pointerup", onPointerUp, { passive: false });
canvas.addEventListener("pointercancel", onPointerUp, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  ensureAudio();
  if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyM") { sfxMuted = !sfxMuted; spawnMessage(sfxMuted ? "Sound off" : "Sound on", 1.2); }
  if (state === STATE.TITLE && (e.code === "Enter" || e.code === "Space")) {
    state = STATE.PLAY; resetGame(); SFX.click();
  }
  if (state === STATE.HOWTO && (e.code === "Enter" || e.code === "Space" || e.code === "Escape")) {
    state = STATE.TITLE;
  }
  if (state === STATE.END && (e.code === "Enter" || e.code === "Space")) {
    state = STATE.TITLE;
  }
  if (state === STATE.PLAY && e.code === "Space") {
    // Smart keyboard throw: nearest undelivered porch in range, else forward
    const target = nearestPorchTarget();
    if (target) throwPackage(target.cx, target.cy, true);
    else throwPackage(G.carX + rand(-15, 15), CAR_Y - 160, false);
  }
  if (state === STATE.GATE && (e.code === "Digit1" || e.code === "Numpad1")) pickGate(0);
  if (state === STATE.GATE && (e.code === "Digit2" || e.code === "Numpad2")) pickGate(1);
  if (state === STATE.GATE && (e.code === "Digit3" || e.code === "Numpad3")) pickGate(2);
});
window.addEventListener("keyup", e => { keys[e.code] = false; });

function nearestPorchTarget() {
  const b = bestActiveStop();
  return b ? b.porch : null;
}

// ─── UI ─────────────────────────────────────────────────────
const UI = { buttons: [] };
function btn(id, x, y, w, h, label, style = "primary") {
  UI.buttons.push({ id, x, y, w, h, label, style });
}
function handleUIClick(x, y) {
  for (const b of UI.buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
      onButton(b.id);
      return;
    }
  }
}
function onButton(id) {
  SFX.click();
  if (id === "play") { state = STATE.PLAY; resetGame(); }
  if (id === "howto") { state = STATE.HOWTO; }
  if (id === "back") { state = STATE.TITLE; }
  if (id === "again") { state = STATE.PLAY; resetGame(); }
  if (id === "menu") { state = STATE.TITLE; }
}
function handleGateClick(x, y) {
  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) {
      pickGate(i);
      return;
    }
    by += 68;
  }
}
function pickGate(i) {
  if (state !== STATE.GATE) return;
  if (i === G.gateCorrect) {
    G.score += 50;
    floatTxt(W / 2, 280, "GATE OPEN +50", "#4CAF50", 20);
    burst(W / 2, 320, "#4CAF50", 16);
    spawnMessage("Gate code accepted. Welcome, Flexer.", 2);
    SFX.gateOk();
  } else {
    G.damage = clamp(G.damage + 14, 0, MAX_DAMAGE);
    G.time = Math.max(0, G.time - 2.5);
    G.shake = 10;
    floatTxt(W / 2, 280, "WRONG CODE!", "#FF5252", 18);
    spawnMessage("Wrong code… HOA delay + damage.", 2.4);
    SFX.gateBad();
  }
  state = STATE.PLAY;
  G.gateActive = false;
  G.nextGateIn = rand(30, 45);
}

// ─── Throw ──────────────────────────────────────────────────
function throwPackage(tx, ty, alreadyAssisted) {
  if (G.throwCD > 0 || state !== STATE.PLAY) return;
  G.throwCD = lerp(0.24, 0.16, difficulty() / MAX_DIFF);
  const startX = G.carX;
  const startY = CAR_Y - 18;
  const c = clampAim(startX, startY, tx, ty);
  // Always run sticky release — strongest aim help on throw
  const sticky = stickyReleaseAim(c.x, c.y);
  let aimX = sticky.x, aimY = sticky.y;
  let targetHouse = sticky.house;

  // Tap-to-auto: if best pad is "beside" the car, force it
  const best = bestActiveStop();
  if (best && Math.abs(best.porch.cx - G.carX) < 95 && best.porch.cy > CAR_Y - 280 && best.porch.cy < CAR_Y - 60) {
    if (!sticky.snap || dist(aimX, aimY, best.porch.cx, best.porch.cy) > 20) {
      // mild auto when close to pad lane
      if (Math.abs(c.x - best.porch.cx) < 90) {
        aimX = best.porch.cx;
        aimY = best.porch.cy;
        targetHouse = best.house;
      }
    }
  }

  const d = dist(startX, startY, aimX, aimY);
  const flight = clamp(d / lerp(270, 340, difficulty() / MAX_DIFF), 0.36, 0.8);
  G.packages.push({
    x: startX, y: startY,
    sx: startX, sy: startY,
    tx: aimX, ty: aimY,
    t: 0, dur: flight,
    arc: lerp(24, 38, Math.min(d / 220, 1)),
    rot: rand(0, Math.PI),
    vr: rand(-5, 5),
    done: false,
    targetHouse,
  });
  SFX.throw();
}

function startGate() {
  state = STATE.GATE;
  G.gateActive = true;
  const correct = String(randi(1000, 9999));
  const opts = new Set([correct]);
  while (opts.size < 3) {
    let c;
    if (Math.random() < 0.65) {
      const digits = correct.split("");
      digits[randi(0, 3)] = String(randi(0, 9));
      c = digits.join("");
    } else c = String(randi(1000, 9999));
    opts.add(c);
  }
  G.gateOptions = [...opts].sort(() => Math.random() - 0.5);
  G.gateCorrect = G.gateOptions.indexOf(correct);
  G.gateTimer = 10;
  spawnMessage("GATED COMMUNITY — pick the code!", 2);
}

function tryFSD() {
  G.fsdReady++;
  if (G.fsdReady >= FSD_DELIVERIES) {
    G.fsdReady = 0;
    G.fsd = FSD_DURATION;
    spawnMessage("⚡ FSD ENGAGED — focus on throws!", 2.8);
    burst(G.carX, CAR_Y, "#00B0FF", 22);
    SFX.fsd();
  }
}

function carHitbox() {
  return { x: G.carX - 22, y: CAR_Y - 48, w: 44, h: 78 };
}
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function damagePlayer(amt, reason) {
  if (G.invuln > 0 || G.fsd > 0) return false;
  // Early route: softer damage
  const scaled = amt * lerp(0.4, 0.85, difficulty() / MAX_DIFF);
  G.damage = clamp(G.damage + scaled, 0, MAX_DAMAGE);
  G.invuln = lerp(1.6, 1.15, difficulty() / MAX_DIFF);
  G.shake = 7;
  G.combo = 0;
  if (reason) spawnMessage(reason, 2);
  if (G.damage >= MAX_DAMAGE) endRoute(true);
  return true;
}
function endRoute(wrecked) {
  state = STATE.END;
  G.wrecked = wrecked;
}

// ─── Update ─────────────────────────────────────────────────
let lastT = now();

function update(dt) {
  for (const c of G.clouds) {
    c.x += c.s * dt * (0.12 + c.layer * 0.1);
    if (c.x > W + 90) c.x = -90;
  }
  for (const b of G.birds) {
    b.x += b.s * dt;
    b.flap += dt * 8;
    if (b.x > W + 30) { b.x = -30; b.y = rand(40, 110); }
  }

  if (state === STATE.TITLE || state === STATE.HOWTO || state === STATE.END) {
    G.scroll += 28 * dt;
    return;
  }

  if (state === STATE.GATE) {
    G.gateTimer -= dt;
    if (G.gateTimer <= 0) {
      G.damage = clamp(G.damage + 12, 0, MAX_DAMAGE);
      G.shake = 8;
      spawnMessage("Gate timeout! Security noted your plate.", 2.2);
      state = STATE.PLAY;
      G.gateActive = false;
      G.nextGateIn = rand(32, 48);
    }
    updateFX(dt);
    return;
  }

  // PLAY
  G.time -= dt;
  if (G.time <= 0) { G.time = 0; endRoute(false); return; }

  if (G.invuln > 0) G.invuln -= dt;
  if (G.throwCD > 0) G.throwCD -= dt;
  if (G.shake > 0) G.shake -= dt * 18;

  // Coaching phases
  const e = elapsed();
  if (G.coachPhase === 0 && e > 0.8) {
    G.coachPhase = 1;
    spawnMessage("Drag bottom to steer · Tap/hold top to aim & throw", 3.2);
  } else if (G.coachPhase === 1 && e > 5 && G.deliveries === 0) {
    G.coachPhase = 2;
    spawnMessage("Only DROP / AIM HERE pads need packages!", 3.2);
  } else if (G.coachPhase === 2 && e > EASY_SECS) {
    G.coachPhase = 3;
    spawnMessage("Traffic picking up — and watch for angry lawn ladies!", 2.6);
  }

  if (G.fsd > 0) {
    G.fsd -= dt;
    if (G.fsd <= 0) {
      G.fsd = 0;
      spawnMessage("Autopilot off — you're driving again.", 2);
    }
  }

  // Speed: calm cruise → moderate late (not frantic)
  const diff = difficulty();
  G.baseSpeed = lerp(92, 155, easeOut(diff / MAX_DIFF));
  G.speed = G.baseSpeed * (G.fsd > 0 ? 1.05 : 1);

  const scrollAmt = G.speed * dt;
  G.scroll += scrollAmt;
  G.roadLines += scrollAmt;

  // Steering
  let inputX = 0;
  if (keys["ArrowLeft"] || keys["KeyA"]) inputX -= 1;
  if (keys["ArrowRight"] || keys["KeyD"]) inputX += 1;

  if (G.fsd > 0) {
    let avoid = 0, best = 1e9;
    for (const o of G.obstacles) {
      if (o.dead || o.y < CAR_Y - 220 || o.y > CAR_Y + 40) continue;
      const dx = o.x - G.carX;
      const dy = Math.abs(o.y - CAR_Y);
      const threat = Math.abs(dx) + dy * 0.35;
      if (threat < best && Math.abs(dx) < 70) {
        best = threat;
        avoid = dx > 0 ? -1 : 1;
      }
    }
    const centerPull = (ROAD_CX - G.carX) * 0.01;
    G.carVX = lerp(G.carVX, avoid * 200 + centerPull * 50, 1 - Math.pow(0.001, dt));
  } else if (G.steerTarget != null) {
    const dx = G.steerTarget - G.carX;
    G.carVX = lerp(G.carVX, clamp(dx * 5.5, -240, 240), 1 - Math.pow(0.0006, dt));
  } else {
    G.carVX = lerp(G.carVX, inputX * 230, 1 - Math.pow(0.001, dt));
    if (inputX === 0) G.carVX *= Math.pow(0.1, dt);
  }
  G.carX = clamp(G.carX + G.carVX * dt, ROAD_L + 26, ROAD_R - 26);

  // Scroll entities
  for (const h of G.houses) h.y += scrollAmt;
  for (const p of G.props) p.y += scrollAmt;
  for (const o of G.obstacles) {
    o.y += scrollAmt;
    if (o.type === "car") o.y += (o.vy || 0) * dt;
    if (o.type === "lady") {
      updateLady(o, dt, scrollAmt);
    } else {
      o.x += (o.vx || 0) * dt;
      if (o.type === "scooter" || o.type === "ped" || o.type === "dog") {
        if (o.x < ROAD_L + 14 || o.x > ROAD_R - 14) o.vx *= -1;
      }
    }
  }

  // Classic Paperboy: speed too high → scary old lady bursts from a house
  if (G.ladyCD > 0) G.ladyCD -= dt;
  trySpawnAngryLady(e, diff);

  // Houses — roomier for larger buildings
  G.nextHouseDist -= scrollAmt;
  if (G.nextHouseDist <= 0) {
    spawnHouse(-100);
    G.nextHouseDist = lerp(240, 180, diff / MAX_DIFF);
  }

  // Obstacles — sparse overall (was far too dense)
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    if (e > 6) spawnObstacle();
    // ~4.8s early → ~2.0s late between attempts (many attempts still skip)
    G.spawnT = lerp(4.8, 2.0, easeOut(diff / MAX_DIFF));
  }

  // Gates only well after first FSD window
  if (e > EASY_SECS + 12) {
    G.nextGateIn -= dt;
    if (G.nextGateIn <= 0 && !G.gateActive) startGate();
  }

  // Packages — flight + mid-air impacts (Paperboy style)
  for (const pk of G.packages) {
    if (pk.done) continue;
    pk.t += dt;
    const u = clamp(pk.t / pk.dur, 0, 1);
    const ease = smoothstep(u);
    pk.x = lerp(pk.sx, pk.tx, ease);
    const linearY = lerp(pk.sy, pk.ty, ease);
    pk.y = linearY - Math.sin(u * Math.PI) * pk.arc;
    pk.rot += pk.vr * dt;
    // After package leaves the car a bit, allow hits
    if (u > 0.12 && u < 0.98 && resolvePackageMidair(pk)) {
      pk.done = true;
      continue;
    }
    if (u >= 1) {
      pk.done = true;
      resolvePackageLanding(pk);
    }
  }
  G.packages = G.packages.filter(p => !p.done || ((p.fade = (p.fade ?? 0.2) - dt) > 0));

  // Collisions
  const car = carHitbox();
  for (const o of G.obstacles) {
    if (o.dead || o.hit) continue;
    if (o.y < CAR_Y - 100 || o.y > CAR_Y + 60) continue;
    const ob = { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h };
    if (rectsOverlap(car, ob)) {
      o.hit = true;
      o.dead = true;
      handleObstacleHit(o);
    }
  }

  G.houses = G.houses.filter(h => h.y < H + 120);
  G.props = G.props.filter(p => p.y < H + 120);
  G.obstacles = G.obstacles.filter(o => !o.dead && o.y < H + 100);

  updateFX(dt);
  for (const m of G.messages) m.life -= dt;
  G.messages = G.messages.filter(m => m.life > 0);
}

function updateFX(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 120 * dt;
    p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const f of G.floatText) {
    f.y += f.vy * dt;
    f.life -= dt;
  }
  G.floatText = G.floatText.filter(f => f.life > 0);
}

function handleObstacleHit(o) {
  if (G.fsd > 0) {
    floatTxt(o.x, o.y, "DODGED", "#00B0FF", 14);
    burst(o.x, o.y, "#00B0FF", 8);
    return;
  }
  if (o.type === "lady") {
    G.ladyHits++;
    damagePlayer(16, pick([
      "SLOW DOWN!! Get off my lawn!",
      "I'm calling the HOA AND your mother!",
      "Kids these days and their silent Teslas!",
      "You almost hit Mr. Fluffernutter!",
    ]));
    burst(o.x, o.y, "#CE93D8", 16);
    floatTxt(o.x, o.y - 16, "PHONE SMACK!", "#E1BEE7", 15);
    SFX.lady();
    SFX.hit();
    return;
  }
  const table = {
    cone: { dmg: 7, msg: "Traffic cone! Watch the shoulder." },
    scooter: { dmg: 11, msg: "Lime scooter — classic Florida hazard." },
    car: { dmg: 20, msg: "Fender bender with a sunburned sedan!" },
    ped: { dmg: 12, msg: "Phone zombie stepped out!" },
    dog: { dmg: 9, msg: "Doggo loves your Tesla a little too much." },
  };
  const t = table[o.type] || { dmg: 10, msg: "Ouch!" };
  damagePlayer(t.dmg, t.msg);
  burst(o.x, o.y, "#FF7043", 12);
  floatTxt(o.x, o.y - 10, "ouch", "#FF5252", 13);
  SFX.hit();
}

// ─── Scary old lady (Paperboy classic) ──────────────────────
const SPEED_LIMIT = 118; // above this cruise = "too fast"

function isSpeeding() {
  // FSD counts as speeding too — she hates autopilot
  return G.speed >= SPEED_LIMIT || (G.fsd > 0 && G.baseSpeed >= SPEED_LIMIT - 8);
}

function trySpawnAngryLady(elapsedSec, diff) {
  if (state !== STATE.PLAY) return;
  if (G.ladyCD > 0) return;
  if (elapsedSec < 14) return; // give the block a moment
  if (!isSpeeding()) return;
  // Only one lady on screen at a time
  if (G.obstacles.some(o => o.type === "lady" && !o.dead)) return;

  // Find a house she's "at" — mid-ahead of the car
  const candidates = G.houses.filter(h =>
    !h.ladySpawned &&
    h.y > 120 && h.y < CAR_Y - 140
  );
  if (!candidates.length) return;

  // Chance ramps with how much over the limit + route difficulty
  const over = clamp((G.speed - SPEED_LIMIT) / 40, 0, 1);
  const chance = 0.012 + over * 0.035 + diff * 0.02; // per frame ~60fps → ~0.7–3/s windowed by CD
  // Called every frame — use low chance, then long CD
  if (Math.random() > chance) return;

  const h = pick(candidates);
  spawnAngryLady(h);
}

function spawnAngryLady(h) {
  h.ladySpawned = true;
  G.ladyCD = rand(9, 16); // don't spam grannies
  const porch = getPorchRect(h);
  const startX = porch.cx;
  const startY = h.y + 20;
  const roadTargetX = h.side === 0
    ? ROAD_L + rand(36, 70)
    : ROAD_R - rand(36, 70);

  G.obstacles.push({
    type: "lady",
    x: startX,
    y: startY,
    w: 22,
    h: 36,
    vx: 0,
    vy: 0,
    dead: false,
    hit: false,
    phase: "exit", // exit yard → chase car
    roadX: roadTargetX,
    side: h.side,
    age: 0,
    shake: 0,
    wave: 0,
    yellT: 0,
    yellText: "I'M FILMING!",
  });

  floatTxt(startX, startY - 20, "I'M FILMING!!!", "#F8BBD0", 16);
  spawnMessage(pick([
    "😱 Old lady incoming — you were speeding!",
    "Classic Paperboy energy: angry neighbor activated!",
    "She's filming you for the HOA group chat!",
  ]), 2.6);
  SFX.lady();
  burst(startX, startY, "#F8BBD0", 10);
}

function updateLady(o, dt, scrollAmt) {
  o.age += dt;
  o.wave += dt * 14;
  o.yellT -= dt;

  if (o.phase === "exit") {
    // Burst from porch onto the road
    const dx = o.roadX - o.x;
    const dy = 8; // slight down-road motion
    o.x += Math.sign(dx) * Math.min(Math.abs(dx), 140 * dt);
    o.y += 55 * dt;
    if (Math.abs(o.x - o.roadX) < 6) {
      o.phase = "chase";
      o.x = o.roadX;
      if (o.yellT <= 0) {
        o.yellText = pick(["I'M FILMING!", "HOA CHAT!", "SLOW DOWN!", "GOT YOUR PLATE!"]);
        floatTxt(o.x, o.y - 24, o.yellText, "#FF80AB", 13);
        o.yellT = 1.1;
        SFX.lady();
      }
    }
  } else {
    // Chase the Tesla — home in on car X, close the Y gap
    const ax = (G.carX - o.x) * 3.2;
    o.vx = lerp(o.vx || 0, clamp(ax, -160, 160), 1 - Math.pow(0.02, dt));
    o.x += o.vx * dt;
    o.x = clamp(o.x, ROAD_L + 16, ROAD_R - 16);
    // Run toward player (down screen) faster than scroll so she can catch up
    o.y += 95 * dt;
    if (o.yellT <= 0 && Math.random() < 0.02) {
      o.yellText = pick(["SENDING TO HOA!", "I SAW THAT!", "TESLA HOOLIGAN!"]);
      floatTxt(o.x, o.y - 22, o.yellText, "#F48FB1", 12);
      o.yellT = 1.4;
    }
  }

  // Despawn if she falls too far behind/past
  if (o.y > CAR_Y + 80 || o.age > 8) {
    o.dead = true;
  }
}

/** Mid-flight package hits: threats, cars, cones — classic Paperboy chaos */
function resolvePackageMidair(pk) {
  // Threats / road objects
  for (const o of G.obstacles) {
    if (o.dead || o.pkgHit) continue;
    const r = o.type === "car" ? 28 : o.type === "lady" ? 22 : o.type === "dog" ? 18 : 16;
    if (dist(pk.x, pk.y, o.x, o.y) < r) {
      return packageHitEntity(pk, o);
    }
  }
  // Parked driveway cars + house windows
  for (const h of G.houses) {
    if (h.parkedCar && !h.parkedCar.dead) {
      const pc = h.parkedCar;
      const cx = pc.ox, cy = h.y + pc.oy;
      if (Math.abs(pk.x - cx) < pc.w * 0.45 && Math.abs(pk.y - cy) < pc.h * 0.45) {
        return packageHitParkedCar(pk, h);
      }
    }
    // window smash if package hits house face (not porch)
    if (!h.windowBroken && packageHitsWindow(pk, h)) {
      return packageHitWindow(pk, h);
    }
  }
  return false;
}

function packageHitsWindow(pk, h) {
  const sc = h.scale || 1.28;
  const hw = (h.style === "modern" ? 72 : 70) * sc;
  const hh = (h.style === "cottage" ? 70 : 78) * sc;
  const hx = h.side === 0 ? 2 : ROAD_R + 6;
  const hy = h.y - 28;
  // window region on house face
  const wx = h.side === 0 ? hx + 10 : hx + hw - 36;
  const wy = hy + 16;
  return pk.x > wx - 4 && pk.x < wx + 30 && pk.y > wy - 4 && pk.y < wy + 24;
}

function packageHitEntity(pk, o) {
  o.pkgHit = true;
  // Threats get dismissed (bonus). Static hazards knock over.
  const dismissTypes = { lady: 1, ped: 1, dog: 1, scooter: 1, cone: 1 };
  if (dismissTypes[o.type]) {
    const bonus = o.type === "lady" ? 60 : o.type === "ped" ? 40 : o.type === "dog" ? 35 : 25;
    G.score += bonus;
    G.combo++;
    G.bestCombo = Math.max(G.bestCombo, G.combo);
    G.threatBeans = (G.threatBeans || 0) + 1;
    o.dead = true;
    o.hit = true;
    // ragdoll knock
    burst(o.x, o.y, o.type === "lady" ? "#F8BBD0" : "#FFCC80", 14);
    floatTxt(o.x, o.y - 14, "BEANED! +" + bonus, "#69F0AE", 14);
    spawnMessage(pick([
      "Package justice! Threat dismissed.",
      "Paperboy special — right in the kisser!",
      o.type === "lady" ? "Filmed THAT, Karen?" : "Nice toss!",
    ]), 1.8);
    SFX.dismiss();
    return true;
  }
  if (o.type === "car") {
    // Moving traffic — dent + bounce, small penalty
    G.score = Math.max(0, G.score - 15);
    G.combo = 0;
    o.vx = (o.vx || 0) + (pk.x < o.x ? 40 : -40);
    burst(pk.x, pk.y, "#90A4AE", 12);
    floatTxt(pk.x, pk.y, "traffic ding −15", "#FF8A65", 12);
    SFX.crack();
    return true;
  }
  return false;
}

function packageHitParkedCar(pk, h) {
  const pc = h.parkedCar;
  if (!pc.cracked) {
    pc.cracked = true;
    pc.dented = true;
    G.score = Math.max(0, G.score - 20);
    G.combo = 0;
    G.fails++;
    burst(pk.x, pk.y, "#B0BEC5", 14);
    floatTxt(pk.x, pk.y - 10, "CRACKED WINDSHIELD −20", "#EF9A9A", 13);
    spawnMessage("You tagged a parked car. HOA will bill Flex.", 2);
    SFX.crack();
  } else {
    floatTxt(pk.x, pk.y, "already dented", "#BDBDBD", 11);
    SFX.knock();
  }
  return true;
}

function packageHitWindow(pk, h) {
  h.windowBroken = true;
  h.windowLit = false;
  G.score = Math.max(0, G.score - 25);
  G.combo = 0;
  G.fails++;
  burst(pk.x, pk.y, "#E1F5FE", 16);
  floatTxt(pk.x, pk.y, "WINDOW SMASH −25", "#4FC3F7", 13);
  spawnMessage("Classic Paperboy — you broke a window!", 2);
  SFX.crack();
  return true;
}

function resolvePackageLanding(pk) {
  // Midair-style checks one more time at landing
  if (resolvePackageMidair(pk)) return;

  const ordered = [];
  if (pk.targetHouse && isActiveStop(pk.targetHouse)) ordered.push(pk.targetHouse);
  for (const h of G.houses) {
    if (h !== pk.targetHouse) ordered.push(h);
  }

  for (const h of ordered) {
    const porch = getPorchRect(h);
    const onPad = pk.x > porch.x && pk.x < porch.x + porch.w &&
                  pk.y > porch.y && pk.y < porch.y + porch.h;
    // Extra forgiveness around active DROP pads
    const nearPad = isActiveStop(h) && dist(pk.x, pk.y, porch.cx, porch.cy) < lerp(48, 32, difficulty() / MAX_DIFF);

    if (onPad || nearPad) {
      if (!h.needsDelivery) {
        floatTxt(porch.cx, porch.cy, "no delivery here", "#B0BEC5", 12);
        SFX.miss();
        return;
      }
      if (h.delivered) {
        floatTxt(porch.cx, porch.cy, "already delivered", "#B0BEC5", 12);
        SFX.miss();
        return;
      }

      if (h.hasPirate && !h.pirateHit) {
        h.pirateHit = true;
        h.delivered = true;
        const bonus = 75;
        G.score += bonus;
        G.pirateBonus++;
        G.deliveries++;
        G.combo++;
        G.bestCombo = Math.max(G.bestCombo, G.combo);
        tryFSD();
        floatTxt(porch.cx, porch.cy, "PIRATE BONKED! +" + bonus, "#FFD54F", 15);
        burst(pk.x, pk.y, "#FFD54F", 14);
        spawnMessage("Beaned a porch pirate. Justice!", 2);
        SFX.pirate();
        return;
      }

      if (h.hasRing && Math.random() < lerp(0.05, 0.16, difficulty() / MAX_DIFF)) {
        h.ringHit = true;
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 10);
        floatTxt(pk.x, pk.y, "Ring cam −10", "#FF8A65", 13);
        burst(pk.x, pk.y, "#90A4AE", 8);
        spawnMessage("Tagged the Ring camera. HOA has footage.", 2);
        SFX.miss();
        return;
      }

      h.delivered = true;
      let pts = 100 + G.combo * 10;
      let note = "DELIVERED +" + pts;
      if (h.hasSnack && !h.snackTaken) {
        h.snackTaken = true;
        G.snacks++;
        pts += 40;
        note = "SNACKS! +" + pts;
        spawnMessage("Customer left Gatorade & cookies! 🍪", 2);
        burst(pk.x, pk.y, "#FFB74D", 16);
        SFX.snack();
      } else {
        SFX.deliver();
      }
      G.score += pts;
      G.deliveries++;
      G.combo++;
      G.bestCombo = Math.max(G.bestCombo, G.combo);
      tryFSD();
      floatTxt(porch.cx, porch.cy - 12, note, "#69F0AE", 15);
      burst(pk.x, pk.y, "#FF9900", 14);
      return;
    }

    if (h.hasPool) {
      const pool = { x: h.poolX - 30, y: h.y + 4, w: 60, h: 42 };
      if (pk.x > pool.x && pk.x < pool.x + pool.w && pk.y > pool.y && pk.y < pool.y + pool.h) {
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 20);
        floatTxt(pk.x, pk.y, "SPLASH! −20", "#4FC3F7", 14);
        burst(pk.x, pk.y, "#29B6F6", 18);
        spawnMessage("Package went for a swim.", 2);
        SFX.splash();
        return;
      }
    }

    if (h.hasDog) {
      const dogX = h.side === 0 ? h.porchX + h.porchW + 14 : h.porchX - 14;
      const dogY = h.y + 38;
      if (dist(pk.x, pk.y, dogX, dogY) < 32) {
        G.fails++;
        G.combo = 0;
        G.score = Math.max(0, G.score - 8);
        floatTxt(pk.x, pk.y, "DOG GOT IT", "#A1887F", 13);
        burst(pk.x, pk.y, "#8D6E63", 8);
        spawnMessage("Good boy. Bad metrics.", 2);
        SFX.miss();
        if (Math.random() < 0.3) {
          G.obstacles.push({
            type: "dog", x: dogX, y: dogY, w: 26, h: 16,
            vx: (G.carX - dogX) * 0.35, dead: false, hit: false,
          });
        }
        return;
      }
    }
  }

  // Driveway short-drop (not a full fail — package slides on concrete)
  for (const h of G.houses) {
    if (!h.hasDriveway) continue;
    const dwx = h.side === 0 ? ROAD_L - 30 : ROAD_R + 4;
    if (pk.x > dwx - 8 && pk.x < dwx + 36 && pk.y > h.y + 5 && pk.y < h.y + 60) {
      floatTxt(pk.x, pk.y, "driveway skid", "#B0BEC5", 12);
      burst(pk.x, pk.y, "#9E9E9E", 8);
      G.combo = 0;
      SFX.knock();
      return;
    }
  }

  if (pk.x > ROAD_L && pk.x < ROAD_R) {
    floatTxt(pk.x, pk.y, "road pizza", "#BDBDBD", 12);
    burst(pk.x, pk.y, "#9E9E9E", 6);
    // asphalt scuff marks as particles
    for (let i = 0; i < 4; i++) {
      G.particles.push({
        x: pk.x + rand(-8, 8), y: pk.y + rand(-4, 4),
        vx: rand(-20, 20), vy: rand(-10, 10),
        life: 0.4, max: 0.4, r: rand(2, 4), color: "#546E7A",
      });
    }
  } else {
    floatTxt(pk.x, pk.y, "lawn splat", "#AED581", 12);
    burst(pk.x, pk.y, "#7CB342", 6);
    G.combo = 0;
  }
  SFX.miss();
}

// ─── Drawing ────────────────────────────────────────────────
function draw() {
  ctx.save();
  if (G.shake > 0) {
    ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake) * 0.6);
  }
  drawSky();
  drawGround();
  drawRoad();
  drawProps();
  drawHouses();
  drawObstacles();
  drawAimPreview();
  drawPackages();
  drawTesla();
  drawParticles();
  drawFloatText();
  ctx.restore();

  if (state === STATE.TITLE) drawTitle();
  else if (state === STATE.HOWTO) drawHowTo();
  else if (state === STATE.PLAY) drawHUD();
  else if (state === STATE.GATE) { drawHUD(); drawGate(); }
  else if (state === STATE.END) drawEnd();
}

function drawSky() {
  // Florida midday sky — deeper blue aloft, hazy near horizon
  const g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
  g.addColorStop(0, "#3B7DD6");
  g.addColorStop(0.35, "#6BB3E0");
  g.addColorStop(0.7, "#A8D8F0");
  g.addColorStop(1, "#D4EBF5");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // heat haze band near horizon
  const haze = ctx.createLinearGradient(0, H * 0.28, 0, H * 0.5);
  haze.addColorStop(0, "rgba(255,240,200,0)");
  haze.addColorStop(0.6, "rgba(255,230,180,0.12)");
  haze.addColorStop(1, "rgba(255,220,160,0.08)");
  ctx.fillStyle = haze;
  ctx.fillRect(0, H * 0.28, W, H * 0.22);

  // sun + atmospheric bloom
  const sx = W - 48, sy = 44;
  const sg = ctx.createRadialGradient(sx, sy, 2, sx, sy, 70);
  sg.addColorStop(0, "rgba(255,252,220,1)");
  sg.addColorStop(0.15, "rgba(255,240,150,0.85)");
  sg.addColorStop(0.4, "rgba(255,210,100,0.28)");
  sg.addColorStop(1, "rgba(255,180,80,0)");
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.arc(sx, sy, 70, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFFDE7";
  ctx.beginPath();
  ctx.arc(sx, sy, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#FFE082";
  ctx.beginPath();
  ctx.arc(sx, sy, 12, 0, Math.PI * 2);
  ctx.fill();

  // far distant treeline silhouette (Florida suburb horizon)
  ctx.fillStyle = "rgba(70,110,50,0.18)";
  ctx.beginPath();
  ctx.moveTo(0, H * 0.38);
  for (let i = 0; i <= 12; i++) {
    const tx = (i / 12) * W;
    const th = 10 + Math.sin(i * 1.7 + G.scroll * 0.002) * 6 + (i % 3) * 4;
    ctx.lineTo(tx, H * 0.38 - th);
  }
  ctx.lineTo(W, H * 0.4);
  ctx.lineTo(0, H * 0.4);
  ctx.fill();

  for (const c of G.clouds) drawCloud(c.x, c.y, c.w, 0.7 + c.layer * 0.25);
  for (const b of G.birds) drawBird(b);
}

function drawCloud(x, y, w, a) {
  // soft multi-lobe cumulus with slight underside shade
  ctx.fillStyle = `rgba(255,255,255,${a})`;
  ctx.beginPath();
  ctx.ellipse(x, y, w * 0.52, w * 0.2, 0, 0, Math.PI * 2);
  ctx.ellipse(x - w * 0.3, y + 4, w * 0.3, w * 0.16, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.28, y + 3, w * 0.34, w * 0.18, 0, 0, Math.PI * 2);
  ctx.ellipse(x + w * 0.02, y - 10, w * 0.24, w * 0.16, 0, 0, Math.PI * 2);
  ctx.ellipse(x - w * 0.12, y - 6, w * 0.2, w * 0.12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = `rgba(200,210,220,${a * 0.25})`;
  ctx.beginPath();
  ctx.ellipse(x, y + 6, w * 0.4, w * 0.1, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawBird(b) {
  const flap = Math.sin(b.flap) * 5;
  ctx.strokeStyle = "rgba(45,50,60,0.5)";
  ctx.lineWidth = 1.6;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(b.x - 7, b.y + flap);
  ctx.quadraticCurveTo(b.x - 1, b.y - 4, b.x, b.y);
  ctx.quadraticCurveTo(b.x + 1, b.y - 4, b.x + 7, b.y + flap);
  ctx.stroke();
  ctx.lineCap = "butt";
}

function drawGround() {
  // Florida lawn — warmer green near curb, deeper in yards
  const lg = ctx.createLinearGradient(0, 0, ROAD_L, 0);
  lg.addColorStop(0, "#4E7A28");
  lg.addColorStop(0.55, "#6BA335");
  lg.addColorStop(1, "#8BC34A");
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, ROAD_L, H);
  const rg = ctx.createLinearGradient(ROAD_R, 0, W, 0);
  rg.addColorStop(0, "#8BC34A");
  rg.addColorStop(0.45, "#6BA335");
  rg.addColorStop(1, "#4E7A28");
  ctx.fillStyle = rg;
  ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);

  // mower stripes + lawn variation
  for (let i = 0; i < 18; i++) {
    const yy = ((i * 48 + G.scroll * 0.22) % (H + 48)) - 24;
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.035)" : "rgba(0,0,0,0.03)";
    ctx.fillRect(0, yy, ROAD_L - 10, 22);
    ctx.fillRect(ROAD_R + 10, yy, W - ROAD_R - 10, 22);
  }

  // sandy Florida soil patches
  ctx.fillStyle = "rgba(210,180,120,0.18)";
  for (let i = 0; i < 5; i++) {
    const yy = ((i * 160 + G.scroll * 0.3) % (H + 160)) - 40;
    ctx.beginPath();
    ctx.ellipse(20 + (i % 3) * 12, yy, 18, 8, 0, 0, Math.PI * 2);
    ctx.ellipse(W - 24 - (i % 2) * 10, yy + 40, 16, 7, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // concrete sidewalks with expansion joints
  ctx.fillStyle = "#C8C2B6";
  ctx.fillRect(ROAD_L - 17, 0, 13, H);
  ctx.fillRect(ROAD_R + 4, 0, 13, H);
  // sidewalk edge shadow
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  ctx.fillRect(ROAD_L - 5, 0, 2, H);
  ctx.fillRect(ROAD_R + 4, 0, 2, H);
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 22; i++) {
    const yy = ((i * 46 - G.scroll * 0.92) % (H + 46));
    ctx.beginPath();
    ctx.moveTo(ROAD_L - 17, yy); ctx.lineTo(ROAD_L - 4, yy);
    ctx.moveTo(ROAD_R + 4, yy); ctx.lineTo(ROAD_R + 17, yy);
    ctx.stroke();
  }

  // sandy / painted curb
  const curb = ctx.createLinearGradient(0, 0, 0, 8);
  ctx.fillStyle = "#D4B896";
  ctx.fillRect(ROAD_L - 5, 0, 5, H);
  ctx.fillRect(ROAD_R, 0, 5, H);
  // curb highlight
  ctx.fillStyle = "rgba(255,255,255,0.15)";
  ctx.fillRect(ROAD_L - 5, 0, 1.5, H);
  ctx.fillRect(ROAD_R + 3.5, 0, 1.5, H);
}

function drawRoad() {
  // sun-bleached Florida asphalt
  const ag = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
  ag.addColorStop(0, "#3E4E56");
  ag.addColorStop(0.15, "#4A5C64");
  ag.addColorStop(0.5, "#566B75");
  ag.addColorStop(0.85, "#4A5C64");
  ag.addColorStop(1, "#3E4E56");
  ctx.fillStyle = ag;
  ctx.fillRect(ROAD_L, 0, ROAD_W, H);

  // asphalt grain / tar seams
  ctx.strokeStyle = "rgba(0,0,0,0.07)";
  ctx.lineWidth = 1;
  for (let i = 0; i < 10; i++) {
    const yy = ((i * 95 + G.scroll * 0.5) % (H + 95)) - 30;
    ctx.beginPath();
    ctx.moveTo(ROAD_L + 8, yy);
    ctx.quadraticCurveTo(ROAD_CX, yy + 8 + (i % 3) * 4, ROAD_R - 8, yy - 2);
    ctx.stroke();
  }

  // oil stains / wear patches
  ctx.fillStyle = "rgba(0,0,0,0.07)";
  for (let i = 0; i < 7; i++) {
    const yy = ((i * 118 + G.scroll * 0.38) % (H + 118)) - 40;
    ctx.beginPath();
    ctx.ellipse(ROAD_CX + Math.sin(i * 2.3) * 28, yy, 36 + (i % 3) * 8, 14, 0.1, 0, Math.PI * 2);
    ctx.fill();
  }

  // faded center lane dashes
  ctx.strokeStyle = "#E8D96A";
  ctx.lineWidth = 4;
  ctx.globalAlpha = 0.9;
  ctx.setLineDash([24, 18]);
  ctx.lineDashOffset = -G.roadLines * 0.95;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX, 0);
  ctx.lineTo(ROAD_CX, H);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  // double-feel edge lines (white)
  ctx.strokeStyle = "#F5F5F5";
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 5, 0); ctx.lineTo(ROAD_L + 5, H);
  ctx.moveTo(ROAD_R - 5, 0); ctx.lineTo(ROAD_R - 5, H);
  ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.25)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 9, 0); ctx.lineTo(ROAD_L + 9, H);
  ctx.moveTo(ROAD_R - 9, 0); ctx.lineTo(ROAD_R - 9, H);
  ctx.stroke();

  // manhole cover
  const mhY = ((G.scroll * 0.9) % (H + 280)) - 40;
  ctx.fillStyle = "#455A64";
  ctx.beginPath();
  ctx.ellipse(ROAD_CX + 52, mhY, 13, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#37474F";
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.strokeStyle = "rgba(0,0,0,0.25)";
  ctx.beginPath();
  ctx.ellipse(ROAD_CX + 52, mhY, 8, 5, 0, 0, Math.PI * 2);
  ctx.stroke();

  // occasional cracked asphalt patch
  const crY = ((G.scroll * 0.7 + 140) % (H + 320)) - 50;
  ctx.strokeStyle = "rgba(30,30,30,0.2)";
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(ROAD_CX - 40, crY);
  ctx.lineTo(ROAD_CX - 28, crY + 18);
  ctx.lineTo(ROAD_CX - 35, crY + 40);
  ctx.moveTo(ROAD_CX - 28, crY + 18);
  ctx.lineTo(ROAD_CX - 12, crY + 22);
  ctx.stroke();
}

function drawProps() {
  // draw back-to-front by y
  const sorted = G.props.slice().sort((a, b) => a.y - b.y);
  for (const p of sorted) {
    if (p.y < -100 || p.y > H + 90) continue;
    if (p.type === "palm") drawPalm(p.x, p.y, p.scale || 1);
    if (p.type === "pool") drawPool(p.x, p.y);
    if (p.type === "bush") drawBush(p.x, p.y);
    if (p.type === "sign") drawYardSign(p.x, p.y, p.label);
    if (p.type === "pole") drawUtilityPole(p.x, p.y);
    if (p.type === "firehydrant") drawHydrant(p.x, p.y);
  }
}

function drawUtilityPole(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  ctx.beginPath();
  ctx.ellipse(x + 2, y + 48, 6, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#6D4C41";
  ctx.fillRect(x - 2.5, y - 20, 5, 70);
  ctx.fillStyle = "#5D4037";
  ctx.fillRect(x - 12, y - 18, 24, 3.5);
  ctx.fillRect(x - 10, y - 8, 20, 2.5);
  // insulator nubs
  ctx.fillStyle = "#90A4AE";
  ctx.fillRect(x - 11, y - 16, 3, 4);
  ctx.fillRect(x + 8, y - 16, 3, 4);
  // wire hint
  ctx.strokeStyle = "rgba(40,40,40,0.25)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x - 12, y - 16);
  ctx.quadraticCurveTo(x - 40, y + 10, x - 70, y + 30);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x + 12, y - 16);
  ctx.quadraticCurveTo(x + 40, y + 10, x + 70, y + 30);
  ctx.stroke();
}

function drawHydrant(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(x + 4, y + 12, 7, 2.5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#E53935";
  roundRect(x, y, 8, 12, 2);
  ctx.fill();
  ctx.fillStyle = "#C62828";
  ctx.fillRect(x - 3, y + 3, 14, 4);
  ctx.beginPath();
  ctx.arc(x + 4, y, 4, Math.PI, 0);
  ctx.fill();
  ctx.fillStyle = "#FFCDD2";
  ctx.fillRect(x + 2, y + 5, 4, 2);
}

function drawPalm(x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath();
  ctx.ellipse(4, 34, 16, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  // trunk segments
  ctx.strokeStyle = "#8D6E63";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(0, 32);
  ctx.quadraticCurveTo(8, 8, -2, -42);
  ctx.stroke();
  ctx.strokeStyle = "#A1887F";
  ctx.lineWidth = 2;
  for (let i = 0; i < 5; i++) {
    const t = i / 5;
    const px = lerp(0, -1, t) + Math.sin(t * 3) * 2;
    const py = lerp(28, -30, t);
    ctx.beginPath();
    ctx.moveTo(px - 3, py);
    ctx.lineTo(px + 3, py);
    ctx.stroke();
  }
  // fronds
  const baseY = -42;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.38;
    const len = 36 + (i % 2) * 6;
    ctx.strokeStyle = i % 2 ? "#2E7D32" : "#388E3C";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(-2, baseY);
    ctx.quadraticCurveTo(
      -2 + Math.cos(a) * len * 0.5,
      baseY + Math.sin(a) * len * 0.35 - 8,
      -2 + Math.cos(a) * len,
      baseY + Math.sin(a) * len * 0.7
    );
    ctx.stroke();
  }
  // coconuts
  ctx.fillStyle = "#6D4C41";
  ctx.beginPath();
  ctx.arc(-4, -38, 3, 0, Math.PI * 2);
  ctx.arc(2, -36, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawPool(x, y) {
  ctx.fillStyle = "rgba(0,0,0,0.1)";
  roundRect(x - 32, y + 4, 64, 44, 14);
  ctx.fill();
  const pg = ctx.createLinearGradient(x, y, x, y + 44);
  pg.addColorStop(0, "#4DD0E1");
  pg.addColorStop(0.5, "#26C6DA");
  pg.addColorStop(1, "#00ACC1");
  ctx.fillStyle = pg;
  roundRect(x - 30, y, 60, 42, 12);
  ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.4)";
  roundRect(x - 22, y + 5, 28, 10, 5);
  ctx.fill();
  ctx.strokeStyle = "#00838F";
  ctx.lineWidth = 3;
  roundRect(x - 30, y, 60, 42, 12);
  ctx.stroke();
  // deck
  ctx.fillStyle = "#BCAAA4";
  ctx.fillRect(x - 34, y + 40, 68, 6);
}

function drawBush(x, y) {
  ctx.fillStyle = "#558B2F";
  ctx.beginPath();
  ctx.ellipse(x, y, 14, 10, 0, 0, Math.PI * 2);
  ctx.ellipse(x - 8, y + 2, 10, 8, 0, 0, Math.PI * 2);
  ctx.ellipse(x + 8, y + 1, 10, 8, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#7CB342";
  ctx.beginPath();
  ctx.ellipse(x - 2, y - 2, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawYardSign(x, y, label) {
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(x - 1.5, y, 3, 22);
  ctx.fillStyle = "#FFECB3";
  roundRect(x - 16, y - 16, 32, 16, 2);
  ctx.fill();
  ctx.strokeStyle = "#FF8F00";
  ctx.lineWidth = 1.5;
  roundRect(x - 16, y - 16, 32, 16, 2);
  ctx.stroke();
  ctx.fillStyle = "#E65100";
  ctx.font = "bold 8px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(label, x, y - 5);
}

function drawHouses() {
  const sorted = G.houses.slice().sort((a, b) => a.y - b.y);
  for (const h of sorted) {
    if (h.y < -130 || h.y > H + 90) continue;
    drawHouse(h);
  }
}

function drawHouse(h) {
  const facingRight = h.side === 0;
  const sc = h.scale || 1.28;
  const hw = (h.style === "modern" ? 72 : 70) * sc;
  const hh = (h.style === "cottage" ? 70 : 78) * sc;
  const hx = h.side === 0 ? 2 : ROAD_R + 6;
  const hy = h.y - 28;
  const brick = h.brick || "#A1887F";
  const accent = h.accent || "#1565C0";

  // driveway (wider stamped concrete into curb)
  if (h.hasDriveway) {
    const dw = 32;
    const dx = facingRight ? ROAD_L - 28 : ROAD_R - 2;
    const g = ctx.createLinearGradient(dx, 0, dx + (facingRight ? dw : -dw), 0);
    g.addColorStop(0, "#9E9E9E");
    g.addColorStop(0.5, "#BDBDBD");
    g.addColorStop(1, "#8A8A8A");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(facingRight ? hx + hw - 4 : hx + 4, hy + hh - 6);
    ctx.lineTo(dx, h.y + 58);
    ctx.lineTo(dx + (facingRight ? dw : -dw), h.y + 58);
    ctx.lineTo(facingRight ? hx + hw - 4 : hx + 4, hy + hh + 14);
    ctx.closePath();
    ctx.fill();
    // curb cut
    ctx.fillStyle = "#D4B896";
    ctx.fillRect(facingRight ? ROAD_L - 8 : ROAD_R - 2, h.y + 50, 10, 14);
    // expansion joints
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const yy = h.y + 6 + i * 11;
      ctx.beginPath();
      ctx.moveTo(dx + (facingRight ? 3 : -dw + 3), yy);
      ctx.lineTo(dx + (facingRight ? dw - 3 : -3), yy);
      ctx.stroke();
    }
  }

  // parked car on driveway
  if (h.parkedCar) {
    drawParkedCar(h);
  }

  // low fence segment
  if (h.hasFence) {
    const fx0 = facingRight ? hx - 2 : hx + hw - 2;
    ctx.strokeStyle = h.trim;
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 5; i++) {
      const fy = hy + hh - 8 + i * 0;
      const px = facingRight ? hx - 6 : hx + hw + 2;
      ctx.fillStyle = shade(h.trim, -10);
      ctx.fillRect(px + (facingRight ? -i * 5 : i * 5), hy + hh - 2, 3, 14);
    }
    ctx.strokeStyle = shade(h.trim, -20);
    ctx.beginPath();
    const baseX = facingRight ? hx - 28 : hx + hw + 2;
    ctx.moveTo(baseX, hy + hh + 2);
    ctx.lineTo(baseX + (facingRight ? 26 : 26), hy + hh + 2);
    ctx.stroke();
  }

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.16)";
  ctx.beginPath();
  ctx.ellipse(hx + hw / 2 + 3, hy + hh + 7, hw * 0.5, 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // foundation / brick skirt
  ctx.fillStyle = brick;
  ctx.fillRect(hx - 1, hy + hh - 12, hw + 2, 14);
  ctx.fillStyle = "rgba(0,0,0,0.08)";
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 6; c++) {
      ctx.fillRect(hx + 2 + c * 11 + (r % 2) * 5, hy + hh - 10 + r * 4, 9, 3);
    }
  }

  // main stucco body
  const bg = ctx.createLinearGradient(hx, hy, hx + hw, hy + hh);
  bg.addColorStop(0, shade(h.color, 8));
  bg.addColorStop(0.45, h.color);
  bg.addColorStop(1, shade(h.color, -22));
  ctx.fillStyle = bg;
  roundRect(hx, hy, hw, hh - 10, h.style === "modern" ? 2 : 4);
  ctx.fill();
  // stucco noise
  ctx.fillStyle = "rgba(255,255,255,0.04)";
  for (let i = 0; i < 12; i++) {
    ctx.fillRect(hx + 4 + (i * 17) % (hw - 8), hy + 8 + (i * 13) % (hh - 24), 3, 2);
  }
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  ctx.lineWidth = 1.5;
  roundRect(hx, hy, hw, hh - 10, h.style === "modern" ? 2 : 4);
  ctx.stroke();

  // modern accent strip
  if (h.style === "modern") {
    ctx.fillStyle = accent;
    ctx.fillRect(hx, hy + 8, 5, hh - 28);
  }

  // roof
  ctx.fillStyle = h.roof;
  ctx.beginPath();
  if (h.style === "modern") {
    ctx.moveTo(hx - 4, hy + 14);
    ctx.lineTo(hx - 2, hy - 8);
    ctx.lineTo(hx + hw + 6, hy + 4);
    ctx.lineTo(hx + hw + 4, hy + 14);
  } else {
    ctx.moveTo(hx - 7, hy + 12);
    ctx.lineTo(hx + hw / 2, hy - 28);
    ctx.lineTo(hx + hw + 7, hy + 12);
  }
  ctx.closePath();
  ctx.fill();
  // shingles
  ctx.strokeStyle = "rgba(0,0,0,0.14)";
  ctx.lineWidth = 1;
  if (h.style !== "modern") {
    for (let i = 0; i < 5; i++) {
      const t = 0.15 + i * 0.15;
      const y1 = lerp(hy - 28, hy + 12, t);
      const half = lerp(0, hw / 2 + 7, t);
      ctx.beginPath();
      ctx.moveTo(hx + hw / 2 - half, y1);
      ctx.lineTo(hx + hw / 2 + half, y1);
      ctx.stroke();
    }
  }
  // gutter + fascia
  ctx.strokeStyle = h.trim;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(hx - 5, hy + 12);
  ctx.lineTo(hx + hw + 5, hy + 12);
  ctx.stroke();
  // chimney (stable per house)
  if (h.number % 3 === 0) {
    const chx = facingRight ? hx + 10 : hx + hw - 18;
    ctx.fillStyle = brick;
    ctx.fillRect(chx, hy - 22, 10, 20);
    ctx.fillStyle = shade(brick, -20);
    ctx.fillRect(chx - 1, hy - 24, 12, 4);
  }

  // porch overhang toward street
  const porchRoofX = facingRight ? hx + hw - 8 : hx - 18;
  ctx.fillStyle = shade(h.roof, 15);
  ctx.globalAlpha = 0.9;
  ctx.fillRect(porchRoofX, hy + 26, 28, 5);
  ctx.globalAlpha = 1;
  // porch posts
  ctx.fillStyle = h.trim;
  ctx.fillRect(porchRoofX + 3, hy + 31, 3, 28);
  ctx.fillRect(porchRoofX + 22, hy + 31, 3, 28);

  // wall AC
  {
    const acx = facingRight ? hx + 4 : hx + hw - 16;
    ctx.fillStyle = "#90A4AE";
    roundRect(acx, hy + hh - 34, 14, 11, 1);
    ctx.fill();
    ctx.fillStyle = "#607D8B";
    for (let i = 0; i < 3; i++) ctx.fillRect(acx + 2, hy + hh - 32 + i * 3, 10, 1.5);
  }

  // garage
  if (h.garage) {
    const gx = facingRight ? hx + 6 : hx + hw - 32;
    ctx.fillStyle = "#78909C";
    roundRect(gx, hy + 36, 28, 30, 2);
    ctx.fill();
    ctx.strokeStyle = "#546E7A";
    ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.moveTo(gx + 2, hy + 42 + i * 5);
      ctx.lineTo(gx + 26, hy + 42 + i * 5);
      ctx.stroke();
    }
    ctx.fillStyle = "#455A64";
    ctx.fillRect(gx + 10, hy + 48, 8, 3);
  }

  // door with frame
  const doorX = facingRight ? hx + hw - 26 : hx + 10;
  ctx.fillStyle = h.trim;
  roundRect(doorX - 2, hy + 28, 22, 38, 2);
  ctx.fill();
  ctx.fillStyle = shade(accent, -30);
  roundRect(doorX, hy + 30, 18, 34, 2);
  ctx.fill();
  ctx.fillStyle = "#BBDEFB";
  roundRect(doorX + 3, hy + 34, 12, 9, 1);
  ctx.fill();
  ctx.fillStyle = "#FFD54F";
  ctx.beginPath();
  ctx.arc(doorX + 14, hy + 52, 1.8, 0, Math.PI * 2);
  ctx.fill();

  if (h.hasRing) {
    ctx.fillStyle = h.ringHit ? "#FF5252" : "#263238";
    ctx.beginPath();
    ctx.arc(doorX + 9, hy + 26, 4.5, 0, Math.PI * 2);
    ctx.fill();
    if (!h.ringHit) {
      ctx.fillStyle = "#69F0AE";
      ctx.beginPath();
      ctx.arc(doorX + 9, hy + 26, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // windows + shutters
  const wx = facingRight ? hx + 10 : hx + hw - 36;
  drawWindow(wx, hy + 16, 26 * sc * 0.85, 18 * sc * 0.85, h.windowLit && !h.windowBroken, h.shutters, accent, h.windowBroken);
  if (!h.garage) drawWindow(facingRight ? hx + 10 : hx + hw - 32, hy + 44, 18, 14, false, h.shutters, accent, false);

  // house number plaque
  ctx.fillStyle = h.trim;
  roundRect(hx + hw / 2 - 15, hy + hh - 28, 30, 13, 2);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.15)";
  ctx.strokeRect(hx + hw / 2 - 14.5, hy + hh - 27.5, 29, 12);
  ctx.fillStyle = "#37474F";
  ctx.font = "bold 11px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(String(h.number), hx + hw / 2, hy + hh - 18);

  // planters
  if (h.hasPlanters) {
    const px = facingRight ? doorX - 14 : doorX + 22;
    ctx.fillStyle = "#6D4C41";
    roundRect(px, hy + hh - 22, 12, 8, 1);
    ctx.fill();
    ctx.fillStyle = "#43A047";
    ctx.beginPath();
    ctx.ellipse(px + 6, hy + hh - 24, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#E91E63";
    ctx.beginPath();
    ctx.arc(px + 4, hy + hh - 26, 1.5, 0, Math.PI * 2);
    ctx.arc(px + 8, hy + hh - 25, 1.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // mailbox
  if (h.hasMailbox) {
    const mx = facingRight ? ROAD_L - 30 : ROAD_R + 18;
    const my = h.y + 44;
    ctx.fillStyle = "#607D8B";
    ctx.fillRect(mx + 5, my, 3, 14);
    ctx.fillStyle = "#455A64";
    roundRect(mx, my - 11, 14, 11, 2);
    ctx.fill();
    ctx.fillStyle = h.needsDelivery && !h.delivered ? "#FF9900" : "#90A4AE";
    ctx.fillRect(mx + 10, my - 7, 5, 2.5);
  }

  // porch pad
  const pg = ctx.createLinearGradient(h.porchX, h.y + 6, h.porchX, h.y + 6 + h.porchH);
  pg.addColorStop(0, "#E0D6CC");
  pg.addColorStop(1, "#BCAAA4");
  ctx.fillStyle = pg;
  roundRect(h.porchX, h.y + 6, h.porchW, h.porchH, 5);
  ctx.fill();
  // paver lines
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(h.porchX + h.porchW / 2, h.y + 8);
  ctx.lineTo(h.porchX + h.porchW / 2, h.y + 4 + h.porchH);
  ctx.moveTo(h.porchX + 4, h.y + 6 + h.porchH / 2);
  ctx.lineTo(h.porchX + h.porchW - 4, h.y + 6 + h.porchH / 2);
  ctx.stroke();

  // ── Delivery target (ONLY active stops) ──
  if (isActiveStop(h)) {
    drawDropTarget(h);
  } else if (h.needsDelivery && h.delivered) {
    const gx = h.porchX + h.porchW / 2;
    const gy = h.y + 14;
    drawAmazonBox(gx, gy, 0.9);
    ctx.fillStyle = "#2E7D32";
    ctx.font = "bold 12px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("✓", gx, gy + 18);
  }
  // non-delivery: small empty mat only (no glow)
  else if (!h.needsDelivery) {
    ctx.fillStyle = "rgba(0,0,0,0.06)";
    roundRect(h.porchX + 6, h.y + 12, h.porchW - 12, h.porchH - 12, 3);
    ctx.fill();
  }

  if (h.hasSnack && !h.snackTaken && isActiveStop(h)) {
    const sx = h.side === 0 ? h.porchX - 14 : h.porchX + h.porchW + 2;
    ctx.fillStyle = "#EF5350";
    roundRect(sx, h.y + 12, 12, 14, 2);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "9px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("🍪", sx + 6, h.y + 23);
  }

  if (h.hasPirate && !h.pirateHit && isActiveStop(h)) {
    const px = h.side === 0 ? h.porchX + h.porchW + 4 : h.porchX - 16;
    const py = h.y + 10;
    ctx.fillStyle = "#424242";
    ctx.beginPath();
    ctx.ellipse(px + 6, py + 16, 7, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px + 6, py + 6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#212121";
    ctx.fillRect(px + 1, py + 2, 10, 4);
  }

  if (h.hasDog && !h.delivered) {
    const dx = h.side === 0 ? h.porchX + h.porchW + 14 : h.porchX - 14;
    drawDog(dx, h.y + 40, h.side === 0 ? 1 : -1);
  }
}

/** Big clear DROP pad — only on houses that need packages */
function drawDropTarget(h) {
  const gx = h.porchX + h.porchW / 2;
  const gy = h.y + 6 + h.porchH / 2;
  const pulse = 0.55 + Math.sin(now() / 200 + h.number) * 0.45;
  const best = bestActiveStop();
  const isBest = best && best.house === h;

  ctx.save();
  // outer ground ring
  ctx.globalAlpha = 0.35 + pulse * 0.4;
  ctx.strokeStyle = isBest ? "#00E5FF" : "#FF9900";
  ctx.lineWidth = isBest ? 3.5 : 2.8;
  ctx.setLineDash(isBest ? [] : [6, 4]);
  ctx.beginPath();
  ctx.ellipse(gx, gy + 3, 18 + pulse * 5, 12 + pulse * 3, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // solid inner pad glow
  ctx.globalAlpha = 0.25 + pulse * 0.2;
  ctx.fillStyle = isBest ? "#00B0FF" : "#FF9900";
  ctx.beginPath();
  ctx.ellipse(gx, gy + 3, 14, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  // floating package icon
  ctx.globalAlpha = 1;
  ctx.shadowColor = isBest ? "#00E5FF" : "#FF9900";
  ctx.shadowBlur = 14 + pulse * 8;
  drawAmazonBox(gx, gy - 2 - pulse * 2, 1.15);
  ctx.shadowBlur = 0;

  // DROP label
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = isBest ? "#00E5FF" : "#FF9900";
  ctx.font = "bold 10px system-ui";
  ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(0,0,0,0.45)";
  ctx.lineWidth = 3;
  const label = isBest ? "AIM HERE" : "DROP";
  ctx.strokeText(label, gx, gy + 22);
  ctx.fillText(label, gx, gy + 22);

  // road-side arrow cue
  const edgeX = h.side === 0 ? ROAD_L - 4 : ROAD_R + 4;
  ctx.globalAlpha = 0.55 + pulse * 0.3;
  ctx.fillStyle = isBest ? "#00E5FF" : "#FF9900";
  ctx.beginPath();
  if (h.side === 0) {
    ctx.moveTo(edgeX, gy);
    ctx.lineTo(edgeX - 10, gy - 6);
    ctx.lineTo(edgeX - 10, gy + 6);
  } else {
    ctx.moveTo(edgeX, gy);
    ctx.lineTo(edgeX + 10, gy - 6);
    ctx.lineTo(edgeX + 10, gy + 6);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawWindow(x, y, w, h, lit, shutters, accent, broken) {
  if (shutters) {
    ctx.fillStyle = accent || "#1565C0";
    roundRect(x - 5, y, 5, h, 1);
    ctx.fill();
    roundRect(x + w, y, 5, h, 1);
    ctx.fill();
    ctx.fillStyle = "rgba(0,0,0,0.15)";
    ctx.fillRect(x - 3, y + 2, 1, h - 4);
    ctx.fillRect(x + w + 2, y + 2, 1, h - 4);
  }
  ctx.fillStyle = broken ? "#37474F" : lit ? "#FFF9C4" : "#E3F2FD";
  roundRect(x, y, w, h, 2);
  ctx.fill();
  ctx.strokeStyle = "#78909C";
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  if (broken) {
    // shattered pane cracks
    ctx.strokeStyle = "rgba(200,230,255,0.75)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x + 2, y + 3);
    ctx.lineTo(x + w * 0.45, y + h * 0.55);
    ctx.lineTo(x + w - 2, y + 4);
    ctx.moveTo(x + w * 0.5, y + 2);
    ctx.lineTo(x + w * 0.3, y + h - 2);
    ctx.moveTo(x + w * 0.55, y + h * 0.4);
    ctx.lineTo(x + 3, y + h - 3);
    ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
    ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 0.8;
    ctx.strokeRect(x + 2, y + 2, w / 2 - 3, h / 2 - 3);
    if (lit) {
      ctx.fillStyle = "rgba(255,249,196,0.22)";
      ctx.beginPath();
      ctx.moveTo(x, y + h);
      ctx.lineTo(x - 4, y + h + 10);
      ctx.lineTo(x + w + 4, y + h + 10);
      ctx.lineTo(x + w, y + h);
      ctx.fill();
    }
  }
}

function drawParkedCar(h) {
  const pc = h.parkedCar;
  if (!pc) return;
  const x = pc.ox, y = h.y + pc.oy;
  const w = pc.w, ht = pc.h;
  ctx.save();
  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(x, y + ht * 0.4, w * 0.5, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // body
  ctx.fillStyle = pc.dented ? shade(pc.color, -25) : pc.color;
  roundRect(x - w / 2, y - ht / 2, w, ht, 7);
  ctx.fill();
  // cabin glass
  ctx.fillStyle = pc.cracked ? "rgba(80,90,100,0.85)" : "rgba(30,50,70,0.75)";
  roundRect(x - w / 2 + 5, y - ht / 2 + 10, w - 10, ht * 0.32, 4);
  ctx.fill();
  if (pc.cracked) {
    ctx.strokeStyle = "rgba(200,230,255,0.7)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - 6, y - ht / 2 + 12);
    ctx.lineTo(x + 2, y - ht / 2 + 22);
    ctx.lineTo(x + 8, y - ht / 2 + 14);
    ctx.stroke();
  }
  // wheels
  ctx.fillStyle = "#212121";
  roundRect(x - w / 2 - 1, y - ht / 2 + 8, 5, 12, 2);
  roundRect(x + w / 2 - 4, y - ht / 2 + 8, 5, 12, 2);
  roundRect(x - w / 2 - 1, y + ht / 2 - 20, 5, 12, 2);
  roundRect(x + w / 2 - 4, y + ht / 2 - 20, 5, 12, 2);
  // lights
  ctx.fillStyle = "#FFECB3";
  roundRect(x - w / 2 + 4, y + ht / 2 - 10, 8, 4, 1);
  roundRect(x + w / 2 - 12, y + ht / 2 - 10, 8, 4, 1);
  if (pc.dented) {
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.arc(x + 6, y, 5, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  r = clamp(r, 0, 255); g = clamp(g, 0, 255); b = clamp(b, 0, 255);
  return `rgb(${r|0},${g|0},${b|0})`;
}

function drawAmazonBox(x, y, s) {

function drawObstacles() {
  for (const o of G.obstacles) {
    if (o.y < -80 || o.y > H + 80) continue;
    if (o.type === "cone") drawCone(o.x, o.y);
    else if (o.type === "scooter") drawScooter(o.x, o.y);
    else if (o.type === "car") drawOtherCar(o);
    else if (o.type === "ped") drawPed(o.x, o.y);
    else if (o.type === "dog") drawDog(o.x, o.y, o.vx >= 0 ? 1 : -1);
    else if (o.type === "lady") drawAngryLady(o);
  }
}

/** Classic Paperboy scary old lady — curlers, robe, cellphone of justice */
function drawAngryLady(o) {
  const x = o.x, y = o.y;
  const dir = (o.vx || 0) >= 0 ? 1 : -1;
  const run = Math.sin(o.wave || 0) * 4;
  const phoneA = Math.sin((o.wave || 0) * 1.3) * 0.4;

  ctx.save();
  ctx.translate(x, y);

  // shadow
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.beginPath();
  ctx.ellipse(0, 20, 12, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // rage aura when chasing
  if (o.phase === "chase") {
    ctx.globalAlpha = 0.25 + Math.sin(now() / 80) * 0.1;
    ctx.fillStyle = "#F48FB1";
    ctx.beginPath();
    ctx.arc(0, -4, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // legs (running)
  ctx.fillStyle = "#F5F5F5";
  ctx.fillRect(-6, 8 + run * 0.3, 5, 12);
  ctx.fillRect(1, 8 - run * 0.3, 5, 12);
  // slippers
  ctx.fillStyle = "#EC407A";
  ctx.fillRect(-7, 18 + run * 0.3, 7, 3);
  ctx.fillRect(1, 18 - run * 0.3, 7, 3);

  // robe body
  const robe = ctx.createLinearGradient(-12, -10, 12, 14);
  robe.addColorStop(0, "#CE93D8");
  robe.addColorStop(1, "#8E24AA");
  ctx.fillStyle = robe;
  roundRect(-11, -8, 22, 22, 6);
  ctx.fill();
  // robe sash
  ctx.fillStyle = "#6A1B9A";
  ctx.fillRect(-11, 2, 22, 3);

  // free arm (shaking fist energy)
  ctx.fillStyle = "#FFCC80";
  ctx.fillRect(-13, -2, 5, 10);

  // arm holding phone up (filming / smacking)
  ctx.save();
  ctx.translate(9, -2 + run * 0.2);
  ctx.rotate(phoneA * dir - 0.35 * dir);
  ctx.fillStyle = "#FFCC80";
  roundRect(-2, -2, 5, 11, 2);
  ctx.fill();
  // smartphone
  ctx.fillStyle = "#212121";
  roundRect(-4, -16, 10, 16, 2.5);
  ctx.fill();
  // screen glow (she's recording)
  ctx.fillStyle = "#81D4FA";
  roundRect(-2.5, -14, 7, 11, 1.2);
  ctx.fill();
  // camera flash blink while chasing
  if (o.phase === "chase" && Math.sin(now() / 90) > 0.4) {
    ctx.fillStyle = "rgba(255,255,255,0.9)";
    ctx.beginPath();
    ctx.arc(1, -13, 2.2, 0, Math.PI * 2);
    ctx.fill();
  }
  // home button / notch
  ctx.fillStyle = "#424242";
  ctx.beginPath();
  ctx.arc(1, -1.5, 1.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // head
  ctx.fillStyle = "#FFCC80";
  ctx.beginPath();
  ctx.arc(0, -16, 9, 0, Math.PI * 2);
  ctx.fill();

  // curlers
  ctx.fillStyle = "#F8BBD0";
  for (const [cx, cy] of [[-6, -22], [0, -24], [6, -22], [-3, -18], [4, -19]]) {
    ctx.beginPath();
    ctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#EC407A";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, 3.2, 0, Math.PI * 2);
    ctx.stroke();
  }

  // angry face
  ctx.strokeStyle = "#4A148C";
  ctx.lineWidth = 1.5;
  // brows
  ctx.beginPath();
  ctx.moveTo(-5, -19); ctx.lineTo(-1, -17);
  ctx.moveTo(5, -19); ctx.lineTo(1, -17);
  ctx.stroke();
  // eyes
  ctx.fillStyle = "#212121";
  ctx.beginPath();
  ctx.arc(-3, -15, 1.4, 0, Math.PI * 2);
  ctx.arc(3, -15, 1.4, 0, Math.PI * 2);
  ctx.fill();
  // scowl
  ctx.strokeStyle = "#6A1B9A";
  ctx.beginPath();
  ctx.arc(0, -11, 3.5, 0.15 * Math.PI, 0.85 * Math.PI, true);
  ctx.stroke();

  // motion lines when chasing
  if (o.phase === "chase") {
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-16 - i * 4, -6 + i * 5);
      ctx.lineTo(-22 - i * 4, -6 + i * 5);
      ctx.stroke();
    }
  }

  // yell bubble occasionally
  if (o.yellT > 0.7) {
    ctx.fillStyle = "rgba(255,255,255,0.92)";
    roundRect(-22, -50, 44, 16, 6);
    ctx.fill();
    ctx.fillStyle = "#AD1457";
    ctx.font = "bold 7px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(o.yellText || "I'M FILMING!", 0, -39);
  }

  ctx.restore();
}

  ctx.moveTo(x, y - 16);
