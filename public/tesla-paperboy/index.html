<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

<meta name="mobile-web-app-capable" content="yes" />

<title>Tesla Flex</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a1628;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 30%, #132a4a 0%, #0a1628 70%);
  }
  canvas {
    display: block;
    max-width: 100%; max-height: 100%;
    box-shadow: 0 0 60px rgba(0,0,0,0.55);
  }
  @media (max-width: 520px) {
    canvas { width: 100%; height: 100%; box-shadow: none; }
  }
</style>

<body>
<div id="wrap"><canvas id="c"></canvas></div>
<script>
(() => {
"use strict";
/**
 * Tesla Flex — Amazon Flex Paperboy rave delivery game
 * Juicy single-file mobile web game. No external assets.
 *
 * Controls: bottom half drag = steer · top half aim/throw · A/D/←→ · Space throw · P pause · M mute
 * Radio: 1 House · 2 DnB · 3 Riddim · 4 Techno
 */

// ═══════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const W = 390, H = 700;
let dpr = 1;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const scale = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + "px";
  canvas.style.height = Math.floor(H * scale) + "px";
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - (1 - t) * (1 - t);
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[(Math.random() * a.length) | 0];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const now = () => performance.now();

function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function shade(hex, amt) {
  if (!hex || hex[0] !== "#") return hex;
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt;
  return `rgb(${clamp(r,0,255)|0},${clamp(g,0,255)|0},${clamp(b,0,255)|0})`;
}

// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const ROUTE_TIME = 90;
const EASY_SECS = 30;
const ROAD_L = 76, ROAD_R = 314;
const ROAD_CX = (ROAD_L + ROAD_R) / 2;
const ROAD_W = ROAD_R - ROAD_L;
const CAR_Y = 555;
const MAX_DIFF = 0.78;
const FSD_NEED = 3;
const FSD_DUR = 10;
const MAX_HEARTS = 3;
const LS_KEY = "teslaPaperboy_v2";

// Package types: mass affects arc & flight, score mult
const PKG = {
  standard: { id: "standard", label: "Box", mult: 1, mass: 1, arc: 1, size: 1, color: "#FF9900" },
  heavy:    { id: "heavy", label: "Heavy", mult: 1.45, mass: 1.45, arc: 0.72, size: 1.25, color: "#E65100" },
  envelope: { id: "envelope", label: "Envelope", mult: 0.85, mass: 0.65, arc: 1.15, size: 0.75, color: "#FFE082" },
  weird:    { id: "weird", label: "Weird", mult: 1.8, mass: 1.1, arc: 1.05, size: 1.35, color: "#AB47BC" },
};

// ═══════════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════════
function loadMeta() {
  try {
    return Object.assign({
      highScore: 0, bestStreak: 0, games: 0, totalDrops: 0,
      achievements: {}, station: "house",
    }, JSON.parse(localStorage.getItem(LS_KEY) || "{}"));
  } catch { return { highScore: 0, bestStreak: 0, games: 0, totalDrops: 0, achievements: {}, station: "house" }; }
}
function saveMeta(m) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(m)); } catch {}
}
let META = loadMeta();

const ACHIEVEMENTS = {
  porchPerfect: { id: "porchPerfect", title: "Porch Perfect", desc: "10 streak in one route" },
  fsdSavant: { id: "fsdSavant", title: "FSD Savant", desc: "Trigger FSD twice in one route" },
  noDogs: { id: "noDogs", title: "No Dogs Harmed", desc: "Finish with 0 dog incidents" },
  firstFlex: { id: "firstFlex", title: "First Flex", desc: "Complete any route" },
  beanQueen: { id: "beanQueen", title: "Bean Queen", desc: "Dismiss 5 threats with packages" },
  goldenFlex: { id: "goldenFlex", title: "Golden Flex", desc: "Score 1500+ in golden hour" },
  survivor: { id: "survivor", title: "Still Rolling", desc: "Finish with 1 heart left" },
};

// ═══════════════════════════════════════════════════════════
// AUDIO (Web Audio — SFX + procedural rave radio)
// ═══════════════════════════════════════════════════════════
let audioCtx = null, muted = false;
let sfxBus = null, musicBus = null;

/** Radio stations — procedural EDM, no external files */
const RADIO = {
  house:  { id: "house",  name: "House",  bpm: 124, tag: "4/4 Flex cruise",     color: "#FF6D00" },
  dnb:    { id: "dnb",    name: "DnB",    bpm: 174, tag: "Neuro package rush",  color: "#00E5FF" },
  riddim: { id: "riddim", name: "Riddim", bpm: 140, tag: "Half-time HOA bass",  color: "#E040FB" },
  techno: { id: "techno", name: "Techno", bpm: 132, tag: "Warehouse night run", color: "#69F0AE" },
};
let station = (META.station && RADIO[META.station]) ? META.station : "house";

// Music scheduler state
const music = {
  running: false,
  nextT: 0,
  step: 0,
  timer: null,
  master: null,
};

function ensureAudio() {
  if (muted) return null;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!audioCtx) {
    audioCtx = new AC();
    sfxBus = audioCtx.createGain(); sfxBus.gain.value = 0.9;
    musicBus = audioCtx.createGain(); musicBus.gain.value = 0.22;
    sfxBus.connect(audioCtx.destination);
    musicBus.connect(audioCtx.destination);
  }
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function tone({ freq = 440, dur = 0.12, type = "sine", gain = 0.07, slide = 0, delay = 0 }) {
  const ac = ensureAudio(); if (!ac) return;
  const t0 = ac.currentTime + delay;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.linearRampToValueAtTime(freq + slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxBus || ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

function noise(dur = 0.08, gain = 0.04, freq = 1200) {
  const ac = ensureAudio(); if (!ac) return;
  const n = (ac.sampleRate * dur) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const g = ac.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(sfxBus || ac.destination); src.start();
}

// ── Music synth voices (route through musicBus) ──
function mKick(t, g = 0.55) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
  o.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + 0.3);
}
function mHat(t, open = false, g = 0.06) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const n = (ac.sampleRate * (open ? 0.12 : 0.04)) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "highpass"; f.frequency.value = open ? 7000 : 9000;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + (open ? 0.12 : 0.04));
  src.connect(f); f.connect(gn); gn.connect(musicBus);
  src.start(t);
}
function mSnare(t, g = 0.2) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const n = (ac.sampleRate * 0.12) | 0;
  const buf = ac.createBuffer(1, n, ac.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800; f.Q.value = 0.7;
  const gn = ac.createGain();
  gn.gain.setValueAtTime(g, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
  src.connect(f); f.connect(gn); gn.connect(musicBus);
  src.start(t);
  // body
  const o = ac.createOscillator(), g2 = ac.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(180, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.08);
  g2.gain.setValueAtTime(g * 0.5, t); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
  o.connect(g2); g2.connect(musicBus); o.start(t); o.stop(t + 0.12);
}
function mBass(t, freq, dur = 0.18, g = 0.14, type = "sawtooth") {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), gn = ac.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  f.type = "lowpass";
  f.frequency.setValueAtTime(600, t);
  f.frequency.exponentialRampToValueAtTime(180, t + dur);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(g, t + 0.01);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + dur + 0.02);
}
function mReese(t, freq, dur = 0.35, g = 0.1) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  const f = ac.createBiquadFilter(), gn = ac.createGain(), lfo = ac.createOscillator(), lfoG = ac.createGain();
  o1.type = "sawtooth"; o2.type = "sawtooth";
  o1.frequency.setValueAtTime(freq, t);
  o2.frequency.setValueAtTime(freq * 1.01, t);
  f.type = "lowpass"; f.Q.value = 8;
  f.frequency.setValueAtTime(220, t);
  lfo.type = "sine"; lfo.frequency.setValueAtTime(station === "riddim" ? 2.2 : 5.5, t);
  lfoG.gain.value = 160;
  lfo.connect(lfoG); lfoG.connect(f.frequency);
  gn.gain.setValueAtTime(0.0001, t);
  gn.gain.exponentialRampToValueAtTime(g, t + 0.03);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o1.connect(f); o2.connect(f); f.connect(gn); gn.connect(musicBus);
  o1.start(t); o2.start(t); lfo.start(t);
  o1.stop(t + dur + 0.02); o2.stop(t + dur + 0.02); lfo.stop(t + dur + 0.02);
}
function mStab(t, freq, g = 0.05) {
  const ac = audioCtx; if (!ac || !musicBus) return;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = "square"; o.frequency.setValueAtTime(freq, t);
  gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  o.connect(gn); gn.connect(musicBus);
  o.start(t); o.stop(t + 0.14);
}

// Chord roots for variety (Hz, roughly F minor / related)
const BASS_NOTES = [87.31, 92.5, 103.83, 116.54, 130.81]; // F G Ab Bb C
function noteAt(step) {
  const bar = Math.floor(step / 16) % 4;
  return BASS_NOTES[bar % BASS_NOTES.length];
}

function scheduleStep(step, t) {
  const st = station;
  const s = step % 16; // 16th-note grid, 1 bar
  if (st === "house") {
    // 4-on-the-floor
    if (s % 4 === 0) mKick(t, 0.5);
    if (s % 2 === 1) mHat(t, false, 0.045);
    if (s === 6 || s === 14) mHat(t, true, 0.05);
    if (s === 4 || s === 12) mSnare(t, 0.12);
    if (s % 4 === 0) mBass(t, noteAt(step) / 2, 0.2, 0.12, "sawtooth");
    if (s === 0 || s === 8) mStab(t, noteAt(step) * 2, 0.035);
  } else if (st === "dnb") {
    // Amen-ish / 2-step-ish approximation at 16ths
    if (s === 0 || s === 10) mKick(t, 0.48);
    if (s === 4 || s === 12) mSnare(t, 0.22);
    if (s === 6 || s === 14) mSnare(t, 0.08); // ghost
    if (s % 2 === 0) mHat(t, false, 0.04);
    if (s === 3 || s === 11) mHat(t, true, 0.045);
    if (s === 0 || s === 8) mReese(t, noteAt(step) / 2, 0.28, 0.09);
    else if (s % 4 === 0) mBass(t, noteAt(step) / 2, 0.12, 0.08, "square");
  } else if (st === "riddim") {
    // Riddim — half-time, heavy
    if (s === 0) mKick(t, 0.58);
    if (s === 8) mSnare(t, 0.28);
    if (s === 4 || s === 12) mHat(t, false, 0.03);
    if (s === 14) mHat(t, true, 0.04);
    if (s === 0) mReese(t, noteAt(step) / 2, 0.55, 0.12);
    if (s === 8) mBass(t, noteAt(step) / 2 * 0.75, 0.25, 0.1, "sawtooth");
  } else {
    // Techno — driving 4/4, minimal, hypnotic
    if (s % 4 === 0) mKick(t, 0.52);
    if (s % 4 === 2) mHat(t, false, 0.05);          // offbeat hats
    if (s === 4 || s === 12) mHat(t, true, 0.035);  // open
    if (s === 0) mBass(t, noteAt(step) / 2, 0.22, 0.13, "square");
    if (s === 8) mBass(t, noteAt(step) / 2 * 1.5, 0.14, 0.08, "sawtooth");
    if (s === 0 || s === 6) mStab(t, noteAt(step) * 3, 0.028); // icy stabs
  }
}

function musicSchedulerTick() {
  if (!music.running || !audioCtx) return;
  const ac = audioCtx;
  const bpm = RADIO[station].bpm;
  const stepDur = (60 / bpm) / 4; // 16th
  const horizon = 0.12;
  while (music.nextT < ac.currentTime + horizon) {
    scheduleStep(music.step, music.nextT);
    music.nextT += stepDur;
    music.step++;
  }
  music.timer = setTimeout(musicSchedulerTick, 25);
}

function startRadio() {
  const ac = ensureAudio();
  if (!ac || muted) return;
  stopRadio();
  music.running = true;
  music.step = 0;
  music.nextT = ac.currentTime + 0.05;
  // gentle fade-in
  if (musicBus) {
    musicBus.gain.cancelScheduledValues(ac.currentTime);
    musicBus.gain.setValueAtTime(0.001, ac.currentTime);
    musicBus.gain.linearRampToValueAtTime(0.22, ac.currentTime + 0.6);
  }
  musicSchedulerTick();
}
function stopRadio() {
  music.running = false;
  if (music.timer) { clearTimeout(music.timer); music.timer = null; }
}
function setStation(id) {
  if (!RADIO[id]) return;
  station = id;
  META.station = id;
  saveMeta(META);
  if (music.running && !muted) startRadio(); // restart groove on new station
  SFX.click();
}

// Back-compat aliases used elsewhere
function startBgHum() { startRadio(); }
function stopBgHum() { stopRadio(); }

const SFX = {
  click() { tone({ freq: 540, dur: 0.05, type: "triangle", gain: 0.04 }); },
  throw() { tone({ freq: 240, dur: 0.1, type: "sawtooth", gain: 0.03, slide: 200 }); noise(0.07, 0.025, 2000); },
  land() { tone({ freq: 180, dur: 0.08, type: "triangle", gain: 0.05 }); noise(0.05, 0.03, 900); },
  perfect() {
    tone({ freq: 523, dur: 0.08, type: "sine", gain: 0.06 });
    tone({ freq: 659, dur: 0.1, type: "sine", gain: 0.05, delay: 0.06 });
    tone({ freq: 784, dur: 0.14, type: "sine", gain: 0.05, delay: 0.12 });
  },
  deliver() {
    tone({ freq: 440, dur: 0.07, type: "sine", gain: 0.055 });
    tone({ freq: 554, dur: 0.1, type: "sine", gain: 0.045, delay: 0.06 });
  },
  miss() { tone({ freq: 160, dur: 0.14, type: "triangle", gain: 0.04, slide: -50 }); },
  crack() { noise(0.1, 0.05, 2600); tone({ freq: 800, dur: 0.06, type: "square", gain: 0.025, slide: -250 }); },
  hit() { noise(0.1, 0.055, 500); tone({ freq: 90, dur: 0.14, type: "sawtooth", gain: 0.035, slide: -30 }); },
  heart() { tone({ freq: 300, dur: 0.15, type: "sine", gain: 0.05, slide: -120 }); tone({ freq: 200, dur: 0.2, type: "triangle", gain: 0.04, delay: 0.05 }); },
  fsd() {
    tone({ freq: 440, dur: 0.1, type: "sine", gain: 0.05, slide: 200 });
    tone({ freq: 660, dur: 0.16, type: "sine", gain: 0.045, delay: 0.07, slide: 160 });
    tone({ freq: 880, dur: 0.2, type: "triangle", gain: 0.04, delay: 0.14 });
  },
  bark() { tone({ freq: 280, dur: 0.08, type: "square", gain: 0.035, slide: 80 }); tone({ freq: 220, dur: 0.1, type: "square", gain: 0.03, delay: 0.08 }); },
  horn() { tone({ freq: 380, dur: 0.18, type: "sawtooth", gain: 0.03 }); tone({ freq: 400, dur: 0.15, type: "sawtooth", gain: 0.025, delay: 0.02 }); },
  splash() { noise(0.16, 0.045, 800); tone({ freq: 200, dur: 0.12, type: "sine", gain: 0.03, slide: -70 }); },
  dismiss() { tone({ freq: 420, dur: 0.08, type: "sine", gain: 0.05, slide: 160 }); tone({ freq: 640, dur: 0.12, type: "triangle", gain: 0.04, delay: 0.05 }); },
  lady() {
    tone({ freq: 720, dur: 0.1, type: "sawtooth", gain: 0.04, slide: 260 });
    tone({ freq: 960, dur: 0.14, type: "square", gain: 0.03, delay: 0.07, slide: -100 });
  },
  fail() { tone({ freq: 180, dur: 0.25, type: "sawtooth", gain: 0.04, slide: -80 }); tone({ freq: 120, dur: 0.3, type: "triangle", gain: 0.035, delay: 0.1 }); },
  win() {
    [523, 659, 784, 1046].forEach((f, i) => tone({ freq: f, dur: 0.14, type: "sine", gain: 0.045, delay: i * 0.08 }));
  },
  weather() { tone({ freq: 300, dur: 0.2, type: "sine", gain: 0.03, slide: 100 }); },
};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const ST = { TITLE: 0, HOWTO: 1, PLAY: 2, PAUSE: 3, GATE: 4, END: 5 };
let state = ST.TITLE;

const G = {
  score: 0, time: ROUTE_TIME, hearts: MAX_HEARTS,
  deliveries: 0, fails: 0, snacks: 0, pirateBonus: 0, threatBeans: 0, ladyHits: 0,
  streak: 0, bestStreak: 0, perfects: 0,
  fsd: 0, fsdReady: 0, fsdTriggers: 0,
  dogIncidents: 0, window: 0,
  scroll: 0, speed: 95, baseSpeed: 95,
  carX: ROAD_CX, carVX: 0, carLean: 0, steerTarget: null,
  throwCD: 0, invuln: 0, shake: 0, hitStop: 0,
  packages: [], obstacles: [], houses: [], props: [],
  particles: [], floatText: [], messages: [], trails: [],
  clouds: [], birds: [], rain: [],
  roadLines: 0, spawnT: 0, houseSide: 0, nextHouseDist: 40,
  nextGateIn: 55, gateOptions: [], gateCorrect: 0, gateTimer: 0,
  aimPreview: null, coachPhase: 0, wrecked: false, newHigh: false,
  weather: "sunny", // sunny | cloudy | golden | rain
  weatherMult: 1, event: null, eventT: 0,
  nextPkg: "standard", cameraY: 0, flash: 0,
  unlockQueue: [],
};

const keys = {};
let pointers = new Map();
let touchSteerId = null, throwAimId = null;
const UI = { buttons: [] };

// ═══════════════════════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════════════════════
function rollWeather() {
  // Weighted: sunny common, rain/golden rarer
  const r = Math.random();
  if (r < 0.38) return "sunny";
  if (r < 0.62) return "cloudy";
  if (r < 0.82) return "golden";
  return "rain";
}

function weatherInfo(w) {
  return {
    sunny:  { name: "Florida Sun", mult: 1, throw: 1, note: "Clear skies — clean throws" },
    cloudy: { name: "Overcast", mult: 1, throw: 1, note: "Soft light, same rules" },
    golden: { name: "Golden Hour", mult: 1.12, throw: 1, note: "+12% score · peak Flex vibes" },
    rain:   { name: "Pop-up Shower", mult: 0.95, throw: 0.88, note: "Slippery arcs · slightly lower score" },
  }[w] || { name: w, mult: 1, throw: 1, note: "" };
}

// ═══════════════════════════════════════════════════════════
// DIFFICULTY
// ═══════════════════════════════════════════════════════════
function elapsed() { return ROUTE_TIME - G.time; }

function difficulty() {
  const e = elapsed();
  if (e <= EASY_SECS) return (e / EASY_SECS) * 0.16;
  // mid ramp, then spicy last ~20s
  if (e < 70) return clamp(0.16 + (e - EASY_SECS) / 40 * 0.42, 0, 0.58);
  return clamp(0.58 + (e - 70) / 20 * (MAX_DIFF - 0.58), 0, MAX_DIFF);
}

function aimStrength() { return lerp(0.95, 0.7, difficulty() / MAX_DIFF); }
function padExtra() { return lerp(40, 22, difficulty() / MAX_DIFF); }
function assistR() { return lerp(170, 110, difficulty() / MAX_DIFF); }
function snapD() { return lerp(105, 70, difficulty() / MAX_DIFF); }

// ═══════════════════════════════════════════════════════════
// JUICE HELPERS
// ═══════════════════════════════════════════════════════════
function shake(n = 8) { G.shake = Math.max(G.shake, n); }
function flash(n = 0.25) { G.flash = Math.max(G.flash, n); }
function hitStop(t = 0.04) { G.hitStop = Math.max(G.hitStop, t); }

function msg(text, life = 2.2) {
  G.messages.push({ text, life, max: life });
}
function floatT(x, y, text, color = "#fff", size = 16) {
  G.floatText.push({ x, y, text, color, size, life: 1.15, vy: -46 });
}
function burst(x, y, color, n = 12, speed = 140) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(speed * 0.3, speed);
    G.particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: rand(0.35, 0.9), max: 0.9, r: rand(2, 6), color, g: 180,
    });
  }
}
function ringBurst(x, y, color) {
  for (let i = 0; i < 14; i++) {
    const a = (i / 14) * Math.PI * 2;
    G.particles.push({
      x, y, vx: Math.cos(a) * 90, vy: Math.sin(a) * 90,
      life: 0.45, max: 0.45, r: 3, color, g: 0,
    });
  }
}
function confetti(x, y) {
  const cols = ["#FF9900", "#00E5FF", "#69F0AE", "#FFD54F", "#F48FB1"];
  for (let i = 0; i < 18; i++) {
    const a = rand(0, Math.PI * 2);
    G.particles.push({
      x, y, vx: Math.cos(a) * rand(40, 160), vy: Math.sin(a) * rand(-120, -40),
      life: rand(0.6, 1.1), max: 1.1, r: rand(2, 4), color: pick(cols), g: 220,
    });
  }
}

function unlockAch(id) {
  if (META.achievements[id]) return;
  META.achievements[id] = true;
  saveMeta(META);
  const a = ACHIEVEMENTS[id];
  if (a) {
    G.unlockQueue.push(a);
    msg("🏆 " + a.title + " unlocked!", 2.8);
    SFX.perfect();
  }
}

function resetGame() {
  const weather = rollWeather();
  const wi = weatherInfo(weather);
  Object.assign(G, {
    score: 0, time: ROUTE_TIME, hearts: MAX_HEARTS,
    deliveries: 0, fails: 0, snacks: 0, pirateBonus: 0, threatBeans: 0, ladyHits: 0,
    streak: 0, bestStreak: 0, perfects: 0,
    fsd: 0, fsdReady: 0, fsdTriggers: 0,
    dogIncidents: 0, ladyCD: 8,
    scroll: 0, speed: 92, baseSpeed: 92,
    carX: ROAD_CX, carVX: 0, carLean: 0, steerTarget: null,
    throwCD: 0, invuln: 0, shake: 0, hitStop: 0,
    packages: [], obstacles: [], houses: [], props: [],
    particles: [], floatText: [], messages: [], trails: [],
    roadLines: 0, spawnT: 7, houseSide: 0, nextHouseDist: 20,
    nextGateIn: rand(48, 62), gateOptions: [], gateCorrect: 0, gateTimer: 0,
    aimPreview: null, coachPhase: 0, wrecked: false, newHigh: false,
    weather, weatherMult: wi.mult, event: null, eventT: 0,
    nextPkg: "standard", cameraY: 0, flash: 0, unlockQueue: [],
    birds: [], rain: [],
  });
  G.clouds = [];
  for (let i = 0; i < 8; i++) {
    G.clouds.push({ x: rand(-50, W + 50), y: rand(16, 100), w: rand(50, 110), s: rand(5, 16), layer: Math.random() });
  }
  for (let i = 0; i < 3; i++) G.birds.push({ x: rand(0, W), y: rand(40, 100), s: rand(18, 36), flap: rand(0, 8) });
  if (weather === "rain") {
    for (let i = 0; i < 50; i++) G.rain.push({ x: rand(0, W), y: rand(0, H), z: rand(0.6, 1.4) });
  }
  for (let i = 0; i < 4; i++) spawnHouse(-i * 220 - 70);
  pickNextPackage();
  msg(wi.name + " — " + wi.note, 3);
  msg("Easy stretch · hit DROP pads · 3 hearts", 2.6);
  startBgHum();
  SFX.weather();
}

function pickNextPackage() {
  const d = difficulty();
  const r = Math.random();
  if (r < 0.04) G.nextPkg = "weird";
  else if (r < 0.18 + d * 0.08) G.nextPkg = "heavy";
  else if (r < 0.38) G.nextPkg = "envelope";
  else G.nextPkg = "standard";
}

// ═══════════════════════════════════════════════════════════
// WORLD SPAWN
// ═══════════════════════════════════════════════════════════
const HOUSE_COLORS = ["#F5D0C5","#C5E1A5","#B3E5FC","#FFF59D","#E1BEE7","#FFE0B2","#B2DFDB","#F8BBD0","#D7CCC8","#DCEDC8","#FFCCBC"];

function spawnHouse(y) {
  const side = G.houseSide++ % 2;
  const diff = state === ST.PLAY ? difficulty() : 0.12;
  const early = state === ST.PLAY && elapsed() < EASY_SECS;
  const needsDelivery = Math.random() < (early ? 0.72 : lerp(0.62, 0.45, diff / MAX_DIFF));
  const special = needsDelivery && Math.random() < 0.1 ? pick(["fresh", "prime"]) : null;

  // Compact porches that sit in the yard strip, not over the house body
  const porchW = needsDelivery ? (early ? 36 : lerp(34, 28, diff / MAX_DIFF)) : 22;
  const porchH = needsDelivery ? (early ? 30 : lerp(28, 24, diff / MAX_DIFF)) : 18;
  const hasDriveway = Math.random() < 0.85;
  // Parked cars only when driveway exists; placed BELOW house (see layoutParked)
  const hasParked = hasDriveway && Math.random() < 0.5;

  const h = {
    y, side, color: pick(HOUSE_COLORS), scale: 1,
    porchW, porchH, needsDelivery, delivered: false, special,
    roof: pick(["#6D4C41","#455A64","#5D4037","#37474F","#795548","#BF360C"]),
    trim: pick(["#FFFFFF","#FAFAFA","#FFF8E1","#EFEBE9"]),
    accent: pick(["#1565C0","#2E7D32","#6A1B9A","#C62828","#00838F","#EF6C00"]),
    brick: pick(["#A1887F","#8D6E63","#BCAAA4"]),
    style: pick(["ranch","ranch","cottage","modern"]),
    hasPool: needsDelivery && !early && Math.random() < 0.1,
    hasRing: needsDelivery && Math.random() < 0.22,
    hasSnack: needsDelivery && Math.random() < 0.14,
    hasPirate: needsDelivery && !early && Math.random() < 0.06,
    hasDog: !early && Math.random() < 0.07,
    hasMailbox: true, hasDriveway, hasBush: Math.random() < 0.75,
    hasFence: Math.random() < 0.5, hasPlanters: Math.random() < 0.55,
    poolX: side === 0 ? 28 : W - 28,
    ringHit: false, snackTaken: false, pirateHit: false, windowBroken: false,
    number: 100 + (G.houses.length * 2 + side + 1),
    windowLit: Math.random() < 0.4, garage: Math.random() < 0.42, shutters: Math.random() < 0.55,
    ladySpawned: false, dogPhase: 0,
    hasParked,
    parkedCar: hasParked ? {
      color: pick(["#ECEFF1","#E53935","#1E88E5","#43A047","#FB8C00","#37474F","#FAFAFA"]),
      cracked: false, dented: false, w: 28, h: 42,
    } : null,
  };
  G.houses.push(h);

  G.props.push({ type: "palm", x: side === 0 ? rand(12, 40) : rand(W - 40, W - 12), y: y - 16, scale: rand(0.9, 1.2) });
  if (h.hasBush) G.props.push({ type: "bush", x: side === 0 ? rand(18, 52) : rand(W - 52, W - 18), y: y + 30 });
  if (h.hasPool) G.props.push({ type: "pool", x: h.poolX, y: y + 8 });
  if (Math.random() < 0.35) G.props.push({ type: "pole", x: side === 0 ? rand(8, 26) : rand(W - 26, W - 8), y: y - 48 });
  if (Math.random() < 0.2) G.props.push({ type: "hydrant", x: side === 0 ? ROAD_L - 24 : ROAD_R + 18, y: y + 55 });
  if (Math.random() < 0.22) G.props.push({ type: "sign", x: side === 0 ? ROAD_L - 22 : ROAD_R + 22, y: y - 38, label: pick(["SLOW","KIDS","HOA","FLEX"]) });
}

function spawnObstacle() {
  const diff = difficulty();
  if (Math.random() < lerp(0.42, 0.12, diff / MAX_DIFF)) return;
  if (G.fsd > 0 && Math.random() < 0.7) return;
  if (G.obstacles.filter(o => !o.dead).length >= (diff < 0.25 ? 1 : diff < 0.5 ? 2 : 3)) return;

  let type;
  if (diff < 0.2) type = Math.random() < 0.82 ? "cone" : "scooter";
  else if (diff < 0.4) type = pick(["cone","cone","scooter","cone"]);
  else if (diff < 0.6) type = pick(["cone","scooter","ped","cone"]);
  else type = pick(["cone","scooter","ped","dog","car","scooter"]);

  // Construction zone event: more cones
  if (G.event === "construction") type = Math.random() < 0.7 ? "cone" : type;

  let x = rand(ROAD_L + 28, ROAD_R - 28);
  if (Math.random() < (diff < 0.35 ? 0.9 : 0.68)) {
    x = Math.random() < 0.5 ? rand(ROAD_L + 24, ROAD_L + 58) : rand(ROAD_R - 58, ROAD_R - 24);
  }

  const o = { type, x, y: -70, w: 28, h: 28, vx: 0, dead: false, hit: false, anim: 0, pkgHit: false };
  if (type === "cone") { o.w = 18; o.h = 22; }
  if (type === "scooter") { o.w = 16; o.h = 36; o.vx = pick([-14, 14]) * (0.5 + diff * 0.4); }
  if (type === "car") {
    o.w = 46; o.h = 74; o.color = pick(["#E53935","#1E88E5","#43A047","#FB8C00","#5E35B1","#FAFAFA","#37474F"]);
    if (Math.random() < 0.7) { o.x = Math.random() < 0.5 ? ROAD_L + 40 : ROAD_R - 40; o.vy = rand(8, 24); }
    else o.vy = rand(16, 38 + diff * 20);
  }
  if (type === "ped") { o.w = 18; o.h = 32; o.vx = pick([-16, 16]) * (0.5 + diff * 0.35); }
  if (type === "dog") { o.w = 28; o.h = 16; o.vx = pick([-28, 28]) * (0.55 + diff * 0.3); }
  G.obstacles.push(o);
}

// ═══════════════════════════════════════════════════════════
// AIM
// ═══════════════════════════════════════════════════════════
/**
 * Shared house geometry so draw + collisions never disagree.
 * Layout: house sits in the outer yard; porch is a stoop on the
 * road-facing wall; parked car sits on the driveway BELOW the house
 * (toward the player), never under the porch.
 */
function layoutHouse(h) {
  // Compact footprint so porch never sits on the roof/body
  const hw = h.style === "modern" ? 44 : h.style === "cottage" ? 42 : 46;
  const hh = h.style === "cottage" ? 50 : 54;
  // Left: house against left edge. Right: house against right edge.
  const hx = h.side === 0 ? 5 : W - 5 - hw;
  const hy = h.y - 14;

  // Porch = stoop on the road-facing wall, in the strip between house and curb
  let porchW = Math.min(h.porchW || 30, 32);
  let porchH = Math.min(h.porchH || 26, 28);
  let porchX, porchY;
  if (h.side === 0) {
    porchX = hx + hw; // starts at house wall, extends toward road
    const maxW = Math.max(18, ROAD_L - 8 - porchX);
    porchW = Math.min(porchW, maxW);
  } else {
    porchX = ROAD_R + 8;
    const maxW = Math.max(18, hx - porchX);
    porchW = Math.min(porchW, maxW);
    // keep stoop snug against house wall
    porchX = hx - porchW;
  }
  porchY = hy + hh * 0.4; // door height — beside wall, not over roof

  // Driveway BELOW house (higher y = toward player / bottom of screen)
  const driveTop = hy + hh + 2;
  let car = null;
  if (h.parkedCar) {
    const cw = h.parkedCar.w || 26, ch = h.parkedCar.h || 40;
    // Centered under house footprint on the driveway slab
    const cx = hx + hw / 2;
    const cy = driveTop + 26;
    car = { cx, cy, w: cw, h: ch, x: cx - cw / 2, y: cy - ch / 2 };
  }

  // Window on main wall facing road (on the house body only)
  const winW = 20, winH = 15;
  const winX = h.side === 0 ? hx + 6 : hx + hw - 26;
  const winY = hy + 14;

  return {
    hx, hy, hw, hh,
    porchX, porchY, porchW, porchH,
    porchCx: porchX + porchW / 2,
    porchCy: porchY + porchH / 2,
    doorX: h.side === 0 ? hx + hw - 18 : hx + 4,
    doorY: hy + hh * 0.38,
    winX, winY, winW, winH,
    car, driveTop,
  };
}

function getPorch(h) {
  const L = layoutHouse(h);
  const pad = state === ST.PLAY ? padExtra() * 0.65 : 6;
  return {
    x: L.porchX - pad * 0.15,
    y: L.porchY - pad * 0.1,
    w: L.porchW + pad * 0.3,
    h: L.porchH + pad * 0.25,
    cx: L.porchCx,
    cy: L.porchCy,
  };
}
function isActive(h) { return h && h.needsDelivery && !h.delivered; }

function bestStop() {
  let best = null, bestH = null, s = 1e9;
  for (const h of G.houses) {
    if (!isActive(h)) continue;
    const p = getPorch(h);
    if (p.cy > CAR_Y - 40 || p.cy < 70) continue;
    const sc = Math.abs(p.cx - G.carX) * 0.5 + Math.abs(p.cy - (CAR_Y - 170)) * 0.5;
    if (sc < s) { s = sc; best = p; bestH = h; }
  }
  return best ? { porch: best, house: bestH } : null;
}

function findAssist(ax, ay) {
  const R = assistR(), str = aimStrength();
  let best = null, bestH = null, bestD = R;
  for (const h of G.houses) {
    if (!isActive(h)) continue;
    const p = getPorch(h);
    if (p.cy > CAR_Y - 30 || p.cy < 60) continue;
    const d = dist(ax, ay, p.cx, p.cy);
    if (d < bestD) { bestD = d; best = p; bestH = h; }
  }
  if (!best) return { x: ax, y: ay, snap: false, house: null, porch: null };
  if (bestD < snapD()) return { x: best.cx, y: best.cy, snap: true, house: bestH, porch: best };
  const pull = Math.min(1, str * (1 - bestD / R) * 1.25);
  return {
    x: lerp(ax, best.cx, pull), y: lerp(ay, best.cy, pull),
    snap: pull > 0.88, house: bestH, porch: best, assisted: pull > 0.12,
  };
}

function clampAim(sx, sy, ax, ay) {
  const maxD = lerp(195, 260, difficulty() / MAX_DIFF);
  ay = clamp(ay, 95, CAR_Y - 75);
  if (ax > ROAD_L + 14 && ax < ROAD_R - 14) {
    const curb = ax < ROAD_CX ? ROAD_L - 18 : ROAD_R + 18;
    ax = lerp(ax, curb, 0.32);
  }
  let d = dist(sx, sy, ax, ay);
  if (d > maxD) { const k = maxD / d; ax = sx + (ax - sx) * k; ay = sy + (ay - sy) * k; }
  if (sy - ay > 155) ay = lerp(ay, sy - 145, lerp(0.55, 0.28, difficulty() / MAX_DIFF));
  // rain: slightly flatter aim band
  if (G.weather === "rain") ay = lerp(ay, sy - 140, 0.08);
  return { x: ax, y: ay };
}

function stickyAim(ax, ay) {
  const b = bestStop();
  if (!b) return findAssist(ax, ay);
  const p = b.porch;
  const d = dist(ax, ay, p.cx, p.cy);
  if (d < snapD() * 1.4 || (Math.abs(ax - p.cx) < 72 && Math.abs(ay - p.cy) < 95)) {
    return { x: p.cx, y: p.cy, snap: true, house: b.house, porch: p };
  }
  return findAssist(ax, ay);
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
function cpos(e) {
  const r = canvas.getBoundingClientRect();
  const id = e.changedTouches ? e.changedTouches[0] : e;
  return {
    x: ((id.clientX ?? e.clientX) - r.left) * (W / r.width),
    y: ((id.clientY ?? e.clientY) - r.top) * (H / r.height),
  };
}

function onDown(e) {
  e.preventDefault();
  ensureAudio();
  const id = e.pointerId ?? 0;
  const p = cpos(e);
  pointers.set(id, p);

  if (state === ST.TITLE || state === ST.HOWTO || state === ST.END) { hitUI(p.x, p.y); return; }
  if (state === ST.PAUSE) { hitUI(p.x, p.y); return; }
  if (state === ST.GATE) { hitGate(p.x, p.y); return; }
  if (state === ST.PLAY) {
    // pause button
    if (p.x > W - 52 && p.y < 58) { state = ST.PAUSE; SFX.click(); return; }
    if (p.y >= H * 0.5) { touchSteerId = id; G.steerTarget = p.x; G.aimPreview = null; }
    else { throwAimId = id; updateAim(p.x, p.y); }
  }
}
function onMove(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = cpos(e);
  pointers.set(id, p);
  if (state === ST.PLAY && id === touchSteerId) G.steerTarget = p.x;
  if (state === ST.PLAY && id === throwAimId) updateAim(p.x, p.y);
  if (state === ST.PLAY && e.pointerType === "mouse" && throwAimId == null && touchSteerId == null) {
    if (p.y < H * 0.5) updateAim(p.x, p.y); else G.aimPreview = null;
  }
}
function onUp(e) {
  e.preventDefault();
  const id = e.pointerId ?? 0;
  const p = pointers.get(id) || cpos(e);
  if (state === ST.PLAY && id === throwAimId) {
    updateAim(p.x, p.y);
    if (G.aimPreview) throwPkg(G.aimPreview.x, G.aimPreview.y);
    else throwPkg(p.x, p.y);
    throwAimId = null; G.aimPreview = null;
  }
  pointers.delete(id);
  if (id === touchSteerId) { touchSteerId = null; G.steerTarget = null; }
}

function updateAim(px, py) {
  if (state !== ST.PLAY || py >= H * 0.5) { G.aimPreview = null; return; }
  const sx = G.carX, sy = CAR_Y - 18;
  const c = clampAim(sx, sy, px, py);
  const s = stickyAim(c.x, c.y);
  G.aimPreview = { x: s.x, y: s.y, snap: !!s.snap, assisted: !!s.assisted || !!s.snap, sx, sy, house: s.house };
}

canvas.addEventListener("pointerdown", onDown, { passive: false });
canvas.addEventListener("pointermove", onMove, { passive: false });
canvas.addEventListener("pointerup", onUp, { passive: false });
canvas.addEventListener("pointercancel", onUp, { passive: false });
canvas.addEventListener("contextmenu", e => e.preventDefault());

addEventListener("keydown", e => {
  keys[e.code] = true;
  ensureAudio();
  if (["Space","ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyM") {
    muted = !muted;
    if (muted) stopRadio();
    else if (state === ST.PLAY || state === ST.PAUSE) startRadio();
    msg(muted ? "Sound off" : "Tuned to " + RADIO[station].name, 1.4);
  }
  // Quick station switch: 1 House · 2 DnB · 3 Riddim · 4 Techno (not during gate)
  if ((state === ST.PLAY || state === ST.PAUSE || state === ST.TITLE) && state !== ST.GATE && !e.repeat) {
    if (e.code === "Digit1" || e.code === "Numpad1") { setStation("house"); if (state !== ST.TITLE) msg("📻 House", 1.2); }
    if (e.code === "Digit2" || e.code === "Numpad2") { setStation("dnb"); if (state !== ST.TITLE) msg("📻 DnB", 1.2); }
    if (e.code === "Digit3" || e.code === "Numpad3") { setStation("riddim"); if (state !== ST.TITLE) msg("📻 Riddim", 1.2); }
    if (e.code === "Digit4" || e.code === "Numpad4") { setStation("techno"); if (state !== ST.TITLE) msg("📻 Techno", 1.2); }
  }
  if (e.code === "KeyP" || e.code === "Escape") {
    if (state === ST.PLAY) { state = ST.PAUSE; SFX.click(); }
    else if (state === ST.PAUSE) { state = ST.PLAY; SFX.click(); }
  }
  if (state === ST.TITLE && (e.code === "Enter" || e.code === "Space")) { state = ST.PLAY; resetGame(); }
  if (state === ST.PLAY && e.code === "Space") {
    const b = bestStop();
    if (b) throwPkg(b.porch.cx, b.porch.cy);
    else throwPkg(G.carX + rand(-12, 12), CAR_Y - 160);
  }
  if (state === ST.GATE) {
    if (e.code === "Digit1" || e.code === "Numpad1") pickGate(0);
    if (e.code === "Digit2" || e.code === "Numpad2") pickGate(1);
    if (e.code === "Digit3" || e.code === "Numpad3") pickGate(2);
  }
});
addEventListener("keyup", e => { keys[e.code] = false; });

// ═══════════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════════
function btn(id, x, y, w, h, label, style = "primary") {
  UI.buttons.push({ id, x, y, w, h, label, style });
}
function hitUI(x, y) {
  for (const b of UI.buttons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { onBtn(b.id); return; }
  }
  // title: tap anywhere also starts if quick start zone
  if (state === ST.TITLE && y > H * 0.55) onBtn("play");
}
function onBtn(id) {
  if (id.startsWith("radio_")) {
    ensureAudio();
    setStation(id.slice(6));
    // Preview the station on title/pause
    if (state === ST.TITLE || state === ST.PAUSE || state === ST.HOWTO) startRadio();
    return;
  }
  SFX.click();
  if (id === "play") { state = ST.PLAY; resetGame(); }
  if (id === "howto") state = ST.HOWTO;
  if (id === "back" || id === "menu") { stopRadio(); state = ST.TITLE; }
  if (id === "again") { state = ST.PLAY; resetGame(); }
  if (id === "resume") { state = ST.PLAY; if (!muted) startRadio(); }
  if (id === "share") shareScore();
}
function hitGate(x, y) {
  const bw = 280, bh = 52, bx = (W - bw) / 2;
  let by = 340;
  for (let i = 0; i < G.gateOptions.length; i++) {
    if (x >= bx && x <= bx + bw && y >= by && y <= by + bh) { pickGate(i); return; }
    by += 68;
  }
}
function pickGate(i) {
  if (state !== ST.GATE) return;
  if (i === G.gateCorrect) {
    G.score += Math.round(50 * G.weatherMult);
    floatT(W / 2, 280, "GATE OPEN +50", "#69F0AE", 20);
    confetti(W / 2, 320); SFX.perfect(); msg("Gate accepted. Welcome, Flexer.", 2);
  } else {
    loseHeart("Wrong gate code — HOA delay!");
    shake(12); SFX.fail();
  }
  state = ST.PLAY;
  G.nextGateIn = rand(32, 48);
}

function shareScore() {
  const text = `⚡ Tesla Flex\nScore: ${G.score} · Drops: ${G.deliveries} · Streak: ${G.bestStreak}\nTuned to ${RADIO[station].name} · ${weatherInfo(G.weather).name}\nBeat my route? 📦🚗`;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => msg("Score copied — paste anywhere!", 2.4)).catch(() => msg(text.slice(0, 60) + "…", 3));
  } else msg("Score: " + G.score + " · Streak " + G.bestStreak, 3);
  SFX.click();
}

// ═══════════════════════════════════════════════════════════
// THROW
// ═══════════════════════════════════════════════════════════
function throwPkg(tx, ty) {
  if (G.throwCD > 0 || state !== ST.PLAY) return;
  G.throwCD = 0.2;
  const sx = G.carX, sy = CAR_Y - 18;
  const c = clampAim(sx, sy, tx, ty);
  const s = stickyAim(c.x, c.y);
  let ax = s.x, ay = s.y, th = s.house;
  const b = bestStop();
  if (b && Math.abs(b.porch.cx - G.carX) < 100 && Math.abs(c.x - b.porch.cx) < 95) {
    ax = b.porch.cx; ay = b.porch.cy; th = b.house;
  }

  const def = PKG[G.nextPkg] || PKG.standard;
  const wi = weatherInfo(G.weather);
  const d = dist(sx, sy, ax, ay);
  const flight = clamp((d / 300) * def.mass / wi.throw, 0.34, 0.88);

  G.packages.push({
    x: sx, y: sy, sx, sy, tx: ax, ty: ay,
    t: 0, dur: flight,
    arc: lerp(26, 40, Math.min(d / 220, 1)) * def.arc * (G.weather === "rain" ? 0.9 : 1),
    rot: rand(0, Math.PI), vr: rand(-10, 10) / def.mass,
    done: false, type: def.id, def, targetHouse: th,
    trail: [],
  });
  // throw juice
  burst(sx, sy, def.color, 6, 80);
  G.carVX += (sx - ax) * 0.015; // slight recoil weight
  SFX.throw();
  pickNextPackage();
}

// ═══════════════════════════════════════════════════════════
// COMBAT / HEARTS / FSD
// ═══════════════════════════════════════════════════════════
function loseHeart(reason) {
  if (G.invuln > 0 || G.fsd > 0) return false;
  G.hearts--;
  G.invuln = 1.5;
  G.streak = 0;
  shake(14); flash(0.35); hitStop(0.06);
  SFX.heart();
  if (reason) msg(reason, 2.2);
  if (G.hearts <= 0) endRoute(true);
  return true;
}

function oops(reason) {
  // Non-lethal soft fail
  G.fails++;
  G.streak = 0;
  shake(5);
  if (reason) floatT(G.carX, CAR_Y - 60, reason, "#FFCC80", 13);
  SFX.miss();
}

function tryFSD() {
  G.fsdReady++;
  if (G.fsdReady >= FSD_NEED) {
    G.fsdReady = 0;
    G.fsd = FSD_DUR;
    G.fsdTriggers++;
    msg("⚡ FSD ENGAGED — pure package focus!", 2.8);
    burst(G.carX, CAR_Y, "#00B0FF", 24, 180);
    ringBurst(G.carX, CAR_Y, "#00E5FF");
    flash(0.4); shake(6); SFX.fsd();
    if (G.fsdTriggers >= 2) unlockAch("fsdSavant");
  }
}

function addScore(base, x, y, label) {
  const pts = Math.round(base * G.weatherMult * (1 + G.streak * 0.04));
  G.score += pts;
  if (label) floatT(x, y, label.replace("{n}", String(pts)), "#69F0AE", 15);
  return pts;
}

function endRoute(wrecked) {
  state = ST.END;
  G.wrecked = wrecked;
  stopBgHum();
  META.games++;
  META.totalDrops += G.deliveries;
  if (G.score > META.highScore) { META.highScore = G.score; G.newHigh = true; }
  if (G.bestStreak > META.bestStreak) META.bestStreak = G.bestStreak;
  saveMeta(META);
  if (!wrecked) unlockAch("firstFlex");
  if (G.bestStreak >= 10) unlockAch("porchPerfect");
  if (G.dogIncidents === 0 && G.deliveries >= 3) unlockAch("noDogs");
  if (G.threatBeans >= 5) unlockAch("beanQueen");
  if (G.weather === "golden" && G.score >= 1500) unlockAch("goldenFlex");
  if (!wrecked && G.hearts === 1) unlockAch("survivor");
  if (wrecked) SFX.fail(); else SFX.win();
}

// ═══════════════════════════════════════════════════════════
// LADY
// ═══════════════════════════════════════════════════════════
const SPEED_LIMIT = 120;
function isSpeeding() { return G.speed >= SPEED_LIMIT; }

function tryLady(e, diff) {
  if (G.ladyCD > 0) return;
  if (e < 16 || !isSpeeding()) return;
  if (G.obstacles.some(o => o.type === "lady" && !o.dead)) return;
  const cands = G.houses.filter(h => !h.ladySpawned && h.y > 120 && h.y < CAR_Y - 140);
  if (!cands.length) return;
  const over = clamp((G.speed - SPEED_LIMIT) / 40, 0, 1);
  if (Math.random() > 0.012 + over * 0.03 + diff * 0.015) return;
  spawnLady(pick(cands));
}

function spawnLady(h) {
  h.ladySpawned = true;
  G.ladyCD = rand(10, 16);
  const p = getPorch(h);
  G.obstacles.push({
    type: "lady", x: p.cx, y: h.y + 18, w: 22, h: 36,
    vx: 0, dead: false, hit: false, phase: "exit",
    roadX: h.side === 0 ? ROAD_L + rand(36, 70) : ROAD_R - rand(36, 70),
    age: 0, wave: 0, yellT: 0, yellText: "I'M FILMING!", anim: 0,
  });
  floatT(p.cx, h.y, "I'M FILMING!!!", "#F8BBD0", 15);
  msg("😱 Lawn lady inbound — you were speeding!", 2.4);
  SFX.lady(); burst(p.cx, h.y + 18, "#F8BBD0", 12);
}

function updateLady(o, dt) {
  o.age += dt; o.wave += dt * 14; o.yellT -= dt; o.anim += dt * 10;
  if (o.phase === "exit") {
    o.x += Math.sign(o.roadX - o.x) * Math.min(Math.abs(o.roadX - o.x), 150 * dt);
    o.y += 55 * dt;
    if (Math.abs(o.x - o.roadX) < 6) {
      o.phase = "chase"; o.x = o.roadX;
      o.yellText = pick(["I'M FILMING!","HOA CHAT!","SLOW DOWN!"]);
      o.yellT = 1.1; SFX.lady();
    }
  } else {
    o.vx = lerp(o.vx || 0, clamp((G.carX - o.x) * 3.2, -170, 170), 1 - Math.pow(0.02, dt));
    o.x = clamp(o.x + o.vx * dt, ROAD_L + 16, ROAD_R - 16);
    o.y += 100 * dt;
    if (o.yellT <= 0 && Math.random() < 0.02) {
      o.yellText = pick(["SENDING TO HOA!","GOT YOUR PLATE!","TESLA HOOLIGAN!"]);
      o.yellT = 1.3;
    }
  }
  if (o.y > CAR_Y + 80 || o.age > 8) o.dead = true;
}

// ═══════════════════════════════════════════════════════════
// PACKAGE RESOLUTION
// ═══════════════════════════════════════════════════════════
function resolveMidair(pk) {
  for (const o of G.obstacles) {
    if (o.dead || o.pkgHit) continue;
    const r = o.type === "car" ? 28 : o.type === "lady" ? 22 : 17;
    if (dist(pk.x, pk.y, o.x, o.y) < r) return hitEntity(pk, o);
  }
  // Windows first (specific), then parked cars — geometry from layoutHouse
  for (const h of G.houses) {
    if (!h.windowBroken && hitsWindow(pk, h)) return hitWindow(pk, h);
  }
  for (const h of G.houses) {
    if (h.parkedCar && hitsParked(pk, h)) return hitParked(pk, h);
  }
  return false;
}

function hitsWindow(pk, h) {
  const L = layoutHouse(h);
  return pk.x > L.winX && pk.x < L.winX + L.winW &&
         pk.y > L.winY && pk.y < L.winY + L.winH;
}

function hitsParked(pk, h) {
  const L = layoutHouse(h);
  if (!L.car) return false;
  const c = L.car;
  return pk.x > c.x + 3 && pk.x < c.x + c.w - 3 &&
         pk.y > c.y + 4 && pk.y < c.y + c.h - 4;
}

function hitEntity(pk, o) {
  o.pkgHit = true;
  const dismiss = { lady: 60, ped: 40, dog: 35, scooter: 28, cone: 22 };
  if (dismiss[o.type] != null) {
    const bonus = Math.round(dismiss[o.type] * (pk.def?.mult || 1));
    G.score += Math.round(bonus * G.weatherMult);
    G.threatBeans++;
    G.streak++; // still counts as stylish
    G.bestStreak = Math.max(G.bestStreak, G.streak);
    o.dead = true; o.hit = true;
    confetti(o.x, o.y); shake(7); hitStop(0.05);
    floatT(o.x, o.y - 14, "BEANED! +" + bonus, "#69F0AE", 15);
    msg(o.type === "lady" ? "Filmed THAT, Karen?" : "Paperboy special!", 1.6);
    SFX.dismiss();
    if (o.type === "dog") SFX.bark();
    return true;
  }
  if (o.type === "car") {
    G.score = Math.max(0, G.score - 15); G.streak = 0;
    burst(pk.x, pk.y, "#90A4AE", 14); shake(6);
    floatT(pk.x, pk.y, "traffic ding −15", "#FF8A65", 12);
    SFX.horn(); SFX.crack(); return true;
  }
  return false;
}

function hitParked(pk, h) {
  const pc = h.parkedCar;
  if (!pc.cracked) {
    pc.cracked = pc.dented = true;
    G.score = Math.max(0, G.score - 20); G.fails++; G.streak = 0;
    burst(pk.x, pk.y, "#B0BEC5", 16); shake(8);
    floatT(pk.x, pk.y, "PARKED CAR −20", "#EF9A9A", 13);
    msg("Tagged a parked car on the driveway.", 2);
    SFX.crack();
  } else { floatT(pk.x, pk.y, "already dented", "#BDBDBD", 11); SFX.land(); }
  return true;
}

function hitWindow(pk, h) {
  h.windowBroken = true; h.windowLit = false;
  G.score = Math.max(0, G.score - 25); G.fails++; G.streak = 0;
  burst(pk.x, pk.y, "#E1F5FE", 18); shake(9); flash(0.2);
  floatT(pk.x, pk.y, "WINDOW SMASH −25", "#4FC3F7", 13);
  msg("Classic Paperboy chaos!", 2); SFX.crack();
  return true;
}

function resolveLand(pk) {
  if (resolveMidair(pk)) return;
  const ordered = [];
  if (pk.targetHouse && isActive(pk.targetHouse)) ordered.push(pk.targetHouse);
  for (const h of G.houses) if (h !== pk.targetHouse) ordered.push(h);

  for (const h of ordered) {
    const porch = getPorch(h);
    const on = pk.x > porch.x && pk.x < porch.x + porch.w && pk.y > porch.y && pk.y < porch.y + porch.h;
    const near = isActive(h) && dist(pk.x, pk.y, porch.cx, porch.cy) < lerp(50, 34, difficulty() / MAX_DIFF);
    const perfect = isActive(h) && dist(pk.x, pk.y, porch.cx, porch.cy) < 16;

    if (on || near) {
      if (!h.needsDelivery) { floatT(porch.cx, porch.cy, "no delivery", "#B0BEC5", 12); oops(); return; }
      if (h.delivered) { floatT(porch.cx, porch.cy, "already done", "#B0BEC5", 12); return; }

      if (h.hasPirate && !h.pirateHit) {
        h.pirateHit = h.delivered = true;
        G.pirateBonus++; G.deliveries++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
        const pts = addScore(75 * (pk.def?.mult || 1), porch.cx, porch.cy, "PIRATE +{n}");
        confetti(porch.cx, porch.cy); shake(8); tryFSD(); SFX.dismiss(); return;
      }
      if (h.hasRing && Math.random() < lerp(0.05, 0.14, difficulty() / MAX_DIFF)) {
        h.ringHit = true; G.fails++; G.streak = 0;
        G.score = Math.max(0, G.score - 10);
        floatT(pk.x, pk.y, "Ring cam −10", "#FF8A65", 12); SFX.miss(); return;
      }

      h.delivered = true;
      G.deliveries++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
      let base = 100 * (pk.def?.mult || 1);
      if (h.special === "fresh") base *= 2;
      if (h.special === "prime") base *= 1.5;
      if (perfect) { base *= 1.35; G.perfects++; }

      let note = perfect ? "PERFECT +{n}" : (h.special === "fresh" ? "FRESH 2× +{n}" : "DELIVERED +{n}");
      if (h.hasSnack && !h.snackTaken) {
        h.snackTaken = true; G.snacks++; base += 40; note = "SNACKS! +{n}";
        confetti(porch.cx, porch.cy); SFX.perfect();
      } else if (perfect) {
        confetti(porch.cx, porch.cy); ringBurst(porch.cx, porch.cy, "#FFD54F"); SFX.perfect();
      } else {
        burst(porch.cx, porch.cy, "#FF9900", 16); SFX.deliver();
      }

      addScore(base, porch.cx, porch.cy - 10, note);
      shake(perfect ? 10 : 5); hitStop(0.035); tryFSD();
      return;
    }

    if (h.hasPool) {
      const pool = { x: h.poolX - 30, y: h.y + 4, w: 60, h: 42 };
      if (pk.x > pool.x && pk.x < pool.x + pool.w && pk.y > pool.y && pk.y < pool.y + pool.h) {
        G.fails++; G.streak = 0; G.score = Math.max(0, G.score - 20);
        burst(pk.x, pk.y, "#29B6F6", 20); floatT(pk.x, pk.y, "SPLASH −20", "#4FC3F7", 14);
        SFX.splash(); return;
      }
    }
    if (h.hasDog) {
      const Ldog = layoutHouse(h);
      const dx = h.side === 0 ? Ldog.hx + 12 : Ldog.hx + Ldog.hw - 12;
      const dy = Ldog.driveTop + 18;
      if (dist(pk.x, pk.y, dx, dy) < 30) {
        G.fails++; G.dogIncidents++; G.streak = 0; G.score = Math.max(0, G.score - 8);
        floatT(pk.x, pk.y, "DOG GOT IT", "#A1887F", 13); SFX.bark(); SFX.miss();
        return;
      }
    }
  }

  // driveway slab (below house — not porch)
  for (const h of G.houses) {
    if (!h.hasDriveway) continue;
    const L = layoutHouse(h);
    const top = L.driveTop;
    const dw = Math.min(L.hw + 8, 58);
    const dx = h.side === 0 ? L.hx + 4 : L.hx + L.hw - dw - 4;
    if (pk.x > dx && pk.x < dx + dw && pk.y > top && pk.y < top + 52) {
      // Don't count as driveway if it's on the parked car (already handled)
      if (h.parkedCar && hitsParked(pk, h)) continue;
      floatT(pk.x, pk.y, "driveway skid", "#B0BEC5", 12);
      burst(pk.x, pk.y, "#9E9E9E", 8); G.streak = 0; SFX.land(); return;
    }
  }

  if (pk.x > ROAD_L && pk.x < ROAD_R) {
    floatT(pk.x, pk.y, "road pizza", "#BDBDBD", 12);
    burst(pk.x, pk.y, "#546E7A", 8); G.streak = 0; SFX.miss();
  } else {
    floatT(pk.x, pk.y, "lawn splat", "#AED581", 12);
    burst(pk.x, pk.y, "#7CB342", 8); G.streak = 0; SFX.miss();
  }
}

// ═══════════════════════════════════════════════════════════
// UPDATE
// ═══════════════════════════════════════════════════════════
let lastT = now();

function update(dt) {
  // ambient always
  for (const c of G.clouds) {
    c.x += c.s * dt * (0.1 + c.layer * 0.12);
    if (c.x > W + 100) c.x = -100;
  }
  for (const b of G.birds) {
    b.x += b.s * dt; b.flap += dt * 9;
    if (b.x > W + 30) { b.x = -20; b.y = rand(40, 110); }
  }
  for (const r of G.rain) {
    r.y += 380 * r.z * dt; r.x += 40 * dt;
    if (r.y > H) { r.y = -10; r.x = rand(-20, W); }
  }

  if (state === ST.TITLE || state === ST.HOWTO) {
    G.scroll += 32 * dt; G.roadLines += 32 * dt;
    if (!G.houses.length) for (let i = 0; i < 5; i++) spawnHouse(i * 200 - 80);
    for (const h of G.houses) h.y += 32 * dt;
    for (const p of G.props) p.y += 32 * dt;
    G.houses = G.houses.filter(h => h.y < H + 120);
    G.props = G.props.filter(p => p.y < H + 120);
    if (G.houses.length < 4) spawnHouse(-90);
    G.carX = ROAD_CX + Math.sin(now() / 900) * 40;
    return;
  }
  if (state === ST.PAUSE || state === ST.END) return;

  if (G.hitStop > 0) { G.hitStop -= dt; return; } // freeze frames for juice

  if (state === ST.GATE) {
    G.gateTimer -= dt;
    if (G.gateTimer <= 0) { loseHeart("Gate timeout!"); state = ST.PLAY; G.nextGateIn = rand(35, 50); }
    updateFX(dt); return;
  }

  // PLAY
  G.time -= dt;
  if (G.time <= 0) { G.time = 0; endRoute(false); return; }

  if (G.invuln > 0) G.invuln -= dt;
  if (G.throwCD > 0) G.throwCD -= dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 28);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2.2);
  if (G.eventT > 0) { G.eventT -= dt; if (G.eventT <= 0) G.event = null; }
  if (G.ladyCD > 0) G.ladyCD -= dt;

  const e = elapsed();
  if (G.coachPhase === 0 && e > 0.6) { G.coachPhase = 1; msg("Drag bottom to steer · Hold top to aim, release to throw", 3.2); }
  else if (G.coachPhase === 1 && e > 6 && G.deliveries === 0) { G.coachPhase = 2; msg("Cyan X = best DROP · LOCK when near", 3); }
  else if (G.coachPhase === 2 && e > EASY_SECS) { G.coachPhase = 3; msg("Traffic heating up — stay sharp!", 2.4); }

  // Special events
  if (!G.event && e > 20 && Math.random() < 0.0025) {
    G.event = pick(["fresh_boost", "construction", "dog_zone"]);
    G.eventT = 12;
    if (G.event === "fresh_boost") msg("🛒 Amazon Fresh window — double points on drops!", 2.8);
    if (G.event === "construction") msg("🚧 Construction zone — cones ahead!", 2.5);
    if (G.event === "dog_zone") msg("🐕 Dog zone — watch the yards!", 2.5);
  }

  if (G.fsd > 0) {
    G.fsd -= dt;
    if (G.fsd <= 0) { G.fsd = 0; msg("Autopilot off.", 1.6); }
  }

  const diff = difficulty();
  G.baseSpeed = lerp(90, 158, easeOut(diff / MAX_DIFF));
  if (G.event === "construction") G.baseSpeed *= 0.92;
  G.speed = G.baseSpeed * (G.fsd > 0 ? 1.06 : 1);
  const scrollAmt = G.speed * dt;
  G.scroll += scrollAmt; G.roadLines += scrollAmt;
  // subtle camera sway
  G.cameraY = lerp(G.cameraY, Math.sin(now() / 700) * 2 + G.carVX * 0.01, 0.1);

  // Steering with weight
  let inputX = 0;
  if (keys.ArrowLeft || keys.KeyA) inputX -= 1;
  if (keys.ArrowRight || keys.KeyD) inputX += 1;

  if (G.fsd > 0) {
    let avoid = 0, best = 1e9;
    for (const o of G.obstacles) {
      if (o.dead || o.y < CAR_Y - 220 || o.y > CAR_Y + 40) continue;
      const dx = o.x - G.carX, threat = Math.abs(dx) + Math.abs(o.y - CAR_Y) * 0.35;
      if (threat < best && Math.abs(dx) < 72) { best = threat; avoid = dx > 0 ? -1 : 1; }
    }
    G.carVX = lerp(G.carVX, avoid * 210 + (ROAD_CX - G.carX) * 0.5, 1 - Math.pow(0.001, dt));
  } else if (G.steerTarget != null) {
    G.carVX = lerp(G.carVX, clamp((G.steerTarget - G.carX) * 5.2, -250, 250), 1 - Math.pow(0.0005, dt));
  } else {
    G.carVX = lerp(G.carVX, inputX * 240, 1 - Math.pow(0.001, dt));
    if (!inputX) G.carVX *= Math.pow(0.08, dt);
  }
  // weight: clamp accel feel
  G.carX = clamp(G.carX + G.carVX * dt, ROAD_L + 26, ROAD_R - 26);
  G.carLean = lerp(G.carLean, clamp(G.carVX / 380, -0.12, 0.12), 0.15);

  // Scroll world
  for (const h of G.houses) h.y += scrollAmt;
  for (const p of G.props) p.y += scrollAmt;
  for (const o of G.obstacles) {
    o.y += scrollAmt; o.anim += dt * 8;
    if (o.type === "lady") updateLady(o, dt);
    else {
      if (o.type === "car") o.y += (o.vy || 0) * dt;
      o.x += (o.vx || 0) * dt;
      if ((o.type === "scooter" || o.type === "ped" || o.type === "dog") && (o.x < ROAD_L + 14 || o.x > ROAD_R - 14)) o.vx *= -1;
    }
  }

  G.nextHouseDist -= scrollAmt;
  if (G.nextHouseDist <= 0) {
    spawnHouse(-100);
    G.nextHouseDist = lerp(235, 175, diff / MAX_DIFF);
  }

  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    if (e > 7) spawnObstacle();
    G.spawnT = lerp(4.6, 1.7, easeOut(diff / MAX_DIFF)) * (G.event === "construction" ? 0.65 : 1);
  }

  if (e > EASY_SECS + 10) {
    G.nextGateIn -= dt;
    if (G.nextGateIn <= 0) startGate();
  }

  tryLady(e, diff);

  // Packages
  for (const pk of G.packages) {
    if (pk.done) continue;
    pk.t += dt;
    const u = clamp(pk.t / pk.dur, 0, 1);
    const ease = smooth(u);
    pk.x = lerp(pk.sx, pk.tx, ease);
    pk.y = lerp(pk.sy, pk.ty, ease) - Math.sin(u * Math.PI) * pk.arc;
    pk.rot += pk.vr * dt;
    // trail
    pk.trail.push({ x: pk.x, y: pk.y, a: 1 });
    if (pk.trail.length > 10) pk.trail.shift();
    for (const t of pk.trail) t.a *= 0.88;

    if (u > 0.12 && u < 0.98 && resolveMidair(pk)) { pk.done = true; continue; }
    if (u >= 1) { pk.done = true; resolveLand(pk); }
  }
  G.packages = G.packages.filter(p => !p.done || ((p.fade = (p.fade ?? 0.18) - dt) > 0));

  // Collisions car
  const car = { x: G.carX - 22, y: CAR_Y - 48, w: 44, h: 78 };
  for (const o of G.obstacles) {
    if (o.dead || o.hit) continue;
    if (o.y < CAR_Y - 100 || o.y > CAR_Y + 55) continue;
    const ob = { x: o.x - o.w / 2, y: o.y - o.h / 2, w: o.w, h: o.h };
    if (car.x < ob.x + ob.w && car.x + car.w > ob.x && car.y < ob.y + ob.h && car.y + car.h > ob.y) {
      o.hit = true; o.dead = true;
      onCarHit(o);
    }
  }

  G.houses = G.houses.filter(h => h.y < H + 130);
  G.props = G.props.filter(p => p.y < H + 130);
  G.obstacles = G.obstacles.filter(o => !o.dead && o.y < H + 100);
  updateFX(dt);
  for (const m of G.messages) m.life -= dt;
  G.messages = G.messages.filter(m => m.life > 0);
}

function onCarHit(o) {
  if (G.fsd > 0) {
    floatT(o.x, o.y, "DODGED", "#00B0FF", 14); burst(o.x, o.y, "#00B0FF", 10); return;
  }
  if (o.type === "lady") {
    G.ladyHits++;
    loseHeart(pick(["SLOW DOWN!! Get off my lawn!", "I'm calling HOA AND your mother!"]));
    burst(o.x, o.y, "#CE93D8", 16); floatT(o.x, o.y, "PHONE SMACK!", "#F8BBD0", 14); SFX.lady();
    return;
  }
  const table = {
    cone: "Traffic cone!", scooter: "Lime scooter!", car: "Fender bender!",
    ped: "Phone zombie!", dog: "Doggo attack!",
  };
  if (o.type === "dog") { G.dogIncidents++; SFX.bark(); }
  if (o.type === "car") SFX.horn();
  loseHeart(table[o.type] || "Ouch!");
  burst(o.x, o.y, "#FF7043", 14); SFX.hit();
}

function startGate() {
  state = ST.GATE;
  const correct = String(randi(1000, 9999));
  const opts = new Set([correct]);
  while (opts.size < 3) {
    const digits = correct.split("");
    digits[randi(0, 3)] = String(randi(0, 9));
    opts.add(digits.join(""));
  }
  G.gateOptions = [...opts].sort(() => Math.random() - 0.5);
  G.gateCorrect = G.gateOptions.indexOf(correct);
  G.gateTimer = 10;
  msg("GATED COMMUNITY — pick the code!", 2);
}

function updateFX(dt) {
  for (const p of G.particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.g ?? 160) * dt; p.life -= dt;
  }
  G.particles = G.particles.filter(p => p.life > 0);
  for (const f of G.floatText) { f.y += f.vy * dt; f.life -= dt; }
  G.floatText = G.floatText.filter(f => f.life > 0);
}

// ═══════════════════════════════════════════════════════════
// DRAW
// ═══════════════════════════════════════════════════════════
function draw() {
  ctx.save();
  // camera + shake
  let sx = 0, sy = G.cameraY || 0;
  if (G.shake > 0) {
    sx += rand(-G.shake, G.shake);
    sy += rand(-G.shake, G.shake) * 0.7;
  }
  ctx.translate(sx, sy);

  drawSky();
  drawParallaxFar();
  drawGround();
  drawRoad();
  drawProps();
  drawHouses();
  drawObstacles();
  drawAim();
  drawPackages();
  drawTesla();
  drawParticles();
  drawFloats();
  drawWeatherOverlay();

  ctx.restore();

  if (G.flash > 0) {
    ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.35})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (state === ST.TITLE) drawTitle();
  else if (state === ST.HOWTO) drawHowTo();
  else if (state === ST.PLAY || state === ST.GATE) { drawHUD(); if (state === ST.GATE) drawGate(); }
  else if (state === ST.PAUSE) { drawHUD(); drawPause(); }
  else if (state === ST.END) drawEnd();

  // achievement toast
  if (G.unlockQueue.length) {
    const a = G.unlockQueue[0];
    ctx.fillStyle = "rgba(10,22,40,0.9)";
    roundRect(30, H - 90, W - 60, 44, 12); ctx.fill();
    ctx.strokeStyle = "#FFD54F"; ctx.lineWidth = 2;
    roundRect(30, H - 90, W - 60, 44, 12); ctx.stroke();
    ctx.fillStyle = "#FFD54F"; ctx.font = "bold 13px system-ui"; ctx.textAlign = "center";
    ctx.fillText("🏆 " + a.title, W / 2, H - 72);
    ctx.fillStyle = "rgba(255,255,255,0.75)"; ctx.font = "11px system-ui";
    ctx.fillText(a.desc, W / 2, H - 56);
    if (state === ST.PLAY) {
      // auto pop after a moment via life on fake message
    }
  }
}

function drawSky() {
  let g;
  if (G.weather === "golden") {
    g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, "#1A237E"); g.addColorStop(0.4, "#E65100"); g.addColorStop(0.75, "#FFB74D"); g.addColorStop(1, "#FFE0B2");
  } else if (G.weather === "rain" || G.weather === "cloudy") {
    g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, "#546E7A"); g.addColorStop(0.5, "#90A4AE"); g.addColorStop(1, "#B0BEC5");
  } else {
    g = ctx.createLinearGradient(0, 0, 0, H * 0.5);
    g.addColorStop(0, "#3B7DD6"); g.addColorStop(0.45, "#6BB3E0"); g.addColorStop(1, "#D4EBF5");
  }
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // sun
  if (G.weather !== "rain") {
    const sx = G.weather === "golden" ? 60 : W - 50;
    const sy = G.weather === "golden" ? 90 : 48;
    const rg = ctx.createRadialGradient(sx, sy, 2, sx, sy, 70);
    rg.addColorStop(0, G.weather === "golden" ? "rgba(255,180,80,0.95)" : "rgba(255,252,220,1)");
    rg.addColorStop(0.4, "rgba(255,210,100,0.3)");
    rg.addColorStop(1, "rgba(255,180,80,0)");
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(sx, sy, 70, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = G.weather === "golden" ? "#FF8A65" : "#FFF59D";
    ctx.beginPath(); ctx.arc(sx, sy, 16, 0, Math.PI * 2); ctx.fill();
  }
  for (const c of G.clouds) drawCloud(c);
  for (const b of G.birds) {
    const flap = Math.sin(b.flap) * 5;
    ctx.strokeStyle = "rgba(40,45,55,0.45)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(b.x - 7, b.y + flap); ctx.quadraticCurveTo(b.x, b.y - 3, b.x + 7, b.y + flap);
    ctx.stroke();
  }
}

function drawCloud(c) {
  const a = G.weather === "rain" ? 0.55 : 0.75 + c.layer * 0.2;
  ctx.fillStyle = G.weather === "rain" || G.weather === "cloudy" ? `rgba(176,190,197,${a})` : `rgba(255,255,255,${a})`;
  ctx.beginPath();
  ctx.ellipse(c.x, c.y, c.w * 0.5, c.w * 0.2, 0, 0, Math.PI * 2);
  ctx.ellipse(c.x - c.w * 0.28, c.y + 3, c.w * 0.28, c.w * 0.15, 0, 0, Math.PI * 2);
  ctx.ellipse(c.x + c.w * 0.25, c.y + 2, c.w * 0.3, c.w * 0.16, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawParallaxFar() {
  // distant treeline
  ctx.fillStyle = G.weather === "golden" ? "rgba(80,50,30,0.2)" : "rgba(60,100,45,0.18)";
  ctx.beginPath(); ctx.moveTo(0, H * 0.36);
  for (let i = 0; i <= 14; i++) {
    const tx = (i / 14) * W;
    const th = 8 + Math.sin(i * 1.7 + G.scroll * 0.0015) * 5 + (i % 3) * 3;
    ctx.lineTo(tx, H * 0.36 - th);
  }
  ctx.lineTo(W, H * 0.4); ctx.lineTo(0, H * 0.4); ctx.fill();
}

function drawGround() {
  const g1 = ctx.createLinearGradient(0, 0, ROAD_L, 0);
  g1.addColorStop(0, "#4E7A28"); g1.addColorStop(1, "#8BC34A");
  ctx.fillStyle = g1; ctx.fillRect(0, 0, ROAD_L, H);
  const g2 = ctx.createLinearGradient(ROAD_R, 0, W, 0);
  g2.addColorStop(0, "#8BC34A"); g2.addColorStop(1, "#4E7A28");
  ctx.fillStyle = g2; ctx.fillRect(ROAD_R, 0, W - ROAD_R, H);
  // mower stripes (parallax-ish)
  ctx.fillStyle = "rgba(255,255,255,0.035)";
  for (let i = 0; i < 16; i++) {
    const yy = ((i * 50 + G.scroll * 0.2) % (H + 50)) - 25;
    ctx.fillRect(0, yy, ROAD_L - 10, 20);
    ctx.fillRect(ROAD_R + 10, yy, W - ROAD_R - 10, 20);
  }
  // sidewalks
  ctx.fillStyle = "#C8C2B6";
  ctx.fillRect(ROAD_L - 16, 0, 12, H);
  ctx.fillRect(ROAD_R + 4, 0, 12, H);
  ctx.fillStyle = "#D4B896";
  ctx.fillRect(ROAD_L - 5, 0, 5, H);
  ctx.fillRect(ROAD_R, 0, 5, H);
}

function drawRoad() {
  const ag = ctx.createLinearGradient(ROAD_L, 0, ROAD_R, 0);
  ag.addColorStop(0, "#3E4E56"); ag.addColorStop(0.5, "#566B75"); ag.addColorStop(1, "#3E4E56");
  ctx.fillStyle = ag; ctx.fillRect(ROAD_L, 0, ROAD_W, H);
  // wear
  ctx.fillStyle = "rgba(0,0,0,0.06)";
  for (let i = 0; i < 6; i++) {
    const yy = ((i * 120 + G.scroll * 0.35) % (H + 120)) - 40;
    ctx.beginPath(); ctx.ellipse(ROAD_CX + Math.sin(i * 2) * 24, yy, 38, 14, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = "#E8D96A"; ctx.lineWidth = 4;
  ctx.setLineDash([24, 18]); ctx.lineDashOffset = -G.roadLines * 0.95;
  ctx.beginPath(); ctx.moveTo(ROAD_CX, 0); ctx.lineTo(ROAD_CX, H); ctx.stroke();
  ctx.setLineDash([]);
  ctx.strokeStyle = "#F5F5F5"; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ROAD_L + 5, 0); ctx.lineTo(ROAD_L + 5, H);
  ctx.moveTo(ROAD_R - 5, 0); ctx.lineTo(ROAD_R - 5, H);
  ctx.stroke();
}

function drawProps() {
  const sorted = G.props.slice().sort((a, b) => a.y - b.y);
  for (const p of sorted) {
    if (p.y < -100 || p.y > H + 90) continue;
    if (p.type === "palm") drawPalm(p.x, p.y, p.scale || 1);
    if (p.type === "pool") drawPool(p.x, p.y);
    if (p.type === "bush") {
      ctx.fillStyle = "#558B2F";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, 14, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(p.x - 8, p.y + 2, 10, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(p.x + 8, p.y + 1, 10, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    if (p.type === "pole") {
      ctx.fillStyle = "#6D4C41"; ctx.fillRect(p.x - 2.5, p.y - 20, 5, 70);
      ctx.fillStyle = "#5D4037"; ctx.fillRect(p.x - 12, p.y - 18, 24, 3.5);
    }
    if (p.type === "hydrant") {
      ctx.fillStyle = "#E53935"; roundRect(p.x, p.y, 8, 12, 2); ctx.fill();
      ctx.fillRect(p.x - 3, p.y + 3, 14, 4);
    }
    if (p.type === "sign") {
      ctx.fillStyle = "#8D6E63"; ctx.fillRect(p.x - 1.5, p.y, 3, 22);
      ctx.fillStyle = "#FFECB3"; roundRect(p.x - 16, p.y - 16, 32, 16, 2); ctx.fill();
      ctx.fillStyle = "#E65100"; ctx.font = "bold 8px system-ui"; ctx.textAlign = "center";
      ctx.fillText(p.label, p.x, p.y - 5);
    }
  }
}

function drawPalm(x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.fillStyle = "rgba(0,0,0,0.12)";
  ctx.beginPath(); ctx.ellipse(4, 34, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#8D6E63"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 32); ctx.quadraticCurveTo(8, 8, -2, -42); ctx.stroke();
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI / 2 + (i - 3) * 0.38;
    ctx.strokeStyle = i % 2 ? "#2E7D32" : "#388E3C"; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-2, -42);
    ctx.quadraticCurveTo(-2 + Math.cos(a) * 18, -50 + Math.sin(a) * 10, -2 + Math.cos(a) * 38, -42 + Math.sin(a) * 28);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPool(x, y) {
  const pg = ctx.createLinearGradient(x, y, x, y + 44);
  pg.addColorStop(0, "#4DD0E1"); pg.addColorStop(1, "#00ACC1");
  ctx.fillStyle = pg; roundRect(x - 30, y, 60, 42, 12); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,0.35)"; roundRect(x - 20, y + 5, 26, 10, 5); ctx.fill();
  ctx.strokeStyle = "#00838F"; ctx.lineWidth = 3; roundRect(x - 30, y, 60, 42, 12); ctx.stroke();
}

function drawHouses() {
  for (const h of G.houses.slice().sort((a, b) => a.y - b.y)) {
    if (h.y < -140 || h.y > H + 100) continue;
    drawHouse(h);
  }
}

function drawHouse(h) {
  const L = layoutHouse(h);
  const { hx, hy, hw, hh } = L;
  const facingRight = h.side === 0;

  // Driveway slab BELOW house (toward player) — car parks here, not under porch
  if (h.hasDriveway) {
    const top = L.driveTop;
    const dw = Math.min(hw + 8, 58);
    const dx = facingRight ? hx + 4 : hx + hw - dw - 4;
    ctx.fillStyle = "#9E9E9E";
    roundRect(dx, top, dw, 52, 3);
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.12)";
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      ctx.beginPath();
      ctx.moveTo(dx + 4, top + i * 12);
      ctx.lineTo(dx + dw - 4, top + i * 12);
      ctx.stroke();
    }
    // curb cut toward road
    ctx.fillStyle = "#BDBDBD";
    if (facingRight) {
      ctx.beginPath();
      ctx.moveTo(dx + dw, top + 20);
      ctx.lineTo(ROAD_L - 4, top + 28);
      ctx.lineTo(ROAD_L - 4, top + 44);
      ctx.lineTo(dx + dw, top + 40);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(dx, top + 20);
      ctx.lineTo(ROAD_R + 4, top + 28);
      ctx.lineTo(ROAD_R + 4, top + 44);
      ctx.lineTo(dx, top + 40);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Parked car first (under driveway, never covering porch)
  if (h.parkedCar) drawParked(h);

  // House shadow
  ctx.fillStyle = "rgba(0,0,0,0.14)";
  ctx.beginPath();
  ctx.ellipse(hx + hw / 2 + 2, hy + hh + 4, hw * 0.42, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  // Foundation / brick skirt
  ctx.fillStyle = h.brick;
  ctx.fillRect(hx - 1, hy + hh - 10, hw + 2, 12);

  // Body
  const bg = ctx.createLinearGradient(hx, hy, hx + hw, hy + hh);
  bg.addColorStop(0, shade(h.color, 10));
  bg.addColorStop(1, shade(h.color, -18));
  ctx.fillStyle = bg;
  roundRect(hx, hy, hw, hh - 8, 3);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.1)";
  ctx.lineWidth = 1.2;
  roundRect(hx, hy, hw, hh - 8, 3);
  ctx.stroke();
  if (h.style === "modern") {
    ctx.fillStyle = h.accent;
    ctx.fillRect(hx, hy + 8, 5, hh - 24);
  }

  // Roof sits ON TOP of house only
  ctx.fillStyle = h.roof;
  ctx.beginPath();
  if (h.style === "modern") {
    ctx.moveTo(hx - 3, hy + 10);
    ctx.lineTo(hx + 2, hy - 8);
    ctx.lineTo(hx + hw + 4, hy + 4);
    ctx.lineTo(hx + hw + 2, hy + 10);
  } else {
    ctx.moveTo(hx - 5, hy + 10);
    ctx.lineTo(hx + hw / 2, hy - 18);
    ctx.lineTo(hx + hw + 5, hy + 10);
  }
  ctx.closePath();
  ctx.fill();
  // Gutter line
  ctx.strokeStyle = h.trim;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(hx - 3, hy + 10);
  ctx.lineTo(hx + hw + 3, hy + 10);
  ctx.stroke();

  if (h.special && !h.delivered && h.needsDelivery) {
    ctx.fillStyle = h.special === "fresh" ? "#00C853" : "#FF9900";
    roundRect(hx + 6, hy - 4, hw - 12, 12, 3);
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "bold 8px system-ui";
    ctx.textAlign = "center";
    ctx.fillText(h.special === "fresh" ? "FRESH 2×" : "PRIME", hx + hw / 2, hy + 5);
  }

  // Garage on yard side (away from road)
  if (h.garage) {
    const gx = facingRight ? hx + 4 : hx + hw - 26;
    ctx.fillStyle = "#78909C";
    roundRect(gx, hy + hh - 36, 24, 26, 2);
    ctx.fill();
    ctx.strokeStyle = "#546E7A";
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(gx + 2, hy + hh - 30 + i * 6);
      ctx.lineTo(gx + 22, hy + hh - 30 + i * 6);
      ctx.stroke();
    }
  }

  // Door on road-facing wall
  const doorX = L.doorX;
  const doorY = L.doorY;
  ctx.fillStyle = h.trim;
  roundRect(doorX - 1, doorY, 18, 28, 2);
  ctx.fill();
  ctx.fillStyle = shade(h.accent, -25);
  roundRect(doorX, doorY + 2, 16, 24, 2);
  ctx.fill();
  if (h.hasRing) {
    ctx.fillStyle = h.ringHit ? "#FF5252" : "#263238";
    ctx.beginPath();
    ctx.arc(doorX + 8, doorY - 2, 3.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Window (matches hitbox)
  drawWin(L.winX, L.winY, L.winW, L.winH, h.windowLit && !h.windowBroken, h.shutters, h.accent, h.windowBroken);

  // House number on wall
  ctx.fillStyle = h.trim;
  roundRect(hx + hw / 2 - 12, hy + hh - 22, 24, 11, 2);
  ctx.fill();
  ctx.fillStyle = "#37474F";
  ctx.font = "bold 9px system-ui";
  ctx.textAlign = "center";
  ctx.fillText(String(h.number), hx + hw / 2, hy + hh - 14);

  // Porch stoop — attached to road face, NOT covering the house
  const pg = ctx.createLinearGradient(L.porchX, L.porchY, L.porchX, L.porchY + L.porchH);
  pg.addColorStop(0, "#E8DFD6");
  pg.addColorStop(1, "#BCAAA4");
  ctx.fillStyle = pg;
  roundRect(L.porchX, L.porchY, L.porchW, L.porchH, 4);
  ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.12)";
  ctx.lineWidth = 1;
  roundRect(L.porchX, L.porchY, L.porchW, L.porchH, 4);
  ctx.stroke();
  // Small porch posts
  ctx.fillStyle = h.trim;
  ctx.fillRect(L.porchX + 2, L.porchY - 10, 2.5, 12);
  ctx.fillRect(L.porchX + L.porchW - 5, L.porchY - 10, 2.5, 12);
  ctx.fillStyle = shade(h.roof, 20);
  ctx.fillRect(L.porchX - 1, L.porchY - 12, L.porchW + 2, 4);

  if (isActive(h)) drawDrop(h, L);
  else if (h.needsDelivery && h.delivered) {
    drawBox(L.porchCx, L.porchCy - 2, 0.85, PKG.standard);
    ctx.fillStyle = "#2E7D32";
    ctx.font = "bold 11px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("✓", L.porchCx, L.porchCy + 14);
  }

  if (h.hasSnack && !h.snackTaken && isActive(h)) {
    const sx = L.porchX + L.porchW / 2 - 6;
    ctx.fillStyle = "#EF5350";
    roundRect(sx, L.porchY - 16, 12, 12, 2);
    ctx.fill();
    ctx.font = "9px system-ui";
    ctx.fillText("🍪", sx + 6, L.porchY - 6);
  }
  if (h.hasPirate && !h.pirateHit && isActive(h)) {
    const px = L.porchCx + (facingRight ? 14 : -14);
    const py = L.porchCy;
    ctx.fillStyle = "#424242";
    ctx.beginPath();
    ctx.ellipse(px, py + 8, 6, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(px, py, 5, 0, Math.PI * 2);
    ctx.fill();
  }
  if (h.hasDog && !h.delivered) {
    // Dog in yard near driveway, not on porch
    const dx = facingRight ? hx + 12 : hx + hw - 12;
    const dy = L.driveTop + 18;
    drawDog(dx, dy, facingRight ? 1 : -1, now() / 200);
  }
}

function drawDrop(h, L) {
  L = L || layoutHouse(h);
  const gx = L.porchCx, gy = L.porchCy;
  const pulse = 0.55 + Math.sin(now() / 180 + h.number) * 0.45;
  const best = bestStop();
  const isBest = best && best.house === h;
  ctx.save();
  ctx.globalAlpha = 0.35 + pulse * 0.4;
  ctx.strokeStyle = isBest ? "#00E5FF" : "#FF9900";
  ctx.lineWidth = isBest ? 3 : 2.4;
  ctx.beginPath();
  ctx.ellipse(gx, gy + 2, 14 + pulse * 3, 10 + pulse * 2, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.globalAlpha = 0.2 + pulse * 0.18;
  ctx.fillStyle = isBest ? "#00B0FF" : "#FF9900";
  ctx.beginPath();
  ctx.ellipse(gx, gy + 2, 11, 7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.shadowColor = isBest ? "#00E5FF" : "#FF9900";
  ctx.shadowBlur = 12;
  drawBox(gx, gy - 1 - pulse * 1.5, 0.95, PKG.standard);
  ctx.shadowBlur = 0;
  ctx.fillStyle = isBest ? "#00E5FF" : "#FF9900";
  ctx.font = "bold 9px system-ui";
  ctx.textAlign = "center";
  ctx.strokeStyle = "rgba(0,0,0,0.4)";
  ctx.lineWidth = 2.5;
  const lab = isBest ? "AIM" : "DROP";
  ctx.strokeText(lab, gx, gy + L.porchH * 0.5 + 4);
  ctx.fillText(lab, gx, gy + L.porchH * 0.5 + 4);
  ctx.restore();
}

function drawWin(x, y, w, h, lit, shutters, accent, broken) {
  if (shutters) {
    ctx.fillStyle = accent; roundRect(x - 5, y, 5, h, 1); ctx.fill();
    roundRect(x + w, y, 5, h, 1); ctx.fill();
  }
  ctx.fillStyle = broken ? "#37474F" : lit ? "#FFF9C4" : "#E3F2FD";
  roundRect(x, y, w, h, 2); ctx.fill();
  ctx.strokeStyle = "#78909C"; ctx.lineWidth = 1.5; ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  if (broken) {
    ctx.strokeStyle = "rgba(200,230,255,0.75)"; ctx.beginPath();
    ctx.moveTo(x + 2, y + 3); ctx.lineTo(x + w * 0.5, y + h * 0.5); ctx.lineTo(x + w - 2, y + 4); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
    ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2); ctx.stroke();
  }
}

function drawParked(h) {
  const pc = h.parkedCar; if (!pc) return;
  const L = layoutHouse(h);
  if (!L.car) return;
  const { cx: x, cy: y, w, h: ht } = L.car;
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  ctx.beginPath();
  ctx.ellipse(x, y + ht * 0.38, w * 0.48, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = pc.dented ? shade(pc.color, -25) : pc.color;
  roundRect(x - w / 2, y - ht / 2, w, ht, 6);
  ctx.fill();
  ctx.fillStyle = pc.cracked ? "rgba(80,90,100,0.85)" : "rgba(30,50,70,0.75)";
  roundRect(x - w / 2 + 4, y - ht / 2 + 8, w - 8, ht * 0.28, 3);
  ctx.fill();
  if (pc.cracked) {
    ctx.strokeStyle = "rgba(200,230,255,0.75)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(x - 5, y - ht * 0.2);
    ctx.lineTo(x + 1, y);
    ctx.lineTo(x + 6, y - ht * 0.15);
    ctx.stroke();
  }
  // wheels
  ctx.fillStyle = "#212121";
  roundRect(x - w / 2 - 1, y - ht / 2 + 6, 4, 10, 1);
  roundRect(x + w / 2 - 3, y - ht / 2 + 6, 4, 10, 1);
  roundRect(x - w / 2 - 1, y + ht / 2 - 16, 4, 10, 1);
  roundRect(x + w / 2 - 3, y + ht / 2 - 16, 4, 10, 1);
}

function drawObstacles() {
  for (const o of G.obstacles) {
    if (o.y < -80 || o.y > H + 80) continue;
    if (o.type === "cone") {
      ctx.fillStyle = "#FF6D00";
      ctx.beginPath(); ctx.moveTo(o.x, o.y - 16); ctx.lineTo(o.x + 11, o.y + 9); ctx.lineTo(o.x - 11, o.y + 9); ctx.fill();
      ctx.fillStyle = "#FFF"; ctx.fillRect(o.x - 7, o.y - 2, 14, 4);
    } else if (o.type === "scooter") {
      ctx.strokeStyle = "#00ACC1"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(o.x, o.y + 14); ctx.lineTo(o.x, o.y - 10); ctx.lineTo(o.x + 8, o.y - 16); ctx.stroke();
      ctx.fillStyle = "#263238";
      ctx.beginPath(); ctx.arc(o.x, o.y + 16, 4, 0, Math.PI * 2); ctx.arc(o.x, o.y - 4, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (o.type === "car") {
      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.beginPath(); ctx.ellipse(o.x, o.y + 30, 22, 8, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = o.color; roundRect(o.x - 23, o.y - 36, 46, 72, 9); ctx.fill();
      ctx.fillStyle = "rgba(30,40,50,0.78)"; roundRect(o.x - 17, o.y - 22, 34, 26, 5); ctx.fill();
    } else if (o.type === "ped") {
      const bob = Math.sin(o.anim) * 2;
      ctx.fillStyle = pickStable(o.x, ["#42A5F5","#AB47BC","#26A69A"]);
      roundRect(o.x - 7, o.y - 4 + bob, 14, 16, 3); ctx.fill();
      ctx.fillStyle = "#FFCC80";
      ctx.beginPath(); ctx.arc(o.x, o.y - 10 + bob, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#212121"; roundRect(o.x + 6, o.y - 8 + bob, 5, 9, 1); ctx.fill();
      ctx.fillStyle = "#37474F";
      ctx.fillRect(o.x - 5, o.y + 12 + bob, 4, 10); ctx.fillRect(o.x + 1, o.y + 12 - bob, 4, 10);
    } else if (o.type === "dog") drawDog(o.x, o.y, o.vx >= 0 ? 1 : -1, o.anim);
    else if (o.type === "lady") drawLady(o);
  }
}

function pickStable(seed, arr) { return arr[Math.abs(Math.floor(seed * 7.13)) % arr.length]; }

function drawDog(x, y, dir, anim = 0) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  const leg = Math.sin(anim * 2) * 3;
  ctx.fillStyle = "#A1887F"; roundRect(-11, -6, 22, 11, 4); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11, -4, 6.5, 5.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#8D6E63";
  ctx.fillRect(-8, 3 + leg, 3.5, 5); ctx.fillRect(3, 3 - leg, 3.5, 5);
